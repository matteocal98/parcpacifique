const PAYS_TEL_DEFAUT = PAYS_TEL[0];

function paysTel(code) {
  return PAYS_TEL.find((p) => p.code === code) || PAYS_TEL_DEFAUT;
}
function chiffresMax(pays) {
  return pays.groupes.reduce((total, n) => total + n, 0);
}
// Drapeau dérivé du code ISO : les lettres A-Z deviennent des indicateurs
// régionaux Unicode. Évite de saisir soixante emoji à la main.
function drapeauDe(iso) {
  return String(iso).toUpperCase().replace(/[A-Z]/g, (c) => String.fromCodePoint(127397 + c.charCodeAt(0)));
}
function exempleNational(pays) {
  return pays.groupes.map((n) => '0'.repeat(n)).join(' ');
}
// Applique le découpage du pays, sans jamais dépasser le nombre de chiffres.
function formatNational(chiffres, pays) {
  const brut = String(chiffres || '').replace(/\D/g, '');
  if (!brut) return '';
  if (brut.length > chiffresMax(pays)) {
    // Valeur plus longue que le format du pays (donnée ancienne) : on la
    // conserve intégralement, groupée par paires, plutôt que de la tronquer.
    return brut.replace(/(\d{2})(?=\d)/g, '$1 ');
  }
  const morceaux = [];
  let position = 0;
  for (const taille of pays.groupes) {
    if (position >= brut.length) break;
    morceaux.push(brut.slice(position, position + taille));
    position += taille;
  }
  return morceaux.join(' ');
}
// Reconstitue pays + numéro national à partir de ce qui est stocké.
function parserTelephone(valeur) {
  const brut = String(valeur || '').trim();
  const chiffres = brut.replace(/\D/g, '');
  if (!chiffres) return { pays: PAYS_TEL_DEFAUT, national: '' };

  const parIndicatif = (liste) =>
    liste.slice().sort((a, b) => b.indicatif.length - a.indicatif.length)[0];

  if (brut.startsWith('+')) {
    const candidats = PAYS_TEL.filter((p) => chiffres.startsWith(p.indicatif));
    if (candidats.length) {
      const pays = parIndicatif(candidats);
      return { pays, national: chiffres.slice(pays.indicatif.length) };
    }
  } else {
    // Sans « + » : on ne reconnaît un indicatif que si la longueur totale
    // correspond EXACTEMENT au format du pays. Une condition plus souple
    // (« le reste tient dans le format ») ferait passer « 81 54 44 » pour un
    // numéro japonais (+81) suivi de 5444, au lieu d'un numéro calédonien.
    const candidats = PAYS_TEL.filter(
      (p) => chiffres.startsWith(p.indicatif) && chiffres.length - p.indicatif.length === chiffresMax(p)
    );
    if (candidats.length) {
      const pays = parIndicatif(candidats);
      return { pays, national: chiffres.slice(pays.indicatif.length) };
    }
  }
  return { pays: PAYS_TEL_DEFAUT, national: chiffres };
}
// Format de stockage : E.164 (« +687815444 »), celui qu'attendent les services
// de notification.
function telephoneE164(pays, national) {
  const chiffres = String(national || '').replace(/\D/g, '');
  return chiffres ? `+${pays.indicatif}${chiffres}` : '';
}
// Format lisible : « +687 81 54 44 ».
function telephoneLisible(valeur) {
  const { pays, national } = parserTelephone(valeur);
  return national ? `+${pays.indicatif} ${formatNational(national, pays)}` : '';
}

// Champ téléphone réutilisable : sélecteur de pays + saisie masquée.
function champTelephoneHtml(id, valeur, opts = {}) {
  const { pays, national } = parserTelephone(valeur);
  const desactive = opts.disabled ? ' disabled' : '';
  const requis = opts.required ? ' required' : '';
  return `
    <label for="${id}">${esc(opts.label || trad('Téléphone'))}</label>
    <div class="tel-champ">
      <select id="${id}-pays" class="tel-pays" aria-label="${trad('Pays de l\'indicatif')}"${desactive}>
        ${PAYS_TEL.map((p) => `<option value="${esc(p.code)}"${p.code === pays.code ? ' selected' : ''}>${drapeauDe(p.code)} +${esc(p.indicatif)} — ${esc(p.nom)}</option>`).join('')}
      </select>
      <input id="${id}" type="tel" inputmode="tel" autocomplete="tel-national"
             value="${esc(formatNational(national, pays))}"
             placeholder="${esc(exempleNational(pays))}"${desactive}${requis}>
    </div>
    ${opts.aide ? `<div class="hint">${esc(opts.aide)}</div>` : ''}`;
}

// Applique le masque à la frappe et tient le sélecteur et le champ cohérents.
function wireChampTelephone(root, id) {
  const select = root.querySelector(`#${id}-pays`);
  const input = root.querySelector(`#${id}`);
  if (!select || !input) return;

  const courant = () => paysTel(select.value);
  const reformater = (tronquer) => {
    const pays = courant();
    let chiffres = input.value.replace(/\D/g, '');
    if (tronquer) chiffres = chiffres.slice(0, chiffresMax(pays));
    input.value = formatNational(chiffres, pays);
    input.placeholder = exempleNational(pays);
    input.maxLength = chiffresMax(pays) + pays.groupes.length - 1;
  };

  input.addEventListener('input', () => reformater(true));
  input.addEventListener('blur', () => reformater(false));
  select.addEventListener('change', () => {
    // On conserve les chiffres saisis et on les redécoupe selon le nouveau pays.
    reformater(true);
    input.focus();
  });
  reformater(false);
}

// Lit la valeur saisie et la renvoie au format E.164.
function lireChampTelephone(root, id) {
  const select = root.querySelector(`#${id}-pays`);
  const input = root.querySelector(`#${id}`);
  if (!select || !input) return null;
  const pays = paysTel(select.value);
  const national = input.value.replace(/\D/g, '').slice(0, chiffresMax(pays));
  if (!national) return null;
  return { pays, national, e164: telephoneE164(pays, national), lisible: `+${pays.indicatif} ${formatNational(national, pays)}` };
}

// --- Marque et modèle -------------------------------------------------------
// Le schéma d'origine ne stockait qu'une chaîne « marque / modèle ». La
// migration ajoute deux colonnes distinctes ; en attendant, l'application
// reconstitue la chaîne et tout continue de fonctionner à l'identique.
function designation(brand, model, secours = '') {
  const parts = [brand, model].filter(Boolean);
  return parts.length ? parts.join(' ') : (secours || '');
}

// Requête envoyée à la recherche de photo, et TYPE de matériel.
//
// Deux défauts faisaient échouer la recherche sur un véhicule :
//   • la consigne parlait de « fiche produit d'une machine professionnelle » :
//     pour une voiture ou un camion, elle ne décrit pas ce qu'on cherche ;
//   • le mot « Véhicule » ajouté à la requête ne désigne rien de précis pour un
//     moteur de recherche, alors qu'il mange la place de la marque et du modèle.
// On transmet donc le type à la fonction, qui adapte sa consigne, et on retire
// la catégorie quand elle se réduit à « véhicule ».
function requetePhoto({ brand, model, name, category, kind, annee }) {
  const motCategorie = /^v[ée]hicule/i.test(category || '') ? '' : (category || '');
  const anneeTexte = annee ? String(annee) : '';
  return {
    // L'ANNÉE vient juste après la marque et le modèle : c'est ce qui distingue
    // deux millésimes du même nom, et donc deux photos différentes.
    query: [designation(brand, model, name), anneeTexte, motCategorie].filter(Boolean).join(' ').trim(),
    kind: kind === TYPE_VEHICULE ? 'vehicule' : 'machine',
    annee: anneeTexte,
  };
}
// Chaîne affichée : brand_model reste la référence, avec repli sur les colonnes
// séparées si elle n'est pas renseignée.
function machineBrandModel(m) {
  if (!m) return null;
  if (m.brand_model) return m.brand_model;
  const parts = [m.brand, m.model].filter(Boolean);
  return parts.length ? parts.join(' ') : null;
}
// Valeur à préremplir dans le champ « Marque ».
function machineBrand(m) {
  if (!m) return '';
  if (SCHEMA.hasBrandModel && m.brand) return m.brand;
  return m.brand_model || '';
}
// Valeur à préremplir dans le champ « Modèle » : vide tant que la ligne
// historique n'a pas été répartie par l'utilisateur.
function machineModel(m) {
  if (!m || !SCHEMA.hasBrandModel || !m.brand) return '';
  return m.model || '';
}

// --- Année du modèle (« version ») ------------------------------------------
//
// POURQUOI CE CHAMP : sur une même référence, un constructeur change parfois tout
// d'une année sur l'autre — carrosserie, motorisation, calandre. Un « PORSCHE
// CAYENNE » de 2011 et un de 2019 n'ont ni la même fiche technique, ni la même
// photo. Sans l'année, la recherche d'image ramène la version la plus récente,
// ou une page de petite annonce. La colonne est optionnelle : la sonde de schéma
// décide si on peut l'écrire, et tout continue de fonctionner sans elle.
function machineYear(m) {
  if (!m || !SCHEMA.hasModelYear) return null;
  const annee = parseInt(m.model_year, 10);
  return Number.isFinite(annee) && annee >= 1900 ? annee : null;
}

function yearPatch(annee) {
  if (!SCHEMA.hasModelYear) return {};
  const valeur = parseInt(annee, 10);
  return { model_year: Number.isFinite(valeur) && valeur >= 1900 ? valeur : null };
}

// Bornes larges mais réelles : une année de modèle peut être annoncée avec un an
// d'avance, et on ne veut pas refuser une machine ancienne.
function anneePlausible(valeur) {
  if (valeur === '' || valeur == null) return true;
  const annee = parseInt(valeur, 10);
  return Number.isFinite(annee) && annee >= 1950 && annee <= new Date().getFullYear() + 2;
}
// Colonnes à écrire selon le schéma détecté. brand_model est toujours
// renseigné : c'est lui que lisent l'affichage, la recherche et l'export.
function brandModelPatch(brand, model) {

// --- Machines et véhicules ---------------------------------------------------

const TYPE_MACHINE = 'machine';
const TYPE_VEHICULE = 'vehicle';

  [TYPE_MACHINE]: 'Ex. 123456789',

// Force la saisie en majuscules, au fur et à mesure de la frappe, en préservant

function forcerMajuscules(input) {
  if (!input) return;
  input.addEventListener('input', () => {
    const position = input.selectionStart;
    const haut = input.value.toUpperCase();
    if (haut === input.value) return;
    input.value = haut;
    if (position != null) {
      try { input.setSelectionRange(position, position); } catch (e) { /* type sans sélection */ }
    }

const COUNTER_UNITS = {

function counterUnitOf(machine) {

    ? { counter_value: value, counter_unit: counterUnitOf(machine) }

// L'échéance du plan n'avance QUE si au moins un élément de CE plan a réellement
// été coché. Règle volontairement prudente : enregistrer un entretien sans rien
// cocher (graissage, réparation, autre travail) ne doit pas effacer une échéance
// déjà dépassée qu'on n'a pas faite. Un plan sans aucun élément détaillé garde
// le comportement d'avant : on ne peut rien cocher, l'entretien porte donc sur
// le plan et l'échéance avance.

// Depuis le chantier « une échéance par tâche », ce garde-fou ne sert plus qu'aux

function journalAvanceEcheance(items, checked) {

// Classe d'habillage du bandeau d'échéance selon l'état.
function heroClass(state) { return state === 'late' ? 'alert' : (state === 'soon' ? 'soon' : 'ok'); }

// Le trigger d'application des offres (côté base) renvoie ce message lorsque la
// limite est franchie — typiquement quand deux postes ajoutent une machine en
// même temps, cas que le contrôle du navigateur ne peut pas voir. L'ancienne
// formulation (« limite du plan gratuit ») reste reconnue : la base peut encore
// porter l'ancien message tant que la migration des paliers n'est pas exécutée.
function isQuotaError(err) {
  const message = String(err && err.message ? err.message : err || '');
  return /limite (du plan gratuit|de ton offre)/i.test(message);
}

// supabase-js ne remonte qu'un « Edge Function returned a non-2xx status code »
// quand une fonction Edge répond 401, 403, 429… Or c'est justement là que se
// trouve le message utile (quota atteint, session expirée). Le corps de la
// réponse est accessible via error.context.
async function functionErrorMessage(error, defaut = trad('appel impossible')) {
  if (error && error.context && typeof error.context.json === 'function') {
    try {
      const corps = await error.context.clone().json();
      if (corps && corps.error) return String(corps.error);
    } catch (e) { /* corps absent, déjà consommé ou non JSON */ }
  }
  return (error && error.message) || defaut;
}

// ── UNE ÉCHÉANCE PAR TÂCHE ────────────────────────────────────
// Chaque élément d'un plan (maintenance_plans.items, JSONB, qui porte déjà
// label / frequency / spec / qty / note) peut porter en plus :
//   interval                            l'intervalle propre à la tâche, dans l'unité du plan
//   last_done_counter / last_done_at    le relevé (compteur) ou la date du dernier entretien DE CETTE TÂCHE
//   due_counter / due_at                sa prochaine échéance
//
// RÈGLE D'OR : l'échéance du plan (next_due_counter / next_due_hours /
// next_due_at) est LA PLUS PROCHE des échéances de ses tâches, recalculée à
// chaque écriture concernée. Rappels, alertes et tris continuent donc de
// fonctionner sans rien changer — c'est déjà la valeur que lit la fonction de
// rappels (send-maintenance-reminders).
//
// RÈGLE DE REPRISE (plans existants) : un élément qui n'a pas encore d'échéance
// reçoit celle du plan au moment de l'enregistrement. L'affichage ne change donc
// PAS avant le premier enregistrement (les plans déjà extraits de carnets gardent
// exactement leur état actuel) ; ensuite les tâches divergent au fur et à mesure
// qu'on les coche.
//
// RIEN N'EST INVENTÉ : un intervalle qui ne se déduit pas de « frequency »
// (« à chaque utilisation », « tous les 6 mois », texte libre…) reste absent. La
// tâche s'affiche, reste cochable, mais sort du calcul de la plus proche — et
// l'interface écrit « Intervalle à préciser » au lieu de laisser croire qu'elle
// est suivie. Les mois et les années ne sont PAS convertis en jours (un mois ne
// fait pas un nombre de jours fixe) : ils restent à préciser à la main.
function uniteSuivi(plan, machine) {
  if (!planIsCounter(plan)) return 'days';
  if (machine) return counterUnitOf(machine);
  return (plan && plan.tracking_mode === 'km') ? trad('km') : 'hours';
}

// Intervalle lu dans le texte de « frequency », dans l'unité du plan. Renvoie
// null quand il n'est pas déductible sans l'inventer.
function intervalleDepuisTexte(frequency, unite) {
  const texte = String(frequency || '')
    .toLowerCase()
    .replace(/[\u00a0\u202f]/g, ' ')
    .replace(/,/g, '.');
  if (!texte.trim()) return null;
  // L'extraction écrit souvent « Vidange initiale à 20 h puis toutes les
  // 100 heures » : c'est l'intervalle RÉCURRENT qui compte, donc ce qui suit
  // « puis ». On essaie d'abord cette portion, puis le texte entier.
  const morceaux = texte.split(/\b(?:puis|ensuite|par la suite|then|à partir de)\b/);
  const portion = morceaux.length > 1 ? morceaux.slice(1).join(' ') : null;
  const candidats = portion ? [portion, texte] : [texte];
  const nombre = (motif) => {
    const m = texte.match(motif);
    if (!m) return null;
    const n = parseFloat(String(m[1]).replace(/\s/g, ''));
    return Number.isFinite(n) && n > 0 ? n : null;
  };
  const cherche = (motif) => {
    for (const candidat of candidats) {
      const m = candidat.match(motif);
      if (!m) continue;
      const n = parseFloat(String(m[1]).replace(/\s/g, ''));
      if (Number.isFinite(n) && n > 0) return n;
    }
    return null;
  };
  if (unite === 'days') {
    const jours = cherche(/(\d+(?:\.\d+)?)\s*(?:jours?|journee?s?|days?|day|j\b|d\b)/);
    if (jours != null) return jours;
    const semaines = cherche(/(\d+(?:\.\d+)?)\s*(?:semaines?|weeks?|sem\b)/);
    if (semaines != null) return Math.round(semaines * 7);
    return null;
  }
  if (unite === 'km') return cherche(/([\d\s]*\d+(?:\.\d+)?)\s*(?:km|kilom)/);
  return cherche(/(\d+(?:\.\d+)?)\s*(?:heures?|hrs?\b|hours?|h\b)/);
}

// Intervalle d'une tâche : celui déjà mémorisé, sinon celui déduit du texte.
function intervalleTacheDepuis(item, unite) {
  if (!item) return null;
  const memorise = Number(item.interval);
  if (Number.isFinite(memorise) && memorise > 0) return memorise;
  return intervalleDepuisTexte(item.frequency, unite);
}
function intervalleTache(item, plan, machine) {
  const resolu = resolutionIntervalle(item, plan, machine);
  return resolu ? resolu.interval : null;
}

// ── AMBIGUÏTÉ DU CARNET : ON DEMANDE, ON NE DEVINE PAS ────────
// Beaucoup de carnets donnent PLUSIEURS fréquences selon l'usage :
//   « Frein de chaîne — Professionnel : 3 mois / Partiel : 6 mois / Occasionnel : 1 an »
//   « Extincteur — contrôle tous les 1 à 2 ans »
//   « Porte-couteaux — 100 heures ou 2 ans »
// Dans ce cas on mémorise les OPTIONS extraites et AUCUN intervalle unique :
// c'est l'utilisateur qui tranche.
//   interval_choices: [{ libelle: 'Professionnel', interval: 3, unite: 'mois' }, …]
// Une fois le choix fait :
//   interval: 3, interval_unite: 'mois', interval_choisi: 'Professionnel'
// Aucune option n'est inventée : chacune vient du texte du carnet.
//

const UNITES_INTERVALLE = {
  heures: { mot: trad('heures'), libelle: trad('Heures'), court: 'h', genre: 'compteur' },
  km: { mot: trad('km'), libelle: trad('Km'), court: trad('km'), genre: 'compteur' },
  jours: { mot: trad('jours'), libelle: trad('Jours'), court: 'j', genre: 'date' },
  semaines: { mot: trad('semaines'), libelle: trad('Semaines'), court: 'sem', genre: 'date' },
  mois: { mot: trad('mois'), libelle: trad('Mois'), court: trad('mois'), genre: 'date' },
  ans: { mot: trad('ans'), libelle: trad('Ans'), court: 'an', genre: 'date' },

const MOTIFS_CONTROLE = [
  /chaque (utilisation|usage|plein|d[ée]marrage|intervention|fois|saison|journ[ée]e)/,
  /[àa] chaque/,
  /au besoin/, /si besoin/, /si n[ée]cessaire/, /quand n[ée]cessaire/, /en cas de besoin/,
  /selon (le|la|les|l'|ton|ta|tes|votre|vos|manuel|usage|utilisation|conditions)/,
  /r[ée]guli[èe]rement/, /p[ée]riodiquement/, /au coup par coup/,
  /contr[ôo]le visuel/, /v[ée]rification visuelle/, /inspection visuelle/,
  /avant chaque/, /apr[èe]s chaque/, /au moindre/,
];
function estPointDeControle(frequency) {
  const texte = String(frequency || '').toLowerCase();
  return MOTIFS_CONTROLE.some(m => m.test(texte));
}
function uniteIntervalleDepuisMot(mot) {
  const m = String(mot || '').toLowerCase();
  if (/^(heures?|hrs?|hours?|h)$/.test(m)) return trad('heures');
  if (/^(km|kilom)/.test(m)) return trad('km');
  if (/^(jours?|journee?s?|days?|day|j|d)$/.test(m)) return trad('jours');
  if (/^semaines?$|^weeks?$|^sem$/.test(m)) return trad('semaines');
  if (/^mois$|^months?$/.test(m)) return trad('mois');
  if (/^(ans?|ann[ée]es?|years?)$/.test(m)) return trad('ans');
  return null;
}
function uniteIntervalleDuPlan(plan, machine) {
  if (!planIsCounter(plan)) return trad('jours');
  return (machine && counterUnitOf(machine) === 'km') ? trad('km') : trad('heures');
}
function uniteCompatiblePlan(unite, plan, machine) {
  const info = UNITES_INTERVALLE[unite];
  if (!info) return false;
  if (planIsCounter(plan)) return unite === uniteIntervalleDuPlan(plan, machine);
  return info.genre === 'date';

// Découpe une fréquence en morceaux candidats : « a : 3 mois / b : 6 mois ».
function morceauxFrequence(frequency) {
  return String(frequency || '')
    .split(/\s*(?:\/|\bou\b|\bsoit\b|;|\|)\s*/i)
    .map(m => m.trim())
    .filter(Boolean);
}
// Libellé porté par un morceau (« Professionnel : 3 mois » → « Professionnel »).
function libelleDepuisMorceau(morceau) {
  const parts = String(morceau).split(':');
  if (parts.length < 2) return null;
  let candidat = parts[0].trim();
  // « Frein de chaîne — Professionnel : 3 mois » : le libellé d'usage est ce qui
  // suit le tiret, pas le nom de la tâche.
  const apresTiret = candidat.split(/\s*[—–]\s*|\s+-\s+/).filter(Boolean);
  if (apresTiret.length > 1) candidat = apresTiret[apresTiret.length - 1].trim();
  candidat = candidat.replace(/[-–—\s]+$/, '').trim();
  if (!candidat || candidat.length > 30 || /\d/.test(candidat)) return null;
  return candidat;
}
// Toutes les options d'un morceau : « 1 à 2 ans » en donne deux.
function optionsDepuisMorceau(morceau) {
  const texte = String(morceau || '').toLowerCase().replace(/[\u00a0\u202f]/g, ' ').replace(/,/g, '.');
  const libelle = libelleDepuisMorceau(morceau);
  const options = [];
  const motif = /(\d+(?:\.\d+)?)\s*(?:à|a|-|–|et)?\s*(\d+(?:\.\d+)?)?\s*(heures?|hrs?|hours?|h|km|kilom\w*|jours?|journee?s?|days?|day|j|semaines?|weeks?|sem|mois|months?|ans?|ann[ée]es?|years?)\b/g;
  let m;
  while ((m = motif.exec(texte)) !== null) {

    if (!unite) continue;
    const premier = parseFloat(m[1]);
    const second = m[2] ? parseFloat(m[2]) : null;
    if (Number.isFinite(premier) && premier > 0) options.push({ libelle, interval: premier, unite });

}
// Options extraites d'une fréquence, toutes unités confondues. null quand le

function choixDepuisTexte(frequency) {
  if (!frequency || estPointDeControle(frequency)) return null;
  const morceaux = morceauxFrequence(frequency);
  let options = [];
  morceaux.forEach(m => { options = options.concat(optionsDepuisMorceau(m)); });
  options = options.filter((o, i) => options.findIndex(x => x.interval === o.interval && x.unite === o.unite) === i);
  if (!options.length) return null;
  if (options.length < 2 && morceaux.length < 2) return null;
  return options;

// Options d'une tâche : celles déjà mémorisées, sinon celles déduites du texte.
function optionsTache(item, plan, machine) {
  if (!item) return [];
  if (Array.isArray(item.interval_choices) && item.interval_choices.length) return item.interval_choices;
  return choixDepuisTexte(item.frequency) || [];
}
// Compatibilité d'une unité avec un plan, sans avoir le plan sous la main.
function uniteCompatibleAvecPlanSuivi(contreur, unite, uniteOption) {
  const info = UNITES_INTERVALLE[uniteOption];
  if (!info) return false;
  if (!contreur) return info.genre === 'date';
  return info.genre === 'compteur' && uniteOption === uniteIntervalleDepuisSuivi(unite);
}
function uniteIntervalleDepuisSuivi(unite) {
  return unite === 'days' ? trad('jours') : (unite === 'hours' ? trad('heures') : (unite || trad('jours')));
}
// Un intervalle lu dans le texte, DANS L'UNITÉ DU PLAN : « tous les 6 mois » et
// « tous les 2 ans » n'ont de sens que sur un plan calendaire.
function resolutionIntervalleDepuisTexte(frequency, uniteIntervalle) {
  const suivi = uniteIntervalle === 'jours' ? 'days' : uniteIntervalle;
  const nombre = intervalleDepuisTexte(frequency, suivi);
  if (nombre != null) return { interval: nombre, unite: uniteIntervalle };
  if (uniteIntervalle === 'jours') {
    const enMois = intervalleEnMoisDepuisTexte(frequency);
    if (enMois != null) return enMois;
  }

}
// Résolution : { interval, unite } ou null.
//  1) un intervalle déjà mémorisé gagne (avec son unité) ;
//  2) un texte AMBIGU ne donne AUCUN intervalle : c'est l'utilisateur qui
//     tranchera parmi les options extraites du carnet ;
//  3) sinon on lit le texte dans l'unité du plan.
function resolutionIntervalle(item, plan, machine) {
  if (!item) return null;
  const memorise = Number(item.interval);
  if (Number.isFinite(memorise) && memorise > 0) {
    return { interval: memorise, unite: item.interval_unite || uniteIntervalleDuPlan(plan, machine) };
  }
  if (item.point_de_controle) return null;
  const options = (Array.isArray(item.interval_choices) && item.interval_choices.length)
    ? item.interval_choices
    : choixDepuisTexte(item.frequency);
  if (options && options.length) {
    const compatibles = options.filter(o => uniteCompatiblePlan(o.unite, plan, machine));
    if (options.length > 1 || compatibles.length === 0) return null;
  }
  return resolutionIntervalleDepuisTexte(item.frequency, uniteIntervalleDuPlan(plan, machine));
}
// « tous les 6 mois », « tous les 2 ans » : réservé aux plans calendaires.
function intervalleEnMoisDepuisTexte(frequency) {
  const texte = String(frequency || '').toLowerCase()
    .replace(/[\u00a0\u202f]/g, ' ').replace(/,/g, '.');
  if (!texte.trim()) return null;
  const morceaux = texte.split(/\b(?:puis|ensuite|par la suite|then|à partir de)\b/);
  const portions = morceaux.length > 1 ? [morceaux.slice(1).join(' '), texte] : [texte];
  const lire = (motif) => {
    for (const portion of portions) {
      const m = portion.match(motif);
      if (m) {
        const n = parseFloat(String(m[1]).replace(/\s/g, ''));
        if (Number.isFinite(n) && n > 0) return n;
      }
    }
    return null;
  };
  const mois = lire(/(\d+(?:\.\d+)?)\s*(?:mois|months?)\b/);
  if (mois != null) return { interval: mois, unite: trad('mois') };
  const ans = lire(/(\d+(?:\.\d+)?)\s*(?:ans?|ann[ée]es?|years?)\b/);
  if (ans != null) return { interval: ans, unite: trad('ans') };
  return null;
}
// Une tâche attend un choix quand son intervalle n'est pas résolu et que le
// carnet propose des options — soit plusieurs, soit une seule mais dans une
// autre unité que celle du plan (il faut alors trancher : valeur en unité du
// plan, ou point de contrôle).
function tacheAttendUnChoix(item, plan, machine) {
  if (!item) return false;
  if (resolutionIntervalle(item, plan, machine)) return false;
  if (item.point_de_controle) return false;
  if (estPointDeControle(item.frequency)) return false;
  const options = optionsTache(item, plan, machine);
  if (!options.length) return false;
  const compatibles = options.filter(o => uniteCompatiblePlan(o.unite, plan, machine));
  return options.length > 1 || compatibles.length === 0;
}
// Libellé lisible d'une option : « Professionnel — tous les 3 mois ». L'unité
// reste en minuscules DANS la phrase (la majuscule ne sert que d'étiquette).
function libelleOption(option) {
  const info = UNITES_INTERVALLE[option.unite] || { mot: String(option.unite || '') };
  const valeur = tR('Tous les {valeur} {unite}', { valeur: String(option.interval), unite: trad(info.mot) });
  return option.libelle ? `${option.libelle} — ${valeur}` : valeur;
}

// Échéance d'une tâche LUE DANS LA DIMENSION DU PLAN :
// { genre: 'compteur' | 'jours' | null, valeur }.
function echeanceTache(item, plan) {
  if (!item) return { genre: null, valeur: null };
  if (planIsCounter(plan)) {
    const v = Number(item.due_counter);
    return Number.isFinite(v) ? { genre: 'compteur', valeur: v } : { genre: null, valeur: null };
  }
  return item.due_at ? { genre: trad('jours'), valeur: item.due_at } : { genre: null, valeur: null };
}

// Échéance PROPRE d'une tâche : celle de SON unité, quand cette unité n'est pas
// celle du plan — « 10 jours » saisi librement sur un plan au compteur horaire.
// Le champ de l'AUTRE dimension porte alors cette échéance : `due_at` pour une
// unité calendaire, `due_counter` pour une unité de compteur, quelle que soit la
// dimension du plan. Renvoie null quand la tâche n'a pas d'échéance propre.
//
// POURQUOI CE N'EST PAS UN POINT DE CONTRÔLE : une valeur libre est un vrai
// intervalle exprimé par l'utilisateur. Elle ne compte pas dans l'échéance du
// plan (des jours ne se comparent pas à des heures), mais elle n'est pas perdue :
// la ligne de la tâche porte sa propre échéance, et le dit.
function echeancePropreTache(item, plan) {
  if (!item) return null;
  const aDate = !!item.due_at;
  const aCompteur = Number.isFinite(Number(item.due_counter));
  if (planIsCounter(plan)) return (aDate && !aCompteur) ? { genre: trad('jours'), valeur: item.due_at } : null;
  return (aCompteur && !aDate) ? { genre: 'compteur', valeur: Number(item.due_counter) } : null;
}

// Échéance propre, écrite dans SON unité : une date pour les unités calendaires,
// un relevé de compteur sinon. C'est le texte affiché sur la ligne de la tâche.
function echeancePropreTexte(propre, machine) {
  if (!propre) return '';
  if (propre.genre === 'jours') return formatShortDate(propre.valeur);
  return formatCounter(propre.valeur, counterUnitOf(machine));
}

// État d'une tâche : on présente à dueInfo un plan « vu par la tâche » (même
// mode de suivi, même fenêtre de rappel, mais SON échéance). Aucune règle
// d'état n'est réécrite ici.
function infoTache(item, plan, machine) {
  const inconnu = {
    state: 'unknown', label: trad('Intervalle à préciser'), short: trad('Intervalle à préciser'),
    sortKey: Number.POSITIVE_INFINITY, urgency: Number.POSITIVE_INFINITY,
    unit: uniteSuivi(plan, machine),
  };
  // D'abord le CHOIX : une échéance héritée du plan (règle de reprise) ne doit
  // pas faire croire que la tâche est suivie alors que le carnet laisse
  // l'intervalle en suspens. Le choix est demandé avant tout le reste.
  if (tacheAttendUnChoix(item, plan, machine)) {
    return { ...inconnu, state: 'choix', label: trad('Fréquence à choisir'), short: trad('Fréquence à choisir') };
  }
  if (item && item.point_de_controle) {
    return { ...inconnu, state: 'controle', label: trad('Point de contrôle'), short: trad('Point de contrôle') };
  }
  if (item && estPointDeControle(item.frequency)) {
    return { ...inconnu, state: 'controle', label: trad('Point de contrôle'), short: trad('Point de contrôle') };
  }
  // Échéance dans une AUTRE unité que celle du plan : elle est lue dans son
  // unité, marquée horsPlan (l'écran le dit) et n'entre pas dans le minimum.
  const propre = echeancePropreTache(item, plan);
  if (propre) {
    const vuParLaTache = propre.genre === 'jours'
      ? { ...plan, tracking_mode: 'days', next_due_at: propre.valeur }
      : { ...plan, tracking_mode: 'hours', next_due_at: null, ...planNextDueCounterPatch(propre.valeur) };
    return { ...dueInfo(vuParLaTache, machine), horsPlan: true, propre };
  }
  const echeance = echeanceTache(item, plan);
  if (echeance.genre === 'compteur') {
    return dueInfo({ ...plan, ...planNextDueCounterPatch(echeance.valeur) }, machine);
  }
  if (echeance.genre === 'jours') {
    return dueInfo({ ...plan, next_due_at: echeance.valeur }, machine);
  }
  return inconnu;
}

// « Retenu : … » : un choix mémorisé doit TOUJOURS se voir, y compris quand il
// aboutit à un point de contrôle. C'est exactement ce qui manquait sur « Vis du
// pied du cylindre » : le choix était en base, mais la branche « point de
// contrôle » ne l'affichait pas — l'utilisateur croyait l'avoir perdu.
function retenuTache(item) {
  const choix = item && item.interval_choisi;
  if (!choix) return '';
  // Un choix resté « point de contrôle » n'apprend rien de plus que la ligne
  // elle-même : on ne l'écrit que s'il porte une vraie fréquence.
  if (choix === 'Point de contrôle' || choix === trad('Point de contrôle')) return '';
  return `<span class="muted">${esc(tR('Retenu : {choix}', { choix }))}</span>`;
}

// Échéance d'une tâche, prête à afficher. Deux dispositions, une seule source :
//   • 'colonne' (défaut) : le tableau, sur écran large — tout empilé à gauche ;
//   • 'ligne' : les cartes du téléphone — la pastille se pose SUR la ligne de
//     l'échéance, à gauche du texte, et aucun conflit d'alignement n'est possible.
function etatTacheHtml(item, plan, machine, disposition) {
  const info = infoTache(item, plan, machine);
  const bouton = (texte, classe) =>
    `<button type="button" class="${classe}" data-tache="${esc(item.label || '')}">${esc(texte)}</button>`;
  const classe = disposition === 'ligne' ? 'cell-echeance-ligne' : 'cell-echeance';
  const cellule = (contenu) => `<div class="${classe}">${contenu}</div>`;
  const retenu = retenuTache(item);
  if (info.state === 'choix') {
    return cellule(`<span class="muted">${esc(info.short)}</span>${retenu}${bouton(trad('Choisir'), 'choisir-frequence')}`);
  }
  if (info.state === 'controle') {
    // Un point de contrôle peut être revenu en arrière : si le carnet proposait
    // des options (ou si l'utilisateur en avait choisi une), on laisse modifier.
    const peutModifier = item && (item.interval_choisi || optionsTache(item, plan, machine).length);
    const mention = retenu ? `<span class="muted">${trad('— non suivi automatiquement')}</span>` : '';
    return cellule(`<span class="muted">${esc(info.short)}</span>${retenu}${mention}`
      + (peutModifier ? bouton(trad('Modifier'), 'choisir-frequence') : ''));
  }
  if (info.state === 'unknown') return cellule(`<span class="muted">${esc(info.short)}</span>${retenu}`);
  const modifier = item && (item.interval_choisi || item.point_de_controle)
    ? bouton(trad('Modifier'), 'choisir-frequence')
    : '';
  // Échéance propre (unité différente de celle du plan) : écrite dans SON unité,
  // suivie de la phrase qui dit qu'elle ne compte pas dans l'échéance du plan.
  const echeanceHtml = info.horsPlan
    ? `<span class="muted">${esc(tR('Échéance : {echeance}', { echeance: echeancePropreTexte(info.propre, machine) }))}</span>`
      + `<span class="muted">${trad('ne compte pas dans l\'échéance du plan')}</span>`
    : `<span class="muted">${esc(info.short)}</span>`;
  return cellule(`<span class="badge ${badgeClass(info.state)}">${esc(badgeLabel(info.state))}</span>`
    + echeanceHtml + retenu + modifier);
}

// Bloc de choix d'une tâche ambiguë : la phrase, les options du carnet (une par
// ligne, avec leur valeur lisible) et l'accès au choix libre.
function blocChoixTache(item, plan, machine) {
  const options = optionsTache(item, plan, machine);
  const lignes = options.map(o => {
    const compatible = uniteCompatiblePlan(o.unite, plan, machine);
    const note = compatible ? '' : ` <span class="muted">(${esc(tR('pas dans l\'unité de ce plan ({unite}) : la tâche resterait un point de contrôle', { unite: trad((UNITES_INTERVALLE[o.unite] || {}).mot || '') }))})</span>`;
    return `<li>${esc(libelleOption(o))}${note}</li>`;
  }).join('');
  return `
    <div class="plan-field choix-frequence-bloc" data-tache="${esc(item.label || '')}">
      <div class="nom">${esc(item.label || '')}</div>
      <div class="value">${trad('Fréquence d\'entretien : à toi de choisir selon ton usage.')}</div>
      ${lignes ? `<ul class="choix-options">${lignes}</ul>` : ''}
      <button type="button" class="view-manual choisir-frequence" data-tache="${esc(item.label || '')}">${trad('Choisir la fréquence')}</button>
    </div>`;
}

// Tâches dont l'échéance est exploitable : ce sont les seules qui entrent dans
// le calcul de la plus proche (et donc dans l'état de la machine).
function tachesSuivies(items, plan) {
  const liste = normalizeItems(items);
  if (planIsCounter(plan)) return liste.filter(it => Number.isFinite(Number(it.due_counter)));
  return liste.filter(it => it.due_at);
}

// Tâche la plus urgente : c'est elle qui porte l'état affiché pour la machine.
function tacheLaPlusUrgente(items, plan, machine) {
  // Les tâches sont PROJETÉES avant d'être classées : l'état de la machine vient
  // donc du même classement que celui qu'un enregistrement écrirait (voir
  // projectionTaches), et une consultation ne peut pas raconter autre chose.
  const suivies = tachesSuivies(projectionTaches(items, plan, machine), plan);
  let meilleure = null;
  let meilleureInfo = null;
  suivies.forEach(it => {
    const info = infoTache(it, plan, machine);
    if (!meilleureInfo || info.sortKey < meilleureInfo.sortKey) { meilleure = it; meilleureInfo = info; }
  });
  return meilleure ? { item: meilleure, info: meilleureInfo } : null;
}

// L'échéance du plan = la plus proche de ses tâches COMPARABLES (même dimension
// que le plan). null quand aucune ne la porte : un plan dont toutes les tâches
// sont des points de contrôle, des choix en attente ou des échéances d'une autre
// unité n'a aucune échéance générale. Les appelants ÉCRIVENT donc aussi la valeur
// nulle : garder l'ancienne en ferait un vestige qui rend la machine « en
// retard » à tort (cas réel : « Vehicule du PDG », 1 470 km fantômes).
function echeancePlanDepuisTaches(items, plan) {
  const suivies = tachesSuivies(items, plan);
  if (!suivies.length) return null;
  if (planIsCounter(plan)) {
    return suivies.reduce((min, it) => Math.min(min, Number(it.due_counter)), Number.POSITIVE_INFINITY);
  }
  return suivies.reduce((min, it) => (String(it.due_at) < min ? String(it.due_at) : min), String(suivies[0].due_at));
}
function echeancePlanPatch(valeur, plan) {
  return planIsCounter(plan) ? planNextDueCounterPatch(valeur) : { next_due_at: valeur };
}

// ── CLASSEMENT D'UNE FRÉQUENCE : UNE SEULE RÈGLE ─────────────
// L'utilisateur a constaté dix tâches « en retard » de +970 km ou +125 h alors
// que la plupart n'ont AUCUN rythme propre : elles héritaient l'échéance du plan.
// Un « contrôle à chaque utilisation » n'a rien à faire en retard de 970 km.
//
// Trois natures, décidées ICI et nulle part ailleurs :
//   'conditionnelle'  la fréquence dépend d'un ÉVÉNEMENT, pas du temps ni de
//                     l'usage (« à chaque utilisation », « avant chaque long
//                     trajet », « au besoin », « selon le manuel », « si
//                     contamination ») → point de contrôle, JAMAIS d'échéance ;
//   'periodique'      un rythme explicite et unique, même dans une unité qui
//                     n'est pas celle du plan (« toutes les 250 heures », « tous
//                     les 90 jours », « chaque mois ») → intervalle propre ;
//   'a_choisir'       PLUSIEURS possibilités incompatibles (« 3 mois / 6 mois /
//                     1 an », « 1 à 2 ans », « 100 heures ou 2 ans ») → c'est
//                     l'utilisateur qui tranche.
// Un texte qui mêle rythme et condition (« chaque mois ou avant chaque long
// trajet ») est PÉRIODIQUE : le rythme existe, on ne le perd pas.
//
// DEUX ENTRÉES, UNE SEULE RÈGLE :
//   · les champs STRUCTURÉS renvoyés par l'analyse du carnet (extract-maintenance-plan) :
//     la fonction a lu le PDF, elle sait de quoi elle parle — l'application ne
//     devine plus rien à partir d'une phrase française ;
//   · le TEXTE, pour les plans déjà en base : c'est le repli déterministe, et le
//     seul dont dispose la passe de rattrapage.
// Les deux chemins appellent `classerFrequence`, donc ils ne peuvent pas diverger.
const NATURES_FREQUENCE = ['conditionnelle', 'periodique', 'a_choisir', 'inconnue'];

function classementVide(nature) {
  return { nature, interval: null, unite: null, options: [] };
}

function classerDepuisStructure(frequence) {
  if (!frequence || typeof frequence !== 'object') return null;
  const nature = String(frequence.nature || '').toLowerCase();
  if (nature === 'conditionnelle') return classementVide('conditionnelle');
  if (nature === 'periodique') {
    const interval = Number(frequence.interval);
    const unite = frequence.unite ? String(frequence.unite) : null;
    if (!Number.isFinite(interval) || interval <= 0) return null;
    if (!unite || !UNITES_INTERVALLE[unite]) return null;
    return { nature: 'periodique', interval, unite, options: [] };
  }
  if (nature === 'a_choisir') {
    const options = (Array.isArray(frequence.options) ? frequence.options : [])
      .map(o => ({
        libelle: o && o.libelle ? String(o.libelle) : null,
        interval: Number(o && o.interval),
        unite: o && o.unite ? String(o.unite) : null,
      }))
      .filter(o => Number.isFinite(o.interval) && o.interval > 0 && UNITES_INTERVALLE[o.unite]);
    if (!options.length) return null;
    return { nature: 'a_choisir', interval: null, unite: null, options };
  }
  return null;
}

// « chaque mois », « tous les ans » : le rythme EXISTE, même sans nombre écrit.
// Sans cela, « chaque mois ou avant chaque long trajet » passerait pour un
// contrôle purement conditionnel et perdrait son rythme mensuel.
function intervalleUnitaireDepuisTexte(texte) {
  const t = String(texte || '').toLowerCase();
  if (/\b(chaque|tous les|toutes les|par)\s+mois\b|\bmensuel/.test(t)) return { interval: 1, unite: trad('mois') };
  if (/\b(chaque|tous les|toutes les|par)\s+semaines?\b|\bhebdomadaire/.test(t)) return { interval: 1, unite: trad('semaines') };
  if (/\b(chaque|tous les|toutes les|par)\s+(ans?|ann[ée]es?)\b|\bannuel/.test(t)) return { interval: 1, unite: trad('ans') };
  if (/\b(chaque|tous les|toutes les|par)\s+jours?\b|\bquotidien/.test(t)) return { interval: 1, unite: trad('jours') };
  if (/\b(chaque|tous les|toutes les|par)\s+heures?\b/.test(t)) return { interval: 1, unite: trad('heures') };
  return null;
}

function classerDepuisTexte(frequency) {
  const texte = String(frequency || '').trim();
  if (!texte) return classementVide('inconnue');
  // 1. Plusieurs possibilités : on demande, on ne devine pas.
  const options = choixDepuisTexte(texte);
  if (options && options.length) return { nature: 'a_choisir', interval: null, unite: null, options };
  // 2. Purement conditionnelle : un motif de contrôle ET aucun rythme lisible.
  const enMois = intervalleEnMoisDepuisTexte(texte);
  const enHeures = intervalleDepuisTexte(texte, 'hours');
  const enKm = intervalleDepuisTexte(texte, trad('km'));
  const enJours = intervalleDepuisTexte(texte, 'days');
  const unitaire = intervalleUnitaireDepuisTexte(texte);
  if (estPointDeControle(texte) && enMois == null && enHeures == null && enKm == null
    && enJours == null && !unitaire) {
    return classementVide('conditionnelle');
  }
  // 3. Rythme explicite : l'unité écrite dans le carnet fait foi.
  if (enMois) return { nature: 'periodique', interval: enMois.interval, unite: enMois.unite, options: [] };
  if (enHeures) return { nature: 'periodique', interval: enHeures, unite: trad('heures'), options: [] };
  if (enKm) return { nature: 'periodique', interval: enKm, unite: trad('km'), options: [] };
  if (enJours) return { nature: 'periodique', interval: enJours, unite: trad('jours'), options: [] };
  if (unitaire) return { nature: 'periodique', interval: unitaire.interval, unite: unitaire.unite, options: [] };
  // 4. Rien d'exploitable : ni rythme, ni choix à proposer.
  return classementVide('inconnue');
}

// L'ENTRÉE UNIQUE : les champs structurés s'ils sont exploitables, sinon le texte.
function classerFrequence(item) {
  return classerDepuisStructure(item && item.frequence)
    || classerDepuisTexte(item && item.frequency);
}

// Échéance PROPRE d'une tâche, calculée dans SON unité : une date pour les unités
// calendaires, un relevé de compteur sinon. Une seule implémentation, employée
// par la passe de préparation ET par le choix de l'utilisateur.
function echeancePropreTacheAppliquee(t, machine) {
  const info = UNITES_INTERVALLE[t.interval_unite] || {};
  if (info.genre === 'date') {
    const depart = t.last_done_at || todayIso();
    t.due_at = ajouterIntervalleIso(depart, t.interval, t.interval_unite);
    delete t.due_counter;
  } else {
    const depart = Number.isFinite(Number(t.last_done_counter))
      ? Number(t.last_done_counter)
      : (Number(machineCounter(machine)) || 0);
    t.due_counter = depart + Number(t.interval);
    delete t.due_at;
  }
  return t;
}

// LA PASSE, sur les éléments déjà en base comme sur ceux qui arrivent d'une
// analyse. Idempotente, et elle ne touche JAMAIS un choix déjà fait.
function preparerTaches(items, plan, machine, duePlan, unite) {
  const liste = normalizeItems(items);
  if (!liste.length) return null;
  const contreur = planIsCounter(plan);
  return liste.map(it => {
    const t = { ...it };
    // Un choix de l'utilisateur est sa parole : on n'y touche pas.
    if (t.interval_choisi) return t;
    const classement = classerFrequence(t);
    if (classement.nature === 'conditionnelle') {
      // Un rythme conditionnel n'a AUCUNE échéance : il ne doit plus hériter de
      // celle du plan (c'était toute la cause des alertes à +970 km).
      delete t.interval; delete t.interval_unite; delete t.interval_choices;
      delete t.due_at; delete t.due_counter;
      t.point_de_controle = true;
      return t;
    }
    if (classement.nature === 'a_choisir') {
      delete t.interval; delete t.interval_unite;
      delete t.due_at; delete t.due_counter; delete t.point_de_controle;
      t.interval_choices = classement.options;
      return t;
    }
    if (classement.nature === 'periodique') {
      t.interval = classement.interval;
      t.interval_unite = classement.unite;
      delete t.interval_choices; delete t.point_de_controle;
      if (uniteCompatiblePlan(classement.unite, plan, machine)) {
        // Même unité que le plan : l'échéance de reprise porte le retard réel.
        if (contreur) {
          if (!Number.isFinite(Number(t.due_counter)) && duePlan != null) t.due_counter = duePlan;
        } else if (!t.due_at && duePlan) {
          t.due_at = duePlan;
        }
        return t;
      }
      // Autre unité : sa propre échéance, dans son unité, hors du minimum du plan.
      delete t.due_at; delete t.due_counter;
      return echeancePropreTacheAppliquee(t, machine);
    }
    // 'inconnue' : aucun rythme établi, donc aucune échéance — surtout pas celle
    // du plan, qui faisait passer une tâche sans rythme pour en retard.
    delete t.interval; delete t.interval_unite; delete t.interval_choices;
    delete t.point_de_controle; delete t.due_at; delete t.due_counter;
    return t;
  });
}

// ── LE CLASSEMENT PROJETÉ POUR L'AFFICHAGE ────────────────────
// Une consultation ne doit JAMAIS montrer une information périmée : un plan
// jamais réenregistré se lit donc COMME S'IL VENAIT d'être enregistré. Le
// classement d'une fréquence est une fonction pure de son texte (et de sa
// structure) : il n'a aucune raison d'attendre une écriture en base.
//
// `projectionTaches` réemploie `preparerTaches` — EXACTEMENT la passe de
// l'écriture. Il n'existe donc pas de seconde règle côté affichage : ce que
// l'utilisateur voit et ce qui sera enregistré ne peuvent pas diverger.
// Elle ne MODIFIE rien : les éléments rendus sont des copies, et la base n'est
// touchée que sur une action de l'utilisateur (enregistrement, choix, entretien).
function projectionTaches(items, plan, machine) {
  const liste = normalizeItems(items);
  if (!liste.length) return liste;
  const duePlan = planIsCounter(plan) ? planNextDueCounter(plan) : (plan ? plan.next_due_at : null);
  return preparerTaches(liste, plan, machine, duePlan, uniteSuivi(plan, machine)) || liste;
}

// Le même classement, à partir du plan : c'est LA fonction qu'emploient les
// écrans qui affichent des échéances (fiche du plan, prochain entretien,
// journal d'intervention, bandeau des retards, tâche la plus urgente).
function tachesAffichees(plan, machine) {
  return projectionTaches(plan && plan.items, plan, machine);
}

// Entretien enregistré : SEULES les tâches cochées avancent (leur échéance = le
// relevé saisi + leur intervalle). Les autres ne bougent pas — une tâche en
// retard le reste tant qu'elle n'a pas été cochée. Renvoie null quand le plan
// n'a aucun élément détaillé : le comportement d'avant s'applique alors.
function tachesApresEntretien(items, plan, machine, cochees, releve, dateEntretien) {
  const unite = uniteSuivi(plan, machine);
  const contreur = planIsCounter(plan);
  const duePlan = contreur ? planNextDueCounter(plan) : (plan ? plan.next_due_at : null);
  const taches = preparerTaches(items, plan, machine, duePlan, unite);
  if (!taches) return null;
  const faites = Array.isArray(cochees) ? cochees : [];
  const apres = taches.map(t => {
    if (!faites.includes(t.label)) return t;          // non cochée : NE BOUGE PAS
    const resolu = resolutionIntervalle(t, plan, machine);
    const tache = { ...t };
    if (!resolu) {
      // Pas d'intervalle (ambigu, point de contrôle, ou inconnu) : on note que
      // c'est fait, on n'invente pas d'échéance. L'échéance héritée est retirée
      // (elle ne veut plus rien dire) et l'interface dit pourquoi.
      if (contreur) { tache.last_done_counter = releve; delete tache.due_counter; }
      else { tache.last_done_at = dateEntretien; delete tache.due_at; }
      return tache;
    }
    if (UNITES_INTERVALLE[resolu.unite] && UNITES_INTERVALLE[resolu.unite].genre === 'date') {
      tache.last_done_at = dateEntretien;
      tache.due_at = ajouterIntervalleIso(dateEntretien, resolu.interval, resolu.unite);
      delete tache.due_counter;
      return tache;
    }
    tache.last_done_counter = releve;
    tache.due_counter = Number(releve) + Number(resolu.interval);
    delete tache.due_at;
    return tache;
  });
  return { items: apres, echeance: echeancePlanDepuisTaches(apres, plan) };
}

// Le choix de l'utilisateur sur une tâche ambiguë. `choix` :
//   { interval, unite, libelle, libre }  une valeur (issue du carnet, ou libre)
//   { pointDeControle: true }            garder la tâche comme point de contrôle
//
// DEUX CAS BIEN DISTINCTS :
//   • une OPTION DU CARNET dans une autre unité que le plan (« ou 2 ans » sur un
//     compteur horaire) reste un point de contrôle : on ne fabrique pas une
//     échéance à partir d'une phrase du carnet ;
//   • une VALEUR LIBRE (`libre: true`) est un intervalle que l'utilisateur vient
//     d'exprimer, avec son unité : elle est acceptée TELLE QUELLE et reçoit sa
//     propre échéance, dans cette unité. Si l'unité diffère de celle du plan,
//     cette échéance ne compte pas dans l'échéance globale — mais la tâche garde
//     la sienne, et l'écran le dit.
function appliquerChoixTache(items, label, choix, plan, machine) {
  const contreur = planIsCounter(plan);
  return normalizeItems(items).map(it => {
    if (it.label !== label) return it;
    const t = { ...it };
    const compatible = choix.pointDeControle ? false : uniteCompatiblePlan(choix.unite, plan, machine);
    if (choix.pointDeControle || (!compatible && !choix.libre)) {
      delete t.interval;
      delete t.interval_unite;
      delete t.due_counter;
      delete t.due_at;
      t.point_de_controle = true;
      t.interval_choisi = choix.pointDeControle
        ? trad('Point de contrôle')
        : (choix.libelle || libelleOption(choix));
      return t;
    }
    t.interval = Number(choix.interval);
    t.interval_unite = choix.unite;
    t.interval_choisi = choix.libelle || libelleOption({ interval: choix.interval, unite: choix.unite });
    delete t.point_de_controle;
    delete t.interval_choices;
    // MÊME calcul d'échéance propre que la passe de préparation : une seule
    // implémentation, donc un choix de l'utilisateur et une fréquence lue dans un
    // carnet ne peuvent pas produire deux échéances différentes.
    return echeancePropreTacheAppliquee(t, machine);
  });
}

// ── pdf.js EMBARQUÉ, chargé en local ──────────────────────────────────
// POURQUOI EN LOCAL : l'application promet de fonctionner HORS CONNEXION, et le
// repérage des pages d'un carnet en dépend. Chargée depuis un CDN, la
// bibliothèque manquait dès que le réseau manquait — et la panne était muette.
// Les deux fichiers vivent à côté de la page (`vendor/`), copiés tels quels
// depuis la version 3.11.174 (licence Apache 2.0, voir vendor/pdf.js.LICENSE.txt).
const PDFJS_URL = "vendor/pdf.min.js";
const PDFJS_WORKER_URL = "vendor/pdf.worker.min.js";

let pdfLibPromise = null;
function loadPdfLib() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!pdfLibPromise) {
    pdfLibPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = PDFJS_URL;
      s.onload = () => (window.pdfjsLib ? resolve(window.pdfjsLib) : reject(new Error("pdf.js indisponible")));
      s.onerror = () => reject(new Error(trad('téléchargement de pdf.js impossible')));
      document.head.appendChild(s);
    });
    pdfLibPromise.catch(() => { pdfLibPromise = null; });
  }
  return pdfLibPromise;
}

let pdfWorkerReady = null;
function ensurePdfWorker() {
  if (!pdfWorkerReady) {
    const p = loadPdfLib()
      .then(() => fetch(PDFJS_WORKER_URL))
      .then(resp => {
        if (!resp.ok) throw new Error(trad('worker pdf.js introuvable'));
        return resp.text();
      })
      .then(code => {
        const blob = new Blob([code], { type: 'application/javascript' });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
      });
    // En cas d'échec on réarme, sinon le rejet resterait mémorisé pour toujours.
    pdfWorkerReady = p.catch(err => { pdfWorkerReady = null; throw err; });
  }
  return pdfWorkerReady;
}

async function renderPdfFirstPageAsBlob(file) {
  await ensurePdfWorker();
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 1.5 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
}

async function uploadMachinePhoto(companyId, machineId, blob) {
  const path = `${companyId}/${machineId}.jpg`;
  const { error } = await sb.storage.from('machine-photos').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
  if (error) throw error;
  const { data } = sb.storage.from('machine-photos').getPublicUrl(path);
  return data.publicUrl;
}

let reinitialisationParCode = false;

function openForgotPasswordModal() {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.innerHTML = `
    <div class="modal">
      <h2>${trad('Mot de passe oublié')}</h2>
      <p class="sub">${trad('Indique ton email de connexion : on t\'envoie un code à 6 chiffres pour définir un nouveau mot de passe.')}</p>
      <form id="forgot-form">
        <label for="forgot-email">${trad('Email')}</label>
        <input id="forgot-email" type="email" required>
        <div class="hint" id="forgot-error"></div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="forgot-cancel">${trad('Annuler')}</button>
          <button type="submit" class="primary">${trad('Envoyer le lien')}</button>
        </div>
      </form>
    </div>
  `;
  overlay.querySelector('#forgot-cancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = overlay.querySelector('#forgot-error');
    const submitBtn = e.target.querySelector('button[type=submit]');
    const email = overlay.querySelector('#forgot-email').value.trim();
    submitBtn.disabled = true;
    submitBtn.textContent = trad('Envoi…');
    try {
      const redirectTo = window.location.href.split('?')[0].split('#')[0];
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;
      // On demande le CODE reçu, pas seulement le lien : un lien à usage unique
      // est fréquemment consommé par le scanneur de liens du webmail, et
      // l'utilisateur se retrouve avec un lien mort sans comprendre pourquoi.
      overlay.innerHTML = `
        <div class="modal">
          <h2>${trad('Vérifie ton email')}</h2>
          <p class="sub">${tR('Un code à 6 chiffres a été envoyé à {email}. Saisis-le avec ton nouveau mot de passe. Chaque demande remplace la précédente : utilise le dernier code reçu.', { email: esc(email) })}</p>
          <form id="reset-code-form">
            <label for="reset-code">${trad('Code reçu par e-mail')}</label>
            <input id="reset-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" required>
            <label for="reset-password">${trad('Nouveau mot de passe')}</label>
            <div class="password-wrap">
              <input id="reset-password" type="password" minlength="6" required>
              <button type="button" class="toggle-pw-btn" aria-pressed="false">${trad('Afficher')}</button>
            </div>
            <div class="hint" id="reset-code-error"></div>
            <div class="resend-row">
              <button type="button" class="link-inline" id="reset-resend">${trad('Renvoyer un code')}</button>
              <span class="hint" id="reset-resend-msg" role="status" aria-live="polite"></span>
            </div>
            <div class="modal-actions">
              <button type="button" class="secondary" id="reset-code-cancel">${trad('Annuler')}</button>
              <button type="submit" class="primary">${trad('Enregistrer le mot de passe')}</button>
            </div>
          </form>
        </div>`;
      overlay.querySelector('#reset-code-cancel').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#reset-code-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const codeEl = overlay.querySelector('#reset-code-error');
        const valider = ev.target.querySelector('button[type=submit]');
        const code = overlay.querySelector('#reset-code').value.trim();
        const motDePasse = overlay.querySelector('#reset-password').value;
        valider.disabled = true;
        valider.textContent = trad('Vérification…');
        try {
          // Le parcours par code doit être le SEUL à consommer le jeton : on
          // prévient l'écouteur d'état, sinon l'événement PASSWORD_RECOVERY
          // réafficherait « choisis un nouveau mot de passe » après coup.
          reinitialisationParCode = true;
          const { error: errCode } = await sb.auth.verifyOtp({ email, token: code, type: 'recovery' });
          if (errCode) throw errCode;
          const { error: errMaj } = await sb.auth.updateUser({ password: motDePasse });
          if (errMaj) throw errMaj;
          overlay.remove();
          boot(trad('Mot de passe mis à jour'));
        } catch (err) {
          reinitialisationParCode = false;
          const brut = String(err.message || '');
          // Le message brut de Supabase est en anglais et technique. Dans le cas
          // le plus courant — un code d'une demande précédente, remplacé depuis —
          // on dit quoi faire, et le bouton juste en dessous le fait.
          codeEl.textContent = /expired or is invalid/i.test(brut)
            ? trad('Ce code a expiré ou a déjà servi. Demande un nouveau code.')
            : trad('Erreur :') + " " + brut;
          valider.disabled = false;
          valider.textContent = trad('Enregistrer le mot de passe');
        }
      });
      const renvoi = overlay.querySelector('#reset-resend');
      const renvoiMsg = overlay.querySelector('#reset-resend-msg');
      let attente = 0;
      renvoi.addEventListener('click', async () => {
        if (attente > 0) return;
        renvoi.disabled = true;
        renvoiMsg.textContent = trad('Envoi…');
        try {
          const redirectTo = window.location.href.split('?')[0].split('#')[0];
          const { error: errEnvoi } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
          if (errEnvoi) throw errEnvoi;
          // Chaque demande remplace la précédente : l'ancien code ne vaut plus
          // rien, c'est justement pourquoi on propose ce bouton.
          renvoiMsg.textContent = trad('Nouveau code envoyé.');
        } catch (err) {
          renvoiMsg.textContent = trad('Envoi impossible :') + " " + err.message;
        }
        attente = 30;
        const tic = () => {
          if (attente <= 0) { renvoi.disabled = false; renvoi.textContent = trad('Renvoyer un code'); clearInterval(minuteur); return; }
          renvoi.textContent = tR('Renvoyer dans {n} s', { n: attente });
          attente--;
        };
        const minuteur = setInterval(tic, 1000);
        tic();
      });
    } catch (err) {
      errorEl.textContent = trad('Erreur :') + " " + err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = trad('Envoyer le lien');
    }
  });
}

    try {
      if (!nom) throw new Error(trad('Indique le nom de la société.'));
      // Les colonnes prénom/nom du contact n'existent qu'après migration : on ne
      // les envoie que si elles sont là, comme à l'inscription.
      const { error: sonde } = await sb.from('companies').select('contact_first_name').limit(1);
      const contact = sonde ? {} : (() => {
        const plein = (user && user.user_metadata && user.user_metadata.full_name) || '';

        return morceaux.length > 1
          ? { contact_first_name: morceaux[0], contact_last_name: morceaux.slice(1).join(' ') }

      if (errSociete) throw errSociete;
      const { error: errProfil } = await sb.from('profiles').insert({ id: user.id, company_id: companyId });
      if (errProfil) throw errProfil;
      boot(trad('Société créée'));
    } catch (err) {
      errorEl.textContent = trad('Erreur :') + " " + err.message;
      bouton.disabled = false;
      bouton.textContent = trad('Créer ma société');
    }
  });
}

        <a href="./mentions-legales.html" target="_blank" rel="noopener">${trad('Mentions légales')}</a> ·
        <a href="./cgu.html" target="_blank" rel="noopener">${trad('CGU')}</a> ·
        <a href="./politique-confidentialite.html" target="_blank" rel="noopener">${trad('Confidentialité')}</a>
      </div>
    </div>
  `;
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { renderLogin(error.message); return; }
    // L'utilisateur vient de saisir son mot de passe : le verrou de ce lancement
    // est donc levé — redemander une empreinte juste après serait absurde.
    verrouLeve = true;
    // Enregistrement de l'accès sans mot de passe si la case a été cochée (geste
    // explicite). Le résultat n'est PAS annoncé ici : l'échec d'une option ne doit
    // pas accueillir l'utilisateur par un message sur son tableau de bord. La
    // raison et le code restent dans « Mon compte ».
    await proposerAccesSansMotDePasse(email);
    boot();
  });

  // L'invite et le bouton n'apparaissent que dans l'application native, et
  // seulement si l'appareil annonce une vérification utilisable : ailleurs, ce
  // bloc reste vide.
  preparerBiometrieConnexion();
  document.getElementById('open-signup').addEventListener('click', () => openSignupWizard());
  document.getElementById('open-forgot').addEventListener('click', () => openForgotPasswordModal());

  // Retour d'un lien de réinitialisation refusé par Supabase : l'adresse porte
  // error_code=otp_expired (ou access_denied). On le dit, et on nettoie
  // l'adresse pour qu'un rechargement ne réaffiche pas l'erreur.
  if (/[?#&]error_code=/.test(location.hash) || /[?&]error_code=/.test(location.search)) {
    try { history.replaceState(null, '', location.pathname); } catch (err) { /* sans conséquence */ }
    renderLienExpire();
    return;
  }

  // Lien direct depuis la page publique : « Essai gratuit » et « Commencer
  // gratuitement » doivent ouvrir le FORMULAIRE DE CRÉATION DE COMPTE, et non
  // l'écran de connexion. On accepte ?inscription, ?inscription=1 et
  // #inscription. Le paramètre est consommé (retiré de l'adresse) : sans cela,
  // une erreur de connexion relancerait le formulaire à chaque nouvel essai.
  if (/[?&]inscription\b/.test(location.search) || location.hash === '#inscription') {
    try { history.replaceState(null, '', location.pathname); } catch (err) { /* sans conséquence */ }
    openSignupWizard();
  }
  // Déverrouillage local EXPLICITE : rien n'est affiché avant ce clic.
  const voirCopie = document.getElementById('voir-copie');
  if (voirCopie) {
    voirCopie.addEventListener('click', () => {
      const copie = lireCache();
      if (copie) afficherDepuisCache(copie);
      else renderLogin(trad('La copie locale a expiré ou a été effacée.'));
    });
  }
}

const SIGNUP_ACTIVITIES = [trad('BTP / Travaux publics'), trad('Agriculture / Élevage'), trad('Espaces verts / Paysagisme'), trad('Transport / Logistique'), trad('Location de matériel'), trad('Industrie / Production'), trad('Collectivité / Secteur public'), trad('Autre')];

function openSignupWizard() {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  const state = {
    structureType: 'company', name: '', activity: SIGNUP_ACTIVITIES[0],
    registrationNumber: '', phone: '', email: '', password: '',
    contactName: '', contactFirstName: '', contactLastName: '',
  };

  function shell(inner) { overlay.innerHTML = `<div class="modal">${inner}</div>`; }

  function stepForm() {
    shell(`
      <h2>${trad('Créer un compte')}</h2>
      <p class="sub">${trad('Offre gratuite : 1 machine. Offre Éco : 5 €/mois, jusqu\'à 5 machines. Offre Pro : 20 €/mois, sans limite.')}</p>
      <form id="signup-form">
        <label>${trad('Type de structure')}</label>
        <div class="track-mode-choice">
          <label><input type="radio" name="stype" value="company" ${state.structureType === 'company' ? 'checked' : ''}> ${trad('Société')}</label>
          <label><input type="radio" name="stype" value="individual" ${state.structureType === 'individual' ? 'checked' : ''}> ${trad('Indépendant / Patenté')}</label>
        </div>

        <label for="su-name" id="su-name-label">${state.structureType === 'individual' ? trad('Nom et prénom') : trad('Nom de la société')}</label>
        <input id="su-name" required value="${esc(state.name)}">

        <label for="su-activity">${trad('Activité')}</label>
        <select id="su-activity">
          ${SIGNUP_ACTIVITIES.map(a => `<option value="${a}" ${a === state.activity ? 'selected' : ''}>${a}</option>`).join('')}
        </select>

        <label for="su-reg">${trad('N° RCS / RIDET (si disponible)')}</label>
        <input id="su-reg" value="${esc(state.registrationNumber)}">

        ${champTelephoneHtml('su-phone', state.phone, { label: trad('Téléphone'), required: true, aide: trad('Sert aux rappels d\'échéance par WhatsApp et par e-mail.') })}

        <div class="field-row">
          <div>
            <label for="su-contact-first">${trad('Prénom du contact')}</label>
            <input id="su-contact-first" required value="${esc(state.contactFirstName)}">
          </div>
          <div>
            <label for="su-contact-last">${trad('Nom du contact')}</label>
            <input id="su-contact-last" class="majuscules" autocapitalize="characters" required value="${esc(state.contactLastName)}">
          </div>
        </div>

        <label for="su-email">${trad('Email')}</label>
        <input id="su-email" type="email" required value="${esc(state.email)}">

        <label for="su-password">${trad('Mot de passe')}</label>
        <div class="password-wrap">
          <input id="su-password" type="password" required minlength="6">
          <button type="button" class="toggle-pw-btn" aria-pressed="false">${trad('Afficher')}</button>
        </div>
        <div class="hint" id="su-error"></div>

        <div class="modal-actions">
          <button type="button" class="secondary" id="su-cancel">${trad('Annuler')}</button>
          <button type="submit" class="primary">${trad('Créer le compte')}</button>
        </div>
      </form>
    `);

    overlay.querySelector('#su-cancel').addEventListener('click', () => overlay.remove());
    overlay.querySelectorAll('input[name=stype]').forEach(r => {
      r.addEventListener('change', () => {
        state.structureType = overlay.querySelector('input[name=stype]:checked').value;
        overlay.querySelector('#su-name-label').textContent = state.structureType === 'individual' ? trad('Nom et prénom') : trad('Nom de la société');
      });
    });

    wireChampTelephone(overlay, 'su-phone');

    // Le nom de famille se saisit en majuscules, comme la marque et le modèle
    // d'une machine : forcerMajuscules transforme la VALEUR, pas seulement
    // l'affichage — sinon « de niro » resterait tel quel en base.
    forcerMajuscules(overlay.querySelector('#su-contact-last'));

    overlay.querySelector('#signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = overlay.querySelector('#su-error');
      const submitBtn = e.target.querySelector('button[type=submit]');
      submitBtn.disabled = true;
      submitBtn.textContent = trad('Envoi du code…');

      state.name = overlay.querySelector('#su-name').value.trim();
      state.activity = overlay.querySelector('#su-activity').value;
      state.registrationNumber = overlay.querySelector('#su-reg').value.trim();
      const telSaisi = lireChampTelephone(overlay, 'su-phone');
      state.phone = telSaisi ? telSaisi.e164 : '';
      state.contactFirstName = overlay.querySelector('#su-contact-first').value.trim();
      state.contactLastName = overlay.querySelector('#su-contact-last').value.trim();
      state.contactName = contactFullName(state.contactFirstName, state.contactLastName);
      state.email = overlay.querySelector('#su-email').value.trim();
      state.password = overlay.querySelector('#su-password').value;

      try {
        const { data, error } = await sb.auth.signUp({ email: state.email, password: state.password });
        if (error) throw error;
        // Supabase ne dit pas « cette adresse a déjà un compte » (protection contre
        // l'énumération) : il renvoie un utilisateur SANS identité et n'envoie
        // aucun e-mail. Sans ce contrôle, l'écran annonçait un code qui
        // n'arriverait jamais.
        if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
          stepDejaInscrit();
          return;
        }
        stepVerify();
      } catch (err) {
        errorEl.textContent = trad('Erreur :') + " " + err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = trad('Créer le compte');
      }
    });
  }

  // Un compte existe déjà avec cette adresse : l'écran de vérification n'a plus
  // de sens, puisqu'aucun code ne sera envoyé (Supabase ne révèle pas qu'une
  // adresse est déjà prise, et n'écrit donc rien). On propose les deux chemins
  // utiles au lieu de laisser attendre un code qui n'arrivera pas.
  function stepDejaInscrit() {
    shell(`
      <h2>${trad('Cette adresse a déjà un compte')}</h2>
      <p class="sub">${trad('Un compte existe déjà avec cette adresse. Connecte-toi avec ton mot de passe, ou demandes-en un nouveau.')}</p>
      <div class="modal-actions">
        <button type="button" class="secondary" id="deja-forgot">${trad('Mot de passe oublié ?')}</button>
        <button type="button" class="primary" id="deja-login">${trad('Se connecter')}</button>
      </div>
    `);
    overlay.querySelector('#deja-forgot').addEventListener('click', () => { overlay.remove(); openForgotPasswordModal(); });
    overlay.querySelector('#deja-login').addEventListener('click', () => { overlay.remove(); renderLogin(); });
  }

  function stepVerify() {
    shell(`
      <h2>${trad('Vérifie ton email')}</h2>
      <p class="sub">${tR('Un code à 6 chiffres a été envoyé à {email}. Saisis-le ci-dessous pour activer ton compte.', { email: esc(state.email) })}</p>
      <form id="verify-form">
        <label for="su-code">${trad('Code de vérification')}</label>
        <input id="su-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" required autofocus style="letter-spacing:6px;font-size:20px;text-align:center;">
        <div class="hint" id="verify-error"></div>
        <div class="resend-row">
          <button type="button" class="link-inline" id="verify-resend">${trad('Renvoyer le code')}</button>
          <span class="hint" id="verify-resend-msg" role="status" aria-live="polite"></span>
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="verify-cancel">${trad('Annuler')}</button>
          <button type="submit" class="primary">${trad('Valider')}</button>
        </div>
      </form>
    `);
    overlay.querySelector('#verify-cancel').addEventListener('click', () => overlay.remove());

    // Sans renvoi possible, un code non reçu condamnait l'inscription.
    const resendBtn = overlay.querySelector('#verify-resend');
    const resendMsg = overlay.querySelector('#verify-resend-msg');
    let cooldown = 0;
    let cooldownTimer = null;
    resendBtn.addEventListener('click', async () => {
      if (cooldown > 0) return;
      resendBtn.disabled = true;
      resendMsg.textContent = trad('Envoi…');
      try {
        const { error } = await sb.auth.resend({ type: 'signup', email: state.email });
        if (error) throw error;
        resendMsg.textContent = trad('Nouveau code envoyé.');
      } catch (err) {
        // « déjà confirmé » n'est pas une panne d'envoi : c'est un compte qui
        // existe. On le dit, au lieu d'afficher un message technique.
        if (/already confirmed|already registered|déjà/i.test(String(err.message))) {
          stepDejaInscrit();
          return;
        }
        resendMsg.textContent = trad('Envoi impossible :') + " " + err.message;
      }
      cooldown = 30;
      const tick = () => {
        if (cooldown <= 0) {
          resendBtn.disabled = false;
          resendBtn.textContent = trad('Renvoyer le code');
          clearInterval(cooldownTimer);
          return;
        }
        resendBtn.textContent = tR('Renvoyer dans {n} s', { n: cooldown });
        cooldown--;
      };
      tick();
      cooldownTimer = setInterval(tick, 1000);
    });
    overlay.querySelector('#verify-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = overlay.querySelector('#verify-error');
      const submitBtn = e.target.querySelector('button[type=submit]');
      submitBtn.disabled = true;
      submitBtn.textContent = trad('Vérification…');
      const code = overlay.querySelector('#su-code').value.trim();
      try {
        const { data, error } = await sb.auth.verifyOtp({ email: state.email, token: code, type: 'signup' });
        if (error) throw error;

        // Les colonnes prénom/nom n'existent qu'après migration-compte.sql :
        // on les ajoute à l'insertion seulement si elles sont là.
        const { error: sondeContact } = await sb.from('companies').select('contact_first_name').limit(1);
        const colonnesContact = sondeContact
          ? {}
          : { contact_first_name: state.contactFirstName || null, contact_last_name: state.contactLastName || null };

        const companyId = crypto.randomUUID();
        const { error: companyErr } = await sb.from('companies').insert({
          id: companyId,
          name: state.name,
          activity: state.activity,
          registration_number: state.registrationNumber || null,
          phone: state.phone,
          contact_name: state.contactName || null,
          ...colonnesContact,
          plan: 'free',
        });
        if (companyErr) throw companyErr;

        const { error: profileErr } = await sb.from('profiles').insert({
          id: data.user.id,
          company_id: companyId,
        });
        if (profileErr) throw profileErr;

        overlay.remove();
        boot();
      } catch (err) {
        errorEl.textContent = trad('Erreur :') + " " + err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = trad('Valider');
      }
    });
  }

  stepForm();
}

// Liens de paiement Stripe, UN PAR OFFRE — et UN PRODUIT PAR OFFRE côté Stripe,
// sans quoi le portail ne peut pas proposer le changement d'offre. Les clés sont
// celles des plans en base ('free', 'eco', 'pro').
const STRIPE_LIENS = {
  eco: "https://buy.stripe.com/fZu00i3WJ4AofvdgVQf3a03",   // KEEVA Éco — 5 €/mois
  pro: "https://buy.stripe.com/00w9AS9h3c2Q5UD9tof3a04",   // KEEVA Pro — 20 €/mois
};

// Ce que la fenêtre des offres affiche. Les libellés sont EXACTEMENT ceux de la
// rubrique « Mon compte » : une grille tarifaire qui change de vocabulaire d'un
// écran à l'autre ne se comprend plus. Aucun prix n'est inventé ici : 5 €/mois
// pour Éco, 20 €/mois pour Pro, gratuit pour 1 machine. `changement` sert au
// client DÉJÀ abonné : il ne doit jamais souscrire une seconde fois.
const OFFRES_PAYANTES = [
  {
    cle: 'eco',
    ligne: trad('Éco — 5 €/mois, jusqu\'à 5 machines'),
    bouton: trad('Passer à Éco'),
    changement: trad('Pour passer à l\'offre Éco, change d\'offre depuis ton abonnement : le montant est ajusté au prorata.'),
  },
  {
    cle: 'pro',
    ligne: trad('Pro — 20 €/mois, machines illimitées'),
    bouton: trad('Passer à Pro'),
    changement: trad('Pour passer à l\'offre Pro, change d\'offre depuis ton abonnement : le montant est ajusté au prorata.'),
  },
];

// `message` (facultatif) : la raison de l'ouverture, quand la fenêtre s'ouvre
// parce qu'une écriture a été refusée sur une machine non couverte. Le message
// s'affiche dans la zone d'annonce de la fenêtre — même texte partout.
function openUpgradeNotice(companyId, message) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  // Le texte suit l'offre réellement souscrite : annoncer « plan gratuit » à un
  // client Éco serait faux, et la grille doit rester identique d'un écran à l'autre.
  const corpsLimite = UI.companyPlan === 'eco'
    ? trad('L\'offre Éco suit 5 machines. L\'offre Pro (20 €/mois) n\'a pas de limite.')
    : trad('L\'offre gratuite suit 1 machine. L\'offre Éco (5 €/mois) en suit 5, l\'offre Pro (20 €/mois) sans limite.');

  // Une ligne par offre, et un bouton SEULEMENT là où il mène quelque part :
  //  • l'offre gratuite n'a pas de paiement — elle passe par la création de compte,
  //    donc aucun lien ici ;
  //  • l'offre déjà souscrite n'est pas proposée une seconde fois ;
  //  • un lien absent se DIT, au lieu d'afficher un bouton qui ne mène nulle part.
  //
  // ⚠️ CLIENT DÉJÀ ABONNÉ : jamais de lien de paiement pour une autre offre. Il
  // souscrirait un SECOND abonnement et paierait les deux. Le changement d'offre
  // passe par le portail de facturation, qui l'ajuste au prorata.
  const dejaAbonne = UI.companyPlan === 'eco' || UI.companyPlan === 'pro';
  const ligneOffre = (ligne, action) => `<div class="plan-field"><div class="value">${ligne}</div>${action}</div>`;
  // Les mentions ci-dessous portent leur trad() : ce sont des fragments HTML
  // dans des chaînes, que l'extraction automatique ne peut pas atteindre (elle ne
  // voit que le texte des gabarits, pas ce qui est entre guillemets).
  const tonOffre = `<div class="hint">${trad('Ton offre actuelle')}</div>`;
  // Adresse de paiement retenue par offre : gardée de côté pour que le clic
  // puisse ouvrir exactement le lien affiché, après relecture du palier.
  const urlPaiement = {};
  const lignes = OFFRES_PAYANTES.map((offre) => {
    if (offre.cle === UI.companyPlan) return ligneOffre(offre.ligne, tonOffre);
    if (dejaAbonne) {
      return ligneOffre(offre.ligne, `
        <div class="hint">${offre.changement}</div>
        <div style="margin-top:8px;"><button type="button" class="primary" id="forfait-changer">${trad('Gérer mon abonnement')}</button></div>`);
    }
    const lien = STRIPE_LIENS[offre.cle];
    if (!lien) return ligneOffre(offre.ligne, `<div class="hint">${trad('Le lien de cette offre est indisponible pour le moment. Écris-nous à support@keeva.work.')}</div>`);
    const url = lien + '?client_reference_id=' + encodeURIComponent(companyId);
    urlPaiement[offre.cle] = url;
    return ligneOffre(offre.ligne, `<div style="margin-top:8px;"><a id="forfait-payer-${offre.cle}" href="${url}" target="_blank" rel="noopener" class="primary" style="text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;">${offre.bouton}</a></div>`);
  }).join('');
