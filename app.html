<!-- PAS de viewport-fit=cover, ET C'EST LA CORRECTION DU 19/09 : Capacitor 8
     (SystemBars.java) ne pose AUCUNE marge quand la page déclare « cover » et
     que le WebView est récent : il laisse alors la page réserver la hauteur de
     la barre d'état avec env() / --safe-area-inset-*. Sur un vrai téléphone,
     cette valeur n'est pas arrivée (contenu vu DERRIÈRE la pastille de batterie,
     en défilement), et la page n'a aucun autre moyen de connaître cette hauteur.
     Sans « cover », Capacitor prend l'autre branche et RETIRE la fenêtre de
     dessous les barres système : le contenu, y compris ce qui défile, ne peut
     plus s'y trouver — quelle que soit la version du WebView. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Couleur des barres système : le bleu nuit de la charte (fond de la fenêtre,
     voir mobile/construire.mjs), comme la barre latérale. -->

<!-- Material Symbols + Plus Jakarta Sans — polices chargées depuis un CDN
     externe (toutes les autres sont embarquées en base64 juste plus bas,
     précisément pour éviter ça, voir le commentaire "POLICES EMBARQUÉES").
     Exception assumée à la demande explicite de l'utilisateur pour les
     écrans "Plan proposé par notre algorithme" ET pour "Modifier une
     machine" (reprises Stitch demandées à l'octet près, la seconde SANS
     aucun remap de couleur/police/icône) — CSP mise à jour en conséquence
     (style-src/font-src). Instance variable ajoutée (même plage que
     code.html) en plus de l'instance fixe déjà utilisée par pplan-* :
     les deux coexistent, chaque écran choisit son propre poids d'icône
     via font-variation-settings, scopé à sa propre modale. -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">

<script>
// La langue est arrêtée AVANT tout rendu : le premier écran affiché doit déjà
// être dans la bonne langue, sans clignotement.
changerLangue(langueInitiale(), { silencieux: true });

// ★ ÉCOUTEURS PUSH : posés UNE FOIS, au niveau racine du script — jamais dans
// boot() — pour capter un lancement à froid de l'appli par tap sur une
// notification le plus tôt possible, même avant que la connexion aboutisse
// (hors connexion, l'inscription du jeton échoue simplement sans
// conséquence, comme programmerRappels ci-dessus).
wirePushEcouteurs();

if (sb) {
  if (__isPasswordRecovery) {
    renderSetNewPassword();
  } else if (__isModeSupport) {
    activerModeSupport().then(() => {
      boot();
      verifierVersionPubliee();
    });
  } else {
    boot();
    // L'avis « une nouvelle version est disponible » est vérifié à CHAQUE
    // ouverture : c'est là que le risque de tourner sur une version dépassée est
    // le plus grand. Le contrôle ne bloque rien et ne recharge rien.
    verifierVersionPubliee();
  }
}
</script>
