      const images = Array.from(e.target.files || []).filter(f => /^image\//.test(f.type));
      e.target.value = '';
      if (images.length) brancherCarnetPhotos(overlay, images, contexteCarnet, apresCarnet);
    });
    // L'offre « nous établissons votre plan » : e-mail pré-rempli, rien d'automatique.
    // LES VALEURS VIENNENT DE L'ÉTAT DU FORMULAIRE, pas du document : à cette étape
    // l'assistant a été redessiné, les champs de l'étape 1 (« #f-brand », « #f-year »…)
    // ne sont PLUS dans la page. Les relire ici donnait un e-mail entièrement vide —
    // chaque ligne à « — » — et obligeait le client à tout retaper. L'état, lui, a
    // été rempli au moment du « Suivant » de l'étape 1 : c'est la seule source juste.
    brancherOffrePlan(overlay, () => ({
      name: state.name,
      brand: state.brand,
      model: state.model,
      annee: state.annee,
      category: state.category,
      serial_number: state.serial,
    }));
    overlay.querySelector('#upload-form').addEventListener('submit', (e) => {
      e.preventDefault();
      // Sans PDF et sans photo, il n'y a RIEN a analyser : on le dit, au lieu de
      // laisser passer un formulaire vide (le champ accepte desormais des images,
      // donc il n'est plus `required` : la validation du navigateur ne suffit plus).
      if (!state.pendingFile && !pagesCarnet(overlay).length) {
        overlay.querySelector('#f-error').textContent = trad('Ajoute le PDF du carnet, ou photographie le tableau d\'entretien.');
        return;
      }
      state.tasks = overlay.querySelector('#f-tasks').value.trim();
      state.items = overlay._aiItems || state.items || null;
      state.notes = overlay._aiNotes || state.notes || '';
      // LE MODE VIENT APRÈS LE CARNET : l'analyse a lu le document, l'étape
      // suivante propose donc le mode de suivi qu'il recommande.
      stepMode();
    });
  }

  // ── ÉTAPE « MODE DE SUIVI » — APRÈS le carnet, AVANT la photo ──────────
  // Ordre voulu par l'usage : identité → carnet → MODE → photo.
  //  • le mode est PRÉ-SÉLECTIONNÉ d'après ce que dit le carnet : l'utilisateur
  //    confirme ou corrige, il ne devine plus ;
  //  • sans carnet, c'est la SEULE source du mode : défaut raisonnable
  //    (calendaire) et rappel que le plan reste modifiable dans la fiche ;
  //  • la case photo ne s'affiche QUE sans carnet — avec un carnet, c'est sa
  //    première page qui sert de photo et la chercher sur le web ne servirait à
  //    rien, puisqu'elle serait écrasée.
  function stepMode() {
    // Un carnet, c'est un PDF… ou des PHOTOS du tableau : les deux comptent.
    const aUnCarnet = !!state.pendingFile || pagesCarnet(overlay).length > 0;
    const reco = overlay._aiTrackingSuggestion || null;
    // Un véhicule se suit au kilométrage : si l'analyse propose « heures » pour un
    // véhicule, c'est l'unité de la machine qui l'emporte (l'analyse ne connaît
    // que « heures » ou « jours »).
    const recoRetenue = (reco === 'hours' && state.kind === TYPE_VEHICULE && SCHEMA.hasCounter) ? trad('km') : reco;
    if (recoRetenue && !overlay._modeToucheForce) state.trackingMode = recoRetenue;
    // Sans carnet, le TYPE de machine donne un défaut raisonnable : un véhicule se
    // suit au kilométrage, tout le reste au calendrier. L'utilisateur corrige s'il
    // veut — et le plan reste modifiable ensuite, dans la fiche de la machine.
    if (!recoRetenue && !overlay._modeToucheForce) {
      state.trackingMode = (state.kind === TYPE_VEHICULE && SCHEMA.hasCounter) ? trad('km') : 'days';
    }
    const mode = state.trackingMode;
    const unit = COUNTER_UNITS[counterUnitFromMode(mode)];
    const isCounter = mode !== 'days';
    const mention = recoRetenue
      ? `<div class="hint" id="mode-reco">${recoRetenue === 'km'
        ? trad('Le carnet décrit un suivi au kilométrage : ce mode est proposé, tu peux le corriger.')
        : trad('Le carnet exprime ses échéances en heures : le compteur horaire est proposé, tu peux le corriger.')}</div>`
      : '';
    shell(`
      <button type="button" class="step-back" id="back">${trad('← Retour')}</button>
      <h2>${trad('Mode de suivi')}</h2>
      <p class="sub">${aUnCarnet
        ? trad('Vérifie le mode proposé d\'après le carnet, puis l\'échéance et le rappel.')
        : trad('Pas de carnet : choisis le mode qui correspond à ta machine. Le plan reste modifiable ensuite, dans la fiche de la machine.')}</p>
      ${mention}

      <form id="mode-form">
      <label>${trad('Mode de suivi de la maintenance')}</label>
      <div class="track-mode-choice">
        <label><input type="radio" name="tm" value="days" ${state.trackingMode === 'days' ? 'checked' : ''}> ${trad('Calendaire (jours)')}</label>
        <label><input type="radio" name="tm" value="hours" ${state.trackingMode === 'hours' ? 'checked' : ''}> ${trad('Compteur horaire (heures)')}</label>
        ${SCHEMA.hasCounter ? `<label><input type="radio" name="tm" value="km" ${state.trackingMode === trad('km') ? 'checked' : ''}> ${trad('Kilométrage (km)')}</label>` : ''}
      </div>
      <div class="hint" style="margin:-4px 0 10px;">${trad('Compteur horaire pour les moteurs thermiques (BTP, agricole, motoculture), kilométrage pour les véhicules.')}</div>
      <div id="hours-field" style="display:${state.trackingMode === 'days' ? 'none' : 'block'};">
        <label for="f-current-hours" id="f-current-hours-label">${COUNTER_UNITS[counterUnitFromMode(state.trackingMode)].field}</label>
        <input id="f-current-hours" type="number" min="0" step="${COUNTER_UNITS[counterUnitFromMode(state.trackingMode)].step}" value="${state.currentHours ?? ''}" placeholder="${COUNTER_UNITS[counterUnitFromMode(state.trackingMode)].placeholder}">
      </div>

      <div class="field-row" style="margin-top:14px;">
        <div>
          <label for="f-interval" id="f-interval-label">${tR('Échéance {mode}', { mode: isCounter ? tR('tous les ({unite})', { unite: unit.word }) : trad('toutes les (jours)') })}</label>
          <input id="f-interval" type="number" min="1" value="${isCounter ? state.intervalHours : state.intervalDays}" required>
        </div>
        <div>
          <label for="f-reminder" id="f-reminder-label">${tR('Rappel avant ({unite})', { unite: isCounter ? unit.word : trad('jours') })}</label>
          <input id="f-reminder" type="number" min="0" value="${isCounter ? state.reminderHoursBefore : state.reminderDays}" required>
        </div>
      </div>

      ${aUnCarnet ? '' : `
        <label class="check-row" for="f-search-photo">
          <input type="checkbox" id="f-search-photo" ${state.searchPhoto ? 'checked' : ''}>
          ${trad('Chercher automatiquement une photo sur le web')}
        </label>
        <div class="hint">${trad('Sans carnet, c\'est le seul moyen d\'avoir une photo. Dès qu\'un carnet est fourni, c\'est sa première page qui sert.')}</div>
      `}
      <div class="hint" id="f-error"></div>

      <div class="modal-actions">
        <button type="button" class="secondary" id="cancel">${trad('Annuler')}</button>
        <button type="submit" class="primary">${aUnCarnet ? trad('Enregistrer') : trad('Suivant →')}</button>
      </div>
      </form>
    `);
    overlay.querySelector('#back').addEventListener('click', () => (aUnCarnet ? stepUpload(false) : stepChoice()));
    overlay.querySelector('#cancel').addEventListener('click', () => overlay.remove());
    overlay.querySelectorAll('input[name=tm]').forEach(r => {
      r.addEventListener('change', () => {
        const choix = overlay.querySelector('input[name=tm]:checked').value;
        const u = COUNTER_UNITS[counterUnitFromMode(choix)];
        overlay.querySelector('#hours-field').style.display = choix === 'days' ? 'none' : 'block';
        const labelEl = overlay.querySelector('#f-current-hours-label');
        if (labelEl) labelEl.textContent = u.field;
        const intervalLabel = overlay.querySelector('#f-interval-label');
        const reminderLabel = overlay.querySelector('#f-reminder-label');
        const mot = choix === 'days' ? trad('jours') : u.word;
        if (intervalLabel) {
          intervalLabel.textContent = tR('Échéance {mode}', {
            mode: choix === 'days' ? trad('toutes les (jours)') : tR('tous les ({unite})', { unite: mot }),
          });
        }
        if (reminderLabel) reminderLabel.textContent = tR('Rappel avant ({unite})', { unite: mot });
        // L'intervalle suit l'unité choisie : « 90 » (jours) ne doit pas devenir
        // « 90 heures ». On ne remplace que si l'utilisateur n'a rien saisi.
        const champIntervalle = overlay.querySelector('#f-interval');
        if (champIntervalle && !overlay._intervalTouche) {
          champIntervalle.value = intervallePropose(choix, intervallesIA(overlay));
        }
      });
    });
    const champIntervalleWizard = overlay.querySelector('#f-interval');
    if (champIntervalleWizard) {
      champIntervalleWizard.addEventListener('input', () => { overlay._intervalTouche = true; });
    }
    overlay.querySelector('#mode-form').addEventListener('submit', (e) => {
      e.preventDefault();
      state.trackingMode = overlay.querySelector('input[name=tm]:checked').value;
      state.currentHours = state.trackingMode !== 'days'
        ? parseFloat(overlay.querySelector('#f-current-hours').value) || 0
        : null;
      const intervalValue = parseInt(overlay.querySelector('#f-interval').value, 10);
      const reminderValue = parseInt(overlay.querySelector('#f-reminder').value, 10);
      if (state.trackingMode !== 'days') {
        state.intervalHours = intervalValue;
        state.reminderHoursBefore = reminderValue;
        state.intervalDays = overlay._aiIntervalDays || state.intervalDays;
      } else {
        state.intervalDays = intervalValue;
        state.reminderDays = reminderValue;
        state.intervalHours = overlay._aiIntervalHours || state.intervalHours;
      }
      const photo = overlay.querySelector('#f-search-photo');
      state.searchPhoto = photo ? !!photo.checked : false;
      if (aUnCarnet) {
        saveMachine(e.target.querySelector('button[type=submit]'), overlay.querySelector('#f-error'));
      } else {
        stepChecklist();
      }
    });
  }

  function stepChecklist() {
    const commonTasks = [trad('Graissage'), trad('Vidange (huile/carburant)'), trad('Nettoyage'), trad('Contrôle/changement de pièces d\'usure'), trad('Contrôle des niveaux'), trad('Contrôle visuel général')];
    shell(`
      <button type="button" class="step-back" id="back">${trad('← Retour')}</button>
      <h2>${trad('Suivi simplifié')}</h2>
      <p class="sub">${tR('Sélectionne ce que tu veux suivre pour « {nom} ». Pas de carnet constructeur : ce plan reste modifiable ensuite.', { nom: esc(state.name) })}</p>
      <form id="checklist-form">
        <div class="checklist">
          ${commonTasks.map(t => `<label><input type="checkbox" value="${t}"> ${t}</label>`).join('')}
        </div>
        <label for="f-other-task">${trad('Autre (optionnel)')}</label>
        <input id="f-other-task" placeholder="${trad('Ex. Contrôle courroie')}">

        <div class="hint" id="f-error"></div>

        <div class="modal-actions">
          <button type="button" class="secondary" id="cancel">${trad('Annuler')}</button>
          <button type="submit" class="primary">${trad('Enregistrer')}</button>
        </div>
      </form>
    `);
    overlay.querySelector('#back').addEventListener('click', stepMode);
    overlay.querySelector('#cancel').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#checklist-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const checked = Array.from(overlay.querySelectorAll('.checklist input:checked')).map(c => c.value);
      const other = overlay.querySelector('#f-other-task').value.trim();
      if (other) checked.push(other);
      state.tasks = checked.join(', ');
      state.pendingFile = null;
      // L'échéance et le rappel ont été réglés à l'étape du mode de suivi : plus
      // de champs en double ici (deux endroits pour la même valeur finissent
      // toujours par diverger).
      const intervalValue = state.trackingMode !== 'days' ? state.intervalHours : state.intervalDays;
      const freqLabel = state.trackingMode !== 'days'
        ? tR('Tous les {n} {unite}', { n: intervalValue, unite: COUNTER_UNITS[counterUnitFromMode(state.trackingMode)].short })
        : tR('Tous les {n} jours', { n: intervalValue });
      state.items = checked.length
        ? checked.map(label => ({ label, frequency: freqLabel, spec: '', qty: '', note: '' }))
        : null;
      saveMachine(e.target.querySelector('button[type=submit]'), overlay.querySelector('#f-error'));
    });
  }

  async function saveMachine(submitBtn, errorEl) {
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = trad('Enregistrement…'); }
    try {
      let categoryId;
      const existingCat = categories.find(c => c.name.toLowerCase() === state.category.toLowerCase());
      if (existingCat) {
        categoryId = existingCat.id;
      } else {
        const { data: newCat, error: catErr } = await sb
          .from('machine_categories')
          .insert({ company_id: companyId, name: state.category, default_interval_days: state.intervalDays, default_tasks: state.tasks })
          .select('id, name')
          .single();
        if (catErr) throw catErr;
        categoryId = newCat.id;
        categories.push(newCat);
      }

      const { data: machine, error: machineErr } = await sb
        .from('machines')
        .insert({
          company_id: companyId, category_id: categoryId, name: state.name,
          ...identifiantPatch(state.kind, state.serial),
          ...kindPatch(state.kind),
          service_date: state.serviceDate, status: 'en_service',
          ...brandModelPatch(state.brand, state.model),
          ...yearPatch(state.annee),
          ...machineCounterPatch(
            state.trackingMode !== 'days' ? state.currentHours : null,
            { counter_unit: counterUnitFromMode(state.trackingMode) }
          ),
        })
        .select('id')
        .single();
      if (machineErr) throw machineErr;

      try {
        if (state.pendingPhotoBlob) {
          const url = await uploadMachinePhoto(companyId, machine.id, state.pendingPhotoBlob);
          await sb.from('machines').update({ image_url: url }).eq('id', machine.id);
        } else if (state.searchPhoto) {
          // Uniquement sur demande explicite : l'appel consomme un credit et
          // n'a d'interet que si le carnet PDF n'a pas fourni de photo.
          const demande = requetePhoto({
            brand: state.brand, model: state.model, name: state.name,
            category: state.category, kind: state.kind, annee: state.annee,
          });
          const { data: imgData, error: imgErr } = await sb.functions.invoke('fetch-machine-image', { body: demande });
          if (imgErr) console.warn('Recherche de photo :', await functionErrorMessage(imgErr));
          else if (imgData?.imageUrl) await sb.from('machines').update({ image_url: imgData.imageUrl }).eq('id', machine.id);
        }
      } catch (imgErr) { console.warn('Photo de la machine :', imgErr); }

      // AU-DELÀ DE 8 Mo, ON N'ARCHIVE PAS. Ce manuel a été ANALYSÉ — envoyé brut,
      // analysé par référence chez le fournisseur puis supprimé — et c'est
      // l'analyse qui a de la valeur. Le garder occuperait de la place pour un
      // document que le client peut redéposer, et l'application le lui dit.
      if (state.pendingFile && !manuelSansArchivage(state.pendingFile)) {
        await deposerManuel(companyId, machine.id, state.pendingFile, null);
      }

      const planPayload = {
        machine_id: machine.id,
        tracking_mode: state.trackingMode,
        tasks: state.tasks || null,
        items: state.items,
        // Ce texte est écrit ici, avec le compteur que l'utilisateur
        // vient de saisir : on le filtre tout de suite, pour que la base ne
        // contienne jamais une affirmation qui vieillira.
        notes: notesUtiles(state.notes, state.currentHours),
      };
      if (state.trackingMode !== 'days') {
        const intervalCounter = state.intervalHours || FALLBACK_INTERVAL_HOURS;
        const reminderCounter = state.reminderHoursBefore ?? FALLBACK_REMINDER_HOURS;
        const dueCounter = (state.currentHours || 0) + intervalCounter;
        Object.assign(planPayload,
          planCounterPatch(intervalCounter, reminderCounter),
          planNextDueCounterPatch(dueCounter));
        // Une échéance par tâche : la passe CLASSE chaque fréquence (conditionnelle,
        // périodique, à choisir) et ne donne l'échéance du plan qu'aux tâches qui
        // ont un vrai rythme dans l'unité du plan.
        planPayload.items = preparerTaches(state.items, planPayload,
          { counter_unit: counterUnitFromMode(state.trackingMode), counter_value: state.currentHours },
          dueCounter, counterUnitFromMode(state.trackingMode));
        // L'échéance du plan est le MINIMUM de ses tâches comparables, et RIEN
        // quand aucune ne la porte (toutes conditionnelles, ou dans une autre
        // unité) : l'intervalle général du carnet ne doit pas rester en vestige.
        Object.assign(planPayload, echeancePlanPatch(echeancePlanDepuisTaches(planPayload.items, planPayload), planPayload));
        // On conserve aussi un intervalle calendaire cohérent : il servira si la
        // machine bascule plus tard en suivi calendaire.
        planPayload.interval_days = state.intervalDays || FALLBACK_INTERVAL_DAYS;
        planPayload.reminder_days_before = state.reminderDays ?? FALLBACK_REMINDER_DAYS;
      } else {
        planPayload.interval_days = state.intervalDays || FALLBACK_INTERVAL_DAYS;
        planPayload.reminder_days_before = state.reminderDays ?? FALLBACK_REMINDER_DAYS;
        planPayload.next_due_at = addDaysIso(state.serviceDate, planPayload.interval_days);
        // Une échéance par tâche : même passe, même classement (mode calendaire).
        planPayload.items = preparerTaches(state.items, planPayload,
          { counter_unit: 'hours', counter_value: null }, planPayload.next_due_at, 'days');
        // Même règle en mode calendaire : le plan suit le minimum de ses tâches.
        Object.assign(planPayload, echeancePlanPatch(echeancePlanDepuisTaches(planPayload.items, planPayload), planPayload));
        planPayload.interval_hours = state.intervalHours || FALLBACK_INTERVAL_HOURS;
        planPayload.reminder_hours_before = state.reminderHoursBefore ?? FALLBACK_REMINDER_HOURS;
      }
      const { error: planErr } = await sb.from('maintenance_plans').insert(planPayload);
      if (planErr) throw planErr;

      overlay.remove();
      boot(trad('Machine ajoutée'));
    } catch (err) {
      if (isQuotaError(err)) {
        overlay.remove();
        openUpgradeNotice(companyId);
        return;
      }
      if (errorEl) errorEl.textContent = trad('Erreur :') + " " + err.message;
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = trad('Enregistrer'); }
    }
  }

  stepIdentification();
}
function openNextMaintenanceView(machine) {
  // « Prochain entretien » fixe une échéance : c'est une écriture sur le plan.
  if (refuserSiNonCouverte(machine)) return;
  const info = dueInfo(machine.plan, machine);
  const isCounter = planIsCounter(machine.plan);
  const unit = counterUnitOf(machine);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  // Les tâches sont classées AU RENDU, par la même règle que l'enregistrement :
  // un plan jamais réenregistré se lit donc comme s'il venait de l'être, et cette
  // consultation n'écrit rien.
  const planItems = tachesAffichees(machine.plan, machine);
  const items = planItems.length
    ? planItems
    : (machine.plan?.tasks || '').split(',').map(t => t.trim()).filter(Boolean).map(label => ({ label }));

  overlay.innerHTML = `
    <div class="modal">
      <h2>${esc(tR('Prochain entretien — {machine}', { machine: machine.name }))}</h2>
      ${[machine.brand_model, machine.category?.name].filter(Boolean).length
        ? `<p class="sub">${esc([machine.brand_model, machine.category?.name].filter(Boolean).join(' · '))}</p>`
        : ''}

      <div class="due-hero ${heroClass(info.state)}">${esc(info.label)}</div>

      <div class="plan-field">
        <div class="label">${trad('À faire')}</div>
        ${items.length
          ? `<ul class="plan-tasks">${items.map(it => `<li><strong>${esc(it.label)}</strong>${it.frequency ? ` — ${esc(it.frequency)}` : ''}</li>`).join('')}</ul>`
          : `<div class="value" style="color:var(--ink-soft);">${trad('Aucune tâche détaillée dans le plan.')}</div>`}
      </div>

      <div class="plan-field" id="last-intervention-section">
        <div class="label">${trad('Dernier entretien réalisé')}</div>
        <div class="value" style="color:var(--ink-soft);">${trad('Chargement…')}</div>
      </div>

      <div class="modal-actions">
        <button type="button" class="secondary" id="close-next">${trad('Fermer')}</button>
        <button type="button" class="primary" id="log-from-next">${trad('Enregistrer un entretien')}</button>
      </div>
    </div>
  `;

  overlay.querySelector('#close-next').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#log-from-next').addEventListener('click', () => {
    overlay.remove();
    openLogInterventionModal(machine);
  });

  sb.from('interventions')
    .select('performed_at, hours_at_intervention, description, items_done')
    .eq('machine_id', machine.id)
    .order('performed_at', { ascending: false })
    .limit(1)
    .then(({ data, error }) => {
      const section = overlay.querySelector('#last-intervention-section');
      if (!overlay.isConnected || !section) return;
      const valueEl = section.querySelector('.value');
      if (error) { if (valueEl) valueEl.textContent = trad('Erreur de chargement.'); return; }
      const last = (data || [])[0];
      if (!last) {
        if (valueEl) valueEl.textContent = trad('Aucun entretien enregistré pour l\'instant — le plan initial s\'applique.');
        return;
      }
      const doneItems = Array.isArray(last.items_done) && last.items_done.length ? esc(last.items_done.join(', ')) : null;
      if (valueEl) valueEl.outerHTML = `
        <div class="value">
          ${tR('Le {date}', { date: esc(last.performed_at) })}${isCounter && last.hours_at_intervention != null ? ` ${tR('(compteur : {valeur} {unite})', { valeur: esc(last.hours_at_intervention), unite: counterShort(unit) })}` : ''}
          ${doneItems ? `<br>${tR('Éléments traités : {liste}', { liste: doneItems })}` : ''}
          ${last.description ? `<br>${tR('Remarques : {texte}', { texte: esc(last.description) })}` : ''}
        </div>`;
    });
}

function openLogInterventionModal(machine, tache) {
  // « Marquer fait » / enregistrer un entretien écrit dans l'historique et
  // recalcule l'échéance. `tache` (optionnel) pré-coche la ligne du bandeau
  // cliqué, pour que « Marquer fait » porte bien sur CETTE tâche.
  if (refuserSiNonCouverte(machine)) return;
  const today = todayIso();
  const isCounter = planIsCounter(machine.plan);
  const unit = counterUnitOf(machine);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  // Idem ici : le classement est projeté au rendu (même règle que l'écriture),
  // sans rien enregistrer. Les libellés cochés restent ceux du plan.
  const planItems = tachesAffichees(machine.plan, machine);
  const items = planItems.length
    ? planItems.map(it => it.label).filter(Boolean)
    : (machine.plan?.tasks || '').split(',').map(t => t.trim()).filter(Boolean);

  overlay.innerHTML = `
    <div class="modal">
      <h2>${trad('Enregistrer un entretien')}</h2>
      <p class="sub">${tR('{machine} — coche ce qui a été fait, ça met à jour la prochaine échéance.', { machine: esc(machine.name) })}</p>
      <form id="log-form">
        <label for="log-date">${trad('Date de l\'entretien')}</label>
        <input id="log-date" type="date" value="${today}" required>

        ${isCounter ? `
          <label for="log-hours">${tR('Compteur au moment de l\'entretien ({unite})', { unite: COUNTER_UNITS[unit].word })}</label>
          <input id="log-hours" type="number" min="0" step="${COUNTER_UNITS[unit].step}" value="${esc(machineCounter(machine) ?? '')}" required>
        ` : ''}

        ${items.length ? `
          <label>${trad('Éléments traités')}</label>
          <div class="checklist">
            ${items.map(t => `<label><input type="checkbox" value="${esc(t)}"${t === tache ? ' checked' : ''}> ${esc(t)}</label>`).join('')}
          </div>
        ` : ''}

        <label for="log-notes">${trad('Remarques (optionnel)')}</label>
        <textarea id="log-notes" placeholder="${trad('Ex. Pièce X remplacée, RAS sinon')}"></textarea>
        <div class="hint" id="log-error"></div>

        <div class="modal-actions">
          <button type="button" class="secondary" id="cancel-log">${trad('Annuler')}</button>
          <button type="submit" class="primary">${trad('Enregistrer')}</button>
        </div>
      </form>
    </div>
  `;

  overlay.querySelector('#cancel-log').addEventListener('click', () => overlay.remove());

  overlay.querySelector('#log-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type=submit]');
    const errorEl = overlay.querySelector('#log-error');
    submitBtn.disabled = true;
    submitBtn.textContent = trad('Enregistrement…');

    const performedAt = overlay.querySelector('#log-date').value;
    const hoursValue = isCounter ? parseFloat(overlay.querySelector('#log-hours').value) : null;
    const checkedItems = items.length
      ? Array.from(overlay.querySelectorAll('.checklist input:checked')).map(c => c.value)
      : [];
    const notes = overlay.querySelector('#log-notes').value.trim();

    try {
      const { error: logErr } = await sb.from('interventions').insert({
        machine_id: machine.id,
        plan_id: machine.plan?.id || null,
        performed_at: performedAt,
        hours_at_intervention: hoursValue,
        description: notes || null,
        items_done: checkedItems.length ? checkedItems : null,
      });
      if (logErr) throw logErr;

      if (isCounter && hoursValue != null) {
        const { error: machErr } = await sb.from('machines').update(machineCounterPatch(hoursValue, machine)).eq('id', machine.id);
        if (machErr) throw machErr;
      }

      if (machine.plan?.id) {
        const planUpdate = {};
        // UNE ÉCHÉANCE PAR TÂCHE. Cas réel : l'huile était due à 20 h et le
        // compteur est à 22 h (donc « en retard de 2 h ») ; un graissage saisi à
        // 25 h effaçait ce retard alors que la vidange n'avait jamais été faite.
        // Désormais seules les tâches cochées avancent, et l'échéance du plan est
        // le MINIMUM de ses tâches comparables — y compris quand ce minimum vaut
        // « aucune » : un plan dont toutes les tâches sont des points de contrôle
        // ou des échéances d'une autre unité n'a plus d'échéance générale, et
        // garder l'ancienne valeur en ferait un vestige qui rend la machine « en
        // retard » à tort (cas réel : « Vehicule du PDG », 1 470 km fantômes).
        const suivi = tachesApresEntretien(planItems, machine.plan, machine, checkedItems, hoursValue, performedAt);
        if (suivi) {
          planUpdate.items = suivi.items;
          Object.assign(planUpdate, echeancePlanPatch(suivi.echeance, machine.plan));
        } else if (journalAvanceEcheance(items, checkedItems)) {
          // Plan sans élément détaillé : comportement d'avant, inchangé.
          if (isCounter) {
            const interval = planIntervalCounter(machine.plan) || FALLBACK_INTERVAL_HOURS;
            Object.assign(planUpdate, planNextDueCounterPatch((hoursValue || 0) + interval));
          } else {
            planUpdate.next_due_at = addDaysIso(performedAt, machine.plan.interval_days || FALLBACK_INTERVAL_DAYS);
          }
        }
        const { error: planErr } = await sb.from('maintenance_plans').update(planUpdate).eq('id', machine.plan.id);
        if (planErr) throw planErr;
      }

      overlay.remove();
      boot(trad('Entretien enregistré'));
    } catch (err) {
      errorEl.textContent = trad('Erreur :') + " " + err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = trad('Enregistrer');
    }
  });
}

// Récupère l'historique complet d'une machine : l'export CSV ne doit jamais
// être tronqué (PostgREST plafonne à 1000 lignes par requête).
async function fetchAllInterventions(machineId) {
  const pageSize = 1000;
  const all = [];
  for (let from = 0; ; from += pageSize) {
    const { data, error } = await sb.from('interventions')
      .select('id, performed_at, hours_at_intervention, description, items_done')
      .eq('machine_id', machineId)
      .order('performed_at', { ascending: false })
      .order('id', { ascending: false })
      .range(from, from + pageSize - 1);
    if (error) throw error;
    all.push(...(data || []));
    if (!data || data.length < pageSize) break;
  }
  return all;
}

// ── Choix de la fréquence d'une tâche ────────────────────────────
// Le carnet propose PLUSIEURS fréquences selon l'usage (« Professionnel :
// 3 mois / Partiel : 6 mois / Occasionnel : 1 an »), ou une fréquence exprimée
// dans une unité qui n'est pas celle du plan (« ou 2 ans » sur un compteur
// horaire). On demande à l'utilisateur au lieu de deviner : le choix part en
// base dans les éléments du plan, la tâche entre aussitôt dans le calcul de
// l'échéance, et l'échéance du plan est recalculée.
//
// Rien n'est inventé, et rien n'est perdu :
//   • une option DU CARNET hors de l'unité du plan reste un point de contrôle ;
//   • une valeur LIBRE est un vrai intervalle dans son unité : la tâche reçoit sa
//     propre échéance, même si cette unité n'est pas celle du plan (elle ne
//     compte alors pas dans l'échéance globale, et l'écran le dit).
function openChoixFrequence(machine, item, companyId, categories) {
  if (refuserSiNonCouverte(machine)) return;
  const plan = machine.plan || {};
  const options = optionsTache(item, plan, machine);
  const unitePlan = uniteIntervalleDuPlan(plan, machine);
  const uniteMot = (u) => trad((UNITES_INTERVALLE[u] || {}).libelle || u);
  const uniteMinuscule = (u) => trad((UNITES_INTERVALLE[u] || {}).mot || u);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  const lignes = options.map((o, i) => {
    const compatible = uniteCompatiblePlan(o.unite, plan, machine);
    const note = compatible ? '' : `<div class="hint">${tR('Pas dans l\'unité de ce plan ({unitePlan}) : la tâche restera un point de contrôle, sans échéance automatique.', { unitePlan: uniteMinuscule(unitePlan) })}</div>`;
    return `
      <div class="choix-option-ligne">
        <button type="button" class="view-manual choix-option" data-choix="${i}">${esc(libelleOption(o))}</button>
        ${note}
      </div>`;
  }).join('');

  overlay.innerHTML = `
    <div class="modal">
      <h2>${esc(item.label || '')}</h2>
      <p class="sub">${trad('Fréquence d\'entretien : à toi de choisir selon ton usage.')}</p>
      ${item.interval_choisi ? `<div class="hint">${esc(tR('Retenu : {choix}', { choix: item.interval_choisi }))}</div>` : ''}
      <div class="choix-contenu">
        ${options.length ? `<div><div class="label">${trad('Ce que dit le carnet')}</div>${lignes}</div>` : ''}
        <div>
          <div class="label">${trad('Autre (valeur libre)')}</div>
          <div class="field-row">
            <div>
              <label for="choix-valeur">${trad('Valeur')}</label>
              <input id="choix-valeur" type="number" min="1" step="1" value="">
            </div>
            <div>
              <label for="choix-unite">${trad('Unité')}</label>
              <select id="choix-unite">
                ${[trad('heures'), trad('km'), trad('jours'), trad('mois')].map(u => `<option value="${u}"${u === unitePlan ? ' selected' : ''}>${esc(uniteMot(u))}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="hint">${trad('Valeur dans son unité : la tâche aura sa propre échéance, dans cette unité. Elle ne compte pas dans l\'échéance du plan si l\'unité diffère.')}</div>
        </div>
      </div>
      <div class="choix-actions">
        <button type="button" class="view-manual" id="choix-enregistrer">${trad('Enregistrer ce choix')}</button>
        <button type="button" class="view-manual" id="choix-controle">${trad('Garder comme point de contrôle (sans échéance)')}</button>
      </div>
      <div class="hint" id="choix-erreur"></div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="choix-annuler">${trad('Annuler')}</button>
      </div>
    </div>
  `;

  const appliquer = async (choix) => {
    const erreur = overlay.querySelector('#choix-erreur');
    if (!choix.pointDeControle && !(Number(choix.interval) > 0)) {
      erreur.textContent = trad('Renseigne une valeur supérieure à zéro.');
      return;
    }
    const items = appliquerChoixTache(plan.items, item.label, choix, plan, machine);
    const maj = { items };
    const echeance = echeancePlanDepuisTaches(items, plan);
    if (echeance != null) Object.assign(maj, echeancePlanPatch(echeance, plan));
    try {
      if (plan.id) {
        const { error } = await sb.from('maintenance_plans').update(maj).eq('id', plan.id);
        if (error) throw error;
      }
      // La fiche se rafraîchit avec ce qui vient d'être enregistré : l'échéance
      // du plan est recalculée, et le choix reste modifiable.
      Object.assign(plan, maj);
      overlay.remove();
      openPlanView(machine, companyId, categories);
    } catch (err) {
      erreur.textContent = trad('Erreur :') + ' ' + err.message;
    }
  };

  overlay.querySelectorAll('.choix-option').forEach(btn => {
    btn.addEventListener('click', () => appliquer(options[Number(btn.dataset.choix)]));
  });
  overlay.querySelector('#choix-enregistrer').addEventListener('click', () => {
    const valeur = parseFloat(overlay.querySelector('#choix-valeur').value);
    const unite = overlay.querySelector('#choix-unite').value;
    // `libre: true` : c'est un intervalle exprimé par l'utilisateur, avec son
    // unité — il est accepté même si l'unité n'est pas celle du plan, et la tâche
    // reçoit sa propre échéance dans cette unité.
    appliquer({ interval: valeur, unite, libelle: null, libre: true });
  });
  overlay.querySelector('#choix-controle').addEventListener('click', () => appliquer({ pointDeControle: true }));
  overlay.querySelector('#choix-annuler').addEventListener('click', () => {
    overlay.remove();
    openPlanView(machine, companyId, categories);
  });
}

// Les « points d'attention » viennent de l'analyse du carnet : ils ont été écrits
// au moment où le compteur était vide. Une fois le compteur renseigné, une phrase
// comme « La machine ayant 0 heure » contredit le haut de la fiche, qui affiche
// « compteur 22 h ». On retire donc les phrases qui AFFIRMENT l'état du compteur
// ou son unité — l'application les affiche déjà, et mieux — en gardant tout ce
// qui vient du manuel : jalons, pages, opérations. Rien n'est inventé.
function notesUtiles(notes, compteur) {
  if (notes == null) return notes;
  const texte = String(notes).trim();
  // Sans compteur connu, l'affirmation n'est pas contredite : on garde le texte.
  if (compteur == null || !(Number(compteur) > 0)) return texte;
  const AFFIRME_L_ETAT = [
    /^(la|le)\s+(machine|v[ée]hicule|tracteur|engin|chariot|v[ée]lo)\b[^.]*\b(0\s?h|neuf|neuve|affiche|indique|compteur|heures?|km|kilom[èe]tres)/i,
    /^(comme|lorsque|puisque|[ée]tant donn[ée] que)\b[^.]*\b(\d[\d\s]*\s?(h|heures?|km|kilom[èe]tres)|compteur)/i,
    /\b(le suivi doit se faire|suivi par compteur|compteur horaire|compteur kilom[ée]trique)\b/i,
    /^(the|as|since)\b[^.]*\b(0\s?h(ours?)?|new|shows|reads|counter|hours?|km)\b/i,
  ];
  const phrases = texte.match(/[^.!?]+[.!?]?/g) || [texte];
  // L'application calcule elle-même la prochaine échéance : une phrase qui décrit
  // ce calcul vieillit avec le compteur, même une fois la prémisse retirée.
  const CALCUL = /(échéance|echeance|prochaine|jalon)[^.]*\b(fix[ée]e?|calcul[ée]e?|de plus)\b/i;
  const nettoyer = (phrase) => {
    let reste = phrase;
    // Une phrase peut commencer par la prémisse fausse puis donner du manuel :
    // « La machine ayant 0 heure, le premier jalon obligatoire est l'entretien
    // des 20 premières heures (page 17). » On retire la prémisse, on garde le
    // reste — c'est là qu'est l'information utile.
    const coupe = phrase.match(/^([^,]{0,140}?),\s*([\s\S]+)$/);
    if (coupe && AFFIRME_L_ETAT.some((motif) => motif.test(coupe[1]))) reste = coupe[2].trim();
    else if (AFFIRME_L_ETAT.some((motif) => motif.test(phrase))) return '';
    if (CALCUL.test(reste)) return '';
    if (reste !== phrase) {
      if (reste.length < 30) return '';
      return reste.charAt(0).toUpperCase() + reste.slice(1);
    }
    return phrase;
  };
  const gardees = phrases
    .map((phrase) => phrase.trim())
    .map(nettoyer)
    .filter((phrase) => phrase && phrase.length > 2);
  const resultat = gardees.join(' ').trim();
  // Si tout a été retiré, mieux vaut le texte d'origine que rien du tout.
  return resultat.length >= 40 ? resultat : texte;
}

function openPlanView(machine, companyId, categories) {
  const info = dueInfo(machine.plan, machine);
  const isCounterMode = planIsCounter(machine.plan);
  const unit = counterUnitOf(machine);
  const overlay = document.createElement('div');
  overlay.className = 'overlay plan-modal';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  // Les items peuvent être des objets (extraction automatique) ou de simples libellés
  // (anciens enregistrements) : on n'affiche le tableau détaillé que s'il y a
  // réellement des colonnes à remplir.
  // Ils sont CLASSÉS AU RENDU (même règle que l'enregistrement, voir
  // tachesAffichees) : un plan jamais réenregistré montre ici ce qu'il montrera
  // après enregistrement — et cette consultation n'écrit rien en base.
  const items = tachesAffichees(machine.plan, machine);
  const hasItemDetail = items.some(it => it.frequency || it.spec || it.qty || it.note);
  const taskItems = (machine.plan?.tasks || '')
    .split(',')
    .map(t => t.trim())
    .filter(Boolean);
  const simpleItems = items.length ? items.map(it => it.label).filter(Boolean) : taskItems;
  const cell = (v) => (v || v === 0) ? esc(v) : '<span class="muted">—</span>';
  // Tâches dont le carnet laisse un choix (ou qui attendent encore leur
  // intervalle) : elles sont présentées à part, pour que l'utilisateur tranche.
  const tachesAChoisir = items.filter(it => tacheAttendUnChoix(it, machine.plan, machine));

  // Deux présentations des mêmes données, une seule source :
  //   • un tableau sur écran large (colonnes côte à côte) ;
  //   • une CARTE par tâche sur écran étroit : un tableau à six colonnes ne tient
  //     pas dans un téléphone, et la dernière colonne finissait rognée par la
  //     bordure. Dans une carte, chaque information a sa ligne et son libellé,
  //     et la pastille d'échéance se pose sur SA ligne, à gauche du texte.
  const ligneTableau = (it) => `
          <tr>
            <td class="item-label">${esc(it.label || '')}</td>
            <td>${cell(it.frequency)}</td>
            <td>${etatTacheHtml(it, machine.plan, machine, 'colonne')}</td>
            <td>${cell(it.spec)}</td>
            <td>${cell(it.qty)}</td>
            <td>${cell(it.note)}</td>
          </tr>`;
  const carteTache = (it) => `
        <div class="tache-carte">
          <div class="tache-titre">${esc(it.label || '')}</div>
          <div class="tache-ligne"><span class="tache-libelle">${trad('Fréquence')}</span><span class="tache-valeur">${cell(it.frequency)}</span></div>
          <div class="tache-ligne"><span class="tache-libelle">${trad('Échéance')}</span><span class="tache-valeur">${etatTacheHtml(it, machine.plan, machine, 'ligne')}</span></div>
          <div class="tache-ligne"><span class="tache-libelle">${trad('Huile / graisse / pièce')}</span><span class="tache-valeur">${cell(it.spec)}</span></div>
          <div class="tache-ligne"><span class="tache-libelle">${trad('Quantité')}</span><span class="tache-valeur">${cell(it.qty)}</span></div>
          <div class="tache-ligne"><span class="tache-libelle">${trad('Remarque')}</span><span class="tache-valeur">${cell(it.note)}</span></div>
        </div>`;

  const tableHtml = hasItemDetail ? `
    <div class="ref-scroll ref-scroll-plan"><table class="ref-table">
      <thead><tr><th>${trad('Élément')}</th><th>${trad('Fréquence')}</th><th>${trad('Échéance')}</th><th>${trad('Huile / graisse / pièce')}</th><th>${trad('Quantité')}</th><th>${trad('Remarque')}</th></tr></thead>
      <tbody>${items.map(ligneTableau).join('')}</tbody>
    </table></div>
    <div class="taches-cartes">${items.map(carteTache).join('')}</div>
  ` : (simpleItems.length
      ? `<ul class="plan-tasks">${simpleItems.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`
      : `<div class="value" style="color:var(--ink-soft);">${trad('Aucune tâche détaillée')}</div>`);

  overlay.innerHTML = `
    <div class="modal">
      <h2>${esc(tR('Plan d\'entretien — {machine}', { machine: machine.name }))}</h2>
      <p class="sub">${esc(machine.category?.name) || trad('Sans catégorie')}${machine.brand_model ? ' · ' + esc(machine.brand_model) : ''}${identifiantAffiche(machine) ? ' · ' + esc(identifiantAffiche(machine)) : ''}</p>

      <div class="plan-field">
        <div class="label">${trad('Statut')}</div>
        <div class="value"><span class="badge ${badgeClass(info.state)}">${machine.status === 'en_service' ? trad('En service') : esc(machine.status)}</span></div>
      </div>

      <div class="plan-field">
        <div class="label">${trad('Échéance')}</div>
        <div class="value">${esc(info.label)}${machine.plan?.next_due_at ? ` ${tR('(le {date})', { date: esc(machine.plan.next_due_at) })}` : ''}</div>
      </div>

      ${machine.plan ? `
        <div class="plan-field">
          <div class="label">${trad('Mode de suivi')}</div>
          <div class="value">${machine.plan.tracking_mode === 'days' ? trad('Calendaire (jours)') : (unit === 'km' ? trad('Kilométrage') : trad('Compteur horaire'))}</div>
        </div>
        <div class="plan-field">
          <div class="label">${trad('Fréquence générale')}</div>
          <div class="value">${isCounterMode
            ? `${tR('Tous les {intervalle} — rappel {rappel} avant', { intervalle: formatCounter(planIntervalCounter(machine.plan), unit), rappel: formatCounter(planReminderCounter(machine.plan), unit) })}${machineCounter(machine) != null ? ` · ${tR('compteur actuel : {valeur}', { valeur: formatCounter(machineCounter(machine), unit) })}` : ''}`
            : tR('Tous les {n} jours — rappel {rappel} jour(s) avant', { n: machine.plan.interval_days, rappel: machine.plan.reminder_days_before })}</div>
        </div>
        <div class="plan-field">
          <div class="label">${hasItemDetail ? trad('Tableau de référence entretien') : trad('Tâches de maintenance')}</div>
          ${tableHtml}
        </div>
        ${tachesAChoisir.length ? `
          <div class="plan-field">
            <div class="label">${trad('Fréquences à préciser')}</div>
            ${tachesAChoisir.map(it => blocChoixTache(it, machine.plan, machine)).join('')}
          </div>
        ` : ''}
        ${machine.plan.notes ? `
          <div class="plan-field">
            <div class="label">${trad('Points d\'attention')}</div>
            <div class="attention-box">${esc(notesUtiles(machine.plan.notes, machineCounter(machine)))}</div>
          </div>
        ` : ''}
      ` : `<div class="plan-field"><div class="value" style="color:var(--ink-soft);">${trad('Aucun plan de maintenance défini pour cette machine.')}</div></div>`}

      ${machine.manual_url ? `<button type="button" class="view-manual" id="plan-view-manual">${trad('Voir le carnet d\'entretien (PDF)')}</button>` : ''}

      <div class="plan-field" id="history-section">
        <div class="history-head">
          <div class="label">${trad('Historique des entretiens')}</div>
          <div class="history-actions">
            <button type="button" class="icon-btn" id="export-history-csv" disabled>${trad('Exporter en CSV')}</button>
            <button type="button" class="icon-btn" id="share-history-email" disabled>${trad('Partager par email')}</button>
          </div>
        </div>
        <div class="value" style="color:var(--ink-soft);">${trad('Chargement…')}</div>
      </div>

      <div class="modal-actions">
        <button type="button" class="secondary" id="close-plan">${trad('Fermer')}</button>
        <button type="button" class="primary" id="edit-from-plan">${trad('Modifier')}</button>
      </div>
    </div>
  `;

  overlay.querySelector('#close-plan').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#edit-from-plan').addEventListener('click', () => {
    overlay.remove();
    openMachineModal(companyId, categories, machine);
  });
  // Une tâche dont le carnet laisse un choix : on DEMANDE, on ne devine pas.
  overlay.querySelectorAll('.choisir-frequence').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = items.find(it => it.label === btn.dataset.tache);
      if (!item) return;
      overlay.remove();
      openChoixFrequence(machine, item, companyId, categories);
    });
  });
  if (machine.manual_url) {
    overlay.querySelector('#plan-view-manual').addEventListener('click', (e) => viewManual(machine.manual_url, e.target));
  }

  let historyData = [];
  const buildHistoryCsv = () => {
    const header = [trad('Date'), trad('Compteur (h)'), trad('Elements traites'), trad('Remarques')];
    const escape = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = historyData.map(h => [
      h.performed_at,
      h.hours_at_intervention ?? '',
      Array.isArray(h.items_done) ? h.items_done.join('; ') : '',
      h.description ?? '',
    ]);
    return [header, ...rows].map(r => r.map(escape).join(',')).join('\r\n');
  };

  const csvToUtf16Buffer = (csvString) => {
    const buf = new ArrayBuffer(2 + csvString.length * 2);
    const view = new DataView(buf);
    view.setUint16(0, 0xFEFF, true);
    for (let i = 0; i < csvString.length; i++) {
      view.setUint16(2 + i * 2, csvString.charCodeAt(i), true);
    }
    return buf;
  };

  overlay.querySelector('#export-history-csv').addEventListener('click', () => {
    const blob = new Blob([csvToUtf16Buffer(buildHistoryCsv())], { type: 'text/csv;charset=utf-16le;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `historique_${machine.name.replace(/[^a-z0-9]+/gi, '_')}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  overlay.querySelector('#share-history-email').addEventListener('click', async () => {
    const filename = `historique_${machine.name.replace(/[^a-z0-9]+/gi, '_')}.csv`;
    const file = new File([csvToUtf16Buffer(buildHistoryCsv())], filename, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: `tR('Historique entretien — {machine}', { machine: machine.name })`, text: `tR('Historique des entretiens pour {machine}', { machine: machine.name })` });
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
      }
    }
    const subject = encodeURIComponent(`tR('Historique entretien — {machine}', { machine: machine.name })`);
    const bodyLines = historyData.slice(0, 20).map(h => `${h.performed_at} — ${h.hours_at_intervention != null ? h.hours_at_intervention + 'h' : ''} — ${(h.items_done || []).join(', ')} — ${h.description || ''}`);
    const body = encodeURIComponent(`tR('Historique des entretiens pour {machine}', { machine: machine.name }) :\n\n${bodyLines.join('\n')}\n\n${trad('(Le fichier CSV complet est disponible via « Exporter en CSV » si tu veux le joindre en pièce jointe.)')}`);
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
  });

  (async () => {
    const section = overlay.querySelector('#history-section');
    if (!section) return;
    const valueEl = section.querySelector('.value');
    try {
      // Historique COMPLET : l'export CSV ne doit jamais être tronqué.
      historyData = await fetchAllInterventions(machine.id);
    } catch (error) {
      if (valueEl) valueEl.textContent = trad('Erreur de chargement de l\'historique :') + " " + error.message;
      return;
    }
    if (!overlay.isConnected || !section.isConnected) return;
    if (!historyData.length) { if (valueEl) valueEl.textContent = trad('Aucun entretien enregistré pour l\'instant.'); return; }

    overlay.querySelector('#export-history-csv').disabled = false;
    overlay.querySelector('#share-history-email').disabled = false;
    if (valueEl) valueEl.remove();

    const shown = historyData.slice(0, HISTORY_ROWS_IN_MODAL);
    const hidden = historyData.length - shown.length;
    section.insertAdjacentHTML('beforeend', `
      <div class="ref-scroll"><table class="ref-table">
        <thead><tr><th>${trad('Date')}</th>${isCounterMode ? '<th>Compteur</th>' : ''}<th>${trad('Éléments traités')}</th><th>${trad('Remarques')}</th></tr></thead>
        <tbody>
          ${shown.map(h => `
            <tr>
              <td class="item-label">${esc(h.performed_at)}</td>
              ${isCounterMode ? `<td>${h.hours_at_intervention != null ? esc(h.hours_at_intervention) + ' ' + counterShort(unit) : '<span class="muted">—</span>'}</td>` : ''}
              <td>${Array.isArray(h.items_done) && h.items_done.length ? esc(h.items_done.join(', ')) : '<span class="muted">—</span>'}</td>
              <td>${h.description ? esc(h.description) : '<span class="muted">—</span>'}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>
      ${hidden > 0 ? `<div class="hint">tR('{caches} entretien(s) plus ancien(s) non affiché(s) ici — l\'export CSV contient bien les {total} entretiens.', { caches: hidden, total: historyData.length })</div>` : ''}
      <div class="hint">${tR('{n} entretien(s) enregistré(s).', { n: historyData.length })}</div>`);
  })();
}
function openMachineModal(companyId, categories, existing) {
  if (!existing) { openAddWizard(companyId, categories); return; }
  // Machine non couverte par l'offre : la fiche reste consultable (openPlanView),
  // mais rien de ce qui ÉCRIT ne s'ouvre — fiche, plan, compteur, photo, carnets,
  // suppression comprise. Le renvoi vers les offres explique quoi faire.
  if (refuserSiNonCouverte(existing)) return;
  const isEdit = !!existing;
  const today = todayIso();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  // Valeurs de départ calculées une fois : le gabarit reste lisible et le mode
  // de suivi (jours / heures / km) pilote à la fois l'unité et l'intervalle.
  const editMode = isEdit ? (existing.plan?.tracking_mode || 'days') : 'days';
  const editUnit = isEdit ? counterUnitOf(existing) : 'hours';
  const editCounter = isEdit ? machineCounter(existing) : null;
  const editInterval = isEdit
    ? (planIsCounter(existing.plan)

          <option value="vehicle" ${(isEdit ? machineKind(existing) : TYPE_MACHINE) === TYPE_VEHICULE ? 'selected' : ''}>${trad('Véhicule — camion, utilitaire (suivi en kilomètres)')}</option>

        <div class="field-row">
          <div>
            <label for="f-brand">${trad('Marque')}</label>

          </div>
          <div>
            <label for="f-model">${trad('Modèle')}</label>
            <input id="f-model" class="majuscules" placeholder="${trad('Ex. U17-3')}" autocapitalize="characters" value="${isEdit ? esc(machineModel(existing)) : ''}">
          </div>
          <div>
            <label for="f-year">${trad('Année du modèle')}</label>
            <input id="f-year" type="number" inputmode="numeric" min="1950" max="2100" placeholder="${trad('Ex. 2019')}" value="${isEdit && machineYear(existing) ? machineYear(existing) : ''}">
