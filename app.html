async function doLogout() {
  // La copie locale contient les données de la société : elle ne doit pas
  // survivre à une déconnexion, surtout sur un appareil partagé.
  effacerCache();
  await sb.auth.signOut();
  // Même raison pour l'accès sans mot de passe : le jeton du trousseau vient
  // d'être révoqué par la déconnexion. Le garder n'apporterait qu'un verrou
  // inutile au prochain lancement, suivi d'un message d'expiration.
  await oublierAccesSansMotDePasse();
  renderLogin();
}

// Limite de machines par offre. Une offre absente de cette table n'a pas de
// limite (Pro, compte illimité de l'éditeur) : c'est la même règle que le
// déclencheur de la base, qui ne contrôle que les offres connues.
const LIMITES_OFFRES = { free: 1, eco: 5 };

// ── Couverture par l'offre ────────────────────────────────────────────────────
// Quand une période payée s'achève et que le compte repasse en gratuit, RIEN
// n'est perdu : tout reste consultable. Mais les machines AU-DELÀ de la limite
// de l'offre passent en LECTURE SEULE et ne reçoivent plus de rappels.
//
// Ce sont les plus ANCIENNES qui restent couvertes (created_at croissant,
// égalité départagée par id) : c'est déterministe, cela se dit en une phrase au
// client, et supprimer une machine couverte fait entrer la suivante dans le
// quota. Aucune machine n'est supprimée ni masquée : elle redevient pleinement
// active dès que le compte repasse à une offre couvrante.
//
// ⚠️ RÈGLE IDENTIQUE dans la fonction de rappels (send-maintenance-reminders) :
// les deux implémentations sont comparées automatiquement (_verif-biometrie.mjs,
// section « couverture »), parce que deux règles divergentes passeraient
// inaperçues — l'application dirait « couverte » et le rappel partirait, ou
// l'inverse.
function limiteOffre() {
  // MÊME REPLI que la fonction de rappels : une offre absente ou illisible vaut
  // « gratuit » (1 machine), jamais « illimité ». Sans ce repli, un compte dont
  // la colonne plan est nulle se croyait illimité côté application alors que les
  // rappels n'en couvraient qu'une — c'est ce que le contrôle croisé a montré.
  const offre = String(UI.companyPlan || 'free').toLowerCase();
  const limite = LIMITES_OFFRES[offre];
  return limite == null ? null : limite;
}

// created_at d'abord, puis l'identifiant : le même ordre que la fonction de
// rappels. Un created_at absent (base plus ancienne) laisse l'ordre par id.
function ordreCreation(a, b) {
  const ca = a && a.created_at ? String(a.created_at) : '';
  const cb = b && b.created_at ? String(b.created_at) : '';
  if (ca !== cb) return ca < cb ? -1 : 1;
  const ia = String(a && a.id ? a.id : '');
  const ib = String(b && b.id ? b.id : '');
  return ia < ib ? -1 : (ia > ib ? 1 : 0);
}

function machinesCouvertes() {
  const triees = [...UI.machines].sort(ordreCreation);
  const limite = limiteOffre();
  return limite == null ? triees : triees.slice(0, limite);
}

function machineCouverte(machine) {
  if (!machine) return true;
  if (limiteOffre() == null) return true;
  return machinesCouvertes().some((m) => m.id === machine.id);
}

// Message UNIQUE pour toutes les écritures refusées (i18n).
function messageMachineNonCouverte() {
  return tR('Ton offre actuelle couvre {n} machine(s). Repasse à une offre payante pour continuer à suivre celle-ci.', { n: limiteOffre() });
}

// Refuse une écriture sur une machine non couverte, en menant à la fenêtre des
// offres. Renvoie true quand l'écriture est refusée et que l'appelant doit
// s'arrêter là. Aucune donnée n'est touchée.
function refuserSiNonCouverte(machine) {
  if (machineCouverte(machine)) return false;
  openUpgradeNotice(UI.companyId, messageMachineNonCouverte());
  return true;
}

function handleAddMachine() {
  const limite = LIMITES_OFFRES[UI.companyPlan];
  if (limite != null && UI.machines.length >= limite) { openUpgradeNotice(UI.companyId); return; }
  openAddWizard(UI.companyId, UI.categories);
}

// ── Confort des modales ───────────────────────────────────────
// Appliqué automatiquement à toute .overlay ajoutée au document : rôle de
// dialogue, focus initial, piège à focus, fermeture par Échap, et garde-fou
// contre la perte d'une saisie en cours. Aucune modale n'a besoin d'y penser.
const modalMeta = new WeakMap();

function focusableIn(root) {
  return Array.from(root.querySelectorAll(
    'a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )).filter(el => el.offsetParent !== null || el === document.activeElement);
}

function formSnapshot(form) {
  return Array.from(form.elements).map(el => {
    const key = el.name || el.id || el.tagName;
    if (el.type === 'checkbox' || el.type === 'radio') return `${key}:${el.checked}`;
    if (el.type === 'file') return `${key}:${el.files ? el.files.length : 0}`;
    return `${key}:${el.value}`;
  }).join('|');
}

// Une photo distante peut ne pas se charger : on retire l'image plutôt que
// d'afficher une icône cassée. Écouteur en phase de CAPTURE, car l'événement
// « error » d'une <img> ne remonte pas jusqu'au document.
document.addEventListener('error', (e) => {
  const el = e.target;
  if (el && el.tagName === 'IMG' && el.classList && el.classList.contains('machine-photo')) el.remove();
}, true);

function overlayIsDirty(overlay) {
  const meta = modalMeta.get(overlay);
  if (!meta) return false;
  const form = overlay.querySelector('form');
  if (!form || !meta.snapshot) return false;
  return formSnapshot(form) !== meta.snapshot;
}

function enhanceModal(overlay) {
  const meta = modalMeta.get(overlay) || {};
  if (!meta.previousFocus) meta.previousFocus = document.activeElement;
  const form = overlay.querySelector('form');
  // L'instantané est pris à l'ouverture, et repris uniquement si le formulaire
  // est REMPLACÉ (changement d'étape d'un assistant). Une mise à jour
  // asynchrone à l'intérieur du même formulaire — chargement d'une photo ou de
  // l'historique — ne doit pas déplacer la référence, sinon la saisie déjà
  // faite par l'utilisateur deviendrait la nouvelle référence.
  if (form !== meta.formEl) {
    meta.formEl = form || null;
    meta.snapshot = form ? formSnapshot(form) : null;
  }
  modalMeta.set(overlay, meta);

  const dialog = overlay.querySelector('.modal, .sheet');
  if (dialog && !dialog.hasAttribute('role')) {
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-modal', 'true');
    const title = dialog.querySelector('h1, h2');
    if (title) {
      if (!title.id) title.id = `modal-title-${Math.random().toString(36).slice(2, 8)}`;
      dialog.setAttribute('aria-labelledby', title.id);
    }
  }

  requestAnimationFrame(() => {
    if (!document.body.contains(overlay)) return;
    const active = document.activeElement;
    if (active && overlay.contains(active)) return;      // le focus est déjà dedans
    const target = overlay.querySelector('[autofocus]') || focusableIn(overlay)[0];
    if (target) target.focus();
  });
}

function topOverlay() {
  const all = document.querySelectorAll('.overlay');
  return all.length ? all[all.length - 1] : null;
}

function requestCloseOverlay(overlay) {
  if (!overlay) return;
  if (overlayIsDirty(overlay)) {
    const ok = window.confirm(trad('Fermer sans enregistrer ? Les informations saisies seront perdues.'));
    if (!ok) return;
  }
  const meta = modalMeta.get(overlay);
  overlay.remove();
  const previous = meta && meta.previousFocus;
  if (previous && document.body.contains(previous) && typeof previous.focus === 'function') previous.focus();
}

// Un seul écouteur pour toutes les modales : Échap et piège à focus.
document.addEventListener('keydown', (e) => {
  const overlay = topOverlay();
  if (!overlay) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    requestCloseOverlay(overlay);
    return;
  }
  if (e.key !== 'Tab') return;
  const items = focusableIn(overlay);
  if (!items.length) return;
  const first = items[0];
  const last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || !overlay.contains(document.activeElement))) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}, true);

// Clic à l'extérieur : on intercepte avant le gestionnaire de la modale pour
// pouvoir demander confirmation si un formulaire a été modifié.
document.addEventListener('click', (e) => {
  const overlay = topOverlay();
  if (!overlay || e.target !== overlay) return;
  if (!overlayIsDirty(overlay)) return;                  // comportement d'origine
  if (!window.confirm(trad('Fermer sans enregistrer ? Les informations saisies seront perdues.'))) {
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

// Afficher / masquer le mot de passe : UN SEUL gestionnaire pour tous les champs
// concernés, y compris ceux des modales créées plus tard.
//
// Avant, chaque écran branchait son propre bouton : celui du nouveau mot de
// passe, celui de l'inscription… et l'écran de connexion n'en avait aucun, alors
// que c'est là qu'on saisit un mot de passe le plus souvent — et là qu'une faute
// de frappe coûte le plus cher, puisque rien ne laisse voir ce qu'on a tapé.
// Le bouton agit sur le champ de son propre groupe : aucune identification à
// maintenir, et tout nouveau champ ajouté en hérite.
// Choix de la langue : un seul gestionnaire pour les deux écrans qui le
// proposent (connexion et « Mon compte »), comme pour l'affichage du mot de passe.
document.addEventListener('click', (e) => {
  const bouton = e.target && e.target.closest ? e.target.closest('.lang-btn') : null;
  if (!bouton) return;
  changerLangue(bouton.dataset.langue);
});

document.addEventListener('click', (e) => {
  const bouton = e.target && e.target.closest ? e.target.closest('.toggle-pw-btn') : null;
  if (!bouton) return;
  const enveloppe = bouton.closest('.password-wrap');
  const champ = enveloppe ? enveloppe.querySelector('input') : null;
  if (!champ) return;
  const visible = champ.type === 'text';
  champ.type = visible ? 'password' : 'text';
  bouton.textContent = visible ? trad('Afficher') : 'Masquer';
  bouton.setAttribute('aria-pressed', String(!visible));
  // Le focus revient au champ, curseur à la fin : on continue sa saisie sans
  // avoir à recliquer dedans.
  champ.focus();
  try { champ.setSelectionRange(champ.value.length, champ.value.length); } catch (err) { /* type sans sélection */ }
});

// Chaque apparition de modale (et chaque changement d'étape) est équipée.
const modalObserver = new MutationObserver((records) => {
  for (const record of records) {
    for (const node of record.addedNodes) {
      if (node.nodeType !== 1) continue;
      if (node.classList.contains('overlay')) enhanceModal(node);
      else if (node.closest && node.closest('.overlay')) enhanceModal(node.closest('.overlay'));
      else if (node.querySelector && node.querySelector('form')) {
        const host = node.closest ? node.closest('.overlay') : null;
        if (host) enhanceModal(host);
      }
    }
  }
});
modalObserver.observe(document.body, { childList: true, subtree: true });

// ── Confirmation d'action (toast) ─────────────────────────────
function showToast(message) {
  if (!message) return;
  let host = document.getElementById('toast-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toast-host';
    host.className = 'toast-host';
    host.setAttribute('role', 'status');
    host.setAttribute('aria-live', 'polite');
    document.body.appendChild(host);
  }
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add('is-on'));
  setTimeout(() => {
    el.classList.remove('is-on');
    setTimeout(() => el.remove(), 260);
  }, 3200);
}

// ── Éléments partagés ─────────────────────────────────────────
function dropzoneHtml(id) {
  return `
    <div class="dropzone" id="${id}">
      <span class="dz-icon">⤒</span>
      <span class="dz-title">${trad('Déposer un manuel PDF')}</span>
      <span class="dz-help">${trad('Notre algorithme extrait les échéances (heures, mois) et crée le plan d\'entretien. Tu valides avant activation.')}</span>
    </div>`;
}

function attachDropzone(el, onFile) {
  if (!el) return;
  el.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf';
    input.addEventListener('change', () => { if (input.files && input.files[0]) onFile(input.files[0]); });
    input.click();
  });
  ['dragenter', 'dragover'].forEach(ev => el.addEventListener(ev, (e) => { e.preventDefault(); el.classList.add('is-over'); }));
  ['dragleave', 'drop'].forEach(ev => el.addEventListener(ev, (e) => { e.preventDefault(); el.classList.remove('is-over'); }));
  el.addEventListener('drop', (e) => {
    const f = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
    if (f) onFile(f);
  });
}

// ── Rappels : ce que l'application annonce, et ce qu'elle fait ───────────────
//
// Deux canaux existent VRAIMENT : les notifications du téléphone, programmées
// par l'application Android (sans réseau, sans service tiers), et l'e-mail,
// envoyé par le serveur une fois par jour — il part donc même application
// fermée. WhatsApp n'est pas branché : le compte WhatsApp Business n'est pas
// vérifié.
//
// D'où la disparition des interrupteurs `data-reminder` : un bouton qui
// s'allume sans rien changer côté serveur fait croire que le message partira.
// La carte affiche donc l'ÉTAT réel ; les réglages qui agissent vraiment sont
// dans la vue « Rappels » et s'enregistrent en base (update_my_reminders).

// Adresse qui reçoit les rappels : celle de la société, sinon celle du compte
// (l'adresse de connexion), qui est un repli toujours plausible — c'est aussi
// ce que la vue « Rappels » propose à la saisie.
function adresseRappels() {
  return (UI.company && UI.company.notification_email) || UI.email || '';
}

// Case « Recevoir les rappels par e-mail » : elle reflète le réglage du serveur,
// VRAI par défaut — y compris quand la colonne n'existe pas encore en base
// (migration-rappels-email.sql non exécutée), puisque la base elle-même la
// déclare « not null default true ».
function rappelsEmailCoches() {
  return !UI.company || UI.company.reminders_email !== false;
}

// Est-ce qu'un e-mail partira, là, maintenant ? Il faut les deux : une adresse
// enregistrée ET le canal activé. Une case cochée sans adresse n'envoie rien —
// l'annoncer « actif » serait exactement la promesse en l'air qu'on corrige.
function rappelsEmailActifs() {
  if (SCHEMA.hasReminders === false) return false;
  if (!rappelsEmailCoches()) return false;
  return !!(UI.company && UI.company.notification_email);
}

// ── Toutes les tâches EN RETARD : une entrée par TÂCHE ─────────
// Le bandeau violet ne montrait que l'entretien le plus urgent : le deuxième, le
// troisième… n'étaient visibles qu'en descendant dans la liste.
//
// AUCUN dédoublonnage par machine, AUCUN plafond, aucun `slice` : deux tâches en
// retard sur la même machine font DEUX blocs, et sept en font sept.
//
// DEUX NATURES DE BLOCS :
//   • « tâche » : une tâche dont l'échéance propre est dépassée ;
//   • « plan »  : la machine dont l'ÉCHÉANCE GÉNÉRALE est dépassée sans qu'aucune
//     tâche ne le soit (toutes conditionnelles, mensuelles à échéance future…).
//     Ce bloc ne NOMME AUCUNE TÂCHE : coller le dépassement du plan sur un
//     contrôle mensuel affirmerait quelque chose de faux — cas réel « Vehicule du
//     PDG », +1 470 km attribués aux pneumatiques qui n'étaient PAS en retard.
//     Il le dit donc au niveau du plan, et le compteur reste cohérent.
function tachesEnRetard() {
  const entrees = [];
  (UI.machines || []).forEach(machine => {
    // Classement PROJETÉ au rendu : un plan jamais réenregistré est lu comme s'il
    // venait de l'être — même règle que l'enregistrement, rien d'écrit.
    const items = tachesAffichees(machine.plan, machine);
    const suivies = items
      .map(item => ({ item, info: infoTache(item, machine.plan, machine) }))
      .filter(x => x.info.state === 'late');
    if (suivies.length) {
      suivies.forEach(x => entrees.push({ machine, item: x.item, info: x.info, planEntier: false }));
      return;
    }
    const info = dueInfo(machine.plan, machine);
    if (info.state !== 'late') return;
    entrees.push({ machine, item: null, info, planEntier: true });
  });
  // La plus dépassée d'abord, comme le tri des alertes.
  return entrees.sort((a, b) => a.info.sortKey - b.info.sortKey);
}

// Un bloc de retard : tâche, machine, compteur et dépassement, puis les deux
// actions. Mêmes classes que la carte prioritaire d'origine, donc même style.
// `data-priority-tache` porte la TÂCHE visée : deux blocs de la même machine
// restent distincts, et « Marquer fait » coche d'avance la bonne ligne. Il reste
// VIDE pour un bloc au niveau du plan — il n'y a aucune tâche à désigner.
function priorityTaskCardHtml(machine, item, info, planEntier) {
  const enCompteur = info.unit === 'hours' || info.unit === 'km';
  const depart = enCompteur
    ? formatCounter(machineCounter(machine), counterUnitOf(machine))
    : formatShortDate((item && item.due_at) || machine.plan?.next_due_at);
  const titre = planEntier
    ? tR('Échéance générale du plan dépassée de {valeur}', { valeur: info.short })
    : ((item && item.label) ? item.label : nextTaskLabel(machine));
  const tache = planEntier ? '' : titre;
  const mention = planEntier
    ? `<div class="priority-mention">${trad('Aucune tâche périodique n\'est en retard.')}</div>`
    : '';
  return `
    <section class="priority">
      <div class="priority-body">
        <div class="priority-top">
          <span class="eyebrow">${trad('EN RETARD')}</span>
          <span class="pill-late">${esc(info.short)}</span>
        </div>
        <h2>${esc(titre)}</h2>
        <span class="machine-name">${esc(machine.name)}</span>
        ${mention}
        <div class="priority-stats">
          <div class="stat"><span class="val">${esc(depart)}</span><span class="key">${enCompteur ? trad('Compteur') : trad('Échéance')}</span></div>
          <div class="stat"><span class="val">${esc(info.short)}</span><span class="key">${trad('de dépassement')}</span></div>
        </div>
      </div>
      <div class="priority-actions">
        <button type="button" class="do" data-priority-done="${esc(machine.id)}" data-priority-tache="${esc(tache)}">${trad('Marquer fait')}</button>
        <button type="button" class="see" data-priority-details="${esc(machine.id)}" data-priority-tache="${esc(tache)}">${trad('Détails')}</button>
      </div>
    </section>`;
}

// Les blocs vont par PAIRES ; un bloc seul sur sa ligne prend toute la largeur.

// ── Vue : Parc (machines) ─────────────────────────────────────
// Recherche, filtre par état, tri et affichage progressif : indispensable dès
// qu'un parc dépasse quelques dizaines de machines.
const FLEET_PAGE_SIZE = 30;

function fleetFilters() {
  if (!UI.filters) UI.filters = { q: '', status: 'all', sort: 'urgence', limit: FLEET_PAGE_SIZE };
  return UI.filters;
}

function fleetMatches() {
  const f = fleetFilters();
  const q = (f.q || '').trim().toLowerCase();
  return UI.machines.filter(m => {
    const state = dueInfo(m.plan, m).state;
    if (f.status === 'late' && state !== 'late') return false;
    if (f.status === 'soon' && state !== 'soon') return false;
    if (f.status === 'ok' && (state === 'late' || state === 'soon')) return false;
    if (!q) return true;
    const hay = [m.name, m.brand_model, m.brand, m.model, m.serial_number, m.plate, m.category?.name]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function fleetSorted(list) {
  const f = fleetFilters();
  const rankOf = (m) => {
    const s = dueInfo(m.plan, m).state;
    return s === 'late' ? 0 : (s === 'soon' ? 1 : 2);
  };
  const byName = (a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'fr');
  const copy = list.slice();
  if (f.sort === 'nom') return copy.sort(byName);
  if (f.sort === 'compteur') {
    return copy.sort((a, b) => {
      const va = machineCounter(a);
      const vb = machineCounter(b);
      if (va == null && vb == null) return byName(a, b);
      if (va == null) return 1;
      if (vb == null) return -1;
      return vb - va;
    });
  }
  return copy.sort((a, b) => {
    const ra = rankOf(a);
    const rb = rankOf(b);
    if (ra !== rb) return ra - rb;
    if (ra === 0) return dueInfo(a.plan, a).sortKey - dueInfo(b.plan, b).sortKey;
    if (ra === 1) return dueInfo(a.plan, a).urgency - dueInfo(b.plan, b).urgency;
    return byName(a, b);
  });
}

function chipHtml(status, label, count) {
  const active = fleetFilters().status === status;
  return `<button type="button" class="chip${active ? ' is-active' : ''}" data-status="${status}" aria-pressed="${active ? 'true' : 'false'}">${esc(label)}<span class="chip-count">${count}</span></button>`;
}

function fleetListHtml() {
  const matches = fleetSorted(fleetMatches());
  if (!matches.length) {
    return `<div class="empty">${trad('Aucune machine ne correspond à cette recherche.')}
      <div style="margin-top:12px;"><button type="button" class="link-inline" id="fleet-reset">${trad('Réinitialiser les filtres')}</button></div>
    </div>`;
  }
  const limit = fleetFilters().limit;
  const shown = matches.slice(0, limit);
  const rest = matches.length - shown.length;
  const total = UI.machines.length;
  const filtered = matches.length !== total;
  return `
    <div class="fleet-count">${tR('{n} machine(s)', { n: matches.length })}${filtered ? ` ${tR('sur {total}', { total })}` : ''}</div>
    ${shown.map(machineCardHtml).join('')}
    ${rest > 0 ? `<button type="button" class="btn-tint" id="fleet-more" style="align-self:center;">${tR('Afficher {n} machine(s) de plus', { n: Math.min(rest, FLEET_PAGE_SIZE) })}</button>` : ''}`;
}

function wireMachineCards(root) {
  root.querySelectorAll('.view-manual').forEach(btn => {
    btn.addEventListener('click', () => viewManual(btn.dataset.path, btn));
  });
  root.querySelectorAll('[data-open]').forEach(btn => btn.addEventListener('click', () => {
    const m = UI.machines.find(x => x.id === btn.dataset.id);
    if (!m) return;
    const kind = btn.dataset.open;
    if (kind === 'plan') openPlanView(m, UI.companyId, UI.categories);
    else if (kind === 'log') openLogInterventionModal(m);
    else if (kind === 'next') openNextMaintenanceView(m);
    else if (kind === 'edit') openMachineModal(UI.companyId, UI.categories, m);
  }));
}

// Ne redessine que la liste : le champ de recherche garde le focus et sa saisie.
function refreshFleetList() {
  const list = document.getElementById('fleet-list');
  if (!list) return;
  list.innerHTML = fleetListHtml();
  wireMachineCards(list);
  list.querySelector('#fleet-more')?.addEventListener('click', () => {
    fleetFilters().limit += FLEET_PAGE_SIZE;
    refreshFleetList();
  });
  list.querySelector('#fleet-reset')?.addEventListener('click', () => {
    UI.filters = { q: '', status: 'all', sort: 'urgence', limit: FLEET_PAGE_SIZE };
    const input = document.getElementById('fleet-search');
    if (input) input.value = '';
    const select = document.getElementById('fleet-sort');
    if (select) select.value = 'urgence';
    document.querySelectorAll('#view-root .chip').forEach(c => {
      const active = c.dataset.status === 'all';
      c.classList.toggle('is-active', active);
      c.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    refreshFleetList();
  });
}

// ── Vue : Agenda ──────────────────────────────────────────────
// ── Préparation des entretiens ────────────────────────────────
// Ce que les entretiens à venir vont demander d'acheter, et pour quand.
//
// AUCUNE GESTION DE STOCK ICI, volontairement. La question du terrain est
// « qu'est-ce que je commande avant d'aller chez le fournisseur ? », et elle se
// répond avec ce que l'application sait déjà : les plans de maintenance et les
// « items » extraits du carnet constructeur (libellé, spécification,
// quantité). Tenir un stock demande une discipline de saisie que peu de clients
// auront ; prévoir les besoins, non.
const PREPARATION_HORIZON = [30, 90, 180];

function dateDansHorizon(iso, jours, base) {
  if (!iso) return false;
  const echeance = new Date(`${iso}T00:00:00`);
  if (isNaN(echeance.getTime())) return false;
  const limite = new Date(base.getTime() + jours * 86400000);
  return echeance <= limite;
}

// Lecture d'une quantité écrite en texte libre (« 6,5 L », « 2 », « 1 filtre »).
// Renvoie null dès que le texte n'est pas un nombre suivi d'une unité simple :
// on ne devine JAMAIS une quantité.
function lireQuantite(texte) {
  if (texte == null) return null;
  const propre = String(texte).trim().replace(',', '.');
  const trouve = propre.match(/^([0-9]+(?:\.[0-9]+)?)\s*([^\s0-9]*)$/);
  if (!trouve) return null;
  const nombre = Number(trouve[1]);
  if (!isFinite(nombre)) return null;
  return { nombre, unite: trouve[2].toLowerCase() };
}

// Total d'un ensemble de quantités — UNIQUEMENT si toutes sont lisibles et
// partagent la même unité. Sur une liste d'achat, un total faux coûte plus cher
// que pas de total du tout : dans le doute, on n'affiche rien.
function totalQuantites(quantites) {
  const lues = (quantites || []).map(lireQuantite);
  if (!lues.length || lues.some((q) => !q)) return null;
  const unite = lues[0].unite;
  if (lues.some((q) => q.unite !== unite)) return null;
  const total = lues.reduce((somme, q) => somme + q.nombre, 0);
  return { nombre: Math.round(total * 100) / 100, unite };
}

function formatteTotal(total) {
  if (!total) return '';
  const nombre = total.nombre.toLocaleString(localeActive());
  return total.unite ? `${nombre} ${total.unite}` : nombre;
}

// Rassemble ce que les entretiens retenus vont consommer.
//
// Les machines suivies au compteur y figurent aussi : leur entretien n'a pas de
// date, donc rien à commander « pour le 12 octobre » — mais les pièces du
// prochain entretien se commandent, elles, dès maintenant.
function listePreparation(machines, jours, maintenant) {
  const base = maintenant ? new Date(maintenant) : new Date();
  const besoins = [];
  const sansItems = [];
  let entretiens = 0;
  let auCompteur = 0;

  for (const machine of machines || []) {
    const plan = machine && machine.plan;
    if (!plan) continue;
    const compteur = planIsCounter(plan);
    const date = compteur ? null : (plan.next_due_at || null);
    if (compteur) {
      auCompteur++;
    } else {
      if (!dateDansHorizon(date, jours, base)) continue;
      entretiens++;
    }

    const items = Array.isArray(plan.items) ? plan.items : [];
    if (!items.length) {
      // Plan sans liste de produits (carnet jamais analysé) : on rappellera ses
      // tâches, faute de mieux.
      if (!compteur) sansItems.push({ machine, date, taches: (plan.tasks || '').trim() });
      continue;
    }
    for (const item of items) {
      const label = item && item.label ? String(item.label).trim() : '';
      if (!label) continue;
      const spec = item && item.spec ? String(item.spec).trim() : '';
      besoins.push({
        cle: `${label.toLowerCase()}|${spec.toLowerCase()}`,
        label, spec, machine,
        quantite: item && item.qty ? String(item.qty).trim() : '',
        date,
      });
    }
  }

  const parCle = new Map();
  for (const besoin of besoins) {
    if (!parCle.has(besoin.cle)) parCle.set(besoin.cle, { label: besoin.label, spec: besoin.spec, besoins: [] });
    parCle.get(besoin.cle).besoins.push(besoin);
  }
  const produits = [...parCle.values()].map((produit) => ({
    ...produit,
    total: totalQuantites(produit.besoins.map((b) => b.quantite)),
    premiereDate: produit.besoins.map((b) => b.date).filter(Boolean).sort()[0] || null,
  }));
  produits.sort((a, b) => String(a.premiereDate || '9999').localeCompare(String(b.premiereDate || '9999')));

  return { entretiens, auCompteur, produits, groupes: grouperProduits(produits), sansItems };
}

// --- Familles de produits ---------------------------------------------------
//
// POURQUOI REGROUPER : la liste de préparation arrive en vrac — un filtre à
// huile, deux huiles, une graisse, une courroie — alors qu'une commande se passe
// famille par famille. Le carnet constructeur ne fournit pas de catégorie : on
// classe donc sur le LIBELLÉ, avec les mots des manuels réels. Ce qui n'est pas
// reconnu tombe dans « Autres » : jamais perdu, jamais mal rangé.
//
// L'ORDRE de cette table est celui du classement : « Filtre à huile » est un
// filtre, « Graisse à chaîne » est une graisse — le premier mot-clé reconnu
// l'emporte, donc l'ordre est une décision, pas un détail.
const CATEGORIES_PRODUIT = [
  { cle: 'filtres', libelle: 'Filtres', mots: /filtre|filter|tamis/i },
  { cle: 'huiles', libelle: 'Huiles et lubrifiants', mots: /huile|oil|lubrifiant|hydraulique|vidange/i },
  { cle: 'graisses', libelle: 'Graisses', mots: /graisse|graissage|grease/i },
  { cle: 'liquides', libelle: 'Liquides', mots: /liquide|refroidissement|coolant|antigel|adblue|frein|distill/i },
  { cle: 'usure', libelle: 'Pièces d\'usure', mots: /lame|courroie|cha[iî]ne|bougie|batterie|pneu|roue|dent|couteau|segment|joint|roulement|patin|disque|plaquette|masselotte|guide/i },
];

function categorieProduit(label) {
  const texte = String(label || '');
  for (const categorie of CATEGORIES_PRODUIT) {
    if (categorie.mots.test(texte)) return categorie.cle;
  }
  return 'autres';
}

function libelleCategorie(cle) {
  const trouvee = CATEGORIES_PRODUIT.find((categorie) => categorie.cle === cle);
  return trad(trouvee ? trouvee.libelle : 'Autres');
}

function grouperProduits(produits) {
  const parCategorie = new Map();
  for (const produit of produits) {
    const cle = categorieProduit(produit.label);
    if (!parCategorie.has(cle)) parCategorie.set(cle, []);
    parCategorie.get(cle).push(produit);
  }
  const ordre = [...CATEGORIES_PRODUIT.map((c) => c.cle), 'autres'];
  return ordre
    .filter((cle) => parCategorie.has(cle))
    .map((cle) => {
      const membres = parCategorie.get(cle);
      return {
        cle,
        nom: libelleCategorie(cle),
        produits: membres,
        premiereDate: membres.map((p) => p.premiereDate).filter(Boolean).sort()[0] || null,
      };
    })
    // La famille la plus urgente d'abord : c'est la date du produit le plus
    // proche qui commande l'ordre des sections, pas l'ordre du catalogue.
    .sort((a, b) => String(a.premiereDate || '9999').localeCompare(String(b.premiereDate || '9999')));
}

function preparationHtml() {
  const jours = UI.preparationJours || 90;
  const liste = listePreparation(UI.machines, jours);
  const chips = PREPARATION_HORIZON
    .map((j) => `<button type="button" class="chip${j === jours ? ' is-active' : ''}" data-horizon="${j}">${j} j</button>`)
    .join('');

  const produitHtml = (produit) => {
    const besoins = produit.besoins.map((besoin) => {
      const quand = besoin.date ? formatShortDate(besoin.date) : trad('au compteur');
      return `<div>${esc(besoin.machine.name)}${besoin.quantite ? ` — ${esc(besoin.quantite)}` : ''} <span class="prep-quand">(${esc(quand)})</span></div>`;
    }).join('');
    return `<div class="prep-produit">
      <div class="prep-nom">${esc(produit.label)}${produit.spec ? ` <span class="prep-spec">${esc(produit.spec)}</span>` : ''}${produit.total ? `<span class="prep-total">total ${esc(formatteTotal(produit.total))}</span>` : ''}</div>
      <div class="prep-besoins">${besoins}</div>
    </div>`;
  };

  const groupes = liste.groupes || [];
  const produits = groupes.map((groupe) => `
    <details class="prep-groupe"${groupes.length === 1 ? ' open' : ''}>
      <summary>
        <span>${esc(groupe.nom)}</span>
        <span class="prep-groupe-meta">${tR('{n} référence(s)', { n: groupe.produits.length })}${groupe.premiereDate ? ` · ${tR('dès le {date}', { date: formatShortDate(groupe.premiereDate) })}` : ''}</span>
      </summary>
      <div class="prep-groupe-corps">${groupe.produits.map(produitHtml).join('')}</div>
    </details>`).join('');

  const sansItems = liste.sansItems.map((entree) => `<div class="prep-produit">
      <div class="prep-nom">${esc(entree.machine.name)}${entree.date ? ` <span class="prep-quand">— ${esc(formatShortDate(entree.date))}</span>` : ''}</div>
      <div class="prep-besoins">${entree.taches ? esc(entree.taches) : trad('Tâches non renseignées')}</div>
    </div>`).join('');

  const rien = !liste.produits.length && !liste.sansItems.length;
  const resume = liste.entretiens
    ? tR('{n} entretien(s) daté(s) dans les {jours} prochains jours', { n: liste.entretiens, jours })
    : tR('Aucun entretien daté dans les {n} prochains jours', { n: jours });

  return `
    <section class="card">
      <div class="card-head">
        <h2 class="card-title">${trad('Préparation')}</h2>
        <div class="prep-horizon">${chips}</div>
      </div>
      <p class="muted-text">${esc(resume)}${liste.auCompteur ? ` · ${tR('{n} machine(s) au compteur, sans date d\'échéance', { n: liste.auCompteur })}` : ''}</p>
      ${rien
        ? `<p class="muted-text">${trad('Rien à prévoir sur cette période.')}</p>`
        : `${produits}${sansItems}`}
      ${(liste.produits.length || liste.sansItems.length) ? `
        <div class="hint">${trad('Les quantités proviennent du carnet constructeur : vérifie-les avant de commander.')}</div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="prep-copier">${trad('Copier la liste')}</button>
        </div>` : ''}
    </section>`;
}

// Version en clair, à coller dans un message au fournisseur : c'est l'usage
// réel de cette liste.
function preparationTexte() {
  const jours = UI.preparationJours || 90;
  const liste = listePreparation(UI.machines, jours);
  const lignes = [tR('Préparation des entretiens — {n} prochains jours', { n: jours }), ''];
  // Le texte copié suit le MÊME regroupement que l'écran : c'est ce message qui
  // part chez le fournisseur, et une commande se lit par famille.
  for (const groupe of (liste.groupes || [])) {
    lignes.push(`— ${groupe.nom} —`);
    for (const produit of groupe.produits) {
      const total = produit.total ? ` — total ${formatteTotal(produit.total)}` : '';
      lignes.push(`${produit.label}${produit.spec ? ` (${produit.spec})` : ''}${total}`);
      for (const besoin of produit.besoins) {
        const quand = besoin.date ? formatShortDate(besoin.date) : trad('au compteur');
        lignes.push(`   ${besoin.machine.name}${besoin.quantite ? ` : ${besoin.quantite}` : ''} — ${quand}`);
      }
    }
    lignes.push('');
  }
  for (const entree of liste.sansItems) {
    lignes.push(`${entree.machine.name}${entree.date ? ` — ${formatShortDate(entree.date)}` : ''}`);
    lignes.push(`   ${entree.taches || trad('Tâches non renseignées')}`);
  }
  if (!liste.produits.length && !liste.sansItems.length) lignes.push(trad('Rien à prévoir sur cette période.'));
  return lignes.join('\n');
}

// Version courte, pour le TABLEAU DE BORD.
//
// POURQUOI ELLE EXISTE : la liste complète vit dans l'Agenda, qui n'est même pas
// dans la barre d'onglets du téléphone (il faut passer par « Plus »). Une
// fonctionnalité que l'utilisateur ne trouve pas ne sert à rien — constat fait
// en usage réel, l'utilisateur ayant demandé où elle était. Cette carte annonce
// donc l'essentiel dès l'accueil, et renvoie à la liste détaillée.
function preparationResumeHtml() {
  const jours = UI.preparationJours || 90;
  const liste = listePreparation(UI.machines, jours);
  const nombre = liste.produits.length;
  if (!nombre && !liste.sansItems.length) return '';

  const noms = liste.produits.slice(0, 3).map((p) => p.label).join(', ');
  const reste = nombre > 3 ? tR(', + {n} autre(s)', { n: nombre - 3 }) : '';
  const resume = nombre
    ? tR('{n} produit(s) à prévoir pour les {jours} prochains jours : {noms}{reste}.', { n: nombre, jours, noms, reste })
    : tR('Rien à commander pour l\'instant, mais {n} plan(s) sans liste de produits.', { n: liste.sansItems.length });

  return `
    <section class="card">
      <div class="card-head">
        <h2 class="card-title">${trad('Préparation')}</h2>
        <span class="spacer"></span>
        <button type="button" class="link-inline" data-nav="agenda">${trad('Voir la liste')}</button>
      </div>
      <p class="muted-text">${esc(resume)}</p>
    </section>`;
}

function wirePreparation(root) {
  if (!root) return;
  root.querySelectorAll('[data-horizon]').forEach((bouton) => {
    bouton.addEventListener('click', () => {
      UI.preparationJours = Number(bouton.dataset.horizon) || 90;
      renderApp();
    });
  });
  root.querySelector('#prep-copier')?.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(preparationTexte());
      showToast(trad('Liste copiée'));
    } catch (err) {
      // Presse-papiers refusé (permission, contexte non sécurisé) : on le dit
      // plutôt que de laisser croire que la copie a réussi.
      showToast(trad('Copie impossible — sélectionne la liste à la main'));
    }
  });
}

VIEWS.agenda = {
  title: trad('Agenda'),
  subtitle: () => trad('Échéances datées et compteurs à surveiller'),
  render() {
    const dated = UI.machines
      .filter(m => m.plan && !planIsCounter(m.plan) && m.plan.next_due_at)
      .map(m => ({ m, info: dueInfo(m.plan, m) }))
      .sort((a, b) => (a.m.plan.next_due_at < b.m.plan.next_due_at ? -1 : 1));

    const counters = UI.machines
      .filter(m => m.plan && planIsCounter(m.plan))
      .map(m => ({ m, info: dueInfo(m.plan, m) }))
      .sort((a, b) => a.info.sortKey - b.info.sortKey);

    if (!dated.length && !counters.length) {
      return `<div class="empty">${trad('Aucune échéance enregistrée. Renseigne un plan de maintenance sur une machine.')}</div>`;
    }

    let currentMonth = '';
    const datedHtml = dated.map(({ m, info }) => {
      const iso = String(m.plan.next_due_at);
      const monthIndex = Number(iso.slice(5, 7)) - 1;
      const month = moisLong(monthIndex) ? `${moisLong(monthIndex)} ${iso.slice(0, 4)}` : 'Date inconnue';
      const header = month !== currentMonth ? `<div class="agenda-month">${esc(month)}</div>` : '';
      currentMonth = month;
      return header + alertRowHtml(m, info);
    }).join('');

    return `
      ${preparationHtml()}
      ${dated.length ? `<section class="card">
        <div class="card-head"><h2 class="card-title">${trad('Échéances datées')}</h2></div>
        ${datedHtml}
      </section>` : ''}
      ${counters.length ? `<section class="card">
        <div class="card-head"><h2 class="card-title">${trad('Suivi au compteur')}</h2></div>
        <div class="alert-list">${counters.map(({ m, info }) => alertRowHtml(m, info)).join('')}</div>
      </section>` : ''}`;
  },
  mount() {
    const racine = document.getElementById('view-root');
    wireAlertRows(racine);
    wirePreparation(racine);
  },
};

// ── Vue : Rappels ─────────────────────────────────────────────
// Réglages RÉELS : ils partent en base par update_my_reminders, et c'est le
// serveur qui s'en sert pour envoyer l'e-mail. Rien n'est gardé sur l'appareil :
// un réglage local ne pourrait pas déclencher un envoi quand l'application est
// fermée — c'est-à-dire dans le cas le plus utile.
function blocReglagesRappelsHtml() {
  // Colonnes absentes en base (migration-rappels-email.sql non exécutée) : le
  // formulaire est montré, mais désactivé et accompagné de la marche à suivre.
  // Un bouton qui échoue en silence vaut moins qu'un bouton grisé expliqué.
  const dispo = SCHEMA.hasReminders !== false;
  const bloque = dispo ? '' : ' disabled';
  return `
    <section class="card">
      <div class="card-head"><h2 class="card-title">${trad('Recevoir les rappels par e-mail')}</h2></div>
      <p class="muted-text">${trad('L\'e-mail est envoyé par le serveur : il part même si l\'application n\'est pas ouverte.')}</p>
      <label for="rap-email">${trad('Adresse qui reçoit les rappels')}</label>
      <input id="rap-email" type="email" inputmode="email" autocomplete="email" value="${esc(adresseRappels())}"${bloque}>
      <label class="check-row" for="rap-par-email"><input type="checkbox" id="rap-par-email"${rappelsEmailCoches() ? ' checked' : ''}${bloque}> ${trad('Recevoir les rappels par e-mail')}</label>
      <div class="hint">${trad('Laisse l\'adresse vide pour ne plus recevoir de rappel par e-mail. Tant qu\'aucune adresse propre n\'est enregistrée, celle du compte est proposée.')}</div>
      <div class="hint" id="rap-msg" role="status" aria-live="polite"></div>
      <div class="modal-actions">
        <button type="button" class="primary" id="rap-save"${bloque}>${trad('Enregistrer')}</button>
      </div>
      ${dispo ? '' : `<div class="hint">${trad('Mise à jour indisponible : exécute')} <strong>migration-rappels-email.sql</strong> ${trad('dans le SQL Editor de Supabase.')}</div>`}
    </section>`;
}

// WhatsApp : le canal est ANNONCÉ, jamais promis. La ligne existe pour que
// l'utilisateur sache que le sujet est connu, et elle dit POURQUOI rien n'est
// réglable ici — le compte WhatsApp Business n'est pas encore vérifié.
function blocWhatsappRappelsHtml() {
  return `
    <section class="card">
      <div class="card-head"><h2 class="card-title">${trad('WhatsApp')}</h2></div>
      <div class="switch-row is-a-venir">
        <span class="switch-label">${trad('Rappel WhatsApp')} <span class="badge neutral">${trad('à venir prochainement')}</span></span>
        <button type="button" class="switch" role="switch" aria-checked="false" aria-disabled="true" disabled aria-label="${trad('Rappel WhatsApp — à venir prochainement')}"><span></span></button>
      </div>
      <p class="muted-text">${trad('La vérification du compte WhatsApp Business est en cours. Tant qu\'elle n\'est pas terminée, KEEVA n\'envoie aucun message WhatsApp : aucun réglage n\'est donc proposé ici.')}</p>
    </section>`;
}

// Ce qui marche vraiment, et quand. Un texte qui décrit le produit est une
// promesse : il ne doit annoncer que ce que le serveur fait déjà.
function blocFonctionnementRappelsHtml() {
  return `
    <section class="card">
      <div class="card-head"><h2 class="card-title">${trad('Comment ça marche')}</h2></div>
      <p class="muted-text">${trad('KEEVA envoie un e-mail avant chaque échéance, puis rien de plus le même jour : un rappel qui arrive au bon moment se lit, une série de messages finit par être ignorée.')}</p>
      <p class="muted-text">${trad('Le délai se règle sur le plan de maintenance de chaque machine : 7 jours avant l\'échéance par défaut quand elle est datée, et la fenêtre de rappel du compteur pour un engin suivi en heures ou en kilomètres — ces machines-là n\'ont pas de date à annoncer.')}</p>
      <p class="muted-text">${trad('L\'envoi est fait par le serveur : le rappel part même si l\'application n\'est pas ouverte. Sur le téléphone, l\'application Android programme en plus ses propres notifications, sans réseau ni compte tiers. WhatsApp viendra plus tard, quand le compte WhatsApp Business sera vérifié.')}</p>
    </section>`;
}

VIEWS.reminders = {
  title: trad('Rappels'),
  subtitle: () => 'Ce qui part, quand, et par quel canal',
  render() {
    return `
      ${blocReglagesRappelsHtml()}
      ${blocWhatsappRappelsHtml()}
      ${blocFonctionnementRappelsHtml()}`;
  },
  mount() {
    // Conservé, et il ne câble plus rien : plus aucun interrupteur
    // `data-reminder` n'existe, donc querySelectorAll renvoie une liste vide.
    // C'est voulu — un interrupteur sans effet ne doit pas revenir par
    // inadvertance sans que ce test cesse de passer.
    wireReminderSwitches(document.getElementById('view-root'));

    const root = document.getElementById('view-root');
    if (!root) return;
    const msg = root.querySelector('#rap-msg');
    const champ = root.querySelector('#rap-email');
    const caseEmail = root.querySelector('#rap-par-email');
    const bouton = root.querySelector('#rap-save');

    bouton?.addEventListener('click', async () => {
      const adresse = (champ && champ.value ? champ.value : '').trim();
      const parEmail = !!(caseEmail && caseEmail.checked);
      // Une adresse manifestement fausse ne part pas en base : le serveur
      // écrirait dans le vide, et l'utilisateur croirait être prévenu.
      if (adresse && !emailValide(adresse)) {
        champ?.setAttribute('aria-invalid', 'true');
        if (msg) {
          msg.style.color = 'var(--late)';
          msg.textContent = trad('Cette adresse e-mail n\'est pas valide : aucun rappel ne pourrait partir.');
        }
        return;
      }
      champ?.removeAttribute('aria-invalid');
      bouton.disabled = true;
      bouton.textContent = trad('Enregistrement…');
      try {
        // Convention de la fonction SQL : null = ne pas toucher, chaîne vide =
        // effacer. WhatsApp reste donc à null — le serveur garde sa valeur, et
        // rien ici ne laisse croire qu'un réglage WhatsApp existe.
        const { error } = await sb.rpc('update_my_reminders', {
          p_notification_email: adresse,
          p_by_email: parEmail,
          p_by_whatsapp: null,
        });
        if (error) throw error;

        UI.company.notification_email = adresse || null;
        UI.company.reminders_email = parEmail;
        if (msg) {
          msg.style.color = 'var(--ok)';
          if (!adresse) msg.textContent = trad('Aucune adresse enregistrée : aucun rappel par e-mail ne partira.');
          else if (parEmail) msg.textContent = trad('Réglages enregistrés : les rappels partiront à cette adresse.');
          else msg.textContent = trad('Adresse enregistrée, mais les rappels par e-mail sont désactivés.');
        }
      } catch (err) {
        // Le détail vient du serveur (« Aucune société rattachée à ce compte »,
        // panne réseau…) : sans lui, l'utilisateur ne peut rien corriger.
        const detail = err && err.message ? err.message : '';
        if (msg) {
          msg.style.color = 'var(--late)';
          msg.textContent = trad('Enregistrement impossible.') + " " + detail;
        }
      }
      bouton.disabled = false;
      bouton.textContent = trad('Enregistrer');
    });
  },
};

        <div class="hint" id="acc-contact-msg" role="status" aria-live="polite"></div>
        <div class="modal-actions">

        </div>
        ${modifiable ? '' : `<div class="hint">${trad('Mise à jour indisponible : exécute')} <strong>migration-compte.sql</strong> ${trad('dans le SQL Editor de Supabase.')}</div>`}

      <section class="card">

      <section class="card">

        <label class="check-row">
          <input type="checkbox" id="acc-hors-ligne" ${copieHorsLigneActive() ? 'checked' : ''}>
          ${trad('Garder une copie pour la consultation hors connexion')}
        </label>
        <div class="hint">${trad('Sans cette copie, l\'application demandera le réseau à chaque ouverture. Sur un appareil partagé, mieux vaut la désactiver : elle n\'est jamais affichée sans ton accord explicite, mais elle reste lisible dans le stockage du navigateur.')}</div>
        <div class="hint" id="acc-hors-ligne-msg" role="status" aria-live="polite"></div>
      </section>

      <section class="card">
        <div class="card-head"><h2 class="card-title">${trad('Navigation')}</h2></div>
        <p class="muted-text">${trad("Langue de l'interface sur cet appareil.")}</p>
        ${basculeLangueHtml()}
      </section>

      ${dansApplication() ? `
      <section class="card">
        <div class="card-head"><h2 class="card-title">${trad('Verrouillage et reconnexion')}</h2></div>
        <p class="muted-text" id="acc-bio-etat">${trad('Vérification de ce que ce téléphone sait faire…')}</p>
        <div id="acc-bio-corps"></div>
        <p class="muted-text" id="acc-acces-etat"></p>
        <div id="acc-acces-corps"></div>
        <div class="hint" id="acc-bio-msg" role="status" aria-live="polite"></div>
        <details class="bio-detail">
          <summary>${trad('Détail technique')}</summary>
          <p class="hint" id="acc-bio-detail"></p>
        </details>
      </section>` : ''}

      <section class="card">
        <div class="card-head"><h2 class="card-title">${trad('Adresse de connexion')}</h2></div>
