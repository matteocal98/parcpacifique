<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 61 40" role="img" aria-label="KALEA">
  <!-- Spirale d'or : quarts de cercle de rayons Fibonacci 34, 21, 13, 8 (rapport ≈ 1,618) -->
  <defs>
    <linearGradient id="kalea-spirale" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="55" y2="0">
      <stop offset="0" stop-color="#6864DF"/>
      <stop offset="1" stop-color="#16B2CB"/>
    </linearGradient>
  </defs>
  <path d="M0,34 A34,34 0 0 1 34,0 A21,21 0 0 1 55,21 A13,13 0 0 1 42,34 A8,8 0 0 1 34,26"
        fill="none" stroke="url(#kalea-spirale)" stroke-width="3" stroke-linecap="round"/>
  <!-- Œil de la spirale : le point de convergence du nombre d'or -->
  <circle cx="39.6" cy="24.7" r="2.5" fill="#E78B20"/>
</svg>
