  <path d="M0,21 A21,21 0 0 0 21,0" fill="none" stroke="#6864DF" stroke-width="5" stroke-linecap="round"/>
  <path d="M0,21 A13,13 0 0 1 13,34" fill="none" stroke="#16B2CB" stroke-width="5" stroke-linecap="round"/>
  <circle cx="29" cy="0" r="3.09" fill="#E78B20"/>
</svg>
