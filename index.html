<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-Be4lLJrJZJLVKpe1ekoSDayQKPOsL9XT6aVwlBXEEbM=' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src https://tiayvmnodsbygmuemeuy.supabase.co wss://tiayvmnodsbygmuemeuy.supabase.co https://cdnjs.cloudflare.com; worker-src blob:; form-action 'self'; base-uri 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParcPacific — Liste des machines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- pdf.js n'est plus chargé ici : il ne sert qu'à extraire la 1ère page d'un carnet PDF
     et représente ~350 Ko. Il est chargé à la demande (voir loadPdfLib). -->
<style>
  /* ============================================================
     ParcPacific — direction « Signal »
     Jetons issus du handoff (README-handoff.md), valeurs finales.
     ============================================================ */
  :root{
    /* Surfaces */
    --bg:#f7f7fb;
    --surface:#FFFFFF;
    --surface-soft:#F4F3FA;
    --dark:#0D1117;
    --dark-2:#1C2230;
    --dark-ink:#8B93A7;

    /* Texte */
    --ink:#0D1117;
    --ink-2:#6C7280;
    --ink-3:#8B93A7;
    --ink-4:#9AA0AE;
    --ink-warm:#6B665E;

    /* Lignes */
    --line:#E7E7F0;
    --line-2:#F0F0F6;
    --line-3:#E4E4EE;

    /* Accent */
    --primary:#5B4BF5;
    --primary-dark:#4638C9;
    --primary-tint:#ECEAFE;
    --primary-tint-2:#C8C2FF;
    --primary-line:#B3AAF8;

    /* Statuts */
    --late:#FF6B57;
    --late-bg:#FFEBE8;
    --soon:#D98A00;
    --soon-bg:#FDF3E0;
    --soon-ink:#8A7A4A;
    --ok:#0E8A5F;
    --ok-bg:#E3F6ED;
    --ok-accent:#5DE3A1;

    /* Rayons */
    --r-chip:10px;
    --r-card:16px;
    --r-pill:20px;

    /* Ombres */
    --shadow-card:0 1px 3px rgba(13,17,23,.06);
    --shadow-soft:0 1px 3px rgba(13,17,23,.05);
    --shadow-fab:0 8px 18px rgba(91,75,245,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Figtree',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:inherit;letter-spacing:-0.02em;}
  button{font-family:inherit;}
  a{color:var(--primary);text-decoration:none;}
  a:hover{color:var(--primary-dark);text-decoration:underline;}

  /* Chiffres techniques : Space Grotesk + tabular nums (spec README) */
  .num,.stat-card .num,.counter,.ref-table .counter{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;}

  /* ------------------------------------------------------------
     Coquille : sidebar (desktop) / barre d'onglets (mobile)
     ------------------------------------------------------------ */
  .shell{display:flex;min-height:100vh;align-items:stretch;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .content{width:100%;max-width:1180px;margin:0 auto;padding:18px 16px 104px;}
  .view{display:flex;flex-direction:column;gap:16px;}

  .sidebar{display:none;}

  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:6;
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;padding:4px 0;cursor:pointer;
    font-size:10.5px;font-weight:600;color:var(--ink-4);
  }
  .tab .tab-icon{font-size:15px;line-height:1;}
  .tab.is-active{color:var(--primary);font-weight:700;}
  .tab-fab{
    flex:0 0 58px;display:flex;justify-content:center;background:none;border:none;cursor:pointer;
  }
  .tab-fab span{
    width:50px;height:50px;border-radius:16px;background:var(--primary);color:#fff;
    font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-fab);transition:transform .12s ease;
  }
  .tab-fab:active span{transform:scale(.96);}

  @media (min-width:900px){
    .sidebar{
      display:flex;flex-direction:column;gap:5px;
      width:198px;flex:0 0 198px;background:var(--dark);padding:22px 16px;
      position:sticky;top:0;height:100vh;
    }
    .sidebar .wordmark{font-size:16px;font-weight:800;color:#fff;letter-spacing:-0.01em;padding-bottom:18px;}
    .sidebar .wordmark em{font-style:normal;color:var(--ok-accent);}
    .sidebar .nav-item{
      display:block;width:100%;text-align:left;border:none;cursor:pointer;background:none;
      font-size:13.5px;font-weight:600;color:var(--dark-ink);padding:10px 12px;border-radius:9px;
    }
    .sidebar .nav-item:hover{color:#fff;background:#151A25;}
    .sidebar .nav-item.is-active{color:#fff;background:var(--dark-2);font-weight:700;}
    .sidebar .sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;}
    .sidebar .sidebar-foot button{
      background:none;border:none;color:var(--dark-ink);font-size:13px;font-weight:600;
      text-align:left;padding:8px 12px;border-radius:9px;cursor:pointer;
    }
    .sidebar .sidebar-foot button:hover{color:#fff;}
    .tabbar{display:none;}
    .content{padding:26px 28px 60px;}
    .view{gap:20px;}
  }

  /* ------------------------------------------------------------
     En-tête
     ------------------------------------------------------------ */
  .page-head{display:flex;flex-direction:column;gap:12px;}
  .greeting-row{display:flex;justify-content:space-between;align-items:center;gap:14px;}
  .greeting{display:flex;flex-direction:column;}
  .greeting .hello{font-size:13px;font-weight:600;color:var(--ink-2);}
  .greeting .count{font-size:24px;font-weight:800;letter-spacing:-0.02em;}
  .avatar{
    width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;
    font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .avatar.sm{width:30px;height:30px;font-size:12px;}

  .head-title{display:none;}
  .head-title h1{margin:0;font-size:26px;font-weight:800;}
  .head-title .sub{font-size:13.5px;color:var(--ink-2);margin-top:4px;}

  @media (min-width:900px){
    .greeting-row{display:none;}
    .head-title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;}
  }

  /* Boutons */
  .btn-primary{
    background:var(--primary);color:#fff;border:none;border-radius:11px;
    font-size:14px;font-weight:700;padding:12px 18px;cursor:pointer;
    transition:background .15s ease,transform .1s ease;
  }
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-tint{
    background:var(--primary-tint);color:var(--primary-dark);border:1px solid var(--primary-tint-2);
    border-radius:11px;font-size:13.5px;font-weight:700;padding:9px 14px;cursor:pointer;
  }
  .btn-tint:hover{background:var(--primary-tint-2);}
  .link-inline{
    background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
    color:var(--primary);font-size:13.5px;font-weight:700;
  }
  .link-inline:hover{color:var(--primary-dark);text-decoration:underline;}

  /* ------------------------------------------------------------
     Cartes
     ------------------------------------------------------------ */
  .card{
    background:var(--surface);border-radius:var(--r-card);padding:18px 20px;
    box-shadow:var(--shadow-soft);display:flex;flex-direction:column;gap:12px;
  }
  .card-head{display:flex;align-items:center;gap:10px;}
  .card-title{margin:0;font-size:16px;font-weight:800;}
  .card-title-sm{font-size:15px;font-weight:700;}
  .card-head .spacer{margin-left:auto;}
  .muted-text{font-size:13.5px;line-height:1.5;color:var(--ink-2);margin:0;}

  /* Grille des compteurs */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat-card{
    background:var(--surface);border-radius:14px;padding:16px 18px;
    box-shadow:var(--shadow-soft);display:flex;flex-direction:column;gap:5px;
  }
  .stat-card .num{font-size:28px;font-weight:700;line-height:1;}
  .stat-card .num.late{color:var(--late);}
  .stat-card .num.soon{color:var(--soon);}
  .stat-card .num.ok{color:var(--ok);}
  .stat-card .num.primary{color:var(--primary);}
  .stat-card .lbl{font-size:12.5px;font-weight:600;color:var(--ink-2);}
  @media (min-width:900px){ .stat-grid{grid-template-columns:repeat(4,1fr);gap:14px;} }

  /* Carte prioritaire (violette) */
  .priority{
    background:var(--primary);border-radius:14px;padding:16px;color:#fff;
    display:flex;flex-direction:column;gap:12px;
  }
  .priority-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--primary-tint-2);}
  .pill-late{font-size:11px;font-weight:800;background:var(--late);color:#fff;padding:4px 8px;border-radius:var(--r-pill);}
  .pill-soon{font-size:11px;font-weight:800;background:var(--soon);color:#fff;padding:4px 8px;border-radius:var(--r-pill);}
  .priority h2{margin:0;font-size:22px;font-weight:800;line-height:1.15;}
  .priority .machine-name{font-size:14px;color:#D5D1FF;}
  .priority-stats{display:flex;gap:20px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);}
  .priority-stats .stat{display:flex;flex-direction:column;gap:2px;}
  .priority-stats .val{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
  .priority-stats .key{font-size:11px;font-weight:600;color:var(--primary-tint-2);}
  .priority-actions{display:flex;gap:8px;}
  .priority-actions button{
    flex:1;font-size:13px;font-weight:700;padding:11px 0;border-radius:12px;cursor:pointer;
  }
  .priority-actions .do{background:#fff;color:var(--primary);border:none;}
  .priority-actions .see{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);}
  @media (min-width:900px){
    .priority{flex-direction:row;align-items:center;gap:28px;flex-wrap:wrap;}
    .priority .priority-body{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px;}
    .priority-stats{border-top:none;padding-top:0;}
    .priority-actions{flex:0 0 auto;min-width:260px;}
  }

  /* Liste des échéances */
  .alert-list{display:flex;flex-direction:column;}
  .alert-row{
    display:flex;align-items:center;gap:14px;padding:13px 0;
    border-bottom:1px solid var(--line-2);background:none;border-left:none;border-right:none;border-top:none;
    width:100%;text-align:left;cursor:pointer;
  }
  .alert-row:last-child{border-bottom:none;}
  .alert-bar{width:4px;height:38px;border-radius:4px;flex-shrink:0;}
  .alert-bar.late{background:var(--late);}
  .alert-bar.soon{background:var(--soon);}
  .alert-bar.ok{background:var(--ok);}
  .alert-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .alert-title{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .alert-sub{font-size:12.5px;color:var(--ink-2);}
  .alert-due{font-size:12.5px;font-weight:700;white-space:nowrap;}
  .alert-due.late{color:var(--late);}
  .alert-due.soon{color:var(--soon-ink);}
  .alert-due.ok{color:var(--ok);}

  /* Bloc IA */
  .chip-icon{
    width:30px;height:30px;border-radius:9px;background:var(--primary-tint);color:var(--primary);
    font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .pill{font-size:11px;font-weight:700;padding:4px 8px;border-radius:var(--r-pill);}
  .pill.ok{color:var(--ok);background:var(--ok-bg);}
  .pill.soon{color:var(--soon);background:var(--soon-bg);}
  .pill.late{color:var(--late);background:var(--late-bg);}
  .pill.neutral{color:var(--ink-2);background:var(--surface-soft);}
  .ai-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;}
  .ai-row span:first-child{color:var(--ink);font-weight:600;}
  .ai-row span:last-child{color:var(--ink-2);}

  /* Zone de dépôt PDF */
  .dropzone{
    background:var(--primary-tint);border:1px dashed var(--primary-line);border-radius:var(--r-card);
    padding:20px;display:flex;flex-direction:column;gap:9px;align-items:flex-start;cursor:pointer;
    transition:background .15s ease,border-color .15s ease;
  }
  .dropzone:hover,.dropzone.is-over{background:#E3DFFE;border-color:var(--primary);}
  .dropzone .dz-icon{font-size:22px;color:var(--primary);}
  .dropzone .dz-title{font-size:15px;font-weight:800;}
  .dropzone .dz-help{font-size:13px;line-height:1.5;color:#4B4A6B;}

  /* Rappels */
  .switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .switch-row .switch-label{font-size:13.5px;color:#3D4351;}
  .switch{
    width:38px;height:22px;border-radius:var(--r-pill);background:#D8D8E4;border:none;cursor:pointer;
    display:flex;align-items:center;padding:2px;flex-shrink:0;transition:background .15s ease;
  }
  .switch span{width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s ease;}
  .switch.on{background:var(--primary);justify-content:flex-end;}

  /* ------------------------------------------------------------
     Vue Parc : cartes machine (compat. avec le JS existant)
     ------------------------------------------------------------ */
  .machine{
    background:var(--surface);border-radius:14px;box-shadow:var(--shadow-soft);
    padding:16px 18px;display:flex;flex-direction:column;gap:14px;
  }
  .machine.is-alert{border-left:4px solid var(--late);}
  .machine.is-soon{border-left:4px solid var(--soon);}
  .machine.is-ok,.machine.is-unknown{border-left:4px solid var(--ok);}
  .m-main .name{font-size:17px;font-weight:700;}
  .m-main .meta{color:var(--ink-2);font-size:14px;margin-top:4px;line-height:1.5;}
  .m-side{display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
  .m-actions{display:flex;flex-wrap:wrap;gap:6px;}
  .badge{
    display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;
    letter-spacing:.02em;padding:5px 12px;border-radius:var(--r-pill);border:none;
  }
  .badge.ok{color:var(--ok);background:var(--ok-bg);}
  .badge.soon{color:var(--soon);background:var(--soon-bg);}
  .badge.alert{color:var(--late);background:var(--late-bg);}
  .badge.neutral{color:var(--ink-2);background:var(--surface-soft);}
  .due{font-size:13.5px;color:var(--ink-2);font-weight:600;}
  @media (min-width:900px){
    .machine{flex-direction:row;justify-content:space-between;gap:18px;}
    .m-side{align-items:flex-end;}
    .m-actions{justify-content:flex-end;}
  }

  .btn-row-action{
    font-size:13px;font-weight:700;cursor:pointer;border-radius:var(--r-pill);padding:7px 13px;
    white-space:nowrap;border:1px solid transparent;background:var(--surface-soft);color:var(--ink-2);
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .btn-row-action:hover{background:var(--primary-tint);border-color:var(--primary-tint-2);color:var(--primary-dark);}
  .log-intervention-btn{background:var(--primary);color:#fff;}
  .log-intervention-btn:hover{background:var(--primary-dark);color:#fff;border-color:transparent;}
  .view-plan-btn,.next-maint-btn{background:var(--surface);border-color:var(--line);color:var(--ink);}

  .view-manual{
    display:inline-block;background:var(--primary-tint);border:1px solid var(--primary-tint-2);
    color:var(--primary-dark);font-size:12.5px;font-weight:700;padding:5px 12px;
    border-radius:var(--r-pill);cursor:pointer;font-family:inherit;
  }
  .view-manual:hover{background:var(--primary-tint-2);}
  .machine-photo{
    display:block;width:100%;max-width:220px;aspect-ratio:16/9;object-fit:contain;
    border-radius:var(--r-chip);margin-top:12px;border:1px solid var(--line);background:var(--surface-soft);
  }

  /* ------------------------------------------------------------
     Vue Manuels & IA
     ------------------------------------------------------------ */
  .manual-row{
    display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2);
  }
  .manual-row:last-child{border-bottom:none;}
  .manual-row .mr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .manual-row .mr-title{font-size:14.5px;font-weight:700;}
  .manual-row .mr-sub{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ------------------------------------------------------------
     Vue Agenda
     ------------------------------------------------------------ */
  .agenda-month{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 2px;}

  /* ------------------------------------------------------------
     Modales et formulaires (classes partagées avec le JS existant)
     ------------------------------------------------------------ */
  .overlay{
    position:fixed;inset:0;background:rgba(13,17,23,.55);backdrop-filter:blur(2px);
    display:flex;align-items:flex-start;justify-content:center;
    padding:24px 14px;overflow-y:auto;z-index:20;
  }
  .modal{
    background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card);
    max-width:480px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(13,17,23,.24);
  }
  .modal h2{font-size:21px;font-weight:800;margin:0 0 5px;}
  .modal .sub{color:var(--ink-2);font-size:14.5px;margin:0 0 18px;line-height:1.5;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .plan-modal .modal{max-width:660px;}

  label{display:block;font-size:14px;font-weight:700;margin-bottom:6px;margin-top:15px;color:var(--ink);}
  input,select,textarea{
    width:100%;padding:11px 13px;border:1.5px solid transparent;border-radius:var(--r-chip);
    background:var(--surface-soft);font-family:inherit;font-size:16px;color:var(--ink);
    transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-tint);background:var(--surface);
  }
  textarea{resize:vertical;min-height:64px;}
  .field-row{display:flex;gap:12px;}
  .field-row > div{flex:1;}
  .hint{font-size:13.5px;color:var(--ink-2);margin-top:6px;line-height:1.5;}
  .error{color:var(--late);font-size:14px;margin-top:12px;font-weight:600;}

  button.primary{
    flex:1;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:var(--r-pill);
    font-weight:700;font-size:16px;cursor:pointer;box-shadow:var(--shadow-soft);
    transition:background .15s ease,transform .1s ease;
  }
  button.primary:hover{background:var(--primary-dark);}
  button.primary:active{transform:scale(.98);}
  button.secondary{
    flex:1;padding:12px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);
    border-radius:var(--r-pill);font-weight:700;font-size:16px;cursor:pointer;
    transition:border-color .15s ease,background .15s ease;
  }
  button.secondary:hover{border-color:var(--ink-2);background:var(--surface-soft);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .delete-link{
    display:block;margin-top:16px;text-align:center;background:none;border:none;
    color:var(--late);font-size:14px;font-family:inherit;font-weight:700;cursor:pointer;padding:6px;width:100%;
  }
  .delete-link:hover{text-decoration:underline;}

  /* Connexion / inscription */
  .login-box{
    max-width:380px;margin:10vh auto 0;padding:32px 28px;border:1px solid var(--line-2);
    background:var(--surface);border-radius:28px;box-shadow:0 24px 60px rgba(13,17,23,.16);
  }
  .login-box h1{margin:0 0 6px;font-size:24px;font-weight:800;text-align:center;display:block;}
  .login-box p{color:var(--ink-2);font-size:14.5px;margin-top:0;margin-bottom:20px;text-align:center;}
  .avatar-badge{
    width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;
    margin:0 auto 14px;box-shadow:0 8px 18px rgba(91,75,245,.28);
  }
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:76px;}
  .toggle-pw-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--primary);font-size:12.5px;font-weight:700;cursor:pointer;padding:6px 8px;
  }
  .signup-link-btn{width:100%;margin-top:10px;flex:none;}

<script>
// ── Configuration ─────────────────────────────────────────────
const __isPasswordRecovery = window.location.hash.includes('type=recovery');
const SUPABASE_URL = "https://tiayvmnodsbygmuemeuy.supabase.co";
const SUPABASE_KEY = "sb_publishable__D5hSUJPHa9BQVrKzN2oqA_SlmhqDRg";
const app = document.getElementById('app');

// ── Utilitaires ───────────────────────────────────────────────
// Valeurs par défaut du plan « inactif » : on stocke toujours un intervalle
// cohérent dans les deux unités, même si la machine ne suit qu'un seul mode.
const FALLBACK_INTERVAL_DAYS = 90;
const FALLBACK_REMINDER_DAYS = 7;
const FALLBACK_INTERVAL_HOURS = 100;
const FALLBACK_REMINDER_HOURS = 10;
const HISTORY_ROWS_IN_MODAL = 50;

// Échappe une valeur destinée à du HTML (texte ou attribut entre guillemets).
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// N'autorise que les URL http(s) : bloque javascript:, data:, etc.
function safeUrl(u) {
  const s = String(u ?? '').trim();
  return /^https?:\/\//i.test(s) ? s : '';
}

// Dates « AAAA-MM-JJ » traitées en heure locale : évite les décalages de fuseau.
function todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function addDaysIso(isoDateStr, days) {
  const [y, m, d] = String(isoDateStr).split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + (Number(days) || 0));
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
}
// Nombre de jours entiers entre aujourd'hui (minuit local) et la date visée.
// 0 = aujourd'hui, -1 = hier. Pas de Math.ceil : plus de « en retard » décalé.
function daysUntil(isoDateStr) {
  const [y, m, d] = String(isoDateStr).split('-').map(Number);
  if (!y || !m || !d) return null;
  const target = new Date(y, m - 1, d);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
}

// Les items du plan viennent soit de l'IA (objets), soit d'anciens enregistrements
// (chaînes simples) : on normalise pour ne plus perdre l'affichage.
function normalizeItems(raw) {
  if (!Array.isArray(raw)) return [];
  return raw
    .map(it => (typeof it === 'string' ? { label: it } : (it && typeof it === 'object' ? it : null)))
    .filter(it => it && (it.label || it.frequency || it.spec || it.qty || it.note));
}

// ── Modèle « compteur » générique (heures ou kilomètres) ──────
// Schéma cible : machines.counter_unit + machines.counter_value, et sur le plan
// interval_counter / next_due_counter / reminder_counter_before, avec
// tracking_mode ∈ {days, hours, km}.
// Tant que la migration n'est pas exécutée, l'application retombe sur les
// colonnes historiques : elle fonctionne donc AVANT et APRÈS la migration.
const SCHEMA = { hasCounter: false };

const COUNTER_UNITS = {
  hours: { word: 'heures', short: 'h', field: 'Heures compteur actuelles', placeholder: 'Ex. 245', step: '0.1' },
  km: { word: 'kilomètres', short: 'km', field: 'Kilométrage actuel', placeholder: 'Ex. 19 240', step: '1' },
};

function counterUnitFromMode(mode) { return mode === 'km' ? 'km' : 'hours'; }

// L'unité d'une machine : counter_unit fait référence, tracking_mode sert de
// repli tant que la colonne n'est pas renseignée.
function counterUnitOf(machine) {
  if (machine && (machine.counter_unit === 'km' || machine.counter_unit === 'hours')) return machine.counter_unit;
  if (machine && machine.plan && machine.plan.tracking_mode === 'km') return 'km';
  return 'hours';
}
function counterShort(unit) { return COUNTER_UNITS[unit] ? COUNTER_UNITS[unit].short : 'h'; }
function formatCounter(value, unit) {
  // Attention : Number(null) vaut 0. Un compteur non renseigné doit afficher
  // « — » et non « 0 h ».
  if (value == null || value === '') return '—';
  const n = Number(value);
  if (!isFinite(n)) return '—';
  const u = COUNTER_UNITS[unit] ? unit : 'hours';
  const text = u === 'km' ? Math.round(n).toLocaleString('fr-FR') : (Number.isInteger(n) ? String(n) : n.toFixed(1));
  return `${text} ${COUNTER_UNITS[u].short}`;
}
function machineCounter(machine) {
  if (!machine) return null;
  const v = SCHEMA.hasCounter ? machine.counter_value : machine.current_hours;
  return v == null ? null : Number(v);
}
function planIsCounter(plan) { return !!plan && plan.tracking_mode !== 'days'; }
function planIntervalCounter(plan) {
  if (!plan) return null;
  return (SCHEMA.hasCounter ? plan.interval_counter : plan.interval_hours) ?? null;
}
function planNextDueCounter(plan) {
  if (!plan) return null;
  return (SCHEMA.hasCounter ? plan.next_due_counter : plan.next_due_hours) ?? null;
}
function planReminderCounter(plan) {
  if (!plan) return FALLBACK_REMINDER_HOURS;
  return (SCHEMA.hasCounter ? plan.reminder_counter_before : plan.reminder_hours_before) ?? FALLBACK_REMINDER_HOURS;
}
// Le service d'extraction IA ne connaît que « days » et « hours » : pour un
// kilométrage, la lecture du manuel reste la même, seule l'unité change.
function aiModeFrom(mode) { return mode === 'km' ? 'hours' : mode; }

// Colonnes à écrire selon le schéma détecté.
function machineCounterPatch(value, machine) {
  return SCHEMA.hasCounter
    ? { counter_value: value, counter_unit: counterUnitOf(machine) }
    : { current_hours: value };
}
function planCounterPatch(interval, reminder) {
  return SCHEMA.hasCounter
    ? { interval_counter: interval, reminder_counter_before: reminder }
    : { interval_hours: interval, reminder_hours_before: reminder };
}
function planNextDueCounterPatch(nextDue) {
  return SCHEMA.hasCounter ? { next_due_counter: nextDue } : { next_due_hours: nextDue };
}
// Classe d'habillage du bandeau d'échéance selon l'état.
function heroClass(state) { return state === 'late' ? 'alert' : (state === 'soon' ? 'soon' : 'ok'); }

// Le trigger d'application du plan gratuit (côté base) renvoie ce message
// lorsque la limite est franchie — typiquement quand deux postes ajoutent une
// machine en même temps, cas que le contrôle du navigateur ne peut pas voir.
function isQuotaError(err) {
  const message = String(err && err.message ? err.message : err || '');
  return /limite du plan gratuit/i.test(message);
}

// supabase-js ne remonte qu'un « Edge Function returned a non-2xx status code »
// quand une fonction Edge répond 401, 403, 429… Or c'est justement là que se
// trouve le message utile (quota atteint, session expirée). Le corps de la
// réponse est accessible via error.context.
async function functionErrorMessage(error, defaut = 'appel impossible') {
  if (error && error.context && typeof error.context.json === 'function') {
    try {
      const corps = await error.context.clone().json();
      if (corps && corps.error) return String(corps.error);
    } catch (e) { /* corps absent, déjà consommé ou non JSON */ }
  }
  return (error && error.message) || defaut;
}

// ── Initialisation Supabase ───────────────────────────────────
// Si le CDN est bloqué, on affiche une erreur claire au lieu de rester bloqué
// indéfiniment sur « Chargement… ».
let sb = null;
try {
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    throw new Error("bibliothèque Supabase non chargée (CDN inaccessible)");
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch (err) {
  app.innerHTML = `
    <div class="empty">
      <strong>Impossible de charger l'application.</strong><br>
      ${esc(err.message)}<br><br>
      Vérifie ta connexion internet puis recharge la page.<br><br>
      <button type="button" class="primary" id="fatal-retry" style="max-width:220px;margin:0 auto;">Réessayer</button>
    </div>`;
  const retryBtn = document.getElementById('fatal-retry');
  if (retryBtn) retryBtn.addEventListener('click', () => window.location.reload());
}

// ── pdf.js chargé à la demande ────────────────────────────────
const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfLibPromise = null;
function loadPdfLib() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!pdfLibPromise) {
    pdfLibPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = PDFJS_URL;
      s.onload = () => (window.pdfjsLib ? resolve(window.pdfjsLib) : reject(new Error("pdf.js indisponible")));
      s.onerror = () => reject(new Error("téléchargement de pdf.js impossible"));
      document.head.appendChild(s);
    });
    pdfLibPromise.catch(() => { pdfLibPromise = null; });
  }
  return pdfLibPromise;
}

let pdfWorkerReady = null;
function ensurePdfWorker() {
  if (!pdfWorkerReady) {
    const p = loadPdfLib()
      .then(() => fetch(PDFJS_WORKER_URL))
      .then(resp => {
        if (!resp.ok) throw new Error("worker pdf.js introuvable");
        return resp.text();
      })
      .then(code => {
        const blob = new Blob([code], { type: 'application/javascript' });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
      });
    // En cas d'échec on réarme, sinon le rejet resterait mémorisé pour toujours.
    pdfWorkerReady = p.catch(err => { pdfWorkerReady = null; throw err; });
  }
  return pdfWorkerReady;
}

async function renderPdfFirstPageAsBlob(file) {
  await ensurePdfWorker();
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 1.5 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
}

async function uploadMachinePhoto(companyId, machineId, blob) {

  if (error) throw error;
  const { data } = sb.storage.from('machine-photos').getPublicUrl(path);
  return data.publicUrl;
}

function openForgotPasswordModal() {

  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.innerHTML = `
    <div class="modal">
      <h2>Mot de passe oublié</h2>
      <p class="sub">Indique ton email de connexion : on t'envoie un lien pour définir un nouveau mot de passe.</p>
      <form id="forgot-form">
        <label for="forgot-email">Email</label>
        <input id="forgot-email" type="email" required>
        <div class="hint" id="forgot-error"></div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="forgot-cancel">Annuler</button>
          <button type="submit" class="primary">Envoyer le lien</button>
        </div>
      </form>
    </div>
  `;
  overlay.querySelector('#forgot-cancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = overlay.querySelector('#forgot-error');
    const submitBtn = e.target.querySelector('button[type=submit]');
    const email = overlay.querySelector('#forgot-email').value.trim();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Envoi…';
    try {
      const redirectTo = window.location.href.split('?')[0].split('#')[0];
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;
      overlay.innerHTML = `
        <div class="modal">
          <h2>Email envoyé</h2>
          <p class="sub">Si un compte existe pour ${esc(email)}, un lien de réinitialisation vient d'être envoyé. Ouvre-le depuis ta boîte mail pour définir un nouveau mot de passe.</p>
          <div class="modal-actions">
            <button type="button" class="primary" id="forgot-close">Fermer</button>
          </div>
        </div>`;
      overlay.querySelector('#forgot-close').addEventListener('click', () => overlay.remove());
    } catch (err) {
      errorEl.textContent = "Erreur : " + err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Envoyer le lien';
    }
  });
}

const SIGNUP_ACTIVITIES = ['BTP / Travaux publics', 'Agriculture / Élevage', 'Espaces verts / Paysagisme', 'Transport / Logistique', 'Location de matériel', 'Industrie / Production', 'Collectivité / Secteur public', 'Autre'];

function openSignupWizard() {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  const state = { structureType: 'company', name: '', activity: SIGNUP_ACTIVITIES[0], registrationNumber: '', phone: '', email: '', contactName: '', password: '' };

  function shell(inner) { overlay.innerHTML = `<div class="modal">${inner}</div>`; }

  function stepForm() {
    shell(`
      <h2>Créer un compte</h2>
      <p class="sub">Gratuit jusqu'à 3 machines suivies, puis 20 €/mois.</p>
      <form id="signup-form">
        <label>Type de structure</label>
        <div class="track-mode-choice">
          <label><input type="radio" name="stype" value="company" ${state.structureType === 'company' ? 'checked' : ''}> Société</label>
          <label><input type="radio" name="stype" value="individual" ${state.structureType === 'individual' ? 'checked' : ''}> Indépendant / Patenté</label>
        </div>

        <label for="su-name" id="su-name-label">${state.structureType === 'individual' ? 'Nom et prénom' : 'Nom de la société'}</label>
        <input id="su-name" required value="${esc(state.name)}">

        <label for="su-activity">Activité</label>
        <select id="su-activity">
          ${SIGNUP_ACTIVITIES.map(a => `<option value="${a}" ${a === state.activity ? 'selected' : ''}>${a}</option>`).join('')}
        </select>

        <label for="su-reg">N° RCS / RIDET (si disponible)</label>
        <input id="su-reg" value="${esc(state.registrationNumber)}">

        <div class="field-row">
          <div>
            <label for="su-phone">Téléphone</label>
            <input id="su-phone" type="tel" required value="${esc(state.phone)}">
          </div>
          <div>
            <label for="su-contact">Nom du contact</label>
            <input id="su-contact" required value="${esc(state.contactName)}">
          </div>
        </div>

        <label for="su-email">Email</label>
        <input id="su-email" type="email" required value="${esc(state.email)}">

        <label for="su-password">Mot de passe</label>
        <div class="password-wrap">
          <input id="su-password" type="password" required minlength="6">
          <button type="button" class="toggle-pw-btn" id="toggle-pw">Afficher</button>
        </div>
        <div class="hint" id="su-error"></div>

        <div class="modal-actions">
          <button type="button" class="secondary" id="su-cancel">Annuler</button>
          <button type="submit" class="primary">Créer le compte</button>
        </div>
      </form>
    `);

    overlay.querySelector('#su-cancel').addEventListener('click', () => overlay.remove());
    overlay.querySelectorAll('input[name=stype]').forEach(r => {
      r.addEventListener('change', () => {
        state.structureType = overlay.querySelector('input[name=stype]:checked').value;
        overlay.querySelector('#su-name-label').textContent = state.structureType === 'individual' ? 'Nom et prénom' : 'Nom de la société';
      });
    });
    overlay.querySelector('#toggle-pw').addEventListener('click', () => {
      const pw = overlay.querySelector('#su-password');
      const btn = overlay.querySelector('#toggle-pw');
      if (pw.type === 'password') { pw.type = 'text'; btn.textContent = 'Masquer'; }
      else { pw.type = 'password'; btn.textContent = 'Afficher'; }
    });

    overlay.querySelector('#signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = overlay.querySelector('#su-error');
      const submitBtn = e.target.querySelector('button[type=submit]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Envoi du code…';

      state.name = overlay.querySelector('#su-name').value.trim();
      state.activity = overlay.querySelector('#su-activity').value;
      state.registrationNumber = overlay.querySelector('#su-reg').value.trim();
      state.phone = overlay.querySelector('#su-phone').value.trim();
      state.contactName = overlay.querySelector('#su-contact').value.trim();
      state.email = overlay.querySelector('#su-email').value.trim();
      state.password = overlay.querySelector('#su-password').value;

      try {
        const { error } = await sb.auth.signUp({ email: state.email, password: state.password });
        if (error) throw error;
        stepVerify();
      } catch (err) {
        errorEl.textContent = "Erreur : " + err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Créer le compte';
      }
    });
  }

  function stepVerify() {
    shell(`
      <h2>Vérifie ton email</h2>
      <p class="sub">Un code à 6 chiffres a été envoyé à ${esc(state.email)}. Saisis-le ci-dessous pour activer ton compte.</p>
      <form id="verify-form">
        <label for="su-code">Code de vérification</label>
        <input id="su-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" required autofocus style="letter-spacing:6px;font-size:20px;text-align:center;">
        <div class="hint" id="verify-error"></div>
        <div class="resend-row">
          <button type="button" class="link-inline" id="verify-resend">Renvoyer le code</button>
          <span class="hint" id="verify-resend-msg" role="status" aria-live="polite"></span>
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="verify-cancel">Annuler</button>
          <button type="submit" class="primary">Valider</button>
        </div>
      </form>
    `);
    overlay.querySelector('#verify-cancel').addEventListener('click', () => overlay.remove());

    // Sans renvoi possible, un code non reçu condamnait l'inscription.
    const resendBtn = overlay.querySelector('#verify-resend');
    const resendMsg = overlay.querySelector('#verify-resend-msg');
    let cooldown = 0;
    let cooldownTimer = null;
    resendBtn.addEventListener('click', async () => {
      if (cooldown > 0) return;
      resendBtn.disabled = true;
      resendMsg.textContent = 'Envoi…';
      try {
        const { error } = await sb.auth.resend({ type: 'signup', email: state.email });
        if (error) throw error;
        resendMsg.textContent = 'Nouveau code envoyé.';
      } catch (err) {
        resendMsg.textContent = "Envoi impossible : " + err.message;
      }
      cooldown = 30;
      const tick = () => {
        if (cooldown <= 0) {
          resendBtn.disabled = false;
          resendBtn.textContent = 'Renvoyer le code';
          clearInterval(cooldownTimer);
          return;
        }
        resendBtn.textContent = `Renvoyer dans ${cooldown} s`;
        cooldown--;
      };
      tick();
      cooldownTimer = setInterval(tick, 1000);
    });
    overlay.querySelector('#verify-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = overlay.querySelector('#verify-error');
      const submitBtn = e.target.querySelector('button[type=submit]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Vérification…';
      const code = overlay.querySelector('#su-code').value.trim();
      try {
        const { data, error } = await sb.auth.verifyOtp({ email: state.email, token: code, type: 'signup' });
        if (error) throw error;

        const companyId = crypto.randomUUID();
        const { error: companyErr } = await sb.from('companies').insert({
          id: companyId,
          name: state.name,
          activity: state.activity,
          registration_number: state.registrationNumber || null,
          phone: state.phone,
          contact_name: state.contactName,
          plan: 'free',
        });
        if (companyErr) throw companyErr;

        const { error: profileErr } = await sb.from('profiles').insert({
          id: data.user.id,
          company_id: companyId,
        });
        if (profileErr) throw profileErr;

        overlay.remove();
        boot();
      } catch (err) {
        errorEl.textContent = "Erreur : " + err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Valider';
      }
    });
  }

  stepForm();
}

// ============================================================
// ParcPacific — couche de présentation « Signal »
// Remplace dueInfo() + renderMachines() de la version précédente.
// Toute la logique Supabase (modales d'édition, journal d'entretien,
// suppression, assistant d'ajout) est réutilisée telle quelle.
// ============================================================

// Horizon du compteur « Sous 15 jours » du tableau de bord (copie du handoff).
// Pour un suivi au compteur horaire, il n'existe pas d'équivalent en jours :
// on utilise alors la fenêtre de rappel du plan.
const SOON_DAYS = 15;

const REMINDERS_KEY = 'parcpacific.reminders.v1';
const DEFAULT_REMINDERS = { whatsapp: true, email: true, escalate: false };

const MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const MOIS_LONG = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

// ── État applicatif ───────────────────────────────────────────

function loadReminders() {
  try {
    const raw = JSON.parse(localStorage.getItem(REMINDERS_KEY) || '{}');
    return { ...DEFAULT_REMINDERS, ...(raw && typeof raw === 'object' ? raw : {}) };
  } catch (e) {
    return { ...DEFAULT_REMINDERS };
  }
}
function saveReminders(r) {
  try { localStorage.setItem(REMINDERS_KEY, JSON.stringify(r)); } catch (e) { /* stockage indisponible */ }
}

// ── Formatage ─────────────────────────────────────────────────
function formatShortDate(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  if (!y || !m || !d) return '—';
  return `${d} ${MOIS_COURT[m - 1]}`;
}
function formatLongDate(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  if (!y || !m || !d) return '—';
  return `${d} ${MOIS_LONG[m - 1]} ${y}`;
}
function formatHours(n) {
  const v = Number(n);
  if (!isFinite(v)) return '—';
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}
function initialsFrom(label) {
  return esc(String(label || 'PP').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'PP');
}
function firstNameFrom(label) {
  const w = String(label || '').trim().split(/\s+/).filter(Boolean);
  return w.length ? w[0] : '';
}

// ── Échéances et statuts ──────────────────────────────────────
// state : 'late' (en retard) | 'soon' (sous 15 j / fenêtre de rappel) | 'ok' | 'unknown'
// urgency : position dans la fenêtre de « bientôt » — 0 = échéance atteinte,
// 1 = bord de la fenêtre. Permet de classer ensemble des machines suivies au
// compteur et au calendrier, sans convertir des heures en jours.
function dueInfo(plan, machine) {
  if (!plan) {
    return { state: 'unknown', label: 'Pas de plan de maintenance', short: 'Plan à définir', sortKey: Number.POSITIVE_INFINITY, urgency: Number.POSITIVE_INFINITY, unit: null };
  }
  if (planIsCounter(plan)) {
    const unit = counterUnitOf(machine);
    const current = machineCounter(machine);
    const nextDue = planNextDueCounter(plan);
    if (nextDue == null || current == null) {
      return { state: 'unknown', label: `Renseigner le ${unit === 'km' ? 'kilométrage' : 'compteur horaire'}`, short: 'Compteur à saisir', sortKey: Number.POSITIVE_INFINITY, urgency: Number.POSITIVE_INFINITY, unit };
    }
    const remaining = nextDue - current;
    const horizon = planReminderCounter(plan);
    const ctx = `compteur ${formatCounter(current, unit)} · échéance ${formatCounter(nextDue, unit)}`;
    const urgency = horizon > 0 ? remaining / horizon : 0;
    const short = remaining < 0 ? `+${formatCounter(Math.abs(remaining), unit)}` : formatCounter(remaining, unit);
    if (remaining < 0) return { state: 'late', label: `En retard de ${formatCounter(Math.abs(remaining), unit)} (${ctx})`, short, sortKey: remaining, urgency, unit };
    if (remaining <= horizon) return { state: 'soon', label: `Échéance dans ${formatCounter(remaining, unit)} (${ctx})`, short, sortKey: remaining, urgency, unit };
    return { state: 'ok', label: `Prochaine échéance dans ${formatCounter(remaining, unit)} (${ctx})`, short, sortKey: remaining, urgency, unit };
  }
  if (!plan.next_due_at) {
    return { state: 'unknown', label: 'Pas de plan de maintenance', short: 'Plan à définir', sortKey: Number.POSITIVE_INFINITY, urgency: Number.POSITIVE_INFINITY, unit: 'days' };
  }
  const days = daysUntil(plan.next_due_at);
  if (days == null) {
    return { state: 'unknown', label: 'Date d\'échéance illisible', short: '—', sortKey: Number.POSITIVE_INFINITY, urgency: Number.POSITIVE_INFINITY, unit: 'days' };
  }
  const urgency = days / SOON_DAYS;
  if (days < 0) return { state: 'late', label: `En retard de ${Math.abs(days)} j (échéance le ${formatShortDate(plan.next_due_at)})`, short: `+${Math.abs(days)} j`, sortKey: days, urgency, unit: 'days' };
  if (days <= SOON_DAYS) return { state: 'soon', label: `Échéance dans ${days} j (le ${formatShortDate(plan.next_due_at)})`, short: formatShortDate(plan.next_due_at), sortKey: days, urgency, unit: 'days' };
  return { state: 'ok', label: `Prochaine échéance dans ${days} j (le ${formatShortDate(plan.next_due_at)})`, short: formatShortDate(plan.next_due_at), sortKey: days, urgency, unit: 'days' };
}

// Tâche suivante : premier item du plan, sinon première tâche de la liste.
function nextTaskLabel(machine) {
  const items = normalizeItems(machine.plan?.items);
  const first = items.find(it => it.label);
  if (first) return first.label;
  const tasks = (machine.plan?.tasks || '').split(',').map(t => t.trim()).filter(Boolean);
  return tasks[0] || 'Entretien';
}

function machineCounts(machines) {
  const c = { late: 0, soon: 0, ok: 0, manuals: 0, analysed: 0 };
  machines.forEach(m => {
    const info = dueInfo(m.plan, m);
    if (info.state === 'late') c.late++;
    else if (info.state === 'soon') c.soon++;
    else c.ok++;                       // à jour + plans non renseignés : rien à traiter
    if (m.manual_url) c.manuals++;
    if (normalizeItems(m.plan?.items).length) c.analysed++;
  });
  return c;
}

// Échéances à traiter, les plus urgentes d'abord.
function openAlerts() {
  return UI.machines
    .map(m => ({ machine: m, info: dueInfo(m.plan, m) }))
    .filter(x => x.info.state === 'late' || x.info.state === 'soon')
    .sort((a, b) => {
      const rank = (s) => (s === 'late' ? 0 : 1);
      if (rank(a.info.state) !== rank(b.info.state)) return rank(a.info.state) - rank(b.info.state);
      // En retard : le plus dépassé d'abord. Bientôt : le plus proche de
      // l'échéance d'abord, à fenêtre comparable (heures et jours mélangés).
      if (a.info.state === 'late') return a.info.sortKey - b.info.sortKey;
      return a.info.urgency - b.info.urgency;
    });
}

function badgeClass(state) {
  if (state === 'late') return 'alert';
  if (state === 'soon') return 'soon';
  if (state === 'ok') return 'ok';
  return 'neutral';
}
function badgeLabel(state) {
  if (state === 'late') return 'En retard';
  if (state === 'soon') return 'Bientôt';
  if (state === 'ok') return 'À jour';
  return 'Plan à définir';
}

function renderApp() {
  UI.counts = machineCounts(UI.machines);
  const view = VIEWS[UI.view] || VIEWS.dashboard;
  app.innerHTML = `
    <div class="shell">
      <aside class="sidebar">${sidebarHtml()}</aside>
      <div class="main">
        <div class="content">

// ── Confort des modales ───────────────────────────────────────
// Appliqué automatiquement à toute .overlay ajoutée au document : rôle de
// dialogue, focus initial, piège à focus, fermeture par Échap, et garde-fou
// contre la perte d'une saisie en cours. Aucune modale n'a besoin d'y penser.
const modalMeta = new WeakMap();

function focusableIn(root) {
  return Array.from(root.querySelectorAll(
    'a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )).filter(el => el.offsetParent !== null || el === document.activeElement);
}

function formSnapshot(form) {
  return Array.from(form.elements).map(el => {
    const key = el.name || el.id || el.tagName;
    if (el.type === 'checkbox' || el.type === 'radio') return `${key}:${el.checked}`;
    if (el.type === 'file') return `${key}:${el.files ? el.files.length : 0}`;
    return `${key}:${el.value}`;
  }).join('|');
}

// Une photo distante peut ne pas se charger : on retire l'image plutôt que
// d'afficher une icône cassée. Écouteur en phase de CAPTURE, car l'événement
// « error » d'une <img> ne remonte pas jusqu'au document.
document.addEventListener('error', (e) => {
  const el = e.target;
  if (el && el.tagName === 'IMG' && el.classList && el.classList.contains('machine-photo')) el.remove();
}, true);

function overlayIsDirty(overlay) {
  const meta = modalMeta.get(overlay);
  if (!meta) return false;
  const form = overlay.querySelector('form');
  if (!form || !meta.snapshot) return false;
  return formSnapshot(form) !== meta.snapshot;
}

function enhanceModal(overlay) {
  const meta = modalMeta.get(overlay) || {};
  if (!meta.previousFocus) meta.previousFocus = document.activeElement;
  const form = overlay.querySelector('form');
  // L'instantané est pris à l'ouverture, et repris uniquement si le formulaire
  // est REMPLACÉ (changement d'étape d'un assistant). Une mise à jour
  // asynchrone à l'intérieur du même formulaire — chargement d'une photo ou de
  // l'historique — ne doit pas déplacer la référence, sinon la saisie déjà
  // faite par l'utilisateur deviendrait la nouvelle référence.
  if (form !== meta.formEl) {
    meta.formEl = form || null;
    meta.snapshot = form ? formSnapshot(form) : null;
  }
  modalMeta.set(overlay, meta);

  const dialog = overlay.querySelector('.modal, .sheet');
  if (dialog && !dialog.hasAttribute('role')) {
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-modal', 'true');
    const title = dialog.querySelector('h1, h2');
    if (title) {
      if (!title.id) title.id = `modal-title-${Math.random().toString(36).slice(2, 8)}`;
      dialog.setAttribute('aria-labelledby', title.id);
    }
  }

  requestAnimationFrame(() => {
    if (!document.body.contains(overlay)) return;
    const active = document.activeElement;
    if (active && overlay.contains(active)) return;      // le focus est déjà dedans
    const target = overlay.querySelector('[autofocus]') || focusableIn(overlay)[0];
    if (target) target.focus();
  });
}

function topOverlay() {
  const all = document.querySelectorAll('.overlay');
  return all.length ? all[all.length - 1] : null;
}

function requestCloseOverlay(overlay) {
  if (!overlay) return;
  if (overlayIsDirty(overlay)) {
    const ok = window.confirm("Fermer sans enregistrer ? Les informations saisies seront perdues.");
    if (!ok) return;
  }
  const meta = modalMeta.get(overlay);
  overlay.remove();
  const previous = meta && meta.previousFocus;
  if (previous && document.body.contains(previous) && typeof previous.focus === 'function') previous.focus();
}

// Un seul écouteur pour toutes les modales : Échap et piège à focus.
document.addEventListener('keydown', (e) => {
  const overlay = topOverlay();
  if (!overlay) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    requestCloseOverlay(overlay);
    return;
  }
  if (e.key !== 'Tab') return;
  const items = focusableIn(overlay);
  if (!items.length) return;
  const first = items[0];
  const last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || !overlay.contains(document.activeElement))) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}, true);

// Clic à l'extérieur : on intercepte avant le gestionnaire de la modale pour
// pouvoir demander confirmation si un formulaire a été modifié.
document.addEventListener('click', (e) => {
  const overlay = topOverlay();
  if (!overlay || e.target !== overlay) return;
  if (!overlayIsDirty(overlay)) return;                  // comportement d'origine
  if (!window.confirm("Fermer sans enregistrer ? Les informations saisies seront perdues.")) {
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

// Chaque apparition de modale (et chaque changement d'étape) est équipée.
const modalObserver = new MutationObserver((records) => {
  for (const record of records) {
    for (const node of record.addedNodes) {
      if (node.nodeType !== 1) continue;
      if (node.classList.contains('overlay')) enhanceModal(node);
      else if (node.closest && node.closest('.overlay')) enhanceModal(node.closest('.overlay'));
      else if (node.querySelector && node.querySelector('form')) {
        const host = node.closest ? node.closest('.overlay') : null;
        if (host) enhanceModal(host);
      }
    }
  }
});
modalObserver.observe(document.body, { childList: true, subtree: true });

// ── Confirmation d'action (toast) ─────────────────────────────
function showToast(message) {
  if (!message) return;
  let host = document.getElementById('toast-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toast-host';
    host.className = 'toast-host';
    host.setAttribute('role', 'status');
    host.setAttribute('aria-live', 'polite');
    document.body.appendChild(host);
  }
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add('is-on'));
  setTimeout(() => {
    el.classList.remove('is-on');
    setTimeout(() => el.remove(), 260);
  }, 3200);
}

function dropzoneHtml(id) {
  return `
    <div class="dropzone" id="${id}">
      <span class="dz-icon">⤒</span>
      <span class="dz-title">Déposer un manuel PDF</span>
      <span class="dz-help">L'IA extrait les échéances (heures, mois) et crée le plan d'entretien. Tu valides avant activation.</span>
    </div>`;
}

function attachDropzone(el, onFile) {
  if (!el) return;
  el.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf';
    input.addEventListener('change', () => { if (input.files && input.files[0]) onFile(input.files[0]); });
    input.click();
  });
  ['dragenter', 'dragover'].forEach(ev => el.addEventListener(ev, (e) => { e.preventDefault(); el.classList.add('is-over'); }));
  ['dragleave', 'drop'].forEach(ev => el.addEventListener(ev, (e) => { e.preventDefault(); el.classList.remove('is-over'); }));
  el.addEventListener('drop', (e) => {
    const f = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
    if (f) onFile(f);
  });
}

// ── Vue : Parc (machines) ─────────────────────────────────────
// Recherche, filtre par état, tri et affichage progressif : indispensable dès
// qu'un parc dépasse quelques dizaines de machines.
const FLEET_PAGE_SIZE = 30;

function fleetFilters() {
  if (!UI.filters) UI.filters = { q: '', status: 'all', sort: 'urgence', limit: FLEET_PAGE_SIZE };
  return UI.filters;
}

function fleetMatches() {
  const f = fleetFilters();
  const q = (f.q || '').trim().toLowerCase();
  return UI.machines.filter(m => {
    const state = dueInfo(m.plan, m).state;
    if (f.status === 'late' && state !== 'late') return false;
    if (f.status === 'soon' && state !== 'soon') return false;
    if (f.status === 'ok' && (state === 'late' || state === 'soon')) return false;
    if (!q) return true;
    const hay = [m.name, m.brand_model, m.serial_number, m.category?.name]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function fleetSorted(list) {
  const f = fleetFilters();
  const rankOf = (m) => {
    const s = dueInfo(m.plan, m).state;
    return s === 'late' ? 0 : (s === 'soon' ? 1 : 2);
  };
  const byName = (a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'fr');
  const copy = list.slice();
  if (f.sort === 'nom') return copy.sort(byName);
  if (f.sort === 'compteur') {
    return copy.sort((a, b) => {
      const va = machineCounter(a);
      const vb = machineCounter(b);
      if (va == null && vb == null) return byName(a, b);
      if (va == null) return 1;
      if (vb == null) return -1;
      return vb - va;
    });
  }
  return copy.sort((a, b) => {
    const ra = rankOf(a);
    const rb = rankOf(b);
    if (ra !== rb) return ra - rb;
    if (ra === 0) return dueInfo(a.plan, a).sortKey - dueInfo(b.plan, b).sortKey;
    if (ra === 1) return dueInfo(a.plan, a).urgency - dueInfo(b.plan, b).urgency;
    return byName(a, b);
  });
}

function chipHtml(status, label, count) {
  const active = fleetFilters().status === status;
  return `<button type="button" class="chip${active ? ' is-active' : ''}" data-status="${status}" aria-pressed="${active ? 'true' : 'false'}">${esc(label)}<span class="chip-count">${count}</span></button>`;
}

function fleetListHtml() {
  const matches = fleetSorted(fleetMatches());
  if (!matches.length) {
    return `<div class="empty">Aucune machine ne correspond à cette recherche.
      <div style="margin-top:12px;"><button type="button" class="link-inline" id="fleet-reset">Réinitialiser les filtres</button></div>
    </div>`;
  }
  const limit = fleetFilters().limit;
  const shown = matches.slice(0, limit);
  const rest = matches.length - shown.length;
  const total = UI.machines.length;
  const filtered = matches.length !== total;
  return `
    <div class="fleet-count">${matches.length} machine${matches.length > 1 ? 's' : ''}${filtered ? ` sur ${total}` : ''}</div>
    ${shown.map(machineCardHtml).join('')}
    ${rest > 0 ? `<button type="button" class="btn-tint" id="fleet-more" style="align-self:center;">Afficher ${Math.min(rest, FLEET_PAGE_SIZE)} machine(s) de plus</button>` : ''}`;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = () => reject(new Error('lecture du fichier impossible'));
    reader.readAsDataURL(file);
  });
}

function openManualUploadModal(presetMachine, presetFile) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  let machine = presetMachine || (UI.machines.length === 1 ? UI.machines[0] : null);
  let file = presetFile || null;
  let analysis = null;

  const close = () => overlay.remove();
  const shell = (inner) => { overlay.innerHTML = `<div class="modal">${inner}</div>`; };

  function stepPick() {
    if (!UI.machines.length) {
      shell(`
        <h2>Déposer un manuel</h2>
        <p class="sub">Ajoute d'abord une machine : le carnet d'entretien vient compléter sa fiche.</p>
        <div class="modal-actions">
          <button type="button" class="secondary" id="mu-close">Fermer</button>
          <button type="button" class="primary" id="mu-add">Ajouter une machine</button>
        </div>`);
      overlay.querySelector('#mu-close').addEventListener('click', close);
      overlay.querySelector('#mu-add').addEventListener('click', () => { close(); handleAddMachine(); });
      return;
    }
    shell(`
      <h2>Déposer un manuel PDF</h2>
      <p class="sub">L'IA lit le manuel, en extrait les échéances et propose le plan d'entretien. Tu valides avant activation.</p>
      <label for="mu-machine">Machine concernée</label>
      <select id="mu-machine">
        ${UI.machines.map(m => `<option value="${esc(m.id)}"${machine && m.id === machine.id ? ' selected' : ''}>${esc(m.name)}</option>`).join('')}
      </select>
      ${dropzoneHtml('mu-drop')}
      <div class="hint" id="mu-status">${file ? `Fichier sélectionné : ${esc(file.name)}` : ''}</div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="mu-cancel">Annuler</button>
        <button type="button" class="primary" id="mu-start">Analyser le PDF</button>
      </div>`);
    const statusEl = overlay.querySelector('#mu-status');
    attachDropzone(overlay.querySelector('#mu-drop'), (f) => {
      file = f;
      statusEl.textContent = `Fichier sélectionné : ${f.name}`;
    });
    overlay.querySelector('#mu-machine').addEventListener('change', (e) => {
      machine = UI.machines.find(m => m.id === e.target.value) || null;
    });
    overlay.querySelector('#mu-cancel').addEventListener('click', close);
    overlay.querySelector('#mu-start').addEventListener('click', () => {
      if (!file) { statusEl.textContent = 'Choisis d\'abord un fichier PDF (glisser-déposer ou clic sur la zone).'; return; }
      if (!machine) { statusEl.textContent = 'Choisis la machine concernée.'; return; }
      run();
    });
  }

  async function run() {
    shell(`
      <h2>Analyse en cours…</h2>
      <p class="sub">${esc(file.name)} · ${esc(machine.name)}</p>
      <div class="hint" id="mu-progress">Téléversement du carnet…</div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="mu-cancel">Fermer</button>
      </div>`);
    overlay.querySelector('#mu-cancel').addEventListener('click', close);
    const progress = () => overlay.querySelector('#mu-progress');

    try {
      if (file.size > 15 * 1024 * 1024) throw new Error('Le PDF dépasse 15 Mo, réduis sa taille avant de réessayer.');

      const path = `${UI.companyId}/${machine.id}.pdf`;
      const { error: upErr } = await sb.storage.from('manuals').upload(path, file, { upsert: true, contentType: 'application/pdf' });
      if (upErr) throw upErr;
      const { error: linkErr } = await sb.from('machines').update({ manual_url: path }).eq('id', machine.id);
      if (linkErr) throw linkErr;

      if (file.size > 8 * 1024 * 1024) {
        stepReview(null);
        return;
      }

      if (progress()) progress().textContent = "Lecture du carnet par l'IA… (jusqu'à 20 secondes, ne ferme pas cette fenêtre)";
      const base64 = await fileToBase64(file);
      const mode = planIsCounter(machine.plan) ? (counterUnitOf(machine) === 'km' ? 'km' : 'hours') : 'days';
      const { data, error } = await sb.functions.invoke('extract-maintenance-plan', {
        body: {
          fileBase64: base64,
          trackingMode: aiModeFrom(mode),
          currentHours: machineCounter(machine) ?? null,
          serviceDate: machine.service_date ?? null,
        },
      });
      if (error) throw new Error(await functionErrorMessage(error, 'analyse IA impossible'));
      if (data?.error) throw new Error(data.error);
      analysis = data;
      stepReview(analysis);
    } catch (err) {
      shell(`
        <h2>Analyse interrompue</h2>
        <p class="sub">${esc(err.message)}</p>
        <div class="hint">Le carnet n'a peut-être pas été enregistré. Tu peux réessayer, ou renseigner le plan à la main depuis la fiche de la machine.</div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="mu-close">Fermer</button>
          <button type="button" class="primary" id="mu-retry">Réessayer</button>
        </div>`);
      overlay.querySelector('#mu-close').addEventListener('click', close);
      overlay.querySelector('#mu-retry').addEventListener('click', () => { analysis = null; stepPick(); });
    }
  }

  function stepReview(result) {
    const mode = planIsCounter(machine.plan) ? (counterUnitOf(machine) === 'km' ? 'km' : 'hours') : 'days';
    const items = normalizeItems(result?.items);
    const unit = counterUnitFromMode(mode);
    const suggested = mode === 'days'
      ? (result?.interval_days || machine.plan?.interval_days || FALLBACK_INTERVAL_DAYS)
      : (result?.interval_hours || planIntervalCounter(machine.plan) || FALLBACK_INTERVAL_HOURS);

    shell(`
      <h2>${result ? 'Plan proposé par l\'IA' : 'Carnet attaché'}</h2>
      <p class="sub">${esc(machine.name)} · ${esc(file.name)}</p>
      ${result ? `
        <label for="mu-interval">Échéance ${mode === 'days' ? 'toutes les (jours)' : `tous les (${COUNTER_UNITS[unit].word})`}</label>
        <input id="mu-interval" type="number" min="1" value="${esc(suggested)}">
        ${items.length ? `
          <label>Échéances détectées dans le manuel</label>
          <table class="ref-table">
            <thead><tr><th>Élément</th><th>Fréquence</th></tr></thead>
            <tbody>${items.map(it => `<tr><td class="item-label">${esc(it.label || '—')}</td><td>${esc(it.frequency || '—')}</td></tr>`).join('')}</tbody>
          </table>` : ''}
        <label for="mu-tasks">Tâches de maintenance</label>
        <textarea id="mu-tasks">${esc(result.tasks || machine.plan?.tasks || '')}</textarea>
        <div class="hint">Confiance : ${esc(result.confidence || '—')}${result.notes ? ' — ' + esc(result.notes) : ''}</div>
      ` : `
        <div class="hint">Le PDF est attaché à la fiche. L'analyse automatique n'a pas été lancée (fichier volumineux ou IA indisponible) : le plan reste à renseigner à la main.</div>
      `}
      <div class="hint" id="mu-error"></div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="mu-cancel">Annuler</button>
        <button type="button" class="primary" id="mu-activate">${result ? 'Activer le plan' : 'Terminer'}</button>
      </div>`);

    overlay.querySelector('#mu-cancel').addEventListener('click', close);
    overlay.querySelector('#mu-activate').addEventListener('click', async () => {
      const btn = overlay.querySelector('#mu-activate');
      const errEl = overlay.querySelector('#mu-error');
      btn.disabled = true;
      btn.textContent = 'Enregistrement…';
      try {
        if (!result) { close(); boot('Carnet attaché'); return; }
        const interval = parseInt(overlay.querySelector('#mu-interval').value, 10) || suggested;
        const tasks = overlay.querySelector('#mu-tasks').value.trim();
        const payload = {
          tracking_mode: mode,
          tasks: tasks || null,
          items: items.length ? items : (machine.plan?.items ?? null),
          notes: result.notes || machine.plan?.notes || null,
          interval_days: mode === 'days' ? interval : (machine.plan?.interval_days || FALLBACK_INTERVAL_DAYS),
          reminder_days_before: machine.plan?.reminder_days_before ?? FALLBACK_REMINDER_DAYS,
        };
        if (mode === 'days') {
          payload.next_due_at = addDaysIso(machine.service_date || todayIso(), payload.interval_days);
        } else {
          Object.assign(payload,
            planCounterPatch(interval, machine.plan ? planReminderCounter(machine.plan) : FALLBACK_REMINDER_HOURS),
            planNextDueCounterPatch((machineCounter(machine) || 0) + interval));
        }

        if (machine.plan?.id) {
          const { error } = await sb.from('maintenance_plans').update(payload).eq('id', machine.plan.id);
          if (error) throw error;
        } else {
          const { error } = await sb.from('maintenance_plans').insert({ ...payload, machine_id: machine.id });
          if (error) throw error;
        }
        close();
        boot('Plan activé');
      } catch (err) {
        errEl.textContent = 'Erreur : ' + err.message;
        btn.disabled = false;
        btn.textContent = result ? 'Activer le plan' : 'Terminer';
      }
    });
  }

  if (machine && file) run();
  else stepPick();
}

async function analyzeManualAndFill(overlay, fileOrBlob, mode = 'days', context = {}) {
  const analysisEl = overlay.querySelector('#f-analysis');
  const fileInput = overlay.querySelector('#f-manual');
  const submitBtn = overlay.querySelector('button[type=submit]');

  if (fileOrBlob.size > 8 * 1024 * 1024) {
    analysisEl.textContent = "Fichier volumineux (>8 Mo) : pas d'analyse automatique, mais le PDF reste attaché.";
    return;
  }

  if (fileInput) fileInput.disabled = true;
  if (submitBtn) submitBtn.disabled = true;
  analysisEl.style.color = 'var(--ok)';
  analysisEl.style.fontWeight = '600';
  analysisEl.textContent = "🤖 Lecture du carnet d'entretien par l'IA… (jusqu'à 15-20 secondes, ne ferme pas cette fenêtre)";

  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(fileOrBlob);
    });

    const { data, error } = await sb.functions.invoke('extract-maintenance-plan', {
      body: { fileBase64: base64, trackingMode: mode, currentHours: context.currentHours ?? null, serviceDate: context.serviceDate ?? null },
    });
    if (error) throw new Error(error.message || 'appel IA impossible');
    if (data?.error) throw new Error(data.error);

    overlay._aiIntervalDays = data.interval_days || null;
    overlay._aiIntervalHours = data.interval_hours || null;
    overlay._aiTrackingSuggestion = data.tracking_mode_suggestion === 'hours' ? 'hours' : 'days';

    const intervalField = overlay.querySelector('#f-interval');
    if (intervalField) {
      if (mode === 'hours' && data.interval_hours) intervalField.value = data.interval_hours;
      else if (mode !== 'hours' && data.interval_days) intervalField.value = data.interval_days;
    }
    if (data.tasks) overlay.querySelector('#f-tasks').value = data.tasks;
    overlay._aiItems = Array.isArray(data.items) && data.items.length ? data.items : null;
    overlay._aiNotes = data.notes || '';
    const detailMsg = overlay._aiItems ? ` ${overlay._aiItems.length} élément(s) détaillé(s) extrait(s), consultables via « Voir le plan » une fois enregistré.` : '';
    const mismatchMsg = overlay._aiTrackingSuggestion !== mode
      ? ` ℹ️ D'après le manuel, un suivi ${overlay._aiTrackingSuggestion === 'hours' ? 'horaire' : 'calendaire'} conviendrait peut-être mieux — reviens en arrière pour changer si tu veux.`
      : '';
    analysisEl.textContent = `✅ Suggestion IA appliquée (confiance ${data.confidence || '—'})${data.notes ? ' — ' + data.notes : ''}.${detailMsg}${mismatchMsg} Vérifie les champs ci-dessus avant d'enregistrer.`;
  } catch (err) {
    analysisEl.style.color = 'var(--alert)';
    analysisEl.textContent = "Analyse IA indisponible (" + err.message + ") — renseigne le plan manuellement.";
  } finally {
    if (fileInput) fileInput.disabled = false;
    if (submitBtn) submitBtn.disabled = false;
  }
}
