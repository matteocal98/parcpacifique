    });
    overlay.querySelector('#mu-cancel').addEventListener('click', close);
    overlay.querySelector('#mu-start').addEventListener('click', () => {
      if (!file) { statusEl.textContent = 'Choisis d\'abord un fichier PDF (glisser-déposer ou clic sur la zone).'; return; }
      if (!machine) { statusEl.textContent = 'Choisis la machine concernée.'; return; }
      run();
    });
  }

  async function run() {
    shell(`
      <h2>${t('Analyse en cours…')}</h2>
      <p class="sub">${esc(file.name)} · ${esc(machine.name)}</p>
      <div class="hint" id="mu-progress">${t('Téléversement du carnet…')}</div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="mu-cancel">${t('Fermer')}</button>
      </div>`);
    overlay.querySelector('#mu-cancel').addEventListener('click', close);
    const progress = () => overlay.querySelector('#mu-progress');

    try {
      if (file.size > 15 * 1024 * 1024) throw new Error(t('Le PDF dépasse 15 Mo, réduis sa taille avant de réessayer.'));

      const path = `${UI.companyId}/${machine.id}.pdf`;
      const { error: upErr } = await sb.storage.from('manuals').upload(path, file, { upsert: true, contentType: 'application/pdf' });
      if (upErr) throw upErr;
      const { error: linkErr } = await sb.from('machines').update({ manual_url: path }).eq('id', machine.id);
      if (linkErr) throw linkErr;

      if (file.size > 8 * 1024 * 1024) {
        stepReview(null);
        return;
      }

      if (progress()) progress().textContent = "Lecture du carnet par l'IA… (jusqu'à 20 secondes, ne ferme pas cette fenêtre)";
      const base64 = await fileToBase64(file);
      const mode = planIsCounter(machine.plan) ? (counterUnitOf(machine) === 'km' ? 'km' : 'hours') : 'days';
      const { data, error } = await sb.functions.invoke('extract-maintenance-plan', {
        body: {
          fileBase64: base64,
          trackingMode: aiModeFrom(mode),
          currentHours: machineCounter(machine) ?? null,
          serviceDate: machine.service_date ?? null,
        },
      });
      if (error) throw new Error(await functionErrorMessage(error, 'analyse IA impossible'));
      if (data?.error) throw new Error(data.error);
      analysis = data;
      stepReview(analysis);
    } catch (err) {
      shell(`
        <h2>${t('Analyse interrompue')}</h2>
        <p class="sub">${esc(err.message)}</p>
        <div class="hint">Le carnet n'a peut-être pas été enregistré. Tu peux réessayer, ou renseigner le plan à la main depuis la fiche de la machine.</div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="mu-close">${t('Fermer')}</button>
          <button type="button" class="primary" id="mu-retry">${t('Réessayer')}</button>
        </div>`);
      overlay.querySelector('#mu-close').addEventListener('click', close);
      overlay.querySelector('#mu-retry').addEventListener('click', () => { analysis = null; stepPick(); });
    }
  }

  function stepReview(result) {
    const mode = planIsCounter(machine.plan) ? (counterUnitOf(machine) === 'km' ? 'km' : 'hours') : 'days';
    const items = normalizeItems(result?.items);
    const unit = counterUnitFromMode(mode);
    const suggested = mode === 'days'
      ? (result?.interval_days || machine.plan?.interval_days || FALLBACK_INTERVAL_DAYS)
      : (result?.interval_hours || planIntervalCounter(machine.plan) || FALLBACK_INTERVAL_HOURS);

    shell(`
      <h2>${result ? 'Plan proposé par l\'IA' : 'Carnet attaché'}</h2>
      <p class="sub">${esc(machine.name)} · ${esc(file.name)}</p>
      ${result ? `
        <label for="mu-interval">Échéance ${mode === 'days' ? 'toutes les (jours)' : `tous les (${COUNTER_UNITS[unit].word})`}</label>
        <input id="mu-interval" type="number" min="1" value="${esc(suggested)}">
        ${items.length ? `
          <label>${t('Échéances détectées dans le manuel')}</label>
          <table class="ref-table">
            <thead><tr><th>${t('Élément')}</th><th>${t('Fréquence')}</th></tr></thead>
            <tbody>${items.map(it => `<tr><td class="item-label">${esc(it.label || '—')}</td><td>${esc(it.frequency || '—')}</td></tr>`).join('')}</tbody>
          </table>` : ''}
        <label for="mu-tasks">Tâches de maintenance</label>
        <textarea id="mu-tasks">${esc(result.tasks || machine.plan?.tasks || '')}</textarea>
        <div class="hint">Confiance : ${esc(result.confidence || '—')}${result.notes ? ' — ' + esc(result.notes) : ''}</div>
      ` : `
        <div class="hint">Le PDF est attaché à la fiche. L'analyse automatique n'a pas été lancée (fichier volumineux ou IA indisponible) : le plan reste à renseigner à la main.</div>
      `}
      <div class="hint" id="mu-error"></div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="mu-cancel">${t('Annuler')}</button>
        <button type="button" class="primary" id="mu-activate">${result ? 'Activer le plan' : 'Terminer'}</button>
      </div>`);

    overlay.querySelector('#mu-cancel').addEventListener('click', close);
    overlay.querySelector('#mu-activate').addEventListener('click', async () => {
      const btn = overlay.querySelector('#mu-activate');
      const errEl = overlay.querySelector('#mu-error');
      btn.disabled = true;
      btn.textContent = 'Enregistrement…';
      try {
        if (!result) { close(); boot('Carnet attaché'); return; }
        const interval = parseInt(overlay.querySelector('#mu-interval').value, 10) || suggested;
        const tasks = overlay.querySelector('#mu-tasks').value.trim();
        const payload = {
          tracking_mode: mode,
          tasks: tasks || null,
          items: items.length ? items : (machine.plan?.items ?? null),
          notes: result.notes || machine.plan?.notes || null,
          interval_days: mode === 'days' ? interval : (machine.plan?.interval_days || FALLBACK_INTERVAL_DAYS),
          reminder_days_before: machine.plan?.reminder_days_before ?? FALLBACK_REMINDER_DAYS,
        };
        if (mode === 'days') {
          payload.next_due_at = addDaysIso(machine.service_date || todayIso(), payload.interval_days);
        } else {
          Object.assign(payload,
            planCounterPatch(interval, machine.plan ? planReminderCounter(machine.plan) : FALLBACK_REMINDER_HOURS),
            planNextDueCounterPatch((machineCounter(machine) || 0) + interval));
        }

        if (machine.plan?.id) {
          const { error } = await sb.from('maintenance_plans').update(payload).eq('id', machine.plan.id);
          if (error) throw error;
        } else {
          const { error } = await sb.from('maintenance_plans').insert({ ...payload, machine_id: machine.id });
          if (error) throw error;
        }
        close();
        boot('Plan activé');
      } catch (err) {
        errEl.textContent = 'Erreur : ' + err.message;
        btn.disabled = false;
        btn.textContent = result ? 'Activer le plan' : 'Terminer';
      }
    });
  }

  if (machine && file) run();
  else stepPick();
}

async function viewManual(path, btn) {
  const original = btn.textContent;
  btn.textContent = 'Ouverture…';
  const { data, error } = await sb.storage.from('manuals').createSignedUrl(path, 300);
  if (error) { btn.textContent = "Erreur d'ouverture"; return; }
  window.open(data.signedUrl, '_blank');
  btn.textContent = original;
}

async function analyzeManualAndFill(overlay, fileOrBlob, mode = 'days', context = {}) {
  const analysisEl = overlay.querySelector('#f-analysis');
  const fileInput = overlay.querySelector('#f-manual');
  const submitBtn = overlay.querySelector('button[type=submit]');

  if (fileOrBlob.size > 8 * 1024 * 1024) {
    analysisEl.textContent = "Fichier volumineux (>8 Mo) : pas d'analyse automatique, mais le PDF reste attaché.";
    return;
  }

  if (fileInput) fileInput.disabled = true;
  if (submitBtn) submitBtn.disabled = true;
  analysisEl.style.color = 'var(--ok)';
  analysisEl.style.fontWeight = '600';
  analysisEl.textContent = "🤖 Lecture du carnet d'entretien par l'IA… (jusqu'à 15-20 secondes, ne ferme pas cette fenêtre)";

  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(fileOrBlob);
    });

    const { data, error } = await sb.functions.invoke('extract-maintenance-plan', {
      body: { fileBase64: base64, trackingMode: mode, currentHours: context.currentHours ?? null, serviceDate: context.serviceDate ?? null },
    });
    if (error) throw new Error(error.message || 'appel IA impossible');
    if (data?.error) throw new Error(data.error);

    overlay._aiIntervalDays = data.interval_days || null;
    overlay._aiIntervalHours = data.interval_hours || null;
    overlay._aiTrackingSuggestion = data.tracking_mode_suggestion === 'hours' ? 'hours' : 'days';

    const intervalField = overlay.querySelector('#f-interval');
    if (intervalField) {
      if (mode === 'hours' && data.interval_hours) intervalField.value = data.interval_hours;
      else if (mode !== 'hours' && data.interval_days) intervalField.value = data.interval_days;
    }
    if (data.tasks) overlay.querySelector('#f-tasks').value = data.tasks;
    overlay._aiItems = Array.isArray(data.items) && data.items.length ? data.items : null;
    overlay._aiNotes = data.notes || '';
    const detailMsg = overlay._aiItems ? ` ${overlay._aiItems.length} élément(s) détaillé(s) extrait(s), consultables via « Voir le plan » une fois enregistré.` : '';
    const mismatchMsg = overlay._aiTrackingSuggestion !== mode
      ? ` ℹ️ D'après le manuel, un suivi ${overlay._aiTrackingSuggestion === 'hours' ? 'horaire' : 'calendaire'} conviendrait peut-être mieux — reviens en arrière pour changer si tu veux.`
      : '';
    analysisEl.textContent = `✅ Suggestion IA appliquée (confiance ${data.confidence || '—'})${data.notes ? ' — ' + data.notes : ''}.${detailMsg}${mismatchMsg} Vérifie les champs ci-dessus avant d'enregistrer.`;
  } catch (err) {
    analysisEl.style.color = 'var(--alert)';
    analysisEl.textContent = "Analyse IA indisponible (" + err.message + ") — renseigne le plan manuellement.";
  } finally {
    if (fileInput) fileInput.disabled = false;
    if (submitBtn) submitBtn.disabled = false;
  }
}

    overlay.querySelector('#checklist-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const checked = Array.from(overlay.querySelectorAll('.checklist input:checked')).map(c => c.value);
      const other = overlay.querySelector('#f-other-task').value.trim();
      if (other) checked.push(other);
      state.tasks = checked.join(', ');
      state.pendingFile = null;
      const intervalValue = parseInt(overlay.querySelector('#f-interval').value, 10);
      const reminderValue = parseInt(overlay.querySelector('#f-reminder').value, 10);
      const freqLabel = isCounter
        ? `Tous les ${intervalValue} ${COUNTER_UNITS[counterUnitFromMode(state.trackingMode)].short}`
        : `Tous les ${intervalValue} jours`;
      if (isCounter) {
        state.intervalHours = intervalValue;
        state.reminderHoursBefore = reminderValue;
      } else {
        state.intervalDays = intervalValue;
        state.reminderDays = reminderValue;
      }
      state.items = checked.length
        ? checked.map(label => ({ label, frequency: freqLabel, spec: '', qty: '', note: '' }))
        : null;
      saveMachine(e.target.querySelector('button[type=submit]'), overlay.querySelector('#f-error'));
    });
  }

  async function saveMachine(submitBtn, errorEl) {
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Enregistrement…'; }
    try {
      let categoryId;
      const existingCat = categories.find(c => c.name.toLowerCase() === state.category.toLowerCase());
      if (existingCat) {
        categoryId = existingCat.id;
      } else {
        const { data: newCat, error: catErr } = await sb
          .from('machine_categories')
          .insert({ company_id: companyId, name: state.category, default_interval_days: state.intervalDays, default_tasks: state.tasks })
          .select('id, name')
          .single();
        if (catErr) throw catErr;
        categoryId = newCat.id;
        categories.push(newCat);
      }

      const { data: machine, error: machineErr } = await sb
        .from('machines')
        .insert({
          company_id: companyId, category_id: categoryId, name: state.name,
          ...identifiantPatch(state.kind, state.serial),
          ...kindPatch(state.kind),
          service_date: state.serviceDate, status: 'en_service',
          ...brandModelPatch(state.brand, state.model),
          ...machineCounterPatch(
            state.trackingMode !== 'days' ? state.currentHours : null,
            { counter_unit: counterUnitFromMode(state.trackingMode) }
          ),
        })
        .select('id')
        .single();
      if (machineErr) throw machineErr;

      try {
        if (state.pendingPhotoBlob) {
          const url = await uploadMachinePhoto(companyId, machine.id, state.pendingPhotoBlob);
          await sb.from('machines').update({ image_url: url }).eq('id', machine.id);
        } else if (state.searchPhoto) {
          // Uniquement sur demande explicite : l'appel consomme un credit et
          // n'a d'interet que si le carnet PDF n'a pas fourni de photo.
          const query = `${designation(state.brand, state.model, state.name)} ${state.category}`.trim();
          const { data: imgData, error: imgErr } = await sb.functions.invoke('fetch-machine-image', { body: { query } });
          if (imgErr) console.warn('Recherche de photo :', await functionErrorMessage(imgErr));
          else if (imgData?.imageUrl) await sb.from('machines').update({ image_url: imgData.imageUrl }).eq('id', machine.id);
        }
      } catch (imgErr) { console.warn('Photo de la machine :', imgErr); }

      if (state.pendingFile) {
        if (state.pendingFile.size > 15 * 1024 * 1024) throw new Error(t('Le PDF dépasse 15 Mo, réduis sa taille avant de réessayer.'));
        const path = `${companyId}/${machine.id}.pdf`;
        const { error: uploadErr } = await sb.storage.from('manuals').upload(path, state.pendingFile, { upsert: true, contentType: 'application/pdf' });
        if (uploadErr) throw uploadErr;
        const { error: updateErr } = await sb.from('machines').update({ manual_url: path }).eq('id', machine.id);
        if (updateErr) throw updateErr;
      }

      const planPayload = {
        machine_id: machine.id,
        tracking_mode: state.trackingMode,
        tasks: state.tasks || null,
        items: state.items,
        notes: state.notes || null,
      };
      if (state.trackingMode !== 'days') {
        const intervalCounter = state.intervalHours || FALLBACK_INTERVAL_HOURS;
        const reminderCounter = state.reminderHoursBefore ?? FALLBACK_REMINDER_HOURS;
        Object.assign(planPayload,
          planCounterPatch(intervalCounter, reminderCounter),
          planNextDueCounterPatch((state.currentHours || 0) + intervalCounter));
        // On conserve aussi un intervalle calendaire cohérent : il servira si la
        // machine bascule plus tard en suivi calendaire.
        planPayload.interval_days = state.intervalDays || FALLBACK_INTERVAL_DAYS;
        planPayload.reminder_days_before = state.reminderDays ?? FALLBACK_REMINDER_DAYS;
      } else {
        planPayload.interval_days = state.intervalDays || FALLBACK_INTERVAL_DAYS;
        planPayload.reminder_days_before = state.reminderDays ?? FALLBACK_REMINDER_DAYS;
        planPayload.next_due_at = addDaysIso(state.serviceDate, planPayload.interval_days);
        planPayload.interval_hours = state.intervalHours || FALLBACK_INTERVAL_HOURS;
        planPayload.reminder_hours_before = state.reminderHoursBefore ?? FALLBACK_REMINDER_HOURS;
      }
      const { error: planErr } = await sb.from('maintenance_plans').insert(planPayload);
      if (planErr) throw planErr;

      overlay.remove();
      boot('Machine ajoutée');
    } catch (err) {
      if (isQuotaError(err)) {
        overlay.remove();
        openUpgradeNotice(companyId);
        return;
      }
      if (errorEl) errorEl.textContent = "Erreur : " + err.message;
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Enregistrer'; }
    }
  }

  stepIdentification();
}

function openLogInterventionModal(machine) {
  const today = todayIso();
  const isCounter = planIsCounter(machine.plan);
  const unit = counterUnitOf(machine);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  const planItems = normalizeItems(machine.plan?.items);
  const items = planItems.length
    ? planItems.map(it => it.label).filter(Boolean)
    : (machine.plan?.tasks || '').split(',').map(t => t.trim()).filter(Boolean);

  overlay.innerHTML = `
    <div class="modal">
      <h2>${t('Enregistrer un entretien')}</h2>
      <p class="sub">${esc(machine.name)} — coche ce qui a été fait, ça met à jour la prochaine échéance.</p>
      <form id="log-form">
        <label for="log-date">Date de l'entretien</label>
        <input id="log-date" type="date" value="${today}" required>

        ${isCounter ? `
          <label for="log-hours">Compteur au moment de l'entretien (${COUNTER_UNITS[unit].word})</label>
          <input id="log-hours" type="number" min="0" step="${COUNTER_UNITS[unit].step}" value="${esc(machineCounter(machine) ?? '')}" required>
        ` : ''}

        ${items.length ? `
          <label>Éléments traités</label>
          <div class="checklist">
            ${items.map(t => `<label><input type="checkbox" value="${esc(t)}"> ${esc(t)}</label>`).join('')}
          </div>
        ` : ''}

        <label for="log-notes">Remarques (optionnel)</label>
        <textarea id="log-notes" placeholder="Ex. Pièce X remplacée, RAS sinon"></textarea>
        <div class="hint" id="log-error"></div>

        <div class="modal-actions">
          <button type="button" class="secondary" id="cancel-log">${t('Annuler')}</button>
          <button type="submit" class="primary">${t('Enregistrer')}</button>
        </div>
      </form>
    </div>
  `;

  overlay.querySelector('#cancel-log').addEventListener('click', () => overlay.remove());

  overlay.querySelector('#log-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type=submit]');
    const errorEl = overlay.querySelector('#log-error');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enregistrement…';

    const performedAt = overlay.querySelector('#log-date').value;
    const hoursValue = isCounter ? parseFloat(overlay.querySelector('#log-hours').value) : null;
    const checkedItems = items.length
      ? Array.from(overlay.querySelectorAll('.checklist input:checked')).map(c => c.value)
      : [];
    const notes = overlay.querySelector('#log-notes').value.trim();

    try {
      const { error: logErr } = await sb.from('interventions').insert({
        machine_id: machine.id,
        plan_id: machine.plan?.id || null,
        performed_at: performedAt,
        hours_at_intervention: hoursValue,
        description: notes || null,
        items_done: checkedItems.length ? checkedItems : null,
      });
      if (logErr) throw logErr;

      if (isCounter && hoursValue != null) {
        const { error: machErr } = await sb.from('machines').update(machineCounterPatch(hoursValue, machine)).eq('id', machine.id);
        if (machErr) throw machErr;
      }

      if (machine.plan?.id) {
        const planUpdate = {};
        if (isCounter) {
          const interval = planIntervalCounter(machine.plan) || FALLBACK_INTERVAL_HOURS;
          Object.assign(planUpdate, planNextDueCounterPatch((hoursValue || 0) + interval));
        } else {
          planUpdate.next_due_at = addDaysIso(performedAt, machine.plan.interval_days || FALLBACK_INTERVAL_DAYS);
        }
        const { error: planErr } = await sb.from('maintenance_plans').update(planUpdate).eq('id', machine.plan.id);
        if (planErr) throw planErr;
      }

      overlay.remove();
      boot('Entretien enregistré');
    } catch (err) {
      errorEl.textContent = "Erreur : " + err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enregistrer';
    }
  });
}

// Récupère l'historique complet d'une machine : l'export CSV ne doit jamais
// être tronqué (PostgREST plafonne à 1000 lignes par requête).
async function fetchAllInterventions(machineId) {
  const pageSize = 1000;
  const all = [];
  for (let from = 0; ; from += pageSize) {
    const { data, error } = await sb.from('interventions')
      .select('id, performed_at, hours_at_intervention, description, items_done')
      .eq('machine_id', machineId)
      .order('performed_at', { ascending: false })
      .order('id', { ascending: false })
      .range(from, from + pageSize - 1);
    if (error) throw error;
    all.push(...(data || []));
    if (!data || data.length < pageSize) break;
  }
  return all;
}

  const buildHistoryCsv = () => {
    const header = ['Date', 'Compteur (h)', 'Elements traites', 'Remarques'];
    const escape = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = historyData.map(h => [
      h.performed_at,
      h.hours_at_intervention ?? '',
      Array.isArray(h.items_done) ? h.items_done.join('; ') : '',
      h.description ?? '',
    ]);
    return [header, ...rows].map(r => r.map(escape).join(',')).join('\r\n');
  };

  const csvToUtf16Buffer = (csvString) => {
    const buf = new ArrayBuffer(2 + csvString.length * 2);
    const view = new DataView(buf);
    view.setUint16(0, 0xFEFF, true);
    for (let i = 0; i < csvString.length; i++) {

    return buf;
  };

      try {

    const bodyLines = historyData.slice(0, 20).map(h => `${h.performed_at} — ${h.hours_at_intervention != null ? h.hours_at_intervention + 'h' : ''} — ${(h.items_done || []).join(', ')} — ${h.description || ''}`);
    const body = encodeURIComponent(`Historique des entretiens pour ${machine.name} :\n\n${bodyLines.join('\n')}\n\n(Le fichier CSV complet est disponible via « Exporter en CSV » si tu veux le joindre en pièce jointe.)`);
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
  });

  (async () => {
    const section = overlay.querySelector('#history-section');
    if (!section) return;
    const valueEl = section.querySelector('.value');
    try {
      // Historique COMPLET : l'export CSV ne doit jamais être tronqué.
      historyData = await fetchAllInterventions(machine.id);
    } catch (error) {
      if (valueEl) valueEl.textContent = "Erreur de chargement de l'historique : " + error.message;
      return;
    }
    if (!overlay.isConnected || !section.isConnected) return;
    if (!historyData.length) { if (valueEl) valueEl.textContent = "Aucun entretien enregistré pour l'instant."; return; }

    overlay.querySelector('#export-history-csv').disabled = false;
    overlay.querySelector('#share-history-email').disabled = false;
    if (valueEl) valueEl.remove();

    const shown = historyData.slice(0, HISTORY_ROWS_IN_MODAL);
    const hidden = historyData.length - shown.length;
    section.insertAdjacentHTML('beforeend', `
      <table class="ref-table">
        <thead><tr><th>${t('Date')}</th>${isCounterMode ? '<th>Compteur</th>' : ''}<th>${t('Éléments traités')}</th><th>${t('Remarques')}</th></tr></thead>
        <tbody>
          ${shown.map(h => `
            <tr>
              <td class="item-label">${esc(h.performed_at)}</td>
              ${isCounterMode ? `<td>${h.hours_at_intervention != null ? esc(h.hours_at_intervention) + ' ' + counterShort(unit) : '<span class="muted">—</span>'}</td>` : ''}
              <td>${Array.isArray(h.items_done) && h.items_done.length ? esc(h.items_done.join(', ')) : '<span class="muted">—</span>'}</td>
              <td>${h.description ? esc(h.description) : '<span class="muted">—</span>'}</td>
            </tr>`).join('')}
        </tbody>
      </table>
      ${hidden > 0 ? `<div class="hint">${hidden} entretien(s) plus ancien(s) non affiché(s) ici — l'export CSV contient bien les ${historyData.length} entretiens.</div>` : ''}
      <div class="hint">${historyData.length} entretien(s) enregistré(s).</div>`);
  })();
}

  // Valeurs de départ calculées une fois : le gabarit reste lisible et le mode
  // de suivi (jours / heures / km) pilote à la fois l'unité et l'intervalle.
  const editMode = isEdit ? (existing.plan?.tracking_mode || 'days') : 'days';
  const editUnit = isEdit ? counterUnitOf(existing) : 'hours';
  const editCounter = isEdit ? machineCounter(existing) : null;
  const editInterval = isEdit
    ? (planIsCounter(existing.plan)
        ? (planIntervalCounter(existing.plan) || FALLBACK_INTERVAL_HOURS)
        : (existing.plan?.interval_days || FALLBACK_INTERVAL_DAYS))
    : FALLBACK_INTERVAL_DAYS;
  const editReminder = isEdit
    ? (planIsCounter(existing.plan)
        ? planReminderCounter(existing.plan)
        : (existing.plan?.reminder_days_before ?? FALLBACK_REMINDER_DAYS))
    : FALLBACK_REMINDER_DAYS;

  overlay.innerHTML = `
    <div class="modal">
      <h2>${isEdit ? `Modifier ${esc(existing.name)}` : 'Ajouter une machine'}</h2>
      <p class="sub">${isEdit ? 'Les modifications sont appliquées immédiatement.' : 'Elle apparaîtra immédiatement dans la liste, avec son plan de maintenance.'}</p>
      <form id="add-form">
        <label for="f-name">${t('Nom de la machine')}</label>
        <input id="f-name" required placeholder="Ex. Orec 4x4 - Atelier" value="${isEdit ? esc(existing.name) : ''}">

        <label for="f-category">${t('Catégorie')}</label>
        <input id="f-category" list="cat-list" required placeholder="Ex. Motoculture" value="${isEdit ? esc(existing.category?.name || '') : ''}">
        <datalist id="cat-list">
          ${categories.map(c => `<option value="${esc(c.name)}">`).join('')}
        </datalist>

        ${SCHEMA.hasKind ? `<label for="f-kind">${t('Type')}</label>
        <select id="f-kind">
          <option value="machine" ${(isEdit ? machineKind(existing) : TYPE_MACHINE) === TYPE_MACHINE ? 'selected' : ''}>Machine — engin, outil (suivi en heures)</option>
          <option value="vehicle" ${(isEdit ? machineKind(existing) : TYPE_MACHINE) === TYPE_VEHICULE ? 'selected' : ''}>Véhicule — camion, utilitaire (suivi en kilomètres)</option>
        </select>` : ''}

        <div class="field-row">
          <div>
            <label for="f-brand">${t('Marque')}</label>
            <input id="f-brand" class="majuscules" placeholder="Ex. KUBOTA" autocapitalize="characters" value="${isEdit ? esc(machineBrand(existing)) : ''}">
          </div>
          <div>
            <label for="f-model">${t('Modèle')}</label>
            <input id="f-model" class="majuscules" placeholder="Ex. U17-3" autocapitalize="characters" value="${isEdit ? esc(machineModel(existing)) : ''}">
          </div>
        </div>

        <label for="f-serial" id="f-identifiant-label">${IDENTIFIANT_LIBELLE[isEdit ? machineKind(existing) : TYPE_MACHINE]}</label>
        <input id="f-serial" placeholder="${IDENTIFIANT_PLACEHOLDER[isEdit ? machineKind(existing) : TYPE_MACHINE]}" value="${isEdit ? esc(machineIdentifiant(existing)) : ''}">

        <label for="f-service-date">${t('Date de mise en service')}</label>
        <input id="f-service-date" type="date" value="${isEdit ? esc(existing.service_date || today) : today}" required>

        <label>${t('Mode de suivi de la maintenance')}</label>
        <div class="track-mode-choice">
          <label><input type="radio" name="tm" value="days" ${editMode === 'days' ? 'checked' : ''}> Calendaire (jours)</label>
          <label><input type="radio" name="tm" value="hours" ${editMode === 'hours' ? 'checked' : ''}> Compteur horaire (heures)</label>
          ${SCHEMA.hasCounter ? `<label><input type="radio" name="tm" value="km" ${editMode === 'km' ? 'checked' : ''}> Kilométrage (km)</label>` : ''}
        </div>
        <div id="hours-field" style="display:${editMode === 'days' ? 'none' : 'block'};">
          <label for="f-current-hours" id="f-current-hours-label">${COUNTER_UNITS[editUnit].field}</label>
          <input id="f-current-hours" type="number" min="0" step="${COUNTER_UNITS[editUnit].step}" value="${isEdit ? esc(editCounter ?? '') : ''}" placeholder="${COUNTER_UNITS[editUnit].placeholder}">
        </div>

        <div class="field-row">
          <div>
            <label for="f-interval" id="f-interval-label">Échéance ${editMode === 'days' ? 'toutes les (jours)' : `tous les (${COUNTER_UNITS[editUnit].word})`}</label>
            <input id="f-interval" type="number" min="1" value="${isEdit ? esc(editInterval) : FALLBACK_INTERVAL_DAYS}" required>
          </div>
          <div>
            <label for="f-reminder" id="f-reminder-label">Rappel avant (${editMode === 'days' ? 'jours' : COUNTER_UNITS[editUnit].word})</label>
            <input id="f-reminder" type="number" min="0" value="${isEdit ? esc(editReminder) : FALLBACK_REMINDER_DAYS}" required>
          </div>
        </div>

        <label for="f-tasks">${t('Tâches de maintenance')}</label>
        <textarea id="f-tasks" placeholder="Ex. Vidange, contrôle lame, graissage">${isEdit ? esc(existing.plan?.tasks || '') : ''}</textarea>

        <label>${t('Photo de la machine')}</label>
        <div id="photo-preview">
          ${isEdit && safeUrl(existing.image_url) ? `<img class="machine-photo" src="${esc(safeUrl(existing.image_url))}" alt="${esc(existing.name)}">` : ''}
        </div>
        <button type="button" class="view-manual" id="fetch-photo-btn">${isEdit && existing.image_url ? 'Chercher plutôt sur le web' : 'Chercher une photo sur le web'}</button>
        <div class="hint" id="photo-status"></div>

        <label for="f-manual">Carnet d'entretien (PDF${isEdit ? ' — laisser vide pour ne pas changer' : ', optionnel'})</label>
        ${isEdit && existing.manual_url ? `
          <button type="button" class="view-manual" id="modal-view-manual">Voir le carnet actuel (PDF)</button>
          <button type="button" class="view-manual" id="modal-analyze-manual">Analyser ce carnet avec l'IA</button>
        ` : ''}
        <input id="f-manual" type="file" accept="application/pdf">
        <div class="hint" id="f-analysis">Le PDF du fabricant reste attaché à la fiche, consultable par n'importe quel technicien. S'il est fourni, l'IA propose un intervalle et des tâches à partir de son contenu.</div>
        <div class="hint" id="f-error"></div>

        <div class="modal-actions">
          <button type="button" class="secondary" id="cancel-add">${t('Annuler')}</button>
          <button type="submit" class="primary" id="submit-add">${isEdit ? 'Enregistrer les modifications' : 'Enregistrer'}</button>
        </div>
        ${isEdit ? `<button type="button" class="delete-link" id="delete-machine">${t('Supprimer cette machine')}</button>` : ''}
      </form>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#cancel-add').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  forcerMajuscules(overlay.querySelector('#f-brand'));
  forcerMajuscules(overlay.querySelector('#f-model'));

  const champType = overlay.querySelector('#f-kind');
  if (champType) {
    const ancienType = champType.value;
    champType.addEventListener('change', () => {
      const kind = champType.value;
      overlay.querySelector('#f-identifiant-label').textContent = IDENTIFIANT_LIBELLE[kind];
      overlay.querySelector('#f-serial').placeholder = IDENTIFIANT_PLACEHOLDER[kind];
      if (SCHEMA.hasCounter) {
        const mode = kind === TYPE_VEHICULE ? 'km' : 'hours';
        const radio = overlay.querySelector(`input[name=tm][value=${mode}]`);
        if (radio) { radio.checked = true; radio.dispatchEvent(new Event('change')); }
      }
      const champIntervalle = overlay.querySelector('#f-interval');
      if (champIntervalle && Number(champIntervalle.value) === INTERVALLE_DEFAUT[ancienType]) {
        champIntervalle.value = INTERVALLE_DEFAUT[kind];
      }
    });
  }

  overlay.querySelectorAll('input[name=tm]').forEach(r => {
    r.addEventListener('change', () => {
      const mode = overlay.querySelector('input[name=tm]:checked').value;
      const u = COUNTER_UNITS[counterUnitFromMode(mode)];
      const word = mode === 'days' ? 'jours' : u.word;
      overlay.querySelector('#hours-field').style.display = mode === 'days' ? 'none' : 'block';
      overlay.querySelector('#f-interval-label').textContent = `Échéance ${mode === 'days' ? 'toutes les' : 'tous les'} (${word})`;
      overlay.querySelector('#f-reminder-label').textContent = `Rappel avant (${word})`;
      const counterLabelEl = overlay.querySelector('#f-current-hours-label');
      if (counterLabelEl) counterLabelEl.textContent = u.field;
      const counterInputEl = overlay.querySelector('#f-current-hours');
      if (counterInputEl) { counterInputEl.step = u.step; counterInputEl.placeholder = u.placeholder; }
    });
  });

  if (isEdit) {
    overlay.querySelector('#delete-machine').addEventListener('click', async (e) => {
      const ok = confirm(`Supprimer définitivement « ${existing.name} » ? Son historique de maintenance, son carnet d'entretien et sa photo seront aussi supprimés. Cette action est irréversible.`);
      if (!ok) return;
      const btn = e.target;
      btn.disabled = true;
      btn.textContent = 'Suppression…';
      try {
        // Nettoyage des fichiers attachés : le carnet PDF et la photo.
        // Un échec ici ne doit pas empêcher la suppression de la fiche.
        if (existing.manual_url) {
          const { error: manualRmErr } = await sb.storage.from('manuals').remove([existing.manual_url]);
          if (manualRmErr) console.warn('Suppression du carnet impossible :', manualRmErr.message);
        }
        const { error: photoRmErr } = await sb.storage.from('machine-photos').remove([`${companyId}/${existing.id}.jpg`]);
        if (photoRmErr) console.warn('Suppression de la photo impossible :', photoRmErr.message);

        const { error: delErr } = await sb.from('machines').delete().eq('id', existing.id);
        if (delErr) throw delErr;
        overlay.remove();
        boot('Machine supprimée');
      } catch (err) {
        overlay.querySelector('#f-error').textContent = "Erreur à la suppression : " + err.message;
        btn.disabled = false;
        btn.textContent = 'Supprimer cette machine';
      }
    });
  }

  if (isEdit && existing.manual_url) {
    overlay.querySelector('#modal-view-manual').addEventListener('click', (e) => viewManual(existing.manual_url, e.target));
    overlay.querySelector('#modal-analyze-manual').addEventListener('click', async (e) => {
      const btn = e.target;
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Téléchargement du carnet…';
      const { data: blob, error } = await sb.storage.from('manuals').download(existing.manual_url);
      if (error) {
        overlay.querySelector('#f-analysis').textContent = "Impossible de récupérer le PDF existant : " + error.message;
      } else {
        await analyzeManualAndFill(
          overlay, blob,
          aiModeFrom(overlay.querySelector('input[name=tm]:checked').value),
          {
            currentHours: parseFloat(overlay.querySelector('#f-current-hours')?.value) || machineCounter(existing) || null,
            serviceDate: overlay.querySelector('#f-service-date')?.value || existing.service_date || null,
          }
        );
        if (!existing.image_url && !overlay._pendingPhotoBlob) {
          try {
            const photoBlob = await renderPdfFirstPageAsBlob(blob);
            overlay._pendingPhotoBlob = photoBlob;
            const previewUrl = URL.createObjectURL(photoBlob);
            overlay.querySelector('#photo-preview').innerHTML = `<img class="machine-photo" src="${previewUrl}" alt="${esc(existing.name)}">`;
            overlay.querySelector('#photo-status').textContent = "Photo extraite de la 1ère page du carnet — elle sera enregistrée avec la fiche.";
          } catch (photoErr) {
            console.error('Extraction photo (1ère page du PDF) échouée :', photoErr);
            overlay.querySelector('#photo-status').textContent = "Extraction de la photo impossible (" + (photoErr?.message || photoErr) + ").";
          }
        }
      }
      btn.disabled = false;
      btn.textContent = original;
    });
  }

  overlay.querySelector('#fetch-photo-btn').addEventListener('click', async (e) => {
    const btn = e.target;
    const statusEl = overlay.querySelector('#photo-status');
    const name = overlay.querySelector('#f-name').value.trim();
    const brand = overlay.querySelector('#f-brand').value.trim();
    const model = overlay.querySelector('#f-model').value.trim();
    const category = overlay.querySelector('#f-category').value.trim();
    const query = `${designation(brand, model, name)} ${category}`.trim();
    btn.disabled = true;
    statusEl.textContent = 'Recherche en cours…';
    try {
      const { data, error } = await sb.functions.invoke('fetch-machine-image', { body: { query } });
      if (error) throw new Error(await functionErrorMessage(error, 'recherche de photo impossible'));
      if (data?.error) throw new Error(data.error);
      const foundUrl = safeUrl(data.imageUrl);
      if (!foundUrl) throw new Error(t('URL de photo invalide'));
      overlay.querySelector('#photo-preview').innerHTML = `<img class="machine-photo" src="${esc(foundUrl)}" alt="${esc(name)}">`;
      overlay._newImageUrl = foundUrl;
      overlay._pendingPhotoBlob = null;
      statusEl.textContent = 'Photo trouvée sur le web — elle sera enregistrée avec la fiche.';
      btn.textContent = 'Chercher une autre photo sur le web';
    } catch (err) {
      statusEl.textContent = "Aucune photo trouvée (" + err.message + ").";
    }
    btn.disabled = false;
  });

  overlay.querySelector('#f-manual').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      analyzeManualAndFill(
        overlay, file,
        aiModeFrom(overlay.querySelector('input[name=tm]:checked').value),
        {
          currentHours: parseFloat(overlay.querySelector('#f-current-hours')?.value) || machineCounter(existing) || null,
          serviceDate: overlay.querySelector('#f-service-date')?.value || existing.service_date || null,
        }
      );
      renderPdfFirstPageAsBlob(file).then(blob => {
        overlay._pendingPhotoBlob = blob;
        const previewUrl = URL.createObjectURL(blob);
        overlay.querySelector('#photo-preview').innerHTML = `<img class="machine-photo" src="${previewUrl}" alt="${esc(existing.name)}">`;
        overlay.querySelector('#photo-status').textContent = "Photo extraite de la 1ère page du carnet — elle sera enregistrée avec la fiche.";
        overlay.querySelector('#fetch-photo-btn').textContent = 'Chercher plutôt sur le web';
      }).catch(err => {
        console.error('Extraction photo (1ère page du PDF) échouée :', err);
        overlay.querySelector('#photo-status').textContent = "Extraction de la photo impossible (" + (err?.message || err) + "). Tu peux essayer « Chercher sur le web ».";
      });
    }
  });
  overlay.querySelector('#add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = overlay.querySelector('#f-error');
    const submitBtn = overlay.querySelector('#submit-add');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enregistrement…';

    const name = overlay.querySelector('#f-name').value.trim();
    const categoryName = overlay.querySelector('#f-category').value.trim();
    const brand = overlay.querySelector('#f-brand').value.trim();
    const model = overlay.querySelector('#f-model').value.trim();
    const serial = overlay.querySelector('#f-serial').value.trim();
    const kind = overlay.querySelector('#f-kind') ? overlay.querySelector('#f-kind').value : machineKind(existing);
    const serviceDate = overlay.querySelector('#f-service-date').value;
    const trackingMode = overlay.querySelector('input[name=tm]:checked').value;
    const isCounterMode = trackingMode !== 'days';
    const counterUnit = counterUnitFromMode(trackingMode);
    const currentHours = isCounterMode ? (parseFloat(overlay.querySelector('#f-current-hours').value) || 0) : null;
    const intervalValue = parseInt(overlay.querySelector('#f-interval').value, 10);
    const reminderValue = parseInt(overlay.querySelector('#f-reminder').value, 10);
    // Les deux unités sont toujours renseignées : une machine suivie au compteur
    // garde un intervalle calendaire de repli, et inversement.
    const intervalDays = isCounterMode
      ? (overlay._aiIntervalDays || existing?.plan?.interval_days || FALLBACK_INTERVAL_DAYS)
      : intervalValue;
    const reminderDays = isCounterMode
      ? (existing?.plan?.reminder_days_before ?? FALLBACK_REMINDER_DAYS)
      : reminderValue;
    const intervalCounter = isCounterMode
      ? intervalValue
      : (overlay._aiIntervalHours || planIntervalCounter(existing?.plan) || FALLBACK_INTERVAL_HOURS);
    const reminderCounter = isCounterMode
      ? reminderValue
      : (existing?.plan ? planReminderCounter(existing.plan) : FALLBACK_REMINDER_HOURS);
    const tasks = overlay.querySelector('#f-tasks').value.trim();

    try {
      let categoryId;
      const existingCat = categories.find(c => c.name.toLowerCase() === categoryName.toLowerCase());
      if (existingCat) {
        categoryId = existingCat.id;
      } else {
        const { data: newCat, error: catErr } = await sb
          .from('machine_categories')
          .insert({ company_id: companyId, name: categoryName, default_interval_days: intervalDays, default_tasks: tasks })
          .select('id, name')
          .single();
        if (catErr) throw catErr;
        categoryId = newCat.id;
        categories.push(newCat);
      }

      // openMachineModal n'est appelée que pour une machine existante :
      // la création passe par openAddWizard.
      let resolvedImageUrl = null;
      if (overlay._pendingPhotoBlob) {
        try { resolvedImageUrl = await uploadMachinePhoto(companyId, existing.id, overlay._pendingPhotoBlob); }
        catch (e) { }
      } else if (overlay._newImageUrl) {
        resolvedImageUrl = overlay._newImageUrl;
      }
      const updatePayload = {
        category_id: categoryId,
        name,
        ...identifiantPatch(kind, serial),
        ...kindPatch(kind),
        service_date: serviceDate,
      };
      Object.assign(updatePayload, brandModelPatch(brand, model));
      Object.assign(updatePayload, machineCounterPatch(currentHours, { counter_unit: counterUnit }));
      if (resolvedImageUrl) updatePayload.image_url = resolvedImageUrl;
      const { error: updErr } = await sb
        .from('machines')
        .update(updatePayload)
        .eq('id', existing.id);
      if (updErr) throw updErr;
      const machineId = existing.id;

      const fileInput = overlay.querySelector('#f-manual');
      const file = fileInput.files[0];
      if (file) {
        if (file.size > 15 * 1024 * 1024) throw new Error(t('Le PDF dépasse 15 Mo, réduis sa taille avant de réessayer.'));
        const path = `${companyId}/${machineId}.pdf`;
        const { error: uploadErr } = await sb.storage.from('manuals').upload(path, file, { upsert: true, contentType: 'application/pdf' });
        if (uploadErr) throw uploadErr;
        const { error: updateErr } = await sb.from('machines').update({ manual_url: path }).eq('id', machineId);
        if (updateErr) throw updateErr;
      }

      // Le plan peut ne pas exister encore pour cette machine : on le crée alors,
      // sinon les réglages saisis seraient perdus sans aucun message.
      if (existing.plan?.id) {
        const planUpdate = {
          tracking_mode: trackingMode,
          tasks: tasks || null,
          interval_days: intervalDays,
          reminder_days_before: reminderDays,
        };
        Object.assign(planUpdate, planCounterPatch(intervalCounter, reminderCounter));
        if (overlay._aiItems) { planUpdate.items = overlay._aiItems; planUpdate.notes = overlay._aiNotes || null; }

        const aiJustRefreshed = !!(overlay._aiItems || overlay._aiIntervalHours || overlay._aiIntervalDays);
        const modeChanged = existing.plan.tracking_mode !== trackingMode;

        // Recalcul de l'échéance. On repart d'aujourd'hui si le mode de suivi
        // change (ou si l'IA vient de fournir de nouvelles valeurs) ; sinon on
        // décale l'échéance du delta d'intervalle. Sans ça, modifier l'intervalle
        // ou la date de mise en service n'avait aucun effet sur la date affichée.
        if (modeChanged || aiJustRefreshed) {
          if (isCounterMode) {
            Object.assign(planUpdate, planNextDueCounterPatch((currentHours || 0) + intervalCounter));
          } else {
            planUpdate.next_due_at = addDaysIso(serviceDate, intervalDays);
          }
        } else if (isCounterMode) {
          const oldNext = planNextDueCounter(existing.plan);
          const oldInterval = planIntervalCounter(existing.plan);
          if (oldNext != null && oldInterval != null) {
            Object.assign(planUpdate, planNextDueCounterPatch(oldNext + (intervalCounter - oldInterval)));
          } else if (currentHours != null) {
            Object.assign(planUpdate, planNextDueCounterPatch(currentHours + intervalCounter));
          }
        } else if (existing.plan.next_due_at && existing.plan.interval_days != null) {
          planUpdate.next_due_at = addDaysIso(existing.plan.next_due_at, intervalDays - existing.plan.interval_days);
        } else {
          planUpdate.next_due_at = addDaysIso(serviceDate, intervalDays);
        }

        const { error: planErr } = await sb
          .from('maintenance_plans')
          .update(planUpdate)
          .eq('id', existing.plan.id);
        if (planErr) throw planErr;
      } else {
        const planPayload = {
          machine_id: machineId,
          tracking_mode: trackingMode,
          tasks: tasks || null,
          items: overlay._aiItems || null,
          notes: overlay._aiNotes || null,
          interval_days: intervalDays,
          reminder_days_before: reminderDays,
        };
        Object.assign(planPayload, planCounterPatch(intervalCounter, reminderCounter));
        if (isCounterMode) {
          Object.assign(planPayload, planNextDueCounterPatch((currentHours || 0) + intervalCounter));
        } else {
          planPayload.next_due_at = addDaysIso(serviceDate, intervalDays);
        }
        const { error: planErr } = await sb
          .from('maintenance_plans')
          .insert(planPayload);
        if (planErr) throw planErr;
      }

      overlay.remove();
      boot(isEdit ? 'Modifications enregistrées' : 'Machine ajoutée');
    } catch (err) {
      errorEl.textContent = "Erreur : " + err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = isEdit ? 'Enregistrer les modifications' : 'Enregistrer';
    }
  });
}

// Affiche les dernières données connues, avec le bandeau qui l'annonce.
// Le schéma est restauré lui aussi : sans cela, l'affichage retomberait sur les
// anciennes colonnes et le kilométrage, par exemple, disparaîtrait.
function afficherDepuisCache(cache) {
  if (cache.schema) Object.assign(SCHEMA, cache.schema);
  UI.companyId = cache.companyId;
  UI.companyName = cache.companyName;
  UI.companyPlan = cache.companyPlan;
  UI.company = cache.company || {};
  UI.contactName = cache.contactName || '';
  UI.email = cache.email || '';
  UI.categories = cache.categories || [];
  UI.machines = cache.machines || [];
  UI.reminders = loadReminders();
  UI.horsLigne = { depuis: cache.savedAt };
  renderApp();
}

async function boot(toastMessage) {
  // La copie locale est lue AVANT tout appel réseau : si le réseau manque, on
  // veut pouvoir l'afficher sans attendre l'expiration des délais.
  const cache = lireCache();
  UI.horsLigne = null;

  let session = null;
  try {
    ({ data: { session } } = await sb.auth.getSession());
  } catch (err) {
    session = null;
  }
  if (!session) {
    // Sans session utilisable, l'écran de connexion donnerait l'impression
    // d'avoir été déconnecté. Si l'on a des données, on les montre.
    if (cache) { afficherDepuisCache(cache); return; }
    renderLogin();
    return;
  }

  app.innerHTML = `<div class="loading">Chargement des machines…</div>`;

  // Colonnes prénom/nom du contact : présentes seulement après migration-compte.
  const { error: sondeContact } = await sb.from('companies').select('contact_first_name').limit(1);
  SCHEMA.hasContactNames = !sondeContact;

  // Chargement de la société, avec repli en cascade si des colonnes
  // optionnelles manquent sur une base plus ancienne.
  const colonnesBase = ['name', 'plan', 'contact_name'];
  const colonnesEtendues = [...colonnesBase, 'activity', 'registration_number', 'phone'];
  const colonnesContact = SCHEMA.hasContactNames ? ['contact_first_name', 'contact_last_name'] : [];
  const tentatives = [
    [...colonnesEtendues, ...colonnesContact],
    colonnesEtendues,
    colonnesBase,
    ['name', 'plan'],
  ];

  let profile = null;
  let profileErr = null;
  for (const colonnes of tentatives) {
    ({ data: profile, error: profileErr } = await sb
      .from('profiles')
      .select(`company_id, companies(${colonnes.join(', ')})`)
      .eq('id', session.user.id)
      .single());
    if (!profileErr) break;
  }

  if (profileErr || !profile) {
    // Un réseau absent ne doit pas ressembler à un compte mal rattaché.
    if (cache && estErreurReseau(profileErr)) { afficherDepuisCache(cache); return; }
    renderLogin(t('Compte connecté mais pas encore rattaché à une société. Vérifie la table profiles.'));
    return;
  }

  const company = Array.isArray(profile.companies) ? profile.companies[0] : profile.companies;

  // Capacités du schéma, détectées par deux requêtes minuscules (une ligne,
  // aucune donnée lue). Cela remplace l'ancienne cascade de repli, qui devenait
  // ingérable à mesure que des colonnes optionnelles s'ajoutaient.
  const [sondeCompteur, sondeMarque, sondeType] = await Promise.all([
    sb.from('machines').select('counter_unit').limit(1),
    sb.from('machines').select('brand, model').limit(1),
    sb.from('machines').select('kind, plate').limit(1),
  ]);
  SCHEMA.hasCounter = !sondeCompteur.error;
  SCHEMA.hasBrandModel = !sondeMarque.error;
  SCHEMA.hasKind = !sondeType.error;
  SCHEMA.hasPlate = !sondeType.error;

  const colonnesMachine = [
    'id', 'name', 'brand_model', 'serial_number', 'status', 'manual_url',
    'service_date', 'image_url',
    SCHEMA.hasCounter ? 'counter_unit' : 'current_hours',
    ...(SCHEMA.hasCounter ? ['counter_value'] : []),
    ...(SCHEMA.hasBrandModel ? ['brand', 'model'] : []),
    ...(SCHEMA.hasKind ? ['kind'] : []),
    ...(SCHEMA.hasPlate ? ['plate'] : []),
  ].join(', ');
  const colonnesPlan = [
    'id', 'interval_days', 'tasks', 'items', 'notes', 'reminder_days_before',
    'next_due_at', 'tracking_mode',
    ...(SCHEMA.hasCounter
      ? ['interval_counter', 'next_due_counter', 'reminder_counter_before']
      : ['interval_hours', 'next_due_hours', 'reminder_hours_before']),
  ].join(', ');

  const { data: machines, error: machinesErr } = await sb
    .from('machines')
    .select(`${colonnesMachine}, category:machine_categories(id, name), plan:maintenance_plans(${colonnesPlan})`)
    .eq('company_id', profile.company_id)
    .order('name');

  if (machinesErr) {
    // Le cas le plus fréquent de très loin : plus de réseau. On montre la
    // dernière liste connue plutôt qu'un message d'erreur.
    if (cache && estErreurReseau(machinesErr)) { afficherDepuisCache(cache); return; }
    app.innerHTML = `<div class="empty">Erreur de chargement : ${esc(machinesErr.message)}</div>`;
    return;
  }

  const { data: categories } = await sb
    .from('machine_categories')
    .select('id, name')
    .eq('company_id', profile.company_id);

  UI.companyId = profile.company_id;
  UI.companyName = company?.name || 'Ta société';
  UI.companyPlan = company?.plan || 'free';
  UI.company = {
    name: company?.name || '',
    activity: company?.activity || '',
    registrationNumber: company?.registration_number || '',
    // Conservé tel quel : la mise en forme se fait à l'affichage, ce qui permet
    // de lire aussi bien un ancien numéro libre qu'un E.164.
    phone: company?.phone || '',
    plan: company?.plan || 'free',
    contact_name: company?.contact_name || '',
    contact_first_name: company?.contact_first_name || null,
    contact_last_name: company?.contact_last_name || null,
  };
  UI.contactName = company?.contact_name || '';
  UI.contactFirstName = companyFirstName(UI.company);
  UI.email = session.user.email || '';
  UI.categories = categories || [];
  UI.machines = (machines || []).map(m => ({
    ...m,
    plan: Array.isArray(m.plan) ? m.plan[0] : m.plan,
    category: Array.isArray(m.category) ? m.category[0] : m.category,
  }));
  UI.reminders = loadReminders();
  UI.horsLigne = null;

  // Copie des données fraîches : c'est elle qui servira hors connexion.
  enregistrerCache({
    companyId: UI.companyId,
    companyName: UI.companyName,
    companyPlan: UI.companyPlan,
    company: UI.company,
    contactName: UI.contactName,
    email: UI.email,
    categories: UI.categories,
    machines: UI.machines,
  });

  renderApp();
  if (toastMessage) showToast(toastMessage);

  // Reprogrammation des rappels à chaque ouverture, sans réclamer
  // l'autorisation : celle-ci n'est demandée que sur action de l'utilisateur.
  // Hors connexion, l'appel échoue sans conséquence — les rappels déjà
  // programmés restent valides.
  programmerRappels({ demander: false });
}

if (sb) {
  if (__isPasswordRecovery) {
    renderSetNewPassword();
  } else {
    boot();
  }
}
</script>
</body>
</html>
