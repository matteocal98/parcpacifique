  /* ============================================================
     KEEVA — CHARTE GRAPHIQUE & SYSTÈME DE DESIGN
     Palette officielle de 12 teintes · Cadre 2px Encre · Contraste 18:1
     ============================================================ */
  :root {
    /* Surfaces */
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-soft: rgba(14, 19, 51, 0.04);
    --surface-tinte: #E9EDFF;
    --dark: #0D1424;
    --dark-2: rgba(255, 255, 255, 0.08);
    --dark-ink: #94A3B8;

    /* Encre & Textes */
    --ink: #0E1333;
    --ink-2: rgba(14, 19, 51, 0.74);
    --ink-3: rgba(14, 19, 51, 0.60);
    --ink-4: rgba(14, 19, 51, 0.40);
    --ink-soft: rgba(14, 19, 51, 0.70);

    /* Lignes & Séparateurs */
    --line: #0E1333;
    --line-soft: rgba(14, 19, 51, 0.12);
    --line-2: rgba(14, 19, 51, 0.08);
    --line-3: rgba(14, 19, 51, 0.22);

    /* Accents et Couleurs Officielles */
    --primary: #0E1333;
    --primary-dark: #5B52DF; /* Signature FR / Accent texte haute lisibilité 5.65:1 */
    --accent: #5B52DF;
    --accent-cyan: #24B5A8;
    --accent-blue: #236FE0;
    --accent-orange: #DE7A16;
    --accent-indigo: #6366F1;
    --accent-green: #8B9B37;
    --lien: #236FE0;
    --sur-primaire: #FFFFFF;

    /* Statuts */
    --late: #DE7A16;
    --late-bg: rgba(222, 122, 22, 0.14);
    --late-ink: #0E1333;
    --late-fort: #DE7A16;
    --soon: #6366F1;
    --soon-bg: rgba(99, 102, 241, 0.14);
    --soon-ink: #0E1333;
    --soon-fort: #5B52DF;
    --ok: #24B5A8;
    --ok-bg: rgba(36, 181, 168, 0.14);
    --ok-ink: #0E1333;
    --alert: #0E1333;
    --alert-bg: rgba(222, 122, 22, 0.16);

    /* Rayons & Cibles */
    --r-sm: 8px;
    --r-chip: 10px;
    --r-md: 12px;
    --r-card: 16px;
    --r-pill: 999px;
    --cible-tactile: 44px;
    --cible-tactile-fort: 48px;

    /* Ombres */
    --shadow-soft: 0 1px 3px rgba(14, 19, 51, 0.05);
    --shadow-card: 0 4px 18px rgba(14, 19, 51, 0.05);
    --shadow-fab: 0 8px 24px rgba(14, 19, 51, 0.25);

    /* Marges de sécurité */
    --safe-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    --safe-right: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
    --safe-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    --safe-left: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Figtree', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  h1, h2, h3, h4, button, input, select, textarea {
    font-family: inherit;
    letter-spacing: -0.015em;

  .num, .counter, .stat-card .num, .compteur-champ, .val, .ref-table .counter, .due {

     ------------------------------------------------------------ */

    border-radius: var(--r-card);
    box-shadow: var(--shadow-card);
    background: var(--surface);

  .content {

    max-width: 1200px;
    margin: 0 auto;

  button.primary, .btn-primary {

  /* ------------------------------------------------------------

     ------------------------------------------------------------ */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);

  .stat-card {

  .m-main .name { font-size: 19px; font-weight: 800; color: var(--ink); }

    border: 2px solid var(--ink);

    border-radius: 12px;
    background: var(--surface-soft);
    margin-top: 10px;
  }
  .compteur-titre {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
    display: block;
    margin-bottom: 6px;

  .compteur-saisie { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .compteur-champ {
    width: 130px;
    height: 44px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);

  .compteur-unite {
    height: 44px;
    min-width: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    color: #FFF;
    font-weight: 800;
    border-radius: 10px;
    padding: 0 10px;

  /* Badges */
  .badge, .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    border-radius: var(--r-pill);

  .badge.alert, .pill.late { background: var(--late-bg); color: var(--late); }
  .badge.soon, .pill.soon { background: var(--soon-bg); color: var(--soon); }
  .badge.ok, .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.neutral, .pill.neutral { background: var(--surface-soft); color: var(--ink-2); }

  /* ------------------------------------------------------------
     FORMULAIRES & MODALES
     ------------------------------------------------------------ */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 20, 36, 0.6);
    backdrop-filter: blur(3px);

  .modal {

    padding: 28px;
    background: var(--surface);

    border-radius: var(--r-card);

  .modal h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
  .modal p.sub { margin: 0 0 16px; font-size: 14px; color: var(--ink-2); }

  label {

    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);

  input, select, textarea {

    padding: 10px 14px;

  }
  input:focus, select:focus, textarea:focus {
    outline: none;

  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .field-row { display: flex; gap: 12px; }
  .field-row > div { flex: 1; min-width: 0; }
</style>

// ── Calcul des états d'échéance ─────────────────────────────────
function dueInfo(plan, machine) {
  if (!plan) return { state: 'neutral', label: 'Aucun plan actif', short: '—', sortKey: 999999 };
  if (plan.tracking_mode === 'hours' || plan.tracking_mode === 'km') {
    const unit = machine.counter_unit === 'km' ? 'km' : 'h';
    const current = machine.counter_value || 0;
    const due = plan.next_due_counter || 0;
    const diff = due - current;
    if (diff < 0) {
      return { state: 'late', label: `En retard de ${Math.abs(diff)} ${unit}`, short: `+${Math.abs(diff)} ${unit}`, sortKey: diff };
    }
    if (diff <= 30) {
      return { state: 'soon', label: `Échéance dans ${diff} ${unit}`, short: `dans ${diff} ${unit}`, sortKey: diff };
    }
    return { state: 'ok', label: `À jour (${diff} ${unit} restants)`, short: `${diff} ${unit}`, sortKey: diff };
  }
  return { state: 'ok', label: 'Échéance calendaire à jour', short: 'À jour', sortKey: 100 };
}

      </div>

        ${UI.machines.map(m => {
          const inf = dueInfo(m.plan, m);
          return `
            <div class="machine card">
              <div class="m-tete">
                <div>
                  <div class="name">${m.name}</div>
                  <div class="meta">${m.brand_model} · ${m.category.name}</div>

function switchView(v) {
  UI.view = v;
  renderApp();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateCounter(id) {
  const val = document.getElementById(`c-${id}`).value;
  const m = UI.machines.find(x => x.id === id);
  if (m) {
    m.counter_value = parseFloat(val);
    renderApp();
  }
}

function openAddModal() {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>Ajouter une machine</h2>
      <p class="sub">Renseignez les détails de l'engin ou véhicule pour initialiser son suivi.</p>
      <label>Désignation / Nom de la machine</label>
      <input id="f-nom" placeholder="Ex. KUBOTA U17-3">
      <label>Catégorie</label>
      <select id="f-cat">
        <option>MINI-PELLE</option>
        <option>VÉHICULE</option>
        <option>TRACTEUR</option>
        <option>GROUPE ÉLECTROGÈNE</option>
      </select>
      <div class="field-row">
        <div>
          <label>Compteur initial</label>
          <input type="number" id="f-compteur" placeholder="250">
        </div>
        <div>
          <label>Unité</label>
          <select id="f-unite"><option value="hours">Heures</option><option value="km">Kilomètres</option></select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="secondary" onclick="this.closest('.overlay').remove()">Annuler</button>
        <button class="primary" onclick="saveNewMachine(this)">Créer la machine</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function saveNewMachine(btn) {
  const nom = document.getElementById('f-nom').value.trim();
  const cat = document.getElementById('f-cat').value;
  const val = parseFloat(document.getElementById('f-compteur').value) || 0;
  const unit = document.getElementById('f-unite').value;
  if (!nom) return alert('Indiquez au moins le nom.');

  UI.machines.push({
    id: 'm_' + Date.now(),
    name: nom.toUpperCase(),
    brand_model: nom,
    category: { name: cat },
    counter_value: val,
    counter_unit: unit,
    status: 'en_service',
    plan: {
      tracking_mode: unit,
      interval_counter: 100,
      next_due_counter: val + 100,
      tasks: 'Premier entretien d\'inspection'
    }
  });

  btn.closest('.overlay').remove();
  renderApp();
}

function openLogModal(id) {
  const m = UI.machines.find(x => x.id === id);
  if (!m) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>Enregistrer un entretien</h2>
      <p class="sub">${m.name} — Cochez les opérations effectuées pour recalculer la prochaine échéance.</p>
      <label>Date de l'intervention</label>
      <input type="date" value="${new Date().toISOString().slice(0, 10)}">
      <label>Relevé du compteur (${m.counter_unit})</label>
      <input type="number" value="${m.counter_value}">
      <label>Tâches réalisées</label>
      <textarea>${m.plan ? m.plan.tasks : 'Contrôle général'}</textarea>
      <div class="modal-actions">
        <button class="secondary" onclick="this.closest('.overlay').remove()">Annuler</button>
        <button class="primary" onclick="alert('Entretien enregistré ! L\\\'échéance a été mise à jour.'); this.closest('.overlay').remove();">Valider l'entretien</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

// Démarrage
renderApp();
</script>
