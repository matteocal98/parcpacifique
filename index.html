<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParcPacific — Liste des machines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  :root{
    --bg:#EEF1F8;
    --surface:#FFFFFF;
    --surface-soft:#F6F8FC;
    --ink:#0F172A;
    --ink-soft:#64748B;
    --ink-faint:#94A3B8;
    --line:#E4E9F2;
    --line-soft:#EEF2F8;

    --primary:#4F46E5;
    --primary-dark:#4338CA;
    --primary-soft:#EEF0FE;
    --primary-line:#C7D2FE;

    --ok:#059669;
    --ok-bg:#ECFDF5;
    --ok-line:#A7F3D0;

    --alert:#E11D48;
    --alert-bg:#FFF1F2;
    --alert-line:#FECDD3;

    --shadow-sm:0 1px 3px rgba(15,23,42,0.06);
    --shadow-md:0 8px 24px rgba(15,23,42,0.09);
    --shadow-lg:0 24px 60px rgba(15,23,42,0.18);

    --r-sm:10px;
    --r-md:16px;
    --r-lg:22px;
    --r-pill:999px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Century Gothic', 'CenturyGothic', 'AppleGothic', 'Poppins', sans-serif;
    font-feature-settings:"tnum" 1;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;padding:32px 20px 90px;}

  h1,h2{font-family:inherit;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:22px;gap:12px;
  }
  h1{
    font-weight:800;font-size:27px;margin:0;letter-spacing:-0.01em;
    display:flex;align-items:center;gap:8px;
  }
  h1::before{
    content:"";width:10px;height:10px;border-radius:3px;
    background:linear-gradient(135deg, var(--primary), #818CF8);
    display:inline-block;flex-shrink:0;
  }
  .company{color:var(--ink-soft);font-size:15.5px;margin-top:5px;font-weight:500;}

  button.link{

    margin:0 0 20px;font-size:15.5px;color:var(--ink-soft);

  }
  .summary strong{color:var(--ink);}
  .summary .chip{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);
    padding:6px 14px;box-shadow:var(--shadow-sm);font-weight:500;

    border-radius:var(--r-md);

  .login-box h1{margin-bottom:6px;justify-content:center;}
  .login-box p{color:var(--ink-soft);font-size:15px;margin-top:0;margin-bottom:22px;text-align:center;}

    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r-sm);

  .delete-link{

  .step-back{

  .step-options{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .option-tile{
    text-align:left;padding:16px 18px;border:1.5px solid var(--line);background:var(--surface);
    border-radius:var(--r-md);font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;

  .option-tile .opt-sub{display:block;font-weight:500;font-size:14px;color:var(--ink-soft);margin-top:3px;}

  .checklist{display:flex;flex-direction:column;gap:9px;margin:10px 0 18px;}

  .track-mode-choice{display:flex;gap:20px;margin:8px 0 6px;}

  .track-mode-choice input{width:17px;height:17px;accent-color:var(--primary);}
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:76px;}
  .toggle-pw-btn{position:absolute;right:6px;top:34px;background:none;border:none;color:var(--primary);font-size:12.5px;font-weight:700;cursor:pointer;padding:6px 8px;}
  .signup-link-btn{width:100%;margin-top:10px;}
  .upgrade-banner{background:var(--primary-soft);border:1px solid var(--primary-line);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;color:var(--primary-dark);margin-bottom:16px;text-align:center;}

</style>

<script>
// ── Configuration ─────────────────────────────────────────────
const __isPasswordRecovery = window.location.hash.includes('type=recovery');
const SUPABASE_URL = "https://tiayvmnodsbygmuemeuy.supabase.co";
const SUPABASE_KEY = "sb_publishable__D5hSUJPHa9BQVrKzN2oqA_SlmhqDRg";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');

let pdfWorkerReady = null;
function ensurePdfWorker() {
  if (!pdfWorkerReady) {
    pdfWorkerReady = fetch("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")
      .then(resp => resp.text())
      .then(code => {
        const blob = new Blob([code], { type: 'application/javascript' });
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
      });
  }
  return pdfWorkerReady;
}

async function renderPdfFirstPageAsBlob(file) {
  await ensurePdfWorker();
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 1.5 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
}

async function uploadMachinePhoto(companyId, machineId, blob) {
  const path = `${companyId}/${machineId}.jpg`;
  const { error } = await sb.storage.from('machine-photos').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
  if (error) throw error;
  const { data } = sb.storage.from('machine-photos').getPublicUrl(path);
  return data.publicUrl;
}

function renderSetNewPassword() {
  app.innerHTML = `
    <div class="login-box">
      <h1>ParcPacific</h1>
      <p>Choisis un nouveau mot de passe.</p>
      <form id="reset-form">
        <label for="new-password">Nouveau mot de passe</label>
        <div class="password-wrap" style="margin-bottom:16px;">
          <input id="new-password" type="password" minlength="6" required>
          <button type="button" class="toggle-pw-btn" id="toggle-new-pw">Afficher</button>
        </div>
        <button class="primary" type="submit">Enregistrer le mot de passe</button>
        <div class="error" id="reset-error"></div>
      </form>
    </div>
  `;
  document.getElementById('toggle-new-pw').addEventListener('click', () => {
    const pw = document.getElementById('new-password');
    const btn = document.getElementById('toggle-new-pw');
    if (pw.type === 'password') { pw.type = 'text'; btn.textContent = 'Masquer'; }
    else { pw.type = 'password'; btn.textContent = 'Afficher'; }
  });
  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('reset-error');
    const submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enregistrement…';
    const password = document.getElementById('new-password').value;
    const { error } = await sb.auth.updateUser({ password });
    if (error) {
      errorEl.textContent = "Erreur : " + error.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enregistrer le mot de passe';
      return;
    }
    boot();
  });
}

sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') { renderSetNewPassword(); }
});

function openForgotPasswordModal() {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.innerHTML = `
    <div class="modal">
      <h2>Mot de passe oublié</h2>
      <p class="sub">Indique ton email de connexion : on t'envoie un lien pour définir un nouveau mot de passe.</p>
      <form id="forgot-form">
        <label for="forgot-email">Email</label>
        <input id="forgot-email" type="email" required>
        <div class="hint" id="forgot-error"></div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="forgot-cancel">Annuler</button>
          <button type="submit" class="primary">Envoyer le lien</button>
        </div>
      </form>
    </div>
  `;
  overlay.querySelector('#forgot-cancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = overlay.querySelector('#forgot-error');
    const submitBtn = e.target.querySelector('button[type=submit]');
    const email = overlay.querySelector('#forgot-email').value.trim();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Envoi…';
    try {
      const redirectTo = window.location.href.split('?')[0].split('#')[0];
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;
      overlay.innerHTML = `
        <div class="modal">
          <h2>Email envoyé</h2>
          <p class="sub">Si un compte existe pour ${email}, un lien de réinitialisation vient d'être envoyé. Ouvre-le depuis ta boîte mail pour définir un nouveau mot de passe.</p>
          <div class="modal-actions">
            <button type="button" class="primary" id="forgot-close">Fermer</button>
          </div>
        </div>`;
      overlay.querySelector('#forgot-close').addEventListener('click', () => overlay.remove());
    } catch (err) {
      errorEl.textContent = "Erreur : " + err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Envoyer le lien';
    }
  });
}

function renderLogin(errorMsg) {
  app.innerHTML = `

      <p>Connecte-toi pour voir tes machines.</p>
      <form id="login-form">

        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div class="forgot-pw-row">
          <button type="button" class="link-inline" id="open-forgot">Mot de passe oublié ?</button>
        </div>
        <button class="primary" type="submit">Se connecter</button>
        ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
      </form>
      <button type="button" class="secondary signup-link-btn" id="open-signup">Créer un compte</button>
      <div class="legal-footer">
        <a href="./mentions-legales.html" target="_blank">Mentions légales</a> ·
        <a href="./cgu.html" target="_blank">CGU</a> ·
        <a href="./politique-confidentialite.html" target="_blank">Confidentialité</a>
      </div>
    </div>
  `;
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

function dueInfo(plan, machine) {
  if (!plan) return { label: 'Pas de plan de maintenance', ok: true };
  if (plan.tracking_mode === 'hours') {
    if (plan.next_due_hours == null || machine?.current_hours == null) {
      return { label: 'Renseigner les heures compteur', ok: true };
    }
    const remaining = plan.next_due_hours - machine.current_hours;
    const threshold = plan.reminder_hours_before ?? 10;
    const target = `échéance au compteur : ${plan.next_due_hours} h`;
    if (remaining < 0) return { label: `En retard de ${Math.abs(remaining)} h (compteur actuel : ${machine.current_hours} h, ${target})`, ok: false };
    if (remaining <= threshold) return { label: `Échéance dans ${remaining} h (compteur actuel : ${machine.current_hours} h, ${target})`, ok: false };
    return { label: `Prochaine échéance dans ${remaining} h (compteur actuel : ${machine.current_hours} h, ${target})`, ok: true };
  }
  if (!plan.next_due_at) return { label: 'Pas de plan de maintenance', ok: true };
  const days = Math.ceil((new Date(plan.next_due_at) - new Date()) / 86400000);
  const threshold = plan.reminder_days_before ?? 7;
  if (days < 0) return { label: `En retard de ${Math.abs(days)} j`, ok: false };
  if (days <= threshold) return { label: `Échéance dans ${days} j`, ok: false };
  return { label: `Prochaine échéance dans ${days} j`, ok: true };
}

async function analyzeManualAndFill(overlay, fileOrBlob, mode = 'days', context = {}) {
  const analysisEl = overlay.querySelector('#f-analysis');
  const fileInput = overlay.querySelector('#f-manual');
  const submitBtn = overlay.querySelector('button[type=submit]');

  if (fileOrBlob.size > 8 * 1024 * 1024) {
    analysisEl.textContent = "Fichier volumineux (>8 Mo) : pas d'analyse automatique, mais le PDF reste attaché.";
    return;
  }

  if (fileInput) fileInput.disabled = true;
  if (submitBtn) submitBtn.disabled = true;
  analysisEl.style.color = 'var(--ok)';
  analysisEl.style.fontWeight = '600';
  analysisEl.textContent = "🤖 Lecture du carnet d'entretien par l'IA… (jusqu'à 15-20 secondes, ne ferme pas cette fenêtre)";

  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(fileOrBlob);
    });

    const { data, error } = await sb.functions.invoke('extract-maintenance-plan', {
      body: { fileBase64: base64, trackingMode: mode, currentHours: context.currentHours ?? null, serviceDate: context.serviceDate ?? null },
    });
    if (error) throw new Error(error.message || 'appel IA impossible');
    if (data?.error) throw new Error(data.error);

    overlay._aiIntervalDays = data.interval_days || null;
    overlay._aiIntervalHours = data.interval_hours || null;
    overlay._aiTrackingSuggestion = data.tracking_mode_suggestion === 'hours' ? 'hours' : 'days';

    const intervalField = overlay.querySelector('#f-interval');
    if (intervalField) {
      if (mode === 'hours' && data.interval_hours) intervalField.value = data.interval_hours;
      else if (mode !== 'hours' && data.interval_days) intervalField.value = data.interval_days;
    }
    if (data.tasks) overlay.querySelector('#f-tasks').value = data.tasks;
    overlay._aiItems = Array.isArray(data.items) && data.items.length ? data.items : null;
    overlay._aiNotes = data.notes || '';
    const detailMsg = overlay._aiItems ? ` ${overlay._aiItems.length} élément(s) détaillé(s) extrait(s), consultables via « Voir le plan » une fois enregistré.` : '';
    const mismatchMsg = overlay._aiTrackingSuggestion !== mode
      ? ` ℹ️ D'après le manuel, un suivi ${overlay._aiTrackingSuggestion === 'hours' ? 'horaire' : 'calendaire'} conviendrait peut-être mieux — reviens en arrière pour changer si tu veux.`
      : '';
    analysisEl.textContent = `✅ Suggestion IA appliquée (confiance ${data.confidence || '—'})${data.notes ? ' — ' + data.notes : ''}.${detailMsg}${mismatchMsg} Vérifie les champs ci-dessus avant d'enregistrer.`;
  } catch (err) {
    analysisEl.style.color = 'var(--alert)';
    analysisEl.textContent = "Analyse IA indisponible (" + err.message + ") — renseigne le plan manuellement.";
  } finally {
    if (fileInput) fileInput.disabled = false;
    if (submitBtn) submitBtn.disabled = false;
  }
}

    overlay.querySelector('#upload-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const intervalValue = parseInt(overlay.querySelector('#f-interval').value, 10);
      const reminderValue = parseInt(overlay.querySelector('#f-reminder').value, 10);
      if (isHours) {
        state.intervalHours = intervalValue;
        state.reminderHoursBefore = reminderValue;
        state.intervalDays = overlay._aiIntervalDays || state.intervalDays;
      } else {
        state.intervalDays = intervalValue;
        state.reminderDays = reminderValue;
        state.intervalHours = overlay._aiIntervalHours || null;
      }
      state.tasks = overlay.querySelector('#f-tasks').value.trim();
      state.items = overlay._aiItems || null;
      state.notes = overlay._aiNotes || '';
      saveMachine(e.target.querySelector('button[type=submit]'), overlay.querySelector('#f-error'));
    });
  }

  function stepChecklist() {
    const commonTasks = ['Graissage', 'Vidange (huile/carburant)', 'Nettoyage', "Contrôle/changement de pièces d'usure", 'Contrôle des niveaux', 'Contrôle visuel général'];
    const isHours = state.trackingMode === 'hours';
    shell(`
      <button type="button" class="step-back" id="back">← Retour</button>
      <h2>Suivi simplifié</h2>
      <p class="sub">Sélectionne ce que tu veux suivre pour « ${state.name} ». Pas de carnet constructeur : ce plan reste modifiable ensuite.</p>
      <form id="checklist-form">
        <div class="checklist">
          ${commonTasks.map(t => `<label><input type="checkbox" value="${t}"> ${t}</label>`).join('')}
        </div>
        <label for="f-other-task">Autre (optionnel)</label>
        <input id="f-other-task" placeholder="Ex. Contrôle courroie">

        <div class="field-row" style="margin-top:14px;">
          <div>
            <label for="f-interval">Échéance toutes les (${isHours ? 'heures' : 'jours'})</label>
            <input id="f-interval" type="number" min="1" value="${isHours ? state.intervalHours : state.intervalDays}" required>
          </div>
          <div>
            <label for="f-reminder">Rappel avant (${isHours ? 'heures' : 'jours'})</label>
            <input id="f-reminder" type="number" min="0" value="${isHours ? state.reminderHoursBefore : state.reminderDays}" required>
          </div>
        </div>
        <div class="hint" id="f-error"></div>

        <div class="modal-actions">
          <button type="button" class="secondary" id="cancel">Annuler</button>
          <button type="submit" class="primary">Enregistrer</button>
        </div>
      </form>
    `);
    overlay.querySelector('#back').addEventListener('click', stepChoice);
    overlay.querySelector('#cancel').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#checklist-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const checked = Array.from(overlay.querySelectorAll('.checklist input:checked')).map(c => c.value);
      const other = overlay.querySelector('#f-other-task').value.trim();
      if (other) checked.push(other);
      state.tasks = checked.join(', ');
      state.pendingFile = null;
      const intervalValue = parseInt(overlay.querySelector('#f-interval').value, 10);
      const reminderValue = parseInt(overlay.querySelector('#f-reminder').value, 10);
      const freqLabel = isHours ? `Toutes les ${intervalValue} heures` : `Tous les ${intervalValue} jours`;
      if (isHours) {
        state.intervalHours = intervalValue;
        state.reminderHoursBefore = reminderValue;
      } else {
        state.intervalDays = intervalValue;
        state.reminderDays = reminderValue;
      }
      state.items = checked.length
        ? checked.map(label => ({ label, frequency: freqLabel, spec: '', qty: '', note: '' }))
        : null;
      saveMachine(e.target.querySelector('button[type=submit]'), overlay.querySelector('#f-error'));
    });
  }

  async function saveMachine(submitBtn, errorEl) {
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Enregistrement…'; }
    try {
      let categoryId;
      const existingCat = categories.find(c => c.name.toLowerCase() === state.category.toLowerCase());
      if (existingCat) {
        categoryId = existingCat.id;
      } else {
        const { data: newCat, error: catErr } = await sb
          .from('machine_categories')
          .insert({ company_id: companyId, name: state.category, default_interval_days: state.intervalDays, default_tasks: state.tasks })
          .select('id, name')
          .single();
        if (catErr) throw catErr;
        categoryId = newCat.id;
        categories.push(newCat);
      }

      const { data: machine, error: machineErr } = await sb
        .from('machines')
        .insert({
          company_id: companyId, category_id: categoryId, name: state.name,
          brand_model: state.brand || null, serial_number: state.serial || null,
          service_date: state.serviceDate, status: 'en_service',
          current_hours: state.trackingMode === 'hours' ? state.currentHours : null,
        })
        .select('id')
        .single();
      if (machineErr) throw machineErr;

      try {
        if (state.pendingPhotoBlob) {
          const url = await uploadMachinePhoto(companyId, machine.id, state.pendingPhotoBlob);
          await sb.from('machines').update({ image_url: url }).eq('id', machine.id);
        } else {
          const query = `${state.brand || state.name} ${state.category}`.trim();
          const { data: imgData } = await sb.functions.invoke('fetch-machine-image', { body: { query } });
          if (imgData?.imageUrl) {
            await sb.from('machines').update({ image_url: imgData.imageUrl }).eq('id', machine.id);
          }
        }
      } catch (imgErr) { }

      if (state.pendingFile) {
        if (state.pendingFile.size > 15 * 1024 * 1024) throw new Error("Le PDF dépasse 15 Mo, réduis sa taille avant de réessayer.");
        const path = `${companyId}/${machine.id}.pdf`;
        const { error: uploadErr } = await sb.storage.from('manuals').upload(path, state.pendingFile, { upsert: true, contentType: 'application/pdf' });
        if (uploadErr) throw uploadErr;
        const { error: updateErr } = await sb.from('machines').update({ manual_url: path }).eq('id', machine.id);
        if (updateErr) throw updateErr;
      }

      const planPayload = {
        machine_id: machine.id,
        tracking_mode: state.trackingMode,
        tasks: state.tasks || null,
        items: state.items,
        notes: state.notes || null,
      };
      if (state.trackingMode === 'hours') {
        planPayload.interval_hours = state.intervalHours;
        planPayload.reminder_hours_before = state.reminderHoursBefore;
        planPayload.next_due_hours = (state.currentHours || 0) + state.intervalHours;
        planPayload.interval_days = state.intervalDays || null;
      } else {
        const nextDue = new Date(state.serviceDate);
        nextDue.setDate(nextDue.getDate() + state.intervalDays);
        planPayload.interval_days = state.intervalDays;
        planPayload.reminder_days_before = state.reminderDays;
        planPayload.next_due_at = nextDue.toISOString().slice(0, 10);
        planPayload.interval_hours = state.intervalHours || null;
      }
      const { error: planErr } = await sb.from('maintenance_plans').insert(planPayload);
      if (planErr) throw planErr;

      overlay.remove();
      boot();
    } catch (err) {
      if (errorEl) errorEl.textContent = "Erreur : " + err.message;
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Enregistrer'; }
    }
  }

  stepIdentification();
}

          ${doneItems ? `<br>Éléments traités : ${doneItems}` : ''}
          ${last.description ? `<br>Remarques : ${last.description}` : ''}
        </div>`;
    });
}

function openLogInterventionModal(machine) {
  const today = new Date().toISOString().slice(0, 10);
  const isHours = machine.plan?.tracking_mode === 'hours';
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  const items = Array.isArray(machine.plan?.items) && machine.plan.items.length
    ? machine.plan.items.map(it => it.label).filter(Boolean)
    : (machine.plan?.tasks || '').split(',').map(t => t.trim()).filter(Boolean);

  overlay.innerHTML = `
    <div class="modal">
      <h2>Enregistrer un entretien</h2>
      <p class="sub">${machine.name} — coche ce qui a été fait, ça met à jour la prochaine échéance.</p>
      <form id="log-form">
        <label for="log-date">Date de l'entretien</label>
        <input id="log-date" type="date" value="${today}" required>

        ${isHours ? `
          <label for="log-hours">Compteur au moment de l'entretien (heures)</label>
          <input id="log-hours" type="number" min="0" step="0.1" value="${machine.current_hours ?? ''}" required>
        ` : ''}

        ${items.length ? `
          <label>Éléments traités</label>
          <div class="checklist">
            ${items.map(t => `<label><input type="checkbox" value="${t}"> ${t}</label>`).join('')}
          </div>
        ` : ''}

        <label for="log-notes">Remarques (optionnel)</label>
        <textarea id="log-notes" placeholder="Ex. Pièce X remplacée, RAS sinon"></textarea>
        <div class="hint" id="log-error"></div>

        <div class="modal-actions">
          <button type="button" class="secondary" id="cancel-log">Annuler</button>
          <button type="submit" class="primary">Enregistrer</button>
        </div>
      </form>
    </div>
  `;

  overlay.querySelector('#cancel-log').addEventListener('click', () => overlay.remove());

  overlay.querySelector('#log-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type=submit]');
    const errorEl = overlay.querySelector('#log-error');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enregistrement…';

    const performedAt = overlay.querySelector('#log-date').value;
    const hoursValue = isHours ? parseFloat(overlay.querySelector('#log-hours').value) : null;
    const checkedItems = items.length
      ? Array.from(overlay.querySelectorAll('.checklist input:checked')).map(c => c.value)
      : [];
    const notes = overlay.querySelector('#log-notes').value.trim();

    try {
      const { error: logErr } = await sb.from('interventions').insert({
        machine_id: machine.id,
        plan_id: machine.plan?.id || null,
        performed_at: performedAt,
        hours_at_intervention: hoursValue,
        description: notes || null,
        items_done: checkedItems.length ? checkedItems : null,
      });
      if (logErr) throw logErr;

      if (isHours && hoursValue != null) {
        const { error: machErr } = await sb.from('machines').update({ current_hours: hoursValue }).eq('id', machine.id);
        if (machErr) throw machErr;
      }

      if (machine.plan?.id) {
        const planUpdate = {};
        if (isHours) {
          planUpdate.next_due_hours = (hoursValue || 0) + (machine.plan.interval_hours || 0);
        } else {
          const nextDue = new Date(performedAt);
          nextDue.setDate(nextDue.getDate() + (machine.plan.interval_days || 90));
          planUpdate.next_due_at = nextDue.toISOString().slice(0, 10);
        }
        const { error: planErr } = await sb.from('maintenance_plans').update(planUpdate).eq('id', machine.plan.id);
        if (planErr) throw planErr;
      }

      overlay.remove();
      boot();
    } catch (err) {
      errorEl.textContent = "Erreur : " + err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enregistrer';
    }
  });
}

  if (machine.manual_url) {
    overlay.querySelector('#plan-view-manual').addEventListener('click', (e) => viewManual(machine.manual_url, e.target));
  }

  let historyData = [];
  const buildHistoryCsv = () => {
    const header = ['Date', 'Compteur (h)', 'Elements traites', 'Remarques'];
    const escape = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = historyData.map(h => [
      h.performed_at,
      h.hours_at_intervention ?? '',
      Array.isArray(h.items_done) ? h.items_done.join('; ') : '',
      h.description ?? '',
    ]);
    return [header, ...rows].map(r => r.map(escape).join(',')).join('\r\n');
  };

  const csvToUtf16Buffer = (csvString) => {
    const buf = new ArrayBuffer(2 + csvString.length * 2);
    const view = new DataView(buf);
    view.setUint16(0, 0xFEFF, true);
    for (let i = 0; i < csvString.length; i++) {
      view.setUint16(2 + i * 2, csvString.charCodeAt(i), true);
    }
    return buf;
  };

  overlay.querySelector('#export-history-csv').addEventListener('click', () => {
    const blob = new Blob([csvToUtf16Buffer(buildHistoryCsv())], { type: 'text/csv;charset=utf-16le;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `historique_${machine.name.replace(/[^a-z0-9]+/gi, '_')}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  overlay.querySelector('#share-history-email').addEventListener('click', async () => {
    const filename = `historique_${machine.name.replace(/[^a-z0-9]+/gi, '_')}.csv`;
    const file = new File([csvToUtf16Buffer(buildHistoryCsv())], filename, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: `Historique entretien — ${machine.name}`, text: `Historique des entretiens pour ${machine.name}` });
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
      }
    }
    const subject = encodeURIComponent(`Historique entretien — ${machine.name}`);
    const bodyLines = historyData.map(h => `${h.performed_at} — ${h.hours_at_intervention != null ? h.hours_at_intervention + 'h' : ''} — ${(h.items_done || []).join(', ')} — ${h.description || ''}`);
    const body = encodeURIComponent(`Historique des entretiens pour ${machine.name} :\n\n${bodyLines.join('\n')}\n\n(Le fichier CSV complet est disponible via « Exporter en CSV » si tu veux le joindre en pièce jointe.)`);
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
  });

  sb.from('interventions')
    .select('performed_at, hours_at_intervention, description, items_done')
    .eq('machine_id', machine.id)
    .order('performed_at', { ascending: false })
    .limit(20)
    .then(({ data, error }) => {
      const section = overlay.querySelector('#history-section');
      if (!overlay.isConnected || !section) return;
      const valueEl = section.querySelector('.value');
      if (error) { if (valueEl) valueEl.textContent = "Erreur de chargement de l'historique."; return; }
      historyData = data || [];
      if (!historyData.length) { if (valueEl) valueEl.textContent = "Aucun entretien enregistré pour l'instant."; return; }
      overlay.querySelector('#export-history-csv').disabled = false;
      overlay.querySelector('#share-history-email').disabled = false;
      if (valueEl) valueEl.remove();
      section.insertAdjacentHTML('beforeend', `
        <table class="ref-table">
          <thead><tr><th>Date</th>${isHoursMode ? '<th>Compteur</th>' : ''}<th>Éléments traités</th><th>Remarques</th></tr></thead>
          <tbody>
            ${data.map(h => `
              <tr>
                <td class="item-label">${h.performed_at}</td>
                ${isHoursMode ? `<td>${h.hours_at_intervention != null ? h.hours_at_intervention + ' h' : '<span class="muted">—</span>'}</td>` : ''}
                <td>${Array.isArray(h.items_done) && h.items_done.length ? h.items_done.join(', ') : '<span class="muted">—</span>'}</td>
                <td>${h.description || '<span class="muted">—</span>'}</td>
              </tr>`).join('')}
          </tbody>
        </table>`);
    });
}

        <input id="f-category" list="cat-list" required placeholder="Ex. Motoculture" value="${isEdit ? (existing.category?.name || '') : ''}">
        <datalist id="cat-list">
          ${categories.map(c => `<option value="${c.name}">`).join('')}
        </datalist>

        <div class="field-row">
          <div>
            <label for="f-brand">Marque / modèle</label>
            <input id="f-brand" placeholder="Ex. Orec 4x4" value="${isEdit ? (existing.brand_model || '') : ''}">
          </div>
          <div>
            <label for="f-serial">N° de série</label>
            <input id="f-serial" value="${isEdit ? (existing.serial_number || '') : ''}">
          </div>
        </div>

        <label for="f-service-date">Date de mise en service</label>
        <input id="f-service-date" type="date" value="${isEdit ? (existing.service_date || today) : today}" required>

        <label>Mode de suivi de la maintenance</label>
        <div class="track-mode-choice">
          <label><input type="radio" name="tm" value="days" ${(!isEdit || existing.plan?.tracking_mode !== 'hours') ? 'checked' : ''}> Calendaire (jours)</label>
          <label><input type="radio" name="tm" value="hours" ${(isEdit && existing.plan?.tracking_mode === 'hours') ? 'checked' : ''}> Compteur horaire (heures)</label>
        </div>
        <div id="hours-field" style="display:${(isEdit && existing.plan?.tracking_mode === 'hours') ? 'block' : 'none'};">
          <label for="f-current-hours">Heures compteur actuelles</label>
          <input id="f-current-hours" type="number" min="0" step="0.1" value="${isEdit ? (existing.current_hours ?? '') : ''}" placeholder="Ex. 245">
        </div>

        <div class="field-row">
          <div>
            <label for="f-interval" id="f-interval-label">Échéance toutes les (${(isEdit && existing.plan?.tracking_mode === 'hours') ? 'heures' : 'jours'})</label>
            <input id="f-interval" type="number" min="1" value="${isEdit ? (existing.plan?.tracking_mode === 'hours' ? (existing.plan?.interval_hours || 100) : (existing.plan?.interval_days || 90)) : 90}" required>
          </div>
          <div>
            <label for="f-reminder" id="f-reminder-label">Rappel avant (${(isEdit && existing.plan?.tracking_mode === 'hours') ? 'heures' : 'jours'})</label>
            <input id="f-reminder" type="number" min="0" value="${isEdit ? (existing.plan?.tracking_mode === 'hours' ? (existing.plan?.reminder_hours_before ?? 10) : (existing.plan?.reminder_days_before ?? 7)) : 7}" required>
          </div>
        </div>

        <label for="f-tasks">Tâches de maintenance</label>
        <textarea id="f-tasks" placeholder="Ex. Vidange, contrôle lame, graissage">${isEdit ? (existing.plan?.tasks || '') : ''}</textarea>

        <label>Photo de la machine</label>
        <div id="photo-preview">
          ${isEdit && existing.image_url ? `<img class="machine-photo" src="${existing.image_url}" alt="${existing.name}" onerror="this.remove()">` : ''}
        </div>
        <button type="button" class="view-manual" id="fetch-photo-btn">${isEdit && existing.image_url ? 'Chercher plutôt sur le web' : 'Chercher une photo sur le web'}</button>
        <div class="hint" id="photo-status"></div>

        <label for="f-manual">Carnet d'entretien (PDF${isEdit ? ' — laisser vide pour ne pas changer' : ', optionnel'})</label>
        ${isEdit && existing.manual_url ? `
          <button type="button" class="view-manual" id="modal-view-manual">Voir le carnet actuel (PDF)</button>
          <button type="button" class="view-manual" id="modal-analyze-manual">Analyser ce carnet avec l'IA</button>
        ` : ''}
        <input id="f-manual" type="file" accept="application/pdf">
        <div class="hint" id="f-analysis">Le PDF du fabricant reste attaché à la fiche, consultable par n'importe quel technicien. S'il est fourni, l'IA propose un intervalle et des tâches à partir de son contenu.</div>
        <div class="hint" id="f-error"></div>

        <div class="modal-actions">
          <button type="button" class="secondary" id="cancel-add">Annuler</button>
          <button type="submit" class="primary" id="submit-add">${isEdit ? 'Enregistrer les modifications' : 'Enregistrer'}</button>
        </div>
        ${isEdit ? `<button type="button" class="delete-link" id="delete-machine">Supprimer cette machine</button>` : ''}
      </form>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#cancel-add').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelectorAll('input[name=tm]').forEach(r => {
    r.addEventListener('change', () => {
      const mode = overlay.querySelector('input[name=tm]:checked').value;
      overlay.querySelector('#hours-field').style.display = mode === 'hours' ? 'block' : 'none';
      const unit = mode === 'hours' ? 'heures' : 'jours';
      overlay.querySelector('#f-interval-label').textContent = `Échéance toutes les (${unit})`;
      overlay.querySelector('#f-reminder-label').textContent = `Rappel avant (${unit})`;
    });
  });

  if (isEdit) {
    overlay.querySelector('#delete-machine').addEventListener('click', async (e) => {
      const ok = confirm(`Supprimer définitivement « ${existing.name} » ? Son historique de maintenance et son carnet d'entretien seront aussi supprimés. Cette action est irréversible.`);
      if (!ok) return;
      const btn = e.target;
      btn.disabled = true;
      btn.textContent = 'Suppression…';
      try {
        if (existing.manual_url) {
          await sb.storage.from('manuals').remove([existing.manual_url]);
        }
        const { error: delErr } = await sb.from('machines').delete().eq('id', existing.id);
        if (delErr) throw delErr;
        overlay.remove();
        boot();
      } catch (err) {
        overlay.querySelector('#f-error').textContent = "Erreur à la suppression : " + err.message;
        btn.disabled = false;
        btn.textContent = 'Supprimer cette machine';
      }
    });
  }

  if (isEdit && existing.manual_url) {
    overlay.querySelector('#modal-view-manual').addEventListener('click', (e) => viewManual(existing.manual_url, e.target));
    overlay.querySelector('#modal-analyze-manual').addEventListener('click', async (e) => {
      const btn = e.target;
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Téléchargement du carnet…';
      const { data: blob, error } = await sb.storage.from('manuals').download(existing.manual_url);
      if (error) {
        overlay.querySelector('#f-analysis').textContent = "Impossible de récupérer le PDF existant : " + error.message;
      } else {
        await analyzeManualAndFill(
          overlay, blob,
          overlay.querySelector('input[name=tm]:checked').value,
          {
            currentHours: parseFloat(overlay.querySelector('#f-current-hours')?.value) || existing.current_hours || null,
            serviceDate: overlay.querySelector('#f-service-date')?.value || existing.service_date || null,
          }
        );
        if (!existing.image_url && !overlay._pendingPhotoBlob) {
          try {
            const photoBlob = await renderPdfFirstPageAsBlob(blob);
            overlay._pendingPhotoBlob = photoBlob;
            const previewUrl = URL.createObjectURL(photoBlob);
            overlay.querySelector('#photo-preview').innerHTML = `<img class="machine-photo" src="${previewUrl}" alt="${existing.name}">`;
            overlay.querySelector('#photo-status').textContent = "Photo extraite de la 1ère page du carnet — elle sera enregistrée avec la fiche.";
          } catch (photoErr) {
            console.error('Extraction photo (1ère page du PDF) échouée :', photoErr);
            overlay.querySelector('#photo-status').textContent = "Extraction de la photo impossible (" + (photoErr?.message || photoErr) + ").";
          }
        }
      }
      btn.disabled = false;
      btn.textContent = original;
    });
  }

  overlay.querySelector('#fetch-photo-btn').addEventListener('click', async (e) => {
    const btn = e.target;
    const statusEl = overlay.querySelector('#photo-status');
    const name = overlay.querySelector('#f-name').value.trim();
    const brand = overlay.querySelector('#f-brand').value.trim();
    const category = overlay.querySelector('#f-category').value.trim();
    const query = `${brand || name} ${category}`.trim();
    btn.disabled = true;
    statusEl.textContent = 'Recherche en cours…';
    try {
      const { data, error } = await sb.functions.invoke('fetch-machine-image', { body: { query } });
      if (error) throw new Error(error.message || 'appel impossible');
      if (data?.error) throw new Error(data.error);
      overlay.querySelector('#photo-preview').innerHTML = `<img class="machine-photo" src="${data.imageUrl}" alt="${name}" onerror="this.remove()">`;
      overlay._newImageUrl = data.imageUrl;
      overlay._pendingPhotoBlob = null;
      statusEl.textContent = 'Photo trouvée sur le web — elle sera enregistrée avec la fiche.';
      btn.textContent = 'Chercher une autre photo sur le web';
    } catch (err) {
      statusEl.textContent = "Aucune photo trouvée (" + err.message + ").";
    }
    btn.disabled = false;
  });

  overlay.querySelector('#f-manual').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      analyzeManualAndFill(
        overlay, file,
        overlay.querySelector('input[name=tm]:checked').value,
        {
          currentHours: parseFloat(overlay.querySelector('#f-current-hours')?.value) || existing.current_hours || null,
          serviceDate: overlay.querySelector('#f-service-date')?.value || existing.service_date || null,
        }
      );
      renderPdfFirstPageAsBlob(file).then(blob => {
        overlay._pendingPhotoBlob = blob;
        const previewUrl = URL.createObjectURL(blob);
        overlay.querySelector('#photo-preview').innerHTML = `<img class="machine-photo" src="${previewUrl}" alt="${existing.name}">`;
        overlay.querySelector('#photo-status').textContent = "Photo extraite de la 1ère page du carnet — elle sera enregistrée avec la fiche.";
        overlay.querySelector('#fetch-photo-btn').textContent = 'Chercher plutôt sur le web';
      }).catch(err => {
        console.error('Extraction photo (1ère page du PDF) échouée :', err);
        overlay.querySelector('#photo-status').textContent = "Extraction de la photo impossible (" + (err?.message || err) + "). Tu peux essayer « Chercher sur le web ».";
      });
    }
  });
  overlay.querySelector('#add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = overlay.querySelector('#f-error');
    const submitBtn = overlay.querySelector('#submit-add');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enregistrement…';

    const name = overlay.querySelector('#f-name').value.trim();
    const categoryName = overlay.querySelector('#f-category').value.trim();
    const brand = overlay.querySelector('#f-brand').value.trim();
    const serial = overlay.querySelector('#f-serial').value.trim();
    const serviceDate = overlay.querySelector('#f-service-date').value;
    const trackingMode = overlay.querySelector('input[name=tm]:checked').value;
    const currentHours = trackingMode === 'hours' ? (parseFloat(overlay.querySelector('#f-current-hours').value) || 0) : null;
    const intervalValue = parseInt(overlay.querySelector('#f-interval').value, 10);
    const reminderValue = parseInt(overlay.querySelector('#f-reminder').value, 10);
    const intervalDays = trackingMode === 'hours' ? (overlay._aiIntervalDays || existing?.plan?.interval_days || null) : intervalValue;
    const reminderDays = trackingMode === 'hours' ? (existing?.plan?.reminder_days_before ?? null) : reminderValue;
    const intervalHours = trackingMode === 'hours' ? intervalValue : (overlay._aiIntervalHours || existing?.plan?.interval_hours || null);
    const reminderHours = trackingMode === 'hours' ? reminderValue : (existing?.plan?.reminder_hours_before ?? null);
    const tasks = overlay.querySelector('#f-tasks').value.trim();

    try {
      let categoryId;
      const existingCat = categories.find(c => c.name.toLowerCase() === categoryName.toLowerCase());
      if (existingCat) {
        categoryId = existingCat.id;
      } else {
        const { data: newCat, error: catErr } = await sb
          .from('machine_categories')
          .insert({ company_id: companyId, name: categoryName, default_interval_days: intervalDays, default_tasks: tasks })
          .select('id, name')
          .single();
        if (catErr) throw catErr;
        categoryId = newCat.id;
        categories.push(newCat);
      }

      let machineId;
      if (isEdit) {
        let resolvedImageUrl = null;
        if (overlay._pendingPhotoBlob) {
          try { resolvedImageUrl = await uploadMachinePhoto(companyId, existing.id, overlay._pendingPhotoBlob); }
          catch (e) { }
        } else if (overlay._newImageUrl) {
          resolvedImageUrl = overlay._newImageUrl;
        }
        const updatePayload = {
          category_id: categoryId,
          name, brand_model: brand || null, serial_number: serial || null,
          service_date: serviceDate,
          current_hours: currentHours,
        };
        if (resolvedImageUrl) updatePayload.image_url = resolvedImageUrl;
        const { error: updErr } = await sb
          .from('machines')
          .update(updatePayload)
          .eq('id', existing.id);
        if (updErr) throw updErr;
        machineId = existing.id;
      } else {
        const { data: machine, error: machineErr } = await sb
          .from('machines')
          .insert({
            company_id: companyId,
            category_id: categoryId,
            name, brand_model: brand || null, serial_number: serial || null,
            service_date: serviceDate, status: 'en_service',
            current_hours: currentHours,
          })
          .select('id')
          .single();
        if (machineErr) throw machineErr;
        machineId = machine.id;
      }

      const fileInput = overlay.querySelector('#f-manual');
      const file = fileInput.files[0];
      if (file) {
        if (file.size > 15 * 1024 * 1024) throw new Error("Le PDF dépasse 15 Mo, réduis sa taille avant de réessayer.");
        const path = `${companyId}/${machineId}.pdf`;
        const { error: uploadErr } = await sb.storage.from('manuals').upload(path, file, { upsert: true, contentType: 'application/pdf' });
        if (uploadErr) throw uploadErr;
        const { error: updateErr } = await sb.from('machines').update({ manual_url: path }).eq('id', machineId);
        if (updateErr) throw updateErr;
      }

      if (isEdit && existing.plan?.id) {
        const updatePayload = {
          tracking_mode: trackingMode,
          tasks: tasks || null,
          interval_days: intervalDays,
          reminder_days_before: reminderDays,
          interval_hours: intervalHours,
          reminder_hours_before: reminderHours,
        };
        if (overlay._aiItems) { updatePayload.items = overlay._aiItems; updatePayload.notes = overlay._aiNotes || null; }

        const aiJustRefreshed = !!(overlay._aiItems || overlay._aiIntervalHours || overlay._aiIntervalDays);
        if (existing.plan.tracking_mode !== trackingMode || aiJustRefreshed) {
          if (trackingMode === 'hours') {
            updatePayload.next_due_hours = (currentHours || 0) + (intervalHours || 0);
          } else {
            const nextDue = new Date(serviceDate);
            nextDue.setDate(nextDue.getDate() + (intervalDays || 90));
            updatePayload.next_due_at = nextDue.toISOString().slice(0, 10);
          }
        }
        const { error: planErr } = await sb
          .from('maintenance_plans')
          .update(updatePayload)
          .eq('id', existing.plan.id);
        if (planErr) throw planErr;
      } else {
        const planPayload = {
          machine_id: machineId,
          tracking_mode: trackingMode,
          tasks: tasks || null,
          items: overlay._aiItems || null,
          notes: overlay._aiNotes || null,
          interval_days: intervalDays,
          reminder_days_before: reminderDays,
          interval_hours: intervalHours,
          reminder_hours_before: reminderHours,
        };
        if (trackingMode === 'hours') {
          planPayload.next_due_hours = (currentHours || 0) + (intervalHours || 0);
        } else {
          const nextDue = new Date(serviceDate);
          nextDue.setDate(nextDue.getDate() + (intervalDays || 90));
          planPayload.next_due_at = nextDue.toISOString().slice(0, 10);
        }
        const { error: planErr } = await sb
          .from('maintenance_plans')
          .insert(planPayload);
        if (planErr) throw planErr;
      }

      overlay.remove();
      boot();
    } catch (err) {
      errorEl.textContent = "Erreur : " + err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = isEdit ? 'Enregistrer les modifications' : 'Enregistrer';
    }
  });
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { renderLogin(); return; }

  app.innerHTML = `<div class="loading">Chargement des machines…</div>`;

  const { data: profile, error: profileErr } = await sb
    .from('profiles')
    .select('company_id, companies(name, plan)')
    .eq('id', session.user.id)
    .single();

  if (profileErr || !profile) {
    renderLogin("Compte connecté mais pas encore rattaché à une société. Vérifie la table profiles.");
    return;
  }

  const { data: machines, error: machinesErr } = await sb
    .from('machines')
    .select(`
      id, name, brand_model, serial_number, status, manual_url, service_date, current_hours, image_url,
      category:machine_categories(id, name),
      plan:maintenance_plans(id, interval_days, tasks, items, notes, reminder_days_before, next_due_at, tracking_mode, interval_hours, next_due_hours, reminder_hours_before)
    `)
    .eq('company_id', profile.company_id)
    .order('name');

  if (machinesErr) {
    app.innerHTML = `<div class="empty">Erreur de chargement : ${machinesErr.message}</div>`;
    return;
  }

  const { data: categories } = await sb
    .from('machine_categories')
    .select('id, name')
    .eq('company_id', profile.company_id);

  const normalized = (machines || []).map(m => ({
    ...m,
    plan: Array.isArray(m.plan) ? m.plan[0] : m.plan,
    category: Array.isArray(m.category) ? m.category[0] : m.category,
  }));

  renderMachines(
    profile.companies?.name || profile.companies?.[0]?.name || 'Ta société',
    profile.company_id,
    normalized,
    categories || [],
    profile.companies?.plan || profile.companies?.[0]?.plan || 'free'
  );
}

if (__isPasswordRecovery) {
  renderSetNewPassword();
} else {
  boot();
}
</script>
</body>
</html>
