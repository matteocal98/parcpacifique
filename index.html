<!-- L'application est PRIVÉE : ses écrans authentifiés n'ont rien à faire dans un
     moteur de recherche. La page publique et indexable est decouvrir.html. -->

<!-- pdf.js n'est plus chargé ici : il ne sert qu'à extraire la 1ère page d'un carnet PDF
     et représente ~350 Ko. Il est chargé à la demande (voir loadPdfLib). -->
<style>
  /* ============================================================
     KEEVA — jetons de la charte (palette officielle, douze teintes)
     Aucune autre couleur n'est employée : surfaces, bordures et ombres
     sont ces teintes en transparence, jamais des gris inventés.
     Rôles — le fond clair est le blanc, le fond sombre le bleu nuit ;
     l'encre porte le texte du mode clair, le blanc celui du mode sombre ;
     l'indigo est la couleur d'action ; le bleu roi et la signature FR
     servent au texte d'accent, seules teintes avec l'encre à passer AA
     sur fond clair ; le cyan et l'ambre portent les statuts ; l'ardoise
     les légendes.
     ============================================================ */
  :root{
    /* Surfaces */
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-soft:rgba(14,19,51,.04);
    --dark:#0D1424;
    --dark-2:rgba(255,255,255,.10);
    --dark-ink:#94A3B8;

    /* Texte : l'encre de la charte, du plus dense au plus discret. */
    --ink:#0E1333;
    --ink-2:rgba(14,19,51,.74);
    --ink-3:rgba(14,19,51,.66);
    --ink-4:rgba(14,19,51,.60);
    --ink-warm:rgba(14,19,51,.74);

    /* Lignes */
    --line:rgba(14,19,51,.14);
    --line-2:rgba(14,19,51,.08);
    --line-3:rgba(14,19,51,.22);

    /* Accent : indigo de la puce centrale, bleu roi et signature FR pour le
       texte (seules teintes, avec l'encre, à tenir 4,5:1 sur fond clair). */
    --primary:#6366F1;
    --primary-dark:#5B52DF;
    --primary-tint:rgba(99,102,241,.10);
    --primary-tint-2:rgba(99,102,241,.30);
    --primary-line:rgba(99,102,241,.45);
    --gold:#DE7A16;
    --gold-dark:#DE7A16;
    --cyan:#24B5A8;

    /* Statuts. La teinte vive sert aux bordures, aux pastilles et aux icônes ;
       le texte reste l'encre, seule teinte à passer AA sur un fond teinté. */
    --late:#DE7A16;
    --late-bg:rgba(222,122,22,.14);
    --late-ink:#0E1333;
    --soon:#6366F1;
    --soon-bg:rgba(99,102,241,.14);
    --soon-ink:#0E1333;
    --ok:#24B5A8;
    --ok-bg:rgba(36,181,168,.14);
    --ok-ink:#0E1333;
    --ok-accent:#24B5A8;
    --alert:#0E1333;
    --alert-bg:rgba(222,122,22,.16);

    /* Rayons */
    --r-md:12px;
    --r-chip:10px;
    --r-card:16px;
    --r-pill:20px;

    /* Ombres : l'encre en transparence, jamais de noir inventé. */
    --shadow-card:0 1px 3px rgba(14,19,51,.06);
    --shadow-soft:0 1px 3px rgba(14,19,51,.05);
    --shadow-fab:0 8px 18px rgba(99,102,241,.35);
  }

  *{box-sizing:border-box;}
  /* Foyer visible homogène : au clavier, on doit toujours savoir où l'on est.
     :focus-visible évite d'encadrer un bouton simplement cliqué au doigt. */
  :focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px;}
  /* Respect du réglage système « réduire les animations ». */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
  }
  /* Proposition de copie locale sur l'écran de connexion : c'est une donnée
     sensible, l'encadré doit se voir sans dominer le formulaire. */
  .copie-locale{
    margin-top:14px;padding:12px 14px;border:1px dashed var(--line-3);
    border-radius:var(--r-md);background:var(--surface-soft);text-align:left;
  }
  .copie-locale p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2);line-height:1.5;}
  .switch-row.is-a-venir .switch-label{color:var(--ink-3);}
  .switch-row.is-a-venir .switch{opacity:.55;cursor:not-allowed;}
  .badge{margin-left:6px;}
  html,body{margin:0;padding:0;}
  html{
    /* Le navigateur du téléphone ne réécrit pas la taille des textes. */
    -webkit-text-size-adjust:100%;
    /* Dans l'application Android, la page vit dans une vue qui occupe tout
       l'écran : sans cela, tirer vers le bas déclenche le rafraîchissement. */
    overscroll-behavior-y:contain;
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Figtree',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    /* Pas de halo gris au toucher : l'interface signale déjà ses états. */
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:inherit;letter-spacing:-0.02em;}
  button{font-family:inherit;}
  a{color:var(--primary);text-decoration:none;}
  a:hover{color:var(--primary-dark);text-decoration:underline;}

  /* Chiffres techniques : Space Grotesk + tabular nums (spec README) */
  .num,.stat-card .num,.counter,.ref-table .counter{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;}

  /* ------------------------------------------------------------
     Coquille : sidebar (desktop) / barre d'onglets (mobile)
     ------------------------------------------------------------ */
  /* 100dvh suit la hauteur réellement visible quand la barre d'adresse du
     navigateur se replie. Dans l'application Android, les deux sont égaux ;
     100vh reste écrit avant, en repli pour les navigateurs qui ignorent dvh. */
  .shell{display:flex;min-height:100vh;min-height:100dvh;align-items:stretch;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  /* Les marges de sécurité épousent l'encoche, l'horloge et la barre de gestes.
     Dans un navigateur de bureau, toutes ces valeurs valent zéro. */
  .content{
    width:100%;max-width:1180px;margin:0 auto;
    padding:calc(18px + env(safe-area-inset-top,0px))
            calc(16px + env(safe-area-inset-right,0px))
            104px
            calc(16px + env(safe-area-inset-left,0px));
  }
  /* Bandeau « hors connexion » : l'application montre les dernières données
     connues et le dit clairement, plutôt que d'afficher un écran d'erreur. */
  /* Erreur inattendue : une fonction async qui échoue sans message laisse
     l'utilisateur devant un bouton qui « ne fait rien ». On affiche donc
     l'erreur, en clair, avec la possibilité de la fermer. */
  .erreur-globale{
    position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;
    background:var(--alert-bg);border:1px solid var(--alert);color:var(--dark-ink);
    border-radius:var(--r-md);padding:12px 44px 12px 14px;font-size:13px;line-height:1.5;
    box-shadow:0 10px 30px rgba(13,20,36,.18);
  }
  .erreur-globale strong{display:block;margin-bottom:2px;}
  .erreur-globale code{font-size:12px;word-break:break-word;}
  .erreur-globale .fermer{
    position:absolute;top:6px;right:8px;border:none;background:transparent;
    font-size:18px;line-height:1;cursor:pointer;color:var(--ink-2);padding:6px;
  }
  .offline-banner{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    background:var(--soon-bg);color:var(--soon-ink);
    border:1px solid var(--primary-line);border-radius:var(--r-chip);
    padding:10px 12px;font-size:13px;font-weight:600;
  }
  .offline-banner .link-inline{color:inherit;text-decoration:underline;font-weight:700;}
  .view{display:flex;flex-direction:column;gap:16px;}

  .sidebar{display:none;}

  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:6;
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;padding:7px 0;cursor:pointer;
    font-size:10.5px;font-weight:600;color:var(--ink-4);
    /* Cible tactile confortable au pouce : la zone utile dépasse 44 px. */
    min-height:48px;
  }
  .tab .tab-icon{font-size:16px;line-height:1;}
  .tab.is-active{color:var(--primary);font-weight:700;}
  .tab-fab{
    flex:0 0 58px;display:flex;justify-content:center;background:none;border:none;cursor:pointer;
  }
  .tab-fab span{
    width:50px;height:50px;border-radius:16px;background:var(--primary);color:#fff;
    font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-fab);transition:transform .12s ease;
  }
  .tab-fab:active span{transform:scale(.96);}

  @media (min-width:900px){
    .sidebar{
      display:flex;flex-direction:column;gap:5px;
      width:198px;flex:0 0 198px;background:var(--dark);padding:22px 16px;
      position:sticky;top:0;height:100vh;
    }
    .sidebar .wordmark{font-size:16px;font-weight:800;color:#fff;letter-spacing:-0.01em;padding-bottom:18px;}
    .sidebar .wordmark em{font-style:normal;color:var(--ok-accent);}
    .sidebar .nav-item{
      display:block;width:100%;text-align:left;border:none;cursor:pointer;background:none;
      font-size:13.5px;font-weight:600;color:var(--dark-ink);padding:10px 12px;border-radius:9px;
    }
    .sidebar .nav-item:hover{color:#fff;background:rgba(255,255,255,.06);}
    .sidebar .nav-item.is-active{color:#fff;background:var(--dark-2);font-weight:700;}
    .sidebar .sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;}
    .sidebar .sidebar-foot button{
      background:none;border:none;color:var(--dark-ink);font-size:13px;font-weight:600;
      text-align:left;padding:8px 12px;border-radius:9px;cursor:pointer;
    }
    .sidebar .sidebar-foot button:hover{color:#fff;}
    .tabbar{display:none;}
    .content{padding:26px 28px 60px;}
    .view{gap:20px;}
  }

  /* ------------------------------------------------------------
     En-tête
     ------------------------------------------------------------ */
  .page-head{display:flex;flex-direction:column;gap:12px;}
  .greeting-row{display:flex;justify-content:space-between;align-items:center;gap:14px;}
  .greeting{display:flex;flex-direction:column;}
  .greeting .hello{font-size:13px;font-weight:600;color:var(--ink-2);}
  .greeting .count{font-size:24px;font-weight:800;letter-spacing:-0.02em;}
  .avatar{
    width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;
    font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .avatar.sm{width:30px;height:30px;font-size:12px;}

  .head-title{display:none;}
  .head-title h1{margin:0;font-size:26px;font-weight:800;}
  .head-title .sub{font-size:13.5px;color:var(--ink-2);margin-top:4px;}

  @media (min-width:900px){
    .greeting-row{display:none;}
    .head-title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;}
  }

  /* Boutons */
  .btn-primary{
    background:var(--primary);color:#fff;border:none;border-radius:11px;
    font-size:14px;font-weight:700;padding:12px 18px;cursor:pointer;
    transition:background .15s ease,transform .1s ease;
  }
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-tint{
    background:var(--primary-tint);color:var(--primary-dark);border:1px solid var(--primary-tint-2);
    border-radius:11px;font-size:13.5px;font-weight:700;padding:9px 14px;cursor:pointer;
  }
  .btn-tint:hover{background:var(--primary-tint-2);}
  .link-inline{
    background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
    color:var(--primary);font-size:13.5px;font-weight:700;
  }
  .link-inline:hover{color:var(--primary-dark);text-decoration:underline;}

  /* ------------------------------------------------------------
     Cartes
     ------------------------------------------------------------ */
  .card{
    background:var(--surface);border-radius:var(--r-card);padding:18px 20px;
    box-shadow:var(--shadow-soft);display:flex;flex-direction:column;gap:12px;
  }
  .card-head{display:flex;align-items:center;gap:10px;}
  .card-title{margin:0;font-size:16px;font-weight:800;}
  .card-title-sm{font-size:15px;font-weight:700;}
  .card-head .spacer{margin-left:auto;}
  .muted-text{font-size:13.5px;line-height:1.5;color:var(--ink-2);margin:0;}

  /* Grille des compteurs */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat-card{
    background:var(--surface);border-radius:14px;padding:16px 18px;
    box-shadow:var(--shadow-soft);display:flex;flex-direction:column;gap:5px;
  }
  .stat-card .num{font-size:28px;font-weight:700;line-height:1;}
  .stat-card .num.late{color:var(--late-ink);}
  .stat-card .num.soon{color:var(--soon-ink);}
  .stat-card .num.ok{color:var(--ok-ink);}
  .stat-card .num.primary{color:var(--primary);}
  .stat-card .lbl{font-size:12.5px;font-weight:600;color:var(--ink-2);}
  @media (min-width:900px){ .stat-grid{grid-template-columns:repeat(4,1fr);gap:14px;} }

  /* Carte prioritaire (violette) */
  .priority{
    background:var(--primary);border-radius:14px;padding:16px;color:#fff;
    display:flex;flex-direction:column;gap:12px;
  }
  .priority-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--primary-tint-2);}
  .pill-late{font-size:11px;font-weight:800;background:var(--late);color:#fff;padding:4px 8px;border-radius:var(--r-pill);}
  .pill-soon{font-size:11px;font-weight:800;background:var(--soon);color:#fff;padding:4px 8px;border-radius:var(--r-pill);}
  .priority h2{margin:0;font-size:22px;font-weight:800;line-height:1.15;}
  .priority .machine-name{font-size:14px;color:rgba(255,255,255,.82);}
  .priority-stats{display:flex;gap:20px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);}
  .priority-stats .stat{display:flex;flex-direction:column;gap:2px;}
  .priority-stats .val{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
  .priority-stats .key{font-size:11px;font-weight:600;color:var(--primary-tint-2);}
  .priority-actions{display:flex;gap:8px;}
  .priority-actions button{
    flex:1;font-size:13px;font-weight:700;padding:11px 0;border-radius:12px;cursor:pointer;
  }
  .priority-actions .do{background:#fff;color:var(--primary);border:none;}
  .priority-actions .see{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);}
  @media (min-width:900px){
    .priority{flex-direction:row;align-items:center;gap:28px;flex-wrap:wrap;}
    .priority .priority-body{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px;}
    .priority-stats{border-top:none;padding-top:0;}
    .priority-actions{flex:0 0 auto;min-width:260px;}
  }

  /* Liste des échéances */
  .alert-list{display:flex;flex-direction:column;}
  .alert-row{
    display:flex;align-items:center;gap:14px;padding:13px 0;
    border-bottom:1px solid var(--line-2);background:none;border-left:none;border-right:none;border-top:none;
    width:100%;text-align:left;cursor:pointer;
  }
  .alert-row:last-child{border-bottom:none;}
  .alert-bar{width:4px;height:38px;border-radius:4px;flex-shrink:0;}
  .alert-bar.late{background:var(--late);}
  .alert-bar.soon{background:var(--soon);}
  .alert-bar.ok{background:var(--ok);}
  .alert-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .alert-title{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .alert-sub{font-size:12.5px;color:var(--ink-2);}
  .alert-due{font-size:12.5px;font-weight:700;white-space:nowrap;}
  .alert-due.late{color:var(--late-ink);}
  .alert-due.soon{color:var(--soon-ink);}
  .alert-due.ok{color:var(--ok-ink);}

  /* Bloc IA */
  .chip-icon{
    width:30px;height:30px;border-radius:9px;background:var(--primary-tint);color:var(--primary);
    font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .pill{font-size:11px;font-weight:700;padding:4px 8px;border-radius:var(--r-pill);}
  .pill.ok{color:var(--ok-ink);background:var(--ok-bg);}
  .pill.soon{color:var(--soon-ink);background:var(--soon-bg);}
  .pill.late{color:var(--late-ink);background:var(--late-bg);}
  .pill.neutral{color:var(--ink-2);background:var(--surface-soft);}
  .ai-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;}
  .ai-row span:first-child{color:var(--ink);font-weight:600;}
  .ai-row span:last-child{color:var(--ink-2);}

  /* Zone de dépôt PDF */
  .dropzone{
    background:var(--primary-tint);border:1px dashed var(--primary-line);border-radius:var(--r-card);
    padding:20px;display:flex;flex-direction:column;gap:9px;align-items:flex-start;cursor:pointer;
    transition:background .15s ease,border-color .15s ease;
  }
  .dropzone:hover,.dropzone.is-over{background:rgba(99,102,241,.16);border-color:var(--primary);}
  .dropzone .dz-icon{font-size:22px;color:var(--primary);}
  .dropzone .dz-title{font-size:15px;font-weight:800;}
  .dropzone .dz-help{font-size:13px;line-height:1.5;color:var(--ink-2);}

  /* Rappels */
  .switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .switch-row .switch-label{font-size:13.5px;color:var(--ink-2);}
  .switch{
    width:38px;height:22px;border-radius:var(--r-pill);background:rgba(14,19,51,.16);border:none;cursor:pointer;
    display:flex;align-items:center;padding:2px;flex-shrink:0;transition:background .15s ease;
  }
  .switch span{width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s ease;}
  .switch.on{background:var(--primary);justify-content:flex-end;}

  /* ------------------------------------------------------------
     Vue Parc : cartes machine (compat. avec le JS existant)
     ------------------------------------------------------------ */
  .machine{
    background:var(--surface);border-radius:14px;box-shadow:var(--shadow-soft);
    padding:16px 18px;display:flex;flex-direction:column;gap:14px;
  }
  .machine.is-alert{border-left:4px solid var(--late);}
  .machine.is-soon{border-left:4px solid var(--soon);}
  .machine.is-ok,.machine.is-unknown{border-left:4px solid var(--ok);}
  .m-main .name{font-size:17px;font-weight:700;}
  .m-main .meta{color:var(--ink-2);font-size:14px;margin-top:4px;line-height:1.5;}
  .m-side{display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
  .m-actions{display:flex;flex-wrap:wrap;gap:6px;}
  .badge{
    display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;
    letter-spacing:.02em;padding:5px 12px;border-radius:var(--r-pill);border:none;
  }
  .badge.ok{color:var(--ok-ink);background:var(--ok-bg);}
  .badge.soon{color:var(--soon-ink);background:var(--soon-bg);}
  .badge.alert{color:var(--late-ink);background:var(--late-bg);}
  .badge.neutral{color:var(--ink-2);background:var(--surface-soft);}
  .due{font-size:13.5px;color:var(--ink-2);font-weight:600;}
  @media (min-width:900px){
    .machine{flex-direction:row;justify-content:space-between;gap:18px;}
    .m-side{align-items:flex-end;}
    .m-actions{justify-content:flex-end;}
  }

  .btn-row-action{
    font-size:13px;font-weight:700;cursor:pointer;border-radius:var(--r-pill);padding:7px 13px;
    white-space:nowrap;border:1px solid transparent;background:var(--surface-soft);color:var(--ink-2);
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .btn-row-action:hover{background:var(--primary-tint);border-color:var(--primary-tint-2);color:var(--primary-dark);}
  .log-intervention-btn{background:var(--primary);color:#fff;}
  .log-intervention-btn:hover{background:var(--primary-dark);color:#fff;border-color:transparent;}
  .view-plan-btn,.next-maint-btn{background:var(--surface);border-color:var(--line);color:var(--ink);}

  .view-manual{
    display:inline-block;background:var(--primary-tint);border:1px solid var(--primary-tint-2);
    color:var(--primary-dark);font-size:12.5px;font-weight:700;padding:5px 12px;
    border-radius:var(--r-pill);cursor:pointer;font-family:inherit;
  }
  .view-manual:hover{background:var(--primary-tint-2);}
  .machine-photo{
    display:block;width:100%;max-width:220px;aspect-ratio:16/9;object-fit:contain;
    border-radius:var(--r-chip);margin-top:12px;border:1px solid var(--line);background:var(--surface-soft);
  }

  /* ------------------------------------------------------------
     Vue Manuels & IA
     ------------------------------------------------------------ */
  .manual-row{
    display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2);
  }
  .manual-row:last-child{border-bottom:none;}
  .manual-row .mr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .manual-row .mr-title{font-size:14.5px;font-weight:700;}
  .manual-row .mr-sub{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ------------------------------------------------------------
     Vue Agenda
     ------------------------------------------------------------ */
  .agenda-month{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 2px;}

  /* ------------------------------------------------------------
     Modales et formulaires (classes partagées avec le JS existant)
     ------------------------------------------------------------ */
  .overlay{
    position:fixed;inset:0;background:rgba(13,20,36,.55);backdrop-filter:blur(2px);
    display:flex;align-items:flex-start;justify-content:center;
    padding:24px 14px;overflow-y:auto;z-index:20;
  }
  .modal{
    background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card);
    max-width:480px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(13,20,36,.24);
  }
  .modal h2{font-size:21px;font-weight:800;margin:0 0 5px;}
  .modal .sub{color:var(--ink-2);font-size:14.5px;margin:0 0 18px;line-height:1.5;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .plan-modal .modal{max-width:660px;}

  label{display:block;font-size:14px;font-weight:700;margin-bottom:6px;margin-top:15px;color:var(--ink);}
  input,select,textarea{
    width:100%;padding:11px 13px;border:1.5px solid transparent;border-radius:var(--r-chip);
    background:var(--surface-soft);font-family:inherit;font-size:16px;color:var(--ink);
    transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-tint);background:var(--surface);
  }
  textarea{resize:vertical;min-height:64px;}
  /* Deux champs côte à côte n'ont pas toujours des étiquettes de même hauteur :
     « Échéance toutes les (jours) » tient sur deux lignes quand « Rappel avant
     (jours) » n'en occupe qu'une, et les deux champs se retrouvaient décalés
     verticalement. En alignant les colonnes par le BAS, les champs restent
     alignés quelle que soit la longueur des étiquettes. */
  .field-row{display:flex;gap:12px;align-items:flex-end;}
  /* Sur téléphone, deux ou trois champs côte à côte deviennent des colonnes
     étroites : « Marque », « Modèle » et « Année » se réduisaient à quelques
     caractères. En dessous de 600 px, ils s'empilent. */
  @media (max-width: 600px){
    .field-row{flex-direction:column;align-items:stretch;gap:10px;}
    .field-row > div{width:100%;}
  }
  .field-row > div{flex:1;min-width:0;}
  .hint{font-size:13.5px;color:var(--ink-2);margin-top:6px;line-height:1.5;}
  .error{color:var(--late-ink);font-size:14px;margin-top:12px;font-weight:600;}

  button.primary{
    flex:1;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:var(--r-pill);
    font-weight:700;font-size:16px;cursor:pointer;box-shadow:var(--shadow-soft);
    transition:background .15s ease,transform .1s ease;
  }
  button.primary:hover{background:var(--primary-dark);}
  button.primary:active{transform:scale(.98);}
  button.secondary{
    flex:1;padding:12px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);
    border-radius:var(--r-pill);font-weight:700;font-size:16px;cursor:pointer;
    transition:border-color .15s ease,background .15s ease;
  }
  button.secondary:hover{border-color:var(--ink-2);background:var(--surface-soft);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .delete-link{
    display:block;margin-top:16px;text-align:center;background:none;border:none;
    color:var(--late-ink);font-size:14px;font-family:inherit;font-weight:700;cursor:pointer;padding:6px;width:100%;
  }
  .delete-link:hover{text-decoration:underline;}

  /* Connexion / inscription */
  /* Présentation publique : la page d'entrée doit dire ce qu'est le produit
     AVANT de demander un mot de passe. L'audit externe a raison sur ce point —
     un écran de connexion seul ne vend rien et ne se référence pas. */
  .presentation-publique{
    margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2);text-align:left;
  }
  .pres-promesse{margin:0 0 10px;font-size:13.5px;color:var(--ink-2);line-height:1.55;}
  .pres-points{margin:0 0 10px;padding-left:18px;font-size:13px;color:var(--ink-2);line-height:1.6;}
  .pres-points li{margin-bottom:3px;}
  .pres-lien{font-size:13.5px;font-weight:700;color:var(--primary-dark);text-decoration:none;}
  .pres-lien:hover{text-decoration:underline;}
  .login-box{
    max-width:380px;margin:10vh auto 0;padding:32px 28px;border:1px solid var(--line-2);
    background:var(--surface);border-radius:28px;box-shadow:0 24px 60px rgba(13,20,36,.16);
  }
  .login-box h1{margin:0 0 6px;font-size:24px;font-weight:800;text-align:center;display:block;}
  .login-box p{color:var(--ink-2);font-size:14.5px;margin-top:0;margin-bottom:20px;text-align:center;}
  .avatar-badge{
    width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;
    margin:0 auto 14px;box-shadow:0 8px 18px rgba(99,102,241,.28);
  }
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:76px;}
  .toggle-pw-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--primary);font-size:12.5px;font-weight:700;cursor:pointer;padding:6px 8px;
    border-radius:8px;
  }
  .toggle-pw-btn:hover{background:var(--surface-soft);}
  /* Une fois le mot de passe affiché, le bouton s'efface : c'est l'état du champ
     qui compte, pas le bouton. */
  .toggle-pw-btn[aria-pressed="true"]{color:var(--ink-2);}
  .signup-link-btn{width:100%;margin-top:10px;flex:none;}
  .forgot-pw-row{text-align:right;margin-top:10px;}
  .legal-footer{text-align:center;margin-top:24px;font-size:12.5px;color:var(--ink-2);}
  .legal-footer a{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;}
  .legal-footer a:hover{color:var(--primary-dark);}

  /* Assistants par étapes (ajout de machine) */
  .step-back{
    background:none;border:none;color:var(--ink-2);font-size:14px;cursor:pointer;
    font-family:inherit;font-weight:600;padding:0;margin-bottom:14px;
  }
  .step-back:hover{color:var(--ink);}
  .step-options{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .option-tile{
    text-align:left;padding:15px 17px;border:1.5px solid var(--line);background:var(--surface);
    border-radius:var(--r-card);font-family:inherit;font-size:15.5px;font-weight:700;color:var(--ink);
    cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease,transform .1s ease;
  }
  .option-tile:hover{border-color:var(--primary);box-shadow:var(--shadow-card);transform:translateY(-1px);}
  .opt-sub{display:block;font-weight:500;font-size:13.5px;color:var(--ink-2);margin-top:3px;}
  a.option-tile{display:block;text-decoration:none;border-color:var(--primary-tint-2);background:var(--primary-tint);color:var(--primary-dark);}
  a.option-tile:hover{border-color:var(--primary);}

  .checklist{display:flex;flex-direction:column;gap:9px;margin:10px 0 18px;}
  .checklist label{display:flex;align-items:center;gap:9px;font-weight:500;font-size:15.5px;margin:0;}
  .checklist input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);flex:0 0 auto;}
  .track-mode-choice{display:flex;gap:20px;margin:8px 0 6px;flex-wrap:wrap;}
  .track-mode-choice label{display:flex;align-items:center;gap:7px;font-weight:500;font-size:15.5px;margin:0;cursor:pointer;}
  .track-mode-choice input{width:17px;height:17px;accent-color:var(--primary);flex:0 0 auto;}

  /* Détail du plan */
  .due-hero{
    padding:15px 17px;border-radius:14px;font-size:16px;font-weight:700;text-align:center;line-height:1.4;
  }
  .due-hero.ok{background:var(--ok-bg);color:var(--ok-ink);}
  .due-hero.soon{background:var(--soon-bg);color:var(--soon-ink);}
  .due-hero.alert{background:var(--late-bg);color:var(--late-ink);}
  .plan-field{margin-bottom:15px;}
  .plan-field .label{font-size:12px;font-weight:800;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.06em;}
  .plan-field .value{font-size:16px;margin-top:3px;line-height:1.5;}
  .plan-tasks{margin:6px 0 0;padding-left:18px;}
  .plan-tasks li{font-size:15px;margin-bottom:5px;line-height:1.5;}
  .attention-box{
    background:var(--soon-bg);border:1px solid rgba(222,122,22,.35);border-radius:var(--r-chip);
    padding:13px 15px;font-size:14px;line-height:1.6;margin-top:4px;color:var(--soon-ink);
  }
  .ref-table{
    width:100%;border-collapse:separate;border-spacing:0;margin-top:8px;font-size:14px;
    border:1px solid var(--line);border-radius:var(--r-chip);overflow:hidden;
  }
  .ref-table th{
    background:var(--primary-tint);color:var(--primary-dark);font-size:11.5px;text-transform:uppercase;
    letter-spacing:.05em;text-align:left;padding:9px 10px;font-weight:800;
  }
  .ref-table td{padding:9px 10px;border-top:1px solid var(--line-2);vertical-align:top;}
  .ref-table tr:nth-child(even) td{background:var(--surface-soft);}
  .ref-table td.item-label{font-weight:700;}
  .ref-table td.muted,.muted{color:var(--ink-4);}
  .history-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  .history-actions{display:flex;gap:6px;}
  .icon-btn{
    background:var(--surface-soft);border:1px solid var(--line);color:var(--ink-2);
    font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:var(--r-pill);cursor:pointer;font-family:inherit;
  }
  .icon-btn:hover{background:var(--primary-tint);border-color:var(--primary-tint-2);color:var(--primary-dark);}
  .icon-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* États vides et chargement */
  .empty{
    border:1.5px dashed var(--line);border-radius:var(--r-card);padding:34px 20px;text-align:center;
    color:var(--ink-2);font-size:15px;background:var(--surface);
  }
  .empty-soft{
    padding:18px 0;text-align:center;color:var(--ink-2);font-size:14px;
  }
  .loading{color:var(--ink-2);font-size:15px;padding:70px 0;text-align:center;}

  /* Feuille « Plus » (mobile) */
  .sheet{
    background:var(--surface);border-radius:var(--r-card) var(--r-card) 0 0;width:100%;max-width:520px;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;gap:8px;margin-top:auto;
  }
  .sheet-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:none;border:none;padding:14px 12px;border-radius:12px;cursor:pointer;
    font-size:15.5px;font-weight:600;color:var(--ink);font-family:inherit;
  }
  .sheet-item:hover{background:var(--surface-soft);}
  .sheet .sheet-title{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:0 12px 4px;}

  /* Grille du tableau de bord */
  #view-root{display:flex;flex-direction:column;gap:16px;}
  .dash-grid{display:flex;flex-direction:column;gap:16px;}
  .dash-side{display:flex;flex-direction:column;gap:16px;}

  /* Aides d'affichage responsive */
  .mobile-only{display:flex;}
  @media (min-width:900px){
    #view-root{gap:20px;}
    .dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;}
    .mobile-only{display:none;}
  }

  /* Carte prioritaire : corps empilé (mobile) puis en ligne (desktop) */
  .priority .priority-body{display:flex;flex-direction:column;gap:8px;}
  @media (min-width:900px){
    .priority .priority-body{flex:1;min-width:220px;}
  }

  .manual-row{flex-wrap:wrap;}
  .manual-row .mr-main{min-width:140px;}

  /* ------------------------------------------------------------
     Ergonomie : barre d'outils du parc
     ------------------------------------------------------------ */
  .toolbar{display:flex;flex-direction:column;gap:10px;}
  .toolbar-top{display:flex;flex-direction:column;gap:10px;}
  .toolbar-bottom{display:flex;flex-direction:column;gap:10px;}
  .search-wrap{position:relative;display:flex;align-items:center;}
  .search-wrap .search-icon{
    position:absolute;left:14px;font-size:17px;color:var(--ink-3);pointer-events:none;
  }
  .search-wrap input[type=search]{
    padding-left:38px;background:var(--surface);border:1.5px solid var(--line);
    min-height:46px;
  }
  .search-wrap input[type=search]:focus{border-color:var(--primary);}
  .search-wrap input[type=search]::-webkit-search-cancel-button{cursor:pointer;}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
  /* Préparation des entretiens : ce qu'il faut se procurer, et pour quand. */
  .prep-horizon{display:flex;gap:6px;margin-left:auto;}
  .prep-horizon .chip{min-height:32px;padding:5px 12px;font-size:12.5px;}
  .prep-produit{padding:12px 0;border-top:1px solid var(--line-2);}
  .prep-produit:first-child{border-top:none;padding-top:4px;}
  .prep-nom{font-size:14.5px;font-weight:700;line-height:1.4;}
  .prep-spec{font-weight:600;color:var(--ink-2);}
  .prep-total{
    font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;
    font-size:12.5px;font-weight:700;color:var(--ok-ink);
    background:var(--ok-bg);border-radius:var(--r-pill);padding:2px 9px;margin-left:6px;
  }
  .prep-besoins{font-size:13px;color:var(--ink-2);line-height:1.6;margin-top:4px;}
  .prep-quand{color:var(--ink-3);}
  /* Regroupement par famille de produits (filtres, huiles, graisses…). Un
     <details> natif : repliable sans une ligne de JavaScript, et le résumé reste
     lisible — nom de la famille, nombre de références, première échéance. */
  .prep-groupe{border:1px solid var(--line);border-radius:var(--r-md);margin-top:10px;overflow:hidden;}
  .prep-groupe>summary{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:11px 13px;cursor:pointer;list-style:none;font-size:14px;font-weight:700;
  }
  .prep-groupe>summary::-webkit-details-marker{display:none;}
  .prep-groupe>summary::after{content:'▸';color:var(--ink-3);font-size:12px;}
  .prep-groupe[open]>summary::after{content:'▾';}
  .prep-groupe[open]>summary{border-bottom:1px solid var(--line-2);}
  .prep-groupe-meta{font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap;}
  .prep-groupe-corps{padding:0 13px 6px;}
  .prep-groupe-corps .prep-produit:first-child{border-top:none;padding-top:8px;}

  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    background:var(--surface);border:1.5px solid var(--line);color:var(--ink-2);
    border-radius:var(--r-pill);padding:8px 14px;font-family:inherit;
    font-size:13.5px;font-weight:700;min-height:38px;white-space:nowrap;
  }
  .chip:hover{border-color:var(--primary-line);color:var(--primary-dark);}
  .chip.is-active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .chip .chip-count{
    font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;
    font-size:12.5px;font-weight:700;opacity:.75;
  }
  .chip.is-active .chip-count{opacity:.9;}

  .sort-wrap{display:flex;align-items:center;gap:8px;}
  .sort-wrap select{min-height:42px;background:var(--surface);border:1.5px solid var(--line);}

  .fleet-count{font-size:12.5px;font-weight:600;color:var(--ink-2);}
  #fleet-list{display:flex;flex-direction:column;gap:14px;}

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }

  /* Vérification e-mail : renvoi du code */
  .resend-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .resend-row .hint{margin:0;}

  /* Marque et modèle sont saisis en majuscules : la transformation est aussi
     appliquée à la valeur elle-même (voir forcerMajuscules), ceci n'est qu'un
     filet visuel pour le collage et le remplissage automatique. */
  input.majuscules{text-transform:uppercase;}

  /* Téléphone : indicatif du pays + masque de saisie adapté */
  .tel-champ{display:flex;gap:8px;align-items:stretch;}
  .tel-champ .tel-pays{flex:0 1 auto;max-width:62%;}
  .tel-champ input{flex:1 1 38%;min-width:0;}

  /* Case à cocher isolée (option de l'assistant) */
  /* Choix de la langue : deux drapeaux, avec leur nom à côté — un drapeau est
     un pays, pas une langue, et le nom lève l'ambiguïté pour tout le monde. */
  .lang-switch{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
  .lang-btn{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--surface);border:1.5px solid var(--line);color:var(--ink-2);
    border-radius:var(--r-pill);padding:6px 13px;min-height:36px;
    font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  }
  .lang-btn:hover{border-color:var(--primary-line);color:var(--primary-dark);}
  .lang-btn.is-active{background:var(--primary-tint);border-color:var(--primary-line);color:var(--primary-dark);}
  .lang-drapeau{font-size:15px;line-height:1;}

  .check-row{
    display:flex;align-items:center;gap:10px;margin-top:18px;cursor:pointer;
    font-size:14.5px;font-weight:600;color:var(--ink);
  }
  .check-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);flex:0 0 auto;}
  .check-row + .hint{margin-top:6px;}

  /* ------------------------------------------------------------
     Confirmations d'action (toasts)
     ------------------------------------------------------------ */
  .toast-host{
    position:fixed;left:0;right:0;z-index:40;pointer-events:none;
    bottom:calc(86px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;
  }
  .toast{
    background:var(--dark);color:#fff;font-size:14px;font-weight:600;
    padding:12px 18px;border-radius:var(--r-pill);max-width:420px;text-align:center;
    box-shadow:0 12px 28px rgba(13,20,36,.28);
    opacity:0;transform:translateY(8px);
    transition:opacity .18s ease,transform .18s ease;
  }
  .toast.is-on{opacity:1;transform:translateY(0);}

  @media (min-width:900px){
    .toast-host{bottom:24px;}
    .toolbar{gap:12px;}
    .toolbar-top{flex-direction:row;align-items:center;gap:12px;}
    .toolbar-top .search-wrap{flex:1;min-width:220px;}
    .toolbar-top .btn-primary{flex:0 0 auto;}
    .toolbar-bottom{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;}
    .chips{overflow:visible;}
  }

  /* ------------------------------------------------------------
     Cibles tactiles : usage terrain, parfois avec des gants

function langueDisponible(code) {
  return LANGUES.some((l) => l.code === code) && !!TEXTES[code];
}

// Langue de départ : celle choisie précédemment, sinon celle de l'appareil.
// Un utilisateur dont le téléphone est en anglais ne doit pas avoir à chercher
// le sélecteur pour comprendre l'écran de connexion.
function langueInitiale() {
  try {
    const choisie = localStorage.getItem(LANGUE_CLE);
    if (choisie && langueDisponible(choisie)) return choisie;
  } catch (err) { /* stockage indisponible */ }
  const appareil = (navigator.language || '').slice(0, 2).toLowerCase();
  return langueDisponible(appareil) ? appareil : 'fr';
}

// ⚠️ LA LANGUE EST ARRÊTÉE ICI, ET PAS PLUS BAS.
// Plusieurs libellés sont construits une seule fois, au chargement du script —
// libellés de navigation, titres de vues, unités de compteur : `t()` y est
// appelé à la construction des objets. Initialiser la langue à la fin du script
// les laissait donc en français pour toujours, y compris après un rechargement.
// C'est exactement ce qui s'est produit, et ce que l'utilisateur a vu.
let LANGUE = langueInitiale();

function trad(texte) {
  const table = TEXTES[LANGUE];
  if (!table) return texte;
  return Object.prototype.hasOwnProperty.call(table, texte) ? table[texte] : texte;
}

// Applique la langue partout : la fonction trad(), l'attribut lang du document
// (lecteurs d'écran et césure), et un rechargement.
//
// POURQUOI RECHARGER plutôt que re-rendre : plusieurs libellés sont construits
// UNE FOIS au chargement du script — libellés de navigation, titres de vues,
// unités de compteur — parce que t() y est appelé à la construction des objets.
// Un simple re-rendu laisserait donc ces libellés dans l'ancienne langue, et il
// faudrait traquer chaque valeur figée, aujourd'hui et à chaque ajout. Le
// rechargement garantit que TOUT repasse par t(), pour un coût nul : les
// fichiers sont embarqués dans l'application.
function changerLangue(code, options) {
  const choisie = langueDisponible(code) ? code : 'fr';
  const change = choisie !== LANGUE;
  LANGUE = choisie;
  try { localStorage.setItem(LANGUE_CLE, choisie); } catch (err) { /* sans conséquence */ }
  try { document.documentElement.lang = choisie; } catch (err) { /* document absent */ }
  if (options && options.silencieux) return;
  if (change && window.location && typeof window.location.reload === 'function') {
    window.location.reload();
    return;
  }
  if (UI && UI.view) renderApp();
  else renderLogin();
}

// Deux drapeaux, comme demandé. Le nom accompagne le drapeau : un drapeau est
// un pays, pas une langue, et « 🇬🇧 » seul ne dit pas « English » à tout le monde.
function basculeLangueHtml() {
  return `<div class="lang-switch" role="group" aria-label="${LANGUE === 'en' ? 'Language' : 'Langue'}">
      ${LANGUES.map((l) => `<button type="button" class="lang-btn${l.code === LANGUE ? ' is-active' : ''}"
        data-langue="${l.code}" aria-pressed="${l.code === LANGUE}" title="${esc(l.nom)}">
        <span class="lang-drapeau" aria-hidden="true">${l.drapeau}</span><span>${esc(l.nom)}</span>
      </button>`).join('')}
    </div>`;
}

// Interpolation pour les phrases construites : « échéance dans {n} jours ».
// Les chaînes purement dynamiques ne peuvent pas passer par t() au moment de
// l'extraction ; elles passent par ici, avec la phrase complète comme clé.
function tR(cle, valeurs) {
  const modele = trad(cle);
  return modele.replace(/\{(\w+)\}/g, (tout, nom) => (valeurs && nom in valeurs ? String(valeurs[nom]) : tout));
}

// Valeurs par défaut du plan « inactif » : on stocke toujours un intervalle
// cohérent dans les deux unités, même si la machine ne suit qu'un seul mode.
const FALLBACK_INTERVAL_DAYS = 90;
const FALLBACK_REMINDER_DAYS = 7;
const FALLBACK_INTERVAL_HOURS = 100;
const FALLBACK_REMINDER_HOURS = 10;

// Intervalle à proposer pour un mode donné.
//
// POURQUOI CETTE FONCTION EXISTE : sur une machine analysée en mode calendaire,
// le champ « Échéance » contenait 90 (le repli des JOURS). En basculant ensuite
// sur le compteur horaire, ce 90 restait dans le champ et partait en base comme
// « 90 heures » — alors que le carnet disait « premier entretien à 20 heures ».
// Le repli d'une unité ne doit JAMAIS servir dans l'autre.
function intervallePropose(mode, ai) {
  const valeurs = ai || {};
  if (mode === 'days') {
    const jours = Number(valeurs.days);
    return Number.isFinite(jours) && jours > 0 ? jours : FALLBACK_INTERVAL_DAYS;
  }
  const heures = Number(valeurs.hours);
  return Number.isFinite(heures) && heures > 0 ? heures : FALLBACK_INTERVAL_HOURS;
}

// Ce que l'appareil sait déjà de l'analyse en cours : les deux unités proposées
// par l'IA, retenues sur l'élément de la modale.
function intervallesIA(overlay) {
  return { days: overlay && overlay._aiIntervalDays, hours: overlay && overlay._aiIntervalHours };
}
const HISTORY_ROWS_IN_MODAL = 50;

// Échappe une valeur destinée à du HTML (texte ou attribut entre guillemets).
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// N'autorise que les URL http(s) : bloque javascript:, data:, etc.
function safeUrl(u) {
  const s = String(u ?? '').trim();
  return /^https?:\/\//i.test(s) ? s : '';
}

// Dates « AAAA-MM-JJ » traitées en heure locale : évite les décalages de fuseau.
function todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function addDaysIso(isoDateStr, days) {
  const [y, m, d] = String(isoDateStr).split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + (Number(days) || 0));
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
}
// Nombre de jours entiers entre aujourd'hui (minuit local) et la date visée.
// 0 = aujourd'hui, -1 = hier. Pas de Math.ceil : plus de « en retard » décalé.
function daysUntil(isoDateStr) {
  const [y, m, d] = String(isoDateStr).split('-').map(Number);
  if (!y || !m || !d) return null;
  const target = new Date(y, m - 1, d);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
}

// Les items du plan viennent soit de l'IA (objets), soit d'anciens enregistrements
// (chaînes simples) : on normalise pour ne plus perdre l'affichage.
function normalizeItems(raw) {
  if (!Array.isArray(raw)) return [];
  return raw
    .map(it => (typeof it === 'string' ? { label: it } : (it && typeof it === 'object' ? it : null)))
    .filter(it => it && (it.label || it.frequency || it.spec || it.qty || it.note));
}

// ── Modèle « compteur » générique (heures ou kilomètres) ──────
// Schéma cible : machines.counter_unit + machines.counter_value, et sur le plan
// interval_counter / next_due_counter / reminder_counter_before, avec
// tracking_mode ∈ {days, hours, km}.
// Tant que la migration n'est pas exécutée, l'application retombe sur les
// colonnes historiques : elle fonctionne donc AVANT et APRÈS la migration.
const SCHEMA = { hasCounter: false, hasBrandModel: false, hasContactNames: false, hasKind: false, hasPlate: false, hasModelYear: false };

// --- Version affichée, et filet de sécurité ----------------------------------
//
// VERSION : quand un utilisateur signale « ça ne marche plus », la première
// question est de savoir QUELLE version il utilise. Sans repère, on cherche à
// l'aveugle — c'est arrivé. La date du fichier servi répond sans aucun outil :
// dans le navigateur comme dans l'application, elle change à chaque publication.
function versionAffichee() {
  try {
    const brut = document.lastModified;
    const quand = brut ? new Date(brut) : null;
    if (!quand || Number.isNaN(quand.getTime())) return trad('Inconnue');
    const deux = (n) => String(n).padStart(2, '0');
    return tR('{jour}/{mois}/{annee} à {heures}:{minutes}', {
      jour: deux(quand.getDate()), mois: deux(quand.getMonth() + 1), annee: quand.getFullYear(),
      heures: deux(quand.getHours()), minutes: deux(quand.getMinutes()),
    });
  } catch (err) {
    return trad('Inconnue');
  }
}

// ERREURS SILENCIEUSES : une erreur non rattrapée ne doit JAMAIS se traduire par
// « le bouton ne fait rien ». C'est exactement le défaut qui a coûté plusieurs
// allers-retours : on l'affiche donc à l'écran, avec le message brut — c'est ce
// message qui permet de corriger en une fois au lieu de deviner.
function afficherErreurGlobale(message) {
  try {
    const texte = String(message || '').trim();
    if (!texte) return;
    const deja = document.getElementById('erreur-globale');
    if (deja) deja.remove();
    const bloc = document.createElement('div');
    bloc.className = 'erreur-globale';
    bloc.id = 'erreur-globale';
    bloc.setAttribute('role', 'alert');
    bloc.innerHTML = `<strong>${esc(trad('Une erreur inattendue est survenue.'))}</strong>`
      + `<code>${esc(texte.slice(0, 300))}</code>`
      + `<button type="button" class="fermer" aria-label="${esc(trad('Fermer'))}">×</button>`;
    document.body.appendChild(bloc);
    const fermer = bloc.querySelector('.fermer');
    if (fermer) fermer.addEventListener('click', () => bloc.remove());
  } catch (err) {
    // Si même l'affichage de l'erreur échoue, il ne reste que la console.
    console.error('Erreur globale :', message);
  }
}

// Le garde-fou est conditionnel : dans un environnement sans écouteurs (tests,
// outils), il ne doit pas empêcher le reste du script de se charger.
if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('error', (evenement) => {
    afficherErreurGlobale(evenement && evenement.message ? evenement.message : 'erreur inconnue');
  });
  window.addEventListener('unhandledrejection', (evenement) => {
    const raison = evenement && evenement.reason;
    afficherErreurGlobale(raison && raison.message ? raison.message : String(raison || 'promesse rejetée'));
  });
}

// --- Contact de la société --------------------------------------------------
// Le schéma d'origine ne stockait qu'une chaîne « nom du contact ». La migration
// « compte » ajoute prénom et nom séparés ; sans elle, tout continue de
// fonctionner à partir de contact_name.
function contactFullName(first, last, secours = '') {
  const parts = [first, last].filter(Boolean);
  return parts.length ? parts.join(' ') : (secours || '');
}
function companyFirstName(c) {
  if (!c) return '';
  if (SCHEMA.hasContactNames && c.contact_first_name) return c.contact_first_name;
  return c.contact_name || '';
}
function companyLastName(c) {
  if (!c || !SCHEMA.hasContactNames || !c.contact_first_name) return '';
  return c.contact_last_name || '';
}
// Adresse email : contrôle volontairement simple, le serveur reste juge.
function emailValide(v) {
  return /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(String(v || '').trim());
}

const PAYS_TEL_DEFAUT = PAYS_TEL[0];

function paysTel(code) {
  return PAYS_TEL.find((p) => p.code === code) || PAYS_TEL_DEFAUT;
}
function chiffresMax(pays) {
  return pays.groupes.reduce((total, n) => total + n, 0);
}
// Drapeau dérivé du code ISO : les lettres A-Z deviennent des indicateurs
// régionaux Unicode. Évite de saisir soixante emoji à la main.
function drapeauDe(iso) {
  return String(iso).toUpperCase().replace(/[A-Z]/g, (c) => String.fromCodePoint(127397 + c.charCodeAt(0)));
}
function exempleNational(pays) {
  return pays.groupes.map((n) => '0'.repeat(n)).join(' ');
}
// Applique le découpage du pays, sans jamais dépasser le nombre de chiffres.
function formatNational(chiffres, pays) {
  const brut = String(chiffres || '').replace(/\D/g, '');
  if (!brut) return '';
  if (brut.length > chiffresMax(pays)) {
    // Valeur plus longue que le format du pays (donnée ancienne) : on la
    // conserve intégralement, groupée par paires, plutôt que de la tronquer.
    return brut.replace(/(\d{2})(?=\d)/g, '$1 ');
  }
  const morceaux = [];
  let position = 0;
  for (const taille of pays.groupes) {
    if (position >= brut.length) break;
    morceaux.push(brut.slice(position, position + taille));
    position += taille;
  }
  return morceaux.join(' ');
}
// Reconstitue pays + numéro national à partir de ce qui est stocké.
function parserTelephone(valeur) {
  const brut = String(valeur || '').trim();
  const chiffres = brut.replace(/\D/g, '');
  if (!chiffres) return { pays: PAYS_TEL_DEFAUT, national: '' };

  const parIndicatif = (liste) =>
    liste.slice().sort((a, b) => b.indicatif.length - a.indicatif.length)[0];

  if (brut.startsWith('+')) {
    const candidats = PAYS_TEL.filter((p) => chiffres.startsWith(p.indicatif));
    if (candidats.length) {
      const pays = parIndicatif(candidats);
      return { pays, national: chiffres.slice(pays.indicatif.length) };
    }
  } else {
    // Sans « + » : on ne reconnaît un indicatif que si la longueur totale
    // correspond EXACTEMENT au format du pays. Une condition plus souple
    // (« le reste tient dans le format ») ferait passer « 81 54 44 » pour un
    // numéro japonais (+81) suivi de 5444, au lieu d'un numéro calédonien.
    const candidats = PAYS_TEL.filter(
      (p) => chiffres.startsWith(p.indicatif) && chiffres.length - p.indicatif.length === chiffresMax(p)
    );
    if (candidats.length) {
      const pays = parIndicatif(candidats);
      return { pays, national: chiffres.slice(pays.indicatif.length) };
    }
  }
  return { pays: PAYS_TEL_DEFAUT, national: chiffres };
}
// Format de stockage : E.164 (« +687815444 »), celui qu'attendent les services
// de notification.
function telephoneE164(pays, national) {
  const chiffres = String(national || '').replace(/\D/g, '');
  return chiffres ? `+${pays.indicatif}${chiffres}` : '';
}
// Format lisible : « +687 81 54 44 ».
function telephoneLisible(valeur) {
  const { pays, national } = parserTelephone(valeur);
  return national ? `+${pays.indicatif} ${formatNational(national, pays)}` : '';
}

// Champ téléphone réutilisable : sélecteur de pays + saisie masquée.
function champTelephoneHtml(id, valeur, opts = {}) {
  const { pays, national } = parserTelephone(valeur);
  const desactive = opts.disabled ? ' disabled' : '';
  const requis = opts.required ? ' required' : '';
  return `
    <label for="${id}">${esc(opts.label || trad('Téléphone'))}</label>
    <div class="tel-champ">
      <select id="${id}-pays" class="tel-pays" aria-label="${trad('Pays de l\'indicatif')}"${desactive}>
        ${PAYS_TEL.map((p) => `<option value="${esc(p.code)}"${p.code === pays.code ? ' selected' : ''}>${drapeauDe(p.code)} +${esc(p.indicatif)} — ${esc(p.nom)}</option>`).join('')}
      </select>
      <input id="${id}" type="tel" inputmode="tel" autocomplete="tel-national"
             value="${esc(formatNational(national, pays))}"
             placeholder="${esc(exempleNational(pays))}"${desactive}${requis}>
    </div>
    ${opts.aide ? `<div class="hint">${esc(opts.aide)}</div>` : ''}`;
}

// Applique le masque à la frappe et tient le sélecteur et le champ cohérents.
function wireChampTelephone(root, id) {
  const select = root.querySelector(`#${id}-pays`);
  const input = root.querySelector(`#${id}`);
  if (!select || !input) return;

  const courant = () => paysTel(select.value);
  const reformater = (tronquer) => {
    const pays = courant();
    let chiffres = input.value.replace(/\D/g, '');
    if (tronquer) chiffres = chiffres.slice(0, chiffresMax(pays));
    input.value = formatNational(chiffres, pays);
    input.placeholder = exempleNational(pays);
    input.maxLength = chiffresMax(pays) + pays.groupes.length - 1;
  };

  input.addEventListener('input', () => reformater(true));
  input.addEventListener('blur', () => reformater(false));
  select.addEventListener('change', () => {
    // On conserve les chiffres saisis et on les redécoupe selon le nouveau pays.
    reformater(true);
    input.focus();
  });
  reformater(false);
}

// Lit la valeur saisie et la renvoie au format E.164.
function lireChampTelephone(root, id) {
  const select = root.querySelector(`#${id}-pays`);
  const input = root.querySelector(`#${id}`);
  if (!select || !input) return null;
  const pays = paysTel(select.value);
  const national = input.value.replace(/\D/g, '').slice(0, chiffresMax(pays));
  if (!national) return null;
  return { pays, national, e164: telephoneE164(pays, national), lisible: `+${pays.indicatif} ${formatNational(national, pays)}` };
}

// --- Marque et modèle -------------------------------------------------------
// Le schéma d'origine ne stockait qu'une chaîne « marque / modèle ». La
// migration ajoute deux colonnes distinctes ; en attendant, l'application
// reconstitue la chaîne et tout continue de fonctionner à l'identique.
function designation(brand, model, secours = '') {
  const parts = [brand, model].filter(Boolean);
  return parts.length ? parts.join(' ') : (secours || '');
}

// Requête envoyée à la recherche de photo, et TYPE de matériel.
//
// Deux défauts faisaient échouer la recherche sur un véhicule :
//   • la consigne parlait de « fiche produit d'une machine professionnelle » :
//     pour une voiture ou un camion, elle ne décrit pas ce qu'on cherche ;
//   • le mot « Véhicule » ajouté à la requête ne désigne rien de précis pour un
//     moteur de recherche, alors qu'il mange la place de la marque et du modèle.
// On transmet donc le type à la fonction, qui adapte sa consigne, et on retire
// la catégorie quand elle se réduit à « véhicule ».
function requetePhoto({ brand, model, name, category, kind, annee }) {
  const motCategorie = /^v[ée]hicule/i.test(category || '') ? '' : (category || '');
  const anneeTexte = annee ? String(annee) : '';
  return {
    // L'ANNÉE vient juste après la marque et le modèle : c'est ce qui distingue
    // deux millésimes du même nom, et donc deux photos différentes.
    query: [designation(brand, model, name), anneeTexte, motCategorie].filter(Boolean).join(' ').trim(),
    kind: kind === TYPE_VEHICULE ? 'vehicule' : 'machine',
    annee: anneeTexte,
  };
}
// Chaîne affichée : brand_model reste la référence, avec repli sur les colonnes
// séparées si elle n'est pas renseignée.
function machineBrandModel(m) {
  if (!m) return null;
  if (m.brand_model) return m.brand_model;
  const parts = [m.brand, m.model].filter(Boolean);
  return parts.length ? parts.join(' ') : null;
}
// Valeur à préremplir dans le champ « Marque ».
function machineBrand(m) {
  if (!m) return '';
  if (SCHEMA.hasBrandModel && m.brand) return m.brand;
  return m.brand_model || '';
}
// Valeur à préremplir dans le champ « Modèle » : vide tant que la ligne
// historique n'a pas été répartie par l'utilisateur.
function machineModel(m) {
  if (!m || !SCHEMA.hasBrandModel || !m.brand) return '';
  return m.model || '';
}

// --- Année du modèle (« version ») ------------------------------------------
//
// POURQUOI CE CHAMP : sur une même référence, un constructeur change parfois tout
// d'une année sur l'autre — carrosserie, motorisation, calandre. Un « PORSCHE
// CAYENNE » de 2011 et un de 2019 n'ont ni la même fiche technique, ni la même
// photo. Sans l'année, la recherche d'image ramène la version la plus récente,
// ou une page de petite annonce. La colonne est optionnelle : la sonde de schéma
// décide si on peut l'écrire, et tout continue de fonctionner sans elle.
function machineYear(m) {
  if (!m || !SCHEMA.hasModelYear) return null;
  const annee = parseInt(m.model_year, 10);
  return Number.isFinite(annee) && annee >= 1900 ? annee : null;
}

function yearPatch(annee) {
  if (!SCHEMA.hasModelYear) return {};
  const valeur = parseInt(annee, 10);
  return { model_year: Number.isFinite(valeur) && valeur >= 1900 ? valeur : null };
}

// Bornes larges mais réelles : une année de modèle peut être annoncée avec un an
// d'avance, et on ne veut pas refuser une machine ancienne.
function anneePlausible(valeur) {
  if (valeur === '' || valeur == null) return true;
  const annee = parseInt(valeur, 10);
  return Number.isFinite(annee) && annee >= 1950 && annee <= new Date().getFullYear() + 2;
}
// Colonnes à écrire selon le schéma détecté. brand_model est toujours
// renseigné : c'est lui que lisent l'affichage, la recherche et l'export.
function brandModelPatch(brand, model) {
  const complet = designation(brand, model) || null;
  return SCHEMA.hasBrandModel
    ? { brand_model: complet, brand: brand || null, model: model || null }
    : { brand_model: complet };
}

// --- Machines et véhicules ---------------------------------------------------
// Une machine s'identifie par son numéro de série, un véhicule par sa plaque
// d'immatriculation : c'est ce que l'équipe lit sur le terrain. Une seule
// colonne porte l'identifiant selon le type, et l'affichage comme la recherche
// suivent le type.
const TYPE_MACHINE = 'machine';
const TYPE_VEHICULE = 'vehicle';
const IDENTIFIANT_LIBELLE = {
  [TYPE_MACHINE]: trad('N° de série'),
  [TYPE_VEHICULE]: "Plaque d'immatriculation",
};
const IDENTIFIANT_PLACEHOLDER = {
  [TYPE_MACHINE]: 'Ex. 123456789',
  [TYPE_VEHICULE]: 'Ex. 123456',
};
// Intervalle proposé par défaut : 100 heures pour un moteur, 10 000 kilomètres
// pour un véhicule. Le basculer évite d'enregistrer un plan à 100 km.
const INTERVALLE_DEFAUT = { [TYPE_MACHINE]: 100, [TYPE_VEHICULE]: 10000 };

function machineKind(m) {
  return m && m.kind === TYPE_VEHICULE ? TYPE_VEHICULE : TYPE_MACHINE;
}
function isVehicle(m) { return machineKind(m) === TYPE_VEHICULE; }

function kindPatch(kind) {
  return SCHEMA.hasKind ? { kind: kind === TYPE_VEHICULE ? TYPE_VEHICULE : TYPE_MACHINE } : {};
}

// L'identifiant est écrit dans la colonne de son type. L'autre colonne n'est
// jamais effacée : transformer une machine en véhicule ne fait pas perdre son
// numéro de série, il redevient simplement visible si l'on revient en arrière.
function identifiantPatch(kind, valeur) {
  const v = valeur || null;
  if (kind === TYPE_VEHICULE && SCHEMA.hasPlate) return { plate: v };
  return { serial_number: v };
}

// L'identifiant à AFFICHER : la plaque d'un véhicule, le numéro de série sinon.
// Le repli sur l'autre colonne couvre les fiches saisies avant cette version.
function machineIdentifiant(m) {
  if (!m) return '';
  return isVehicle(m)
    ? (m.plate || m.serial_number || '')
    : (m.serial_number || m.plate || '');
}
function identifiantAffiche(m) {
  const valeur = machineIdentifiant(m);
  if (!valeur) return '';
  return `${isVehicle(m) ? trad('Plaque') : trad('N° série')} ${valeur}`;
}
// Force la saisie en majuscules, au fur et à mesure de la frappe, en préservant
// la position du curseur (utile quand on corrige au milieu du champ).
function forcerMajuscules(input) {
  if (!input) return;
  input.addEventListener('input', () => {
    const position = input.selectionStart;
    const haut = input.value.toUpperCase();
    if (haut === input.value) return;
    input.value = haut;
    if (position != null) {
      try { input.setSelectionRange(position, position); } catch (e) { /* type sans sélection */ }
    }
  });
}

const COUNTER_UNITS = {
  hours: { word: trad('heures'), short: 'h', field: trad('Heures compteur actuelles'), placeholder: trad('Ex. 245'), step: '0.1' },
  km: { word: trad('kilomètres'), short: 'km', field: trad('Kilométrage actuel'), placeholder: trad('Ex. 19 240'), step: '1' },
};

function counterUnitFromMode(mode) { return mode === 'km' ? 'km' : 'hours'; }

// L'unité d'une machine : counter_unit fait référence, tracking_mode sert de
// repli tant que la colonne n'est pas renseignée.
function counterUnitOf(machine) {
  if (machine && (machine.counter_unit === 'km' || machine.counter_unit === 'hours')) return machine.counter_unit;
  if (machine && machine.plan && machine.plan.tracking_mode === 'km') return 'km';
  return 'hours';
}
function counterShort(unit) { return COUNTER_UNITS[unit] ? COUNTER_UNITS[unit].short : 'h'; }
function formatCounter(value, unit) {
  // Attention : Number(null) vaut 0. Un compteur non renseigné doit afficher
  // « — » et non « 0 h ».
  if (value == null || value === '') return '—';
  const n = Number(value);
  if (!isFinite(n)) return '—';
  const u = COUNTER_UNITS[unit] ? unit : 'hours';
  const text = u === 'km' ? Math.round(n).toLocaleString(localeActive()) : (Number.isInteger(n) ? String(n) : n.toFixed(1));
  return `${text} ${COUNTER_UNITS[u].short}`;
}
function machineCounter(machine) {
  if (!machine) return null;
  const v = SCHEMA.hasCounter ? machine.counter_value : machine.current_hours;
  return v == null ? null : Number(v);
}
function planIsCounter(plan) { return !!plan && plan.tracking_mode !== 'days'; }
function planIntervalCounter(plan) {
  if (!plan) return null;
  return (SCHEMA.hasCounter ? plan.interval_counter : plan.interval_hours) ?? null;
}
function planNextDueCounter(plan) {
  if (!plan) return null;
  return (SCHEMA.hasCounter ? plan.next_due_counter : plan.next_due_hours) ?? null;
}
function planReminderCounter(plan) {
  if (!plan) return FALLBACK_REMINDER_HOURS;
  return (SCHEMA.hasCounter ? plan.reminder_counter_before : plan.reminder_hours_before) ?? FALLBACK_REMINDER_HOURS;
}
// Le service d'extraction IA ne connaît que « days » et « hours » : pour un
// kilométrage, la lecture du manuel reste la même, seule l'unité change.
function aiModeFrom(mode) { return mode === 'km' ? 'hours' : mode; }

// Colonnes à écrire selon le schéma détecté.
function machineCounterPatch(value, machine) {
  return SCHEMA.hasCounter
    ? { counter_value: value, counter_unit: counterUnitOf(machine) }
    : { current_hours: value };
}
function planCounterPatch(interval, reminder) {
  return SCHEMA.hasCounter
    ? { interval_counter: interval, reminder_counter_before: reminder }
    : { interval_hours: interval, reminder_hours_before: reminder };
}
function planNextDueCounterPatch(nextDue) {
  return SCHEMA.hasCounter ? { next_due_counter: nextDue } : { next_due_hours: nextDue };
}
// Classe d'habillage du bandeau d'échéance selon l'état.
function heroClass(state) { return state === 'late' ? 'alert' : (state === 'soon' ? 'soon' : 'ok'); }

// Le trigger d'application du plan gratuit (côté base) renvoie ce message
// lorsque la limite est franchie — typiquement quand deux postes ajoutent une
// machine en même temps, cas que le contrôle du navigateur ne peut pas voir.
function isQuotaError(err) {
  const message = String(err && err.message ? err.message : err || '');
  return /limite du plan gratuit/i.test(message);
}

// supabase-js ne remonte qu'un « Edge Function returned a non-2xx status code »
// quand une fonction Edge répond 401, 403, 429… Or c'est justement là que se
// trouve le message utile (quota atteint, session expirée). Le corps de la
// réponse est accessible via error.context.
async function functionErrorMessage(error, defaut = trad('appel impossible')) {
  if (error && error.context && typeof error.context.json === 'function') {
    try {
      const corps = await error.context.clone().json();
      if (corps && corps.error) return String(corps.error);
    } catch (e) { /* corps absent, déjà consommé ou non JSON */ }
  }
  return (error && error.message) || defaut;
}

// indéfiniment sur « Chargement… ».

try {
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    throw new Error(trad('bibliothèque Supabase non chargée (CDN inaccessible)'));

      <button type="button" class="primary" id="fatal-retry" style="max-width:220px;margin:0 auto;">${trad('Réessayer')}</button>
    </div>`;
  const retryBtn = document.getElementById('fatal-retry');
  if (retryBtn) retryBtn.addEventListener('click', () => window.location.reload());
}

const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfLibPromise = null;
function loadPdfLib() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!pdfLibPromise) {
    pdfLibPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = PDFJS_URL;
      s.onload = () => (window.pdfjsLib ? resolve(window.pdfjsLib) : reject(new Error("pdf.js indisponible")));
      s.onerror = () => reject(new Error(trad('téléchargement de pdf.js impossible')));
      document.head.appendChild(s);
    });
    pdfLibPromise.catch(() => { pdfLibPromise = null; });
  }
  return pdfLibPromise;
}

let pdfWorkerReady = null;
function ensurePdfWorker() {
  if (!pdfWorkerReady) {
    const p = loadPdfLib()
      .then(() => fetch(PDFJS_WORKER_URL))
      .then(resp => {
        if (!resp.ok) throw new Error(trad('worker pdf.js introuvable'));
        return resp.text();
      })
      .then(code => {
        const blob = new Blob([code], { type: 'application/javascript' });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
      });
    // En cas d'échec on réarme, sinon le rejet resterait mémorisé pour toujours.
    pdfWorkerReady = p.catch(err => { pdfWorkerReady = null; throw err; });
  }
  return pdfWorkerReady;
}

async function renderPdfFirstPageAsBlob(file) {
  await ensurePdfWorker();
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 1.5 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
}

// ============================================================
// KEEVA — couche de présentation « Signal »
// Remplace dueInfo() + renderMachines() de la version précédente.
// Toute la logique Supabase (modales d'édition, journal d'entretien,
// suppression, assistant d'ajout) est réutilisée telle quelle.
// ============================================================

// Horizon du compteur « Sous 15 jours » du tableau de bord (copie du handoff).
// Pour un suivi au compteur horaire, il n'existe pas d'équivalent en jours :
// on utilise alors la fenêtre de rappel du plan.
const SOON_DAYS = 15;

// ── Consultation hors connexion ───────────────────────────────
// L'application Android embarque ses fichiers : elle DÉMARRE sans réseau. Reste
// à pouvoir consulter quelque chose — d'où cette copie des dernières données
// reçues. Sans elle, l'utilisateur hors connexion verrait un écran de chargement
// puis une erreur, alors que sa tournée de machines est déjà sur son téléphone.
//
// Les modifications, elles, continuent d'exiger la connexion : le bandeau le
// dit, et aucun écrit n'est tenté puis perdu.
const CACHE_CLE = 'parcpacific.derniere-donnees.v1';

// Durée de vie de la copie locale. Au-delà, elle est EFFACÉE : garder
// indéfiniment des noms de machines, des plans d'entretien et des coordonnées
// sur un appareil est un risque qui ne se justifie pas — une copie de trois
// semaines n'a plus aucune valeur pour l'utilisateur.
const CACHE_DUREE_MS = 7 * 24 * 60 * 60 * 1000;
const HORS_LIGNE_CLE = 'parcpacific.hors-ligne';

// La copie locale est un CONFORT, pas un dû : l'utilisateur peut la refuser
// depuis « Mon compte », et le refus efface immédiatement ce qui est stocké.
function copieHorsLigneActive() {
  try { return localStorage.getItem(HORS_LIGNE_CLE) !== 'non'; } catch (err) { return true; }
}

function reglerCopieHorsLigne(actif) {
  try {
    if (actif) {
      localStorage.removeItem(HORS_LIGNE_CLE);
    } else {
      localStorage.setItem(HORS_LIGNE_CLE, 'non');
      localStorage.removeItem(CACHE_CLE);
    }
  } catch (err) { /* stockage indisponible : sans conséquence */ }
}

function enregistrerCache(donnees) {
  if (!copieHorsLigneActive()) return;
  try {
    localStorage.setItem(CACHE_CLE, JSON.stringify({ ...donnees, schema: { ...SCHEMA }, savedAt: Date.now() }));
  } catch (err) {
    // Espace plein ou mode privé : ce n'est pas un motif d'échec pour le
    // chargement, la copie est un confort.
    console.warn('Copie hors connexion impossible :', err && err.message);
  }
}

function lireCache() {
  try {
    if (!copieHorsLigneActive()) return null;
    const brut = localStorage.getItem(CACHE_CLE);
    if (!brut) return null;
    const donnees = JSON.parse(brut);
    const perimee = !donnees
      || typeof donnees.savedAt !== 'number'
      || Date.now() - donnees.savedAt > CACHE_DUREE_MS;
    if (perimee) {
      // Copie périmée ou illisible : on l'efface plutôt que de la garder.
      localStorage.removeItem(CACHE_CLE);
      return null;
    }
    // Une copie sans machines n'a aucun intérêt : on la considère comme absente.
    return Array.isArray(donnees.machines) ? donnees : null;
  } catch (err) {
    return null;
  }
}

function effacerCache() {
  try { localStorage.removeItem(CACHE_CLE); } catch (err) { /* sans conséquence */ }
}

// Âge de la copie, en français courant : c'est ce qui indique à l'utilisateur si
// ce qu'il regarde date de ce matin ou de la semaine dernière.
function ageLisible(horodatage) {
  if (!horodatage) return '';
  const minutes = Math.max(0, Math.round((Date.now() - horodatage) / 60000));
  if (minutes < 2) return trad('à l\'instant');
  if (minutes < 60) return tR('il y a {n} minutes', { n: minutes });
  const heures = Math.round(minutes / 60);
  if (heures < 24) return tR('il y a {n} h', { n: heures });
  const jours = Math.round(heures / 24);
  return jours <= 1 ? trad('hier') : tR('il y a {n} jours', { n: jours });
}

// Une erreur de réseau se distingue d'un refus du serveur : seule la première
// justifie de se rabattre sur la copie locale. Un « profil introuvable » ou une
// règle d'accès refusée doivent rester visibles, sinon on masquerait un vrai
// problème de compte derrière des données périmées.
function estErreurReseau(erreur) {
  if (!erreur) return false;
  if (navigator && navigator.onLine === false) return true;
  const texte = String(erreur.message || erreur || '');
  return /failed to fetch|networkerror|network request failed|load failed|timeout|timed out|offline|err_internet|fetch failed/i.test(texte);
}

// ── Rappels d'échéance sur le téléphone ───────────────────────
// L'application Android programme elle-même ses notifications : ni service
// tiers, ni compte Google, ni réseau. Sur le web, tout ce bloc reste inerte
// (window.Capacitor n'existe pas) — la rubrique « Mon compte » le dit alors.
const RAPPELS_PREF = 'parcpacific.rappels-echeances.v1';
const RAPPELS_MAX = 40;

function pluginRappels() {
  const cap = window.Capacitor;
  return (cap && cap.Plugins && cap.Plugins.LocalNotifications) || null;
}
function rappelsDisponibles() { return !!pluginRappels(); }

function rappelsActifs() {
  try { return localStorage.getItem(RAPPELS_PREF) !== 'non'; } catch (err) { return true; }
}
function activerRappels(actif) {
  try { localStorage.setItem(RAPPELS_PREF, actif ? 'oui' : 'non'); } catch (err) { /* sans conséquence */ }
}

// Le greffon n'accepte que des identifiants entiers, et il faut retrouver les
// mêmes d'une programmation à l'autre, sinon les rappels s'empileraient en
// doublons. L'identifiant est donc dérivé de la machine, de façon stable.
function idNotification(machineId, rang) {
  const texte = `${machineId}:${rang}`;
  let empreinte = 7;
  for (let i = 0; i < texte.length; i++) empreinte = (empreinte * 31 + texte.charCodeAt(i)) % 2000000000;
  return empreinte + 1;
}

// Ce qui doit être annoncé, et quand. Fonction PURE : elle ne parle ni au
// greffon ni au réseau, ce qui la rend vérifiable.
//
// Seules les échéances DATÉES sont concernées. Une machine suivie au compteur
// (heures ou kilomètres) n'a pas de date d'échéance : on ne peut pas l'annoncer
// à l'avance sans connaître son rythme d'utilisation. Mieux vaut ne rien
// annoncer que d'annoncer une date fausse.
function rappelsAProgrammer(machines, maintenant) {
  const base = maintenant ? new Date(maintenant) : new Date();
  const rappels = [];
  for (const machine of machines || []) {
    const plan = machine && machine.plan;
    if (!plan || planIsCounter(plan) || !plan.next_due_at) continue;
    const echeance = new Date(`${plan.next_due_at}T09:00:00`);
    if (isNaN(echeance.getTime())) continue;
    const modele = machineBrandModel(machine);
    const nom = modele ? `${machine.name} (${modele})` : machine.name;
    const joursAvant = Number(plan.reminder_days_before ?? FALLBACK_REMINDER_DAYS);
    if (joursAvant > 0) {
      const veille = new Date(echeance.getTime() - joursAvant * 86400000);
      if (veille > base) {
        rappels.push({
          id: idNotification(machine.id, 1),
          quand: veille,
          titre: trad('Entretien à prévoir'),
          corps: `${nom} — ${tR('échéance dans {n} jours ({date})', { n: joursAvant, date: formatShortDate(plan.next_due_at) })}`,
        });
      }
    }
    if (echeance > base) {
      rappels.push({
        id: idNotification(machine.id, 2),
        quand: echeance,
        titre: trad('Entretien à faire aujourd\'hui'),
        corps: `${nom} — ${tR('échéance du {date}', { date: formatShortDate(plan.next_due_at) })}`,
      });
    }
  }
  rappels.sort((a, b) => a.quand - b.quand);
  return rappels.slice(0, RAPPELS_MAX);
}

async function annulerRappels(plugin) {
  const cible = plugin || pluginRappels();
  if (!cible) return;
  try {
    const enAttente = await cible.getPending();
    const liste = (enAttente && enAttente.notifications) || [];
    if (liste.length) await cible.cancel({ notifications: liste.map((n) => ({ id: n.id })) });
  } catch (err) {
    console.warn('Annulation des rappels :', err && err.message);
  }
}

// Reprogramme tout, à chaque ouverture : dès qu'un entretien est validé,
// l'échéance suivante change et les notifications déjà posées annonceraient une
// date fausse.
//
// `demander: false` évite de réclamer l'autorisation au démarrage de
// l'application : elle n'est demandée que lorsque l'utilisateur active les
// rappels depuis « Mon compte ». Une demande surgie sans raison au premier
// lancement se solde presque toujours par un refus.
async function programmerRappels(options) {
  const plugin = pluginRappels();
  if (!plugin) return { natif: false };
  const demander = !options || options.demander !== false;
  if (!rappelsActifs()) { await annulerRappels(plugin); return { desactives: true }; }
  try {
    const etat = await plugin.checkPermissions();
    if (!etat || etat.display !== 'granted') {
      if (!demander) return { sansPermission: true };
      const demande = await plugin.requestPermissions();
      if (!demande || demande.display !== 'granted') return { refuse: true };
    }
    try {
      await plugin.createChannel({
        id: 'echeances',
        name: trad('Échéances d\'entretien'),
        description: trad('Rappels avant chaque entretien planifié.'),
        importance: 4,
      });
    } catch (err) { /* canal déjà créé, ou Android antérieur aux canaux */ }

    await annulerRappels(plugin);
    const rappels = rappelsAProgrammer(UI.machines);
    if (!rappels.length) return { programmees: 0 };
    await plugin.schedule({
      notifications: rappels.map((rappel) => ({
        id: rappel.id,
        title: rappel.titre,
        body: rappel.corps,
        channelId: 'echeances',
        // Inexact assumé : une alarme exacte exigerait la permission
        // SCHEDULE_EXACT_ALARM, et Android ouvrirait son écran de réglages à la
        // première programmation. Celle-ci traverse le mode veille, ce qui
        // suffit largement pour un rappel d'entretien.
        isExactNotification: false,
        allowWhileIdle: true,
        schedule: { at: rappel.quand },
      })),
    });
    return { programmees: rappels.length };
  } catch (err) {
    console.warn('Programmation des rappels :', err && err.message);
    return { erreur: (err && err.message) || trad('erreur inconnue') };
  }
}
