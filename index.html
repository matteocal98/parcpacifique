// ── Formatage ─────────────────────────────────────────────────
function formatShortDate(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  if (!y || !m || !d) return '—';
  return `${d} ${moisCourt(m - 1)}`;
}
function formatLongDate(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  if (!y || !m || !d) return '—';
  return `${d} ${moisLong(m - 1)} ${y}`;
}
function formatHours(n) {
  const v = Number(n);
  if (!isFinite(v)) return '—';
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}
function initialsFrom(label) {
  return esc(String(label || 'PP').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'PP');
}
function firstNameFrom(label) {
  const w = String(label || '').trim().split(/\s+/).filter(Boolean);
  return w.length ? w[0] : '';
}

// ── Échéances et statuts ──────────────────────────────────────
// state : 'late' (en retard) | 'soon' (sous 15 j / fenêtre de rappel) | 'ok' | 'unknown'
// urgency : position dans la fenêtre de « bientôt » — 0 = échéance atteinte,
// 1 = bord de la fenêtre. Permet de classer ensemble des machines suivies au
// compteur et au calendrier, sans convertir des heures en jours.
function dueInfo(plan, machine) {
  if (!plan) {
    return { state: 'unknown', label: trad('Pas de plan de maintenance'), short: trad('Plan à définir'), sortKey: Number.POSITIVE_INFINITY, urgency: Number.POSITIVE_INFINITY, unit: null };
  }
  if (planIsCounter(plan)) {
    const unit = counterUnitOf(machine);
    const current = machineCounter(machine);
    const nextDue = planNextDueCounter(plan);
    if (nextDue == null || current == null) {
      return { state: 'unknown', label: tR('Renseigner le {unite}', { unite: unit === 'km' ? trad('kilométrage') : trad('compteur horaire') }), short: trad('Compteur à saisir'), sortKey: Number.POSITIVE_INFINITY, urgency: Number.POSITIVE_INFINITY, unit };
    }
    const remaining = nextDue - current;
    const horizon = planReminderCounter(plan);
    const ctx = tR('compteur {compteur} · échéance {echeance}', { compteur: formatCounter(current, unit), echeance: formatCounter(nextDue, unit) });
    const urgency = horizon > 0 ? remaining / horizon : 0;
    const short = remaining < 0 ? `+${formatCounter(Math.abs(remaining), unit)}` : formatCounter(remaining, unit);
    // Phrases CONSTRUITES : le texte et les valeurs sont mêlés, donc t() ne peut
    // pas les prendre au moment de l'extraction. Elles passent par tR(), avec la
    // phrase entière comme clé et des {emplacements} pour les valeurs.
    if (remaining < 0) return { state: 'late', label: tR('En retard de {valeur} ({contexte})', { valeur: formatCounter(Math.abs(remaining), unit), contexte: ctx }), short, sortKey: remaining, urgency, unit };
    if (remaining <= horizon) return { state: 'soon', label: tR('Échéance dans {valeur} ({contexte})', { valeur: formatCounter(remaining, unit), contexte: ctx }), short, sortKey: remaining, urgency, unit };
    return { state: 'ok', label: tR('Prochaine échéance dans {valeur} ({contexte})', { valeur: formatCounter(remaining, unit), contexte: ctx }), short, sortKey: remaining, urgency, unit };
  }
  if (!plan.next_due_at) {
    return { state: 'unknown', label: trad('Pas de plan de maintenance'), short: trad('Plan à définir'), sortKey: Number.POSITIVE_INFINITY, urgency: Number.POSITIVE_INFINITY, unit: 'days' };
  }
  const days = daysUntil(plan.next_due_at);
  if (days == null) {
    return { state: 'unknown', label: trad('Date d\'échéance illisible'), short: '—', sortKey: Number.POSITIVE_INFINITY, urgency: Number.POSITIVE_INFINITY, unit: 'days' };
  }
  const urgency = days / SOON_DAYS;
  if (days < 0) return { state: 'late', label: tR('En retard de {n} j (échéance le {date})', { n: Math.abs(days), date: formatShortDate(plan.next_due_at) }), short: tR('+{n} j', { n: Math.abs(days) }), sortKey: days, urgency, unit: 'days' };
  if (days <= SOON_DAYS) return { state: 'soon', label: tR('Échéance dans {n} j (le {date})', { n: days, date: formatShortDate(plan.next_due_at) }), short: formatShortDate(plan.next_due_at), sortKey: days, urgency, unit: 'days' };
  return { state: 'ok', label: tR('Prochaine échéance dans {n} j (le {date})', { n: days, date: formatShortDate(plan.next_due_at) }), short: formatShortDate(plan.next_due_at), sortKey: days, urgency, unit: 'days' };
}

// Tâche suivante : premier item du plan, sinon première tâche de la liste.
function nextTaskLabel(machine) {
  const items = normalizeItems(machine.plan?.items);
  const first = items.find(it => it.label);
  if (first) return first.label;
  const tasks = (machine.plan?.tasks || '').split(',').map(t => t.trim()).filter(Boolean);
  return tasks[0] || 'Entretien';
}

function machineCounts(machines) {
  const c = { late: 0, soon: 0, ok: 0, manuals: 0, analysed: 0 };
  machines.forEach(m => {
    const info = dueInfo(m.plan, m);
    if (info.state === 'late') c.late++;
    else if (info.state === 'soon') c.soon++;
    else c.ok++;                       // à jour + plans non renseignés : rien à traiter
    if (m.manual_url) c.manuals++;
    if (normalizeItems(m.plan?.items).length) c.analysed++;
  });
  return c;
}

// Échéances à traiter, les plus urgentes d'abord.
function openAlerts() {
  return UI.machines
    .map(m => ({ machine: m, info: dueInfo(m.plan, m) }))
    .filter(x => x.info.state === 'late' || x.info.state === 'soon')
    .sort((a, b) => {
      const rank = (s) => (s === 'late' ? 0 : 1);
      if (rank(a.info.state) !== rank(b.info.state)) return rank(a.info.state) - rank(b.info.state);
      // En retard : le plus dépassé d'abord. Bientôt : le plus proche de
      // l'échéance d'abord, à fenêtre comparable (heures et jours mélangés).
      if (a.info.state === 'late') return a.info.sortKey - b.info.sortKey;
      return a.info.urgency - b.info.urgency;
    });
}

// ── Confort des modales ───────────────────────────────────────
// Appliqué automatiquement à toute .overlay ajoutée au document : rôle de
// dialogue, focus initial, piège à focus, fermeture par Échap, et garde-fou
// contre la perte d'une saisie en cours. Aucune modale n'a besoin d'y penser.
const modalMeta = new WeakMap();

function focusableIn(root) {
  return Array.from(root.querySelectorAll(
    'a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )).filter(el => el.offsetParent !== null || el === document.activeElement);
}

function formSnapshot(form) {
  return Array.from(form.elements).map(el => {
    const key = el.name || el.id || el.tagName;
    if (el.type === 'checkbox' || el.type === 'radio') return `${key}:${el.checked}`;
    if (el.type === 'file') return `${key}:${el.files ? el.files.length : 0}`;
    return `${key}:${el.value}`;
  }).join('|');
}

// Une photo distante peut ne pas se charger : on retire l'image plutôt que
// d'afficher une icône cassée. Écouteur en phase de CAPTURE, car l'événement
// « error » d'une <img> ne remonte pas jusqu'au document.
document.addEventListener('error', (e) => {
  const el = e.target;
  if (el && el.tagName === 'IMG' && el.classList && el.classList.contains('machine-photo')) el.remove();
}, true);

function overlayIsDirty(overlay) {
  const meta = modalMeta.get(overlay);
  if (!meta) return false;
  const form = overlay.querySelector('form');
  if (!form || !meta.snapshot) return false;
  return formSnapshot(form) !== meta.snapshot;
}

function enhanceModal(overlay) {
  const meta = modalMeta.get(overlay) || {};
  if (!meta.previousFocus) meta.previousFocus = document.activeElement;
  const form = overlay.querySelector('form');
  // L'instantané est pris à l'ouverture, et repris uniquement si le formulaire
  // est REMPLACÉ (changement d'étape d'un assistant). Une mise à jour
  // asynchrone à l'intérieur du même formulaire — chargement d'une photo ou de
  // l'historique — ne doit pas déplacer la référence, sinon la saisie déjà
  // faite par l'utilisateur deviendrait la nouvelle référence.
  if (form !== meta.formEl) {
    meta.formEl = form || null;
    meta.snapshot = form ? formSnapshot(form) : null;
  }
  modalMeta.set(overlay, meta);

  const dialog = overlay.querySelector('.modal, .sheet');
  if (dialog && !dialog.hasAttribute('role')) {
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-modal', 'true');
    const title = dialog.querySelector('h1, h2');
    if (title) {
      if (!title.id) title.id = `modal-title-${Math.random().toString(36).slice(2, 8)}`;
      dialog.setAttribute('aria-labelledby', title.id);
    }
  }

  requestAnimationFrame(() => {
    if (!document.body.contains(overlay)) return;
    const active = document.activeElement;
    if (active && overlay.contains(active)) return;      // le focus est déjà dedans
    const target = overlay.querySelector('[autofocus]') || focusableIn(overlay)[0];
    if (target) target.focus();
  });
}

function topOverlay() {
  const all = document.querySelectorAll('.overlay');
  return all.length ? all[all.length - 1] : null;
}

function requestCloseOverlay(overlay) {
  if (!overlay) return;
  if (overlayIsDirty(overlay)) {
    const ok = window.confirm(trad('Fermer sans enregistrer ? Les informations saisies seront perdues.'));
    if (!ok) return;
  }
  const meta = modalMeta.get(overlay);
  overlay.remove();
  const previous = meta && meta.previousFocus;
  if (previous && document.body.contains(previous) && typeof previous.focus === 'function') previous.focus();
}

// Un seul écouteur pour toutes les modales : Échap et piège à focus.
document.addEventListener('keydown', (e) => {
  const overlay = topOverlay();
  if (!overlay) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    requestCloseOverlay(overlay);
    return;
  }
  if (e.key !== 'Tab') return;
  const items = focusableIn(overlay);
  if (!items.length) return;
  const first = items[0];
  const last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || !overlay.contains(document.activeElement))) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}, true);

// Clic à l'extérieur : on intercepte avant le gestionnaire de la modale pour
// pouvoir demander confirmation si un formulaire a été modifié.
document.addEventListener('click', (e) => {
  const overlay = topOverlay();
  if (!overlay || e.target !== overlay) return;
  if (!overlayIsDirty(overlay)) return;                  // comportement d'origine
  if (!window.confirm(trad('Fermer sans enregistrer ? Les informations saisies seront perdues.'))) {
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

// Afficher / masquer le mot de passe : UN SEUL gestionnaire pour tous les champs
// concernés, y compris ceux des modales créées plus tard.
//
// Avant, chaque écran branchait son propre bouton : celui du nouveau mot de
// passe, celui de l'inscription… et l'écran de connexion n'en avait aucun, alors
// que c'est là qu'on saisit un mot de passe le plus souvent — et là qu'une faute
// de frappe coûte le plus cher, puisque rien ne laisse voir ce qu'on a tapé.
// Le bouton agit sur le champ de son propre groupe : aucune identification à
// maintenir, et tout nouveau champ ajouté en hérite.
// Choix de la langue : un seul gestionnaire pour les deux écrans qui le
// proposent (connexion et « Mon compte »), comme pour l'affichage du mot de passe.
document.addEventListener('click', (e) => {
  const bouton = e.target && e.target.closest ? e.target.closest('.lang-btn') : null;
  if (!bouton) return;
  changerLangue(bouton.dataset.langue);
});

document.addEventListener('click', (e) => {
  const bouton = e.target && e.target.closest ? e.target.closest('.toggle-pw-btn') : null;
  if (!bouton) return;
  const enveloppe = bouton.closest('.password-wrap');
  const champ = enveloppe ? enveloppe.querySelector('input') : null;
  if (!champ) return;
  const visible = champ.type === 'text';
  champ.type = visible ? 'password' : 'text';
  bouton.textContent = visible ? trad('Afficher') : 'Masquer';
  bouton.setAttribute('aria-pressed', String(!visible));
  // Le focus revient au champ, curseur à la fin : on continue sa saisie sans
  // avoir à recliquer dedans.
  champ.focus();
  try { champ.setSelectionRange(champ.value.length, champ.value.length); } catch (err) { /* type sans sélection */ }
});

// Chaque apparition de modale (et chaque changement d'étape) est équipée.
const modalObserver = new MutationObserver((records) => {
  for (const record of records) {
    for (const node of record.addedNodes) {
      if (node.nodeType !== 1) continue;
      if (node.classList.contains('overlay')) enhanceModal(node);
      else if (node.closest && node.closest('.overlay')) enhanceModal(node.closest('.overlay'));
      else if (node.querySelector && node.querySelector('form')) {
        const host = node.closest ? node.closest('.overlay') : null;
        if (host) enhanceModal(host);
      }
    }
  }
});
modalObserver.observe(document.body, { childList: true, subtree: true });

// ── Confirmation d'action (toast) ─────────────────────────────
function showToast(message) {
  if (!message) return;
  let host = document.getElementById('toast-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toast-host';
    host.className = 'toast-host';
    host.setAttribute('role', 'status');
    host.setAttribute('aria-live', 'polite');
    document.body.appendChild(host);
  }
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add('is-on'));
  setTimeout(() => {
    el.classList.remove('is-on');
    setTimeout(() => el.remove(), 260);
  }, 3200);
}

function dropzoneHtml(id) {
  return `
    <div class="dropzone" id="${id}">
      <span class="dz-icon">⤒</span>
      <span class="dz-title">${trad('Déposer un manuel PDF')}</span>
      <span class="dz-help">${trad('L\'IA extrait les échéances (heures, mois) et crée le plan d\'entretien. Tu valides avant activation.')}</span>
    </div>`;
}

function attachDropzone(el, onFile) {
  if (!el) return;
  el.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf';
    input.addEventListener('change', () => { if (input.files && input.files[0]) onFile(input.files[0]); });
    input.click();
  });
  ['dragenter', 'dragover'].forEach(ev => el.addEventListener(ev, (e) => { e.preventDefault(); el.classList.add('is-over'); }));
  ['dragleave', 'drop'].forEach(ev => el.addEventListener(ev, (e) => { e.preventDefault(); el.classList.remove('is-over'); }));
  el.addEventListener('drop', (e) => {
    const f = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
    if (f) onFile(f);
  });
}

// ── Vue : Parc (machines) ─────────────────────────────────────
// Recherche, filtre par état, tri et affichage progressif : indispensable dès
// qu'un parc dépasse quelques dizaines de machines.
const FLEET_PAGE_SIZE = 30;

function fleetFilters() {
  if (!UI.filters) UI.filters = { q: '', status: 'all', sort: 'urgence', limit: FLEET_PAGE_SIZE };
  return UI.filters;
}

function fleetMatches() {
  const f = fleetFilters();
  const q = (f.q || '').trim().toLowerCase();
  return UI.machines.filter(m => {
    const state = dueInfo(m.plan, m).state;
    if (f.status === 'late' && state !== 'late') return false;
    if (f.status === 'soon' && state !== 'soon') return false;
    if (f.status === 'ok' && (state === 'late' || state === 'soon')) return false;
    if (!q) return true;
    const hay = [m.name, m.brand_model, m.brand, m.model, m.serial_number, m.plate, m.category?.name]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function fleetSorted(list) {
  const f = fleetFilters();
  const rankOf = (m) => {
    const s = dueInfo(m.plan, m).state;
    return s === 'late' ? 0 : (s === 'soon' ? 1 : 2);
  };
  const byName = (a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'fr');
  const copy = list.slice();
  if (f.sort === 'nom') return copy.sort(byName);
  if (f.sort === 'compteur') {
    return copy.sort((a, b) => {
      const va = machineCounter(a);
      const vb = machineCounter(b);
      if (va == null && vb == null) return byName(a, b);
      if (va == null) return 1;
      if (vb == null) return -1;
      return vb - va;
    });
  }
  return copy.sort((a, b) => {
    const ra = rankOf(a);
    const rb = rankOf(b);
    if (ra !== rb) return ra - rb;
    if (ra === 0) return dueInfo(a.plan, a).sortKey - dueInfo(b.plan, b).sortKey;
    if (ra === 1) return dueInfo(a.plan, a).urgency - dueInfo(b.plan, b).urgency;
    return byName(a, b);
  });
}

function chipHtml(status, label, count) {
  const active = fleetFilters().status === status;
  return `<button type="button" class="chip${active ? ' is-active' : ''}" data-status="${status}" aria-pressed="${active ? 'true' : 'false'}">${esc(label)}<span class="chip-count">${count}</span></button>`;
}

function fleetListHtml() {
  const matches = fleetSorted(fleetMatches());
  if (!matches.length) {
    return `<div class="empty">${trad('Aucune machine ne correspond à cette recherche.')}
      <div style="margin-top:12px;"><button type="button" class="link-inline" id="fleet-reset">${trad('Réinitialiser les filtres')}</button></div>
    </div>`;
  }
  const limit = fleetFilters().limit;
  const shown = matches.slice(0, limit);
  const rest = matches.length - shown.length;
  const total = UI.machines.length;
  const filtered = matches.length !== total;
  return `
    <div class="fleet-count">${tR('{n} machine(s)', { n: matches.length })}${filtered ? ` ${tR('sur {total}', { total })}` : ''}</div>
    ${shown.map(machineCardHtml).join('')}
    ${rest > 0 ? `<button type="button" class="btn-tint" id="fleet-more" style="align-self:center;">${tR('Afficher {n} machine(s) de plus', { n: Math.min(rest, FLEET_PAGE_SIZE) })}</button>` : ''}`;
}

    document.querySelectorAll('#view-root .chip').forEach(c => {

// ── Vue : Agenda ──────────────────────────────────────────────
// ── Préparation des entretiens ────────────────────────────────
// Ce que les entretiens à venir vont demander d'acheter, et pour quand.
//
// AUCUNE GESTION DE STOCK ICI, volontairement. La question du terrain est
// « qu'est-ce que je commande avant d'aller chez le fournisseur ? », et elle se
// répond avec ce que l'application sait déjà : les plans de maintenance et les
// « items » extraits du carnet constructeur par l'IA (libellé, spécification,
// quantité). Tenir un stock demande une discipline de saisie que peu de clients
// auront ; prévoir les besoins, non.
const PREPARATION_HORIZON = [30, 90, 180];

function dateDansHorizon(iso, jours, base) {
  if (!iso) return false;
  const echeance = new Date(`${iso}T00:00:00`);
  if (isNaN(echeance.getTime())) return false;
  const limite = new Date(base.getTime() + jours * 86400000);
  return echeance <= limite;
}

// Lecture d'une quantité écrite en texte libre (« 6,5 L », « 2 », « 1 filtre »).
// Renvoie null dès que le texte n'est pas un nombre suivi d'une unité simple :
// on ne devine JAMAIS une quantité.
function lireQuantite(texte) {
  if (texte == null) return null;
  const propre = String(texte).trim().replace(',', '.');
  const trouve = propre.match(/^([0-9]+(?:\.[0-9]+)?)\s*([^\s0-9]*)$/);
  if (!trouve) return null;
  const nombre = Number(trouve[1]);
  if (!isFinite(nombre)) return null;
  return { nombre, unite: trouve[2].toLowerCase() };
}

// Total d'un ensemble de quantités — UNIQUEMENT si toutes sont lisibles et
// partagent la même unité. Sur une liste d'achat, un total faux coûte plus cher
// que pas de total du tout : dans le doute, on n'affiche rien.
function totalQuantites(quantites) {
  const lues = (quantites || []).map(lireQuantite);
  if (!lues.length || lues.some((q) => !q)) return null;
  const unite = lues[0].unite;
  if (lues.some((q) => q.unite !== unite)) return null;
  const total = lues.reduce((somme, q) => somme + q.nombre, 0);
  return { nombre: Math.round(total * 100) / 100, unite };
}

function formatteTotal(total) {
  if (!total) return '';
  const nombre = total.nombre.toLocaleString(localeActive());
  return total.unite ? `${nombre} ${total.unite}` : nombre;
}

// Rassemble ce que les entretiens retenus vont consommer.
//
// Les machines suivies au compteur y figurent aussi : leur entretien n'a pas de
// date, donc rien à commander « pour le 12 octobre » — mais les pièces du
// prochain entretien se commandent, elles, dès maintenant.
function listePreparation(machines, jours, maintenant) {
  const base = maintenant ? new Date(maintenant) : new Date();
  const besoins = [];
  const sansItems = [];
  let entretiens = 0;
  let auCompteur = 0;

  for (const machine of machines || []) {
    const plan = machine && machine.plan;
    if (!plan) continue;
    const compteur = planIsCounter(plan);
    const date = compteur ? null : (plan.next_due_at || null);
    if (compteur) {
      auCompteur++;
    } else {
      if (!dateDansHorizon(date, jours, base)) continue;
      entretiens++;
    }

    const items = Array.isArray(plan.items) ? plan.items : [];
    if (!items.length) {
      // Plan sans liste de produits (carnet jamais analysé) : on rappellera ses
      // tâches, faute de mieux.
      if (!compteur) sansItems.push({ machine, date, taches: (plan.tasks || '').trim() });
      continue;
    }
    for (const item of items) {
      const label = item && item.label ? String(item.label).trim() : '';
      if (!label) continue;
      const spec = item && item.spec ? String(item.spec).trim() : '';
      besoins.push({
        cle: `${label.toLowerCase()}|${spec.toLowerCase()}`,
        label, spec, machine,
        quantite: item && item.qty ? String(item.qty).trim() : '',
        date,
      });
    }
  }

  const parCle = new Map();
  for (const besoin of besoins) {
    if (!parCle.has(besoin.cle)) parCle.set(besoin.cle, { label: besoin.label, spec: besoin.spec, besoins: [] });
    parCle.get(besoin.cle).besoins.push(besoin);
  }
  const produits = [...parCle.values()].map((produit) => ({
    ...produit,
    total: totalQuantites(produit.besoins.map((b) => b.quantite)),
    premiereDate: produit.besoins.map((b) => b.date).filter(Boolean).sort()[0] || null,
  }));
  produits.sort((a, b) => String(a.premiereDate || '9999').localeCompare(String(b.premiereDate || '9999')));

  return { entretiens, auCompteur, produits, groupes: grouperProduits(produits), sansItems };
}

// --- Familles de produits ---------------------------------------------------
//
// POURQUOI REGROUPER : la liste de préparation arrive en vrac — un filtre à
// huile, deux huiles, une graisse, une courroie — alors qu'une commande se passe
// famille par famille. Le carnet constructeur ne fournit pas de catégorie : on
// classe donc sur le LIBELLÉ, avec les mots des manuels réels. Ce qui n'est pas
// reconnu tombe dans « Autres » : jamais perdu, jamais mal rangé.
//
// L'ORDRE de cette table est celui du classement : « Filtre à huile » est un
// filtre, « Graisse à chaîne » est une graisse — le premier mot-clé reconnu
// l'emporte, donc l'ordre est une décision, pas un détail.
const CATEGORIES_PRODUIT = [
  { cle: 'filtres', libelle: 'Filtres', mots: /filtre|filter|tamis/i },
  { cle: 'huiles', libelle: 'Huiles et lubrifiants', mots: /huile|oil|lubrifiant|hydraulique|vidange/i },
  { cle: 'graisses', libelle: 'Graisses', mots: /graisse|graissage|grease/i },
  { cle: 'liquides', libelle: 'Liquides', mots: /liquide|refroidissement|coolant|antigel|adblue|frein|distill/i },
  { cle: 'usure', libelle: 'Pièces d\'usure', mots: /lame|courroie|cha[iî]ne|bougie|batterie|pneu|roue|dent|couteau|segment|joint|roulement|patin|disque|plaquette|masselotte|guide/i },
];

function categorieProduit(label) {
  const texte = String(label || '');
  for (const categorie of CATEGORIES_PRODUIT) {
    if (categorie.mots.test(texte)) return categorie.cle;
  }
  return 'autres';
}

function libelleCategorie(cle) {
  const trouvee = CATEGORIES_PRODUIT.find((categorie) => categorie.cle === cle);
  return trad(trouvee ? trouvee.libelle : 'Autres');
}

function grouperProduits(produits) {
  const parCategorie = new Map();
  for (const produit of produits) {
    const cle = categorieProduit(produit.label);
    if (!parCategorie.has(cle)) parCategorie.set(cle, []);
    parCategorie.get(cle).push(produit);
  }
  const ordre = [...CATEGORIES_PRODUIT.map((c) => c.cle), 'autres'];
  return ordre
    .filter((cle) => parCategorie.has(cle))
    .map((cle) => {
      const membres = parCategorie.get(cle);
      return {
        cle,
        nom: libelleCategorie(cle),
        produits: membres,
        premiereDate: membres.map((p) => p.premiereDate).filter(Boolean).sort()[0] || null,
      };
    })
    // La famille la plus urgente d'abord : c'est la date du produit le plus
    // proche qui commande l'ordre des sections, pas l'ordre du catalogue.
    .sort((a, b) => String(a.premiereDate || '9999').localeCompare(String(b.premiereDate || '9999')));
}

function preparationHtml() {

  const liste = listePreparation(UI.machines, jours);
  const chips = PREPARATION_HORIZON
    .map((j) => `<button type="button" class="chip${j === jours ? ' is-active' : ''}" data-horizon="${j}">${j} j</button>`)
    .join('');

  const produitHtml = (produit) => {
    const besoins = produit.besoins.map((besoin) => {
      const quand = besoin.date ? formatShortDate(besoin.date) : trad('au compteur');
      return `<div>${esc(besoin.machine.name)}${besoin.quantite ? ` — ${esc(besoin.quantite)}` : ''} <span class="prep-quand">(${esc(quand)})</span></div>`;
    }).join('');
    return `<div class="prep-produit">
      <div class="prep-nom">${esc(produit.label)}${produit.spec ? ` <span class="prep-spec">${esc(produit.spec)}</span>` : ''}${produit.total ? `<span class="prep-total">total ${esc(formatteTotal(produit.total))}</span>` : ''}</div>
      <div class="prep-besoins">${besoins}</div>
    </div>`;
  };

  const groupes = liste.groupes || [];
  const produits = groupes.map((groupe) => `
    <details class="prep-groupe"${groupes.length === 1 ? ' open' : ''}>
      <summary>
        <span>${esc(groupe.nom)}</span>
        <span class="prep-groupe-meta">${tR('{n} référence(s)', { n: groupe.produits.length })}${groupe.premiereDate ? ` · ${tR('dès le {date}', { date: formatShortDate(groupe.premiereDate) })}` : ''}</span>
      </summary>
      <div class="prep-groupe-corps">${groupe.produits.map(produitHtml).join('')}</div>
    </details>`).join('');

  const sansItems = liste.sansItems.map((entree) => `<div class="prep-produit">
      <div class="prep-nom">${esc(entree.machine.name)}${entree.date ? ` <span class="prep-quand">— ${esc(formatShortDate(entree.date))}</span>` : ''}</div>
      <div class="prep-besoins">${entree.taches ? esc(entree.taches) : trad('Tâches non renseignées')}</div>
    </div>`).join('');

  const rien = !liste.produits.length && !liste.sansItems.length;
  const resume = liste.entretiens
    ? tR('{n} entretien(s) daté(s) dans les {jours} prochains jours', { n: liste.entretiens, jours })
    : tR('Aucun entretien daté dans les {n} prochains jours', { n: jours });

  return `
    <section class="card">
      <div class="card-head">
        <h2 class="card-title">${trad('Préparation')}</h2>
        <div class="prep-horizon">${chips}</div>
      </div>
      <p class="muted-text">${esc(resume)}${liste.auCompteur ? ` · ${tR('{n} machine(s) au compteur, sans date d\'échéance', { n: liste.auCompteur })}` : ''}</p>
      ${rien
        ? `<p class="muted-text">${trad('Rien à prévoir sur cette période.')}</p>`
        : `${produits}${sansItems}`}
      ${(liste.produits.length || liste.sansItems.length) ? `
        <div class="hint">${trad('Les quantités proviennent du carnet constructeur : vérifie-les avant de commander.')}</div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="prep-copier">${trad('Copier la liste')}</button>
        </div>` : ''}
    </section>`;
}

// Version en clair, à coller dans un message au fournisseur : c'est l'usage
// réel de cette liste.
function preparationTexte() {
  const jours = UI.preparationJours || 90;
  const liste = listePreparation(UI.machines, jours);
  const lignes = [tR('Préparation des entretiens — {n} prochains jours', { n: jours }), ''];
  // Le texte copié suit le MÊME regroupement que l'écran : c'est ce message qui
  // part chez le fournisseur, et une commande se lit par famille.
  for (const groupe of (liste.groupes || [])) {
    lignes.push(`— ${groupe.nom} —`);
    for (const produit of groupe.produits) {
      const total = produit.total ? ` — total ${formatteTotal(produit.total)}` : '';
      lignes.push(`${produit.label}${produit.spec ? ` (${produit.spec})` : ''}${total}`);
      for (const besoin of produit.besoins) {
        const quand = besoin.date ? formatShortDate(besoin.date) : trad('au compteur');
        lignes.push(`   ${besoin.machine.name}${besoin.quantite ? ` : ${besoin.quantite}` : ''} — ${quand}`);
      }
    }
    lignes.push('');
  }
  for (const entree of liste.sansItems) {
    lignes.push(`${entree.machine.name}${entree.date ? ` — ${formatShortDate(entree.date)}` : ''}`);
    lignes.push(`   ${entree.taches || trad('Tâches non renseignées')}`);
  }
  if (!liste.produits.length && !liste.sansItems.length) lignes.push(trad('Rien à prévoir sur cette période.'));
  return lignes.join('\n');
}

// Version courte, pour le TABLEAU DE BORD.
//
// POURQUOI ELLE EXISTE : la liste complète vit dans l'Agenda, qui n'est même pas
// dans la barre d'onglets du téléphone (il faut passer par « Plus »). Une
// fonctionnalité que l'utilisateur ne trouve pas ne sert à rien — constat fait
// en usage réel, l'utilisateur ayant demandé où elle était. Cette carte annonce
// donc l'essentiel dès l'accueil, et renvoie à la liste détaillée.
function preparationResumeHtml() {
  const jours = UI.preparationJours || 90;
  const liste = listePreparation(UI.machines, jours);
  const nombre = liste.produits.length;
  if (!nombre && !liste.sansItems.length) return '';

  const noms = liste.produits.slice(0, 3).map((p) => p.label).join(', ');
  const reste = nombre > 3 ? tR(', + {n} autre(s)', { n: nombre - 3 }) : '';
  const resume = nombre
    ? tR('{n} produit(s) à prévoir pour les {jours} prochains jours : {noms}{reste}.', { n: nombre, jours, noms, reste })
    : tR('Rien à commander pour l\'instant, mais {n} plan(s) sans liste de produits.', { n: liste.sansItems.length });

  return `
    <section class="card">
      <div class="card-head">
        <h2 class="card-title">${trad('Préparation')}</h2>
        <span class="spacer"></span>
        <button type="button" class="link-inline" data-nav="agenda">${trad('Voir la liste')}</button>
      </div>
      <p class="muted-text">${esc(resume)}</p>
    </section>`;
}

function wirePreparation(root) {
  if (!root) return;
  root.querySelectorAll('[data-horizon]').forEach((bouton) => {
    bouton.addEventListener('click', () => {
      UI.preparationJours = Number(bouton.dataset.horizon) || 90;
      renderApp();
    });
  });
  root.querySelector('#prep-copier')?.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(preparationTexte());
      showToast(trad('Liste copiée'));
    } catch (err) {
      // Presse-papiers refusé (permission, contexte non sécurisé) : on le dit
      // plutôt que de laisser croire que la copie a réussi.
      showToast(trad('Copie impossible — sélectionne la liste à la main'));
    }
  });
}

VIEWS.agenda = {
  title: trad('Agenda'),
  subtitle: () => trad('Échéances datées et compteurs à surveiller'),
  render() {
    const dated = UI.machines
      .filter(m => m.plan && !planIsCounter(m.plan) && m.plan.next_due_at)
      .map(m => ({ m, info: dueInfo(m.plan, m) }))
      .sort((a, b) => (a.m.plan.next_due_at < b.m.plan.next_due_at ? -1 : 1));

    const counters = UI.machines
      .filter(m => m.plan && planIsCounter(m.plan))
      .map(m => ({ m, info: dueInfo(m.plan, m) }))
      .sort((a, b) => a.info.sortKey - b.info.sortKey);

    if (!dated.length && !counters.length) {
      return `<div class="empty">${trad('Aucune échéance enregistrée. Renseigne un plan de maintenance sur une machine.')}</div>`;
    }

    let currentMonth = '';
    const datedHtml = dated.map(({ m, info }) => {
      const iso = String(m.plan.next_due_at);
      const monthIndex = Number(iso.slice(5, 7)) - 1;
      const month = moisLong(monthIndex) ? `${moisLong(monthIndex)} ${iso.slice(0, 4)}` : 'Date inconnue';
      const header = month !== currentMonth ? `<div class="agenda-month">${esc(month)}</div>` : '';
      currentMonth = month;
      return header + alertRowHtml(m, info);
    }).join('');

    return `
      ${preparationHtml()}
      ${dated.length ? `<section class="card">
        <div class="card-head"><h2 class="card-title">${trad('Échéances datées')}</h2></div>
        ${datedHtml}
      </section>` : ''}
      ${counters.length ? `<section class="card">
        <div class="card-head"><h2 class="card-title">${trad('Suivi au compteur')}</h2></div>
        <div class="alert-list">${counters.map(({ m, info }) => alertRowHtml(m, info)).join('')}</div>
      </section>` : ''}`;

      const msg = root.querySelector('#acc-rappels-msg');
      const actif = case_.checked;
      activerRappels(actif);
      if (msg) msg.textContent = actif ? 'Programmation…' : '';
      // Désactiver n'appelle pas programmerRappels : celui-ci se contenterait

      if (resultat.erreur) {
        msg.textContent = tR('Rappels non programmés : {erreur}', { erreur: resultat.erreur });

        activerRappels(false);

        msg.textContent = trad('Aucune échéance datée à annoncer pour le moment.');
      } else if (resultat.programmees) {
        msg.textContent = tR('{n} rappel(s) programmé(s).', { n: resultat.programmees });
      } else {
        msg.textContent = trad('Rappels désactivés.');
      }
    });
    wireChampTelephone(root, 'acc-phone');

    const message = (el, texte, erreur) => {
      if (!el) return;
      el.textContent = texte;
      el.style.color = erreur ? 'var(--late)' : 'var(--ok)';
    };

    root.querySelector('#acc-save-contact')?.addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const msg = root.querySelector('#acc-contact-msg');
      const prenom = root.querySelector('#acc-first').value.trim();
      const nom = root.querySelector('#acc-last').value.trim();
      const telSaisi = lireChampTelephone(root, 'acc-phone');
      const telephone = telSaisi ? telSaisi.e164 : '';
      btn.disabled = true;
      btn.textContent = trad('Enregistrement…');
      try {
        // Passe par une fonction dédiée plutôt que par un UPDATE direct : une
        // politique RLS de mise à jour sur companies laisserait aussi modifier
        // la colonne « plan », donc contourner la limite du plan gratuit.
        const { error } = await sb.rpc('update_my_company', {
          p_phone: telephone || null,
          p_contact_first_name: prenom || null,
          p_contact_last_name: nom || null,
        });
        if (error) throw error;

        UI.company.phone = telephone;
        UI.company.contact_first_name = prenom || null;
        UI.company.contact_last_name = nom || null;
        UI.contactFirstName = prenom;
        UI.contactName = contactFullName(prenom, nom, UI.contactName);
        showToast(trad('Coordonnées enregistrées'));
        renderApp();
      } catch (err) {
        message(msg, trad('Erreur :') + ' ' + (err.message || err), true);
        btn.disabled = false;
        btn.textContent = trad('Enregistrer');
      }
    });

    root.querySelector('#acc-save-email')?.addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const msg = root.querySelector('#acc-email-msg');
      const champEmail = root.querySelector('#acc-email');
      const champMotDePasse = root.querySelector('#acc-password');
      const nouvelEmail = champEmail.value.trim();
      const motDePasse = champMotDePasse.value;

      if (!emailValide(nouvelEmail)) {
        message(msg, 'Adresse email invalide.', true);
        return;
      }
      if (nouvelEmail.toLowerCase() === String(UI.email).toLowerCase()) {
        message(msg, trad('C\'est déjà l\'adresse actuelle.'), true);
        return;
      }
      if (!motDePasse) {
        message(msg, trad('Saisis ton mot de passe actuel pour confirmer.'), true);
        return;
      }

      btn.disabled = true;
      btn.textContent = trad('Vérification…');
      try {
        // Ré-authentification obligatoire avant un changement sensible.
        const { error: authErr } = await sb.auth.signInWithPassword({ email: UI.email, password: motDePasse });
        if (authErr) throw new Error(trad('Mot de passe incorrect.'));

        btn.textContent = trad('Envoi du lien…');
        const { error } = await sb.auth.updateUser({ email: nouvelEmail });
        if (error) throw error;

        message(msg, trad('Demande envoyée. Ouvre le lien de confirmation reçu par email : la nouvelle adresse ne sera active qu\'après validation.'), false);
        champEmail.value = '';
        champMotDePasse.value = '';
      } catch (err) {
        message(msg, trad('Erreur :') + ' ' + (err.message || err), true);
      }
      btn.disabled = false;
      btn.textContent = trad('Changer l\'email');
    });
  },
};

// ── Dépôt d'un manuel → analyse IA → validation du plan ───────
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = () => reject(new Error(trad('lecture du fichier impossible')));
    reader.readAsDataURL(file);
  });
}

function openManualUploadModal(presetMachine, presetFile) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  let machine = presetMachine || (UI.machines.length === 1 ? UI.machines[0] : null);
  let file = presetFile || null;
  let analysis = null;

  const close = () => overlay.remove();
  const shell = (inner) => { overlay.innerHTML = `<div class="modal">${inner}</div>`; };

  function stepPick() {
    if (!UI.machines.length) {
      shell(`
        <h2>${trad('Déposer un manuel')}</h2>
        <p class="sub">${trad('Ajoute d\'abord une machine : le carnet d\'entretien vient compléter sa fiche.')}</p>
        <div class="modal-actions">
          <button type="button" class="secondary" id="mu-close">${trad('Fermer')}</button>
          <button type="button" class="primary" id="mu-add">${trad('Ajouter une machine')}</button>
        </div>`);
      overlay.querySelector('#mu-close').addEventListener('click', close);
      overlay.querySelector('#mu-add').addEventListener('click', () => { close(); handleAddMachine(); });
      return;
    }
    shell(`
      <h2>${trad('Déposer un manuel PDF')}</h2>
      <p class="sub">${trad('L\'IA lit le manuel, en extrait les échéances et propose le plan d\'entretien. Tu valides avant activation.')}</p>
      <label for="mu-machine">${trad('Machine concernée')}</label>
      <select id="mu-machine">
        ${UI.machines.map(m => `<option value="${esc(m.id)}"${machine && m.id === machine.id ? ' selected' : ''}>${esc(m.name)}</option>`).join('')}
      </select>
      ${dropzoneHtml('mu-drop')}
      <div class="hint" id="mu-status">${file ? tR('Fichier sélectionné : {nom}', { nom: esc(file.name) }) : ''}</div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="mu-cancel">${trad('Annuler')}</button>
        <button type="button" class="primary" id="mu-start">${trad('Analyser le PDF')}</button>
      </div>`);
    const statusEl = overlay.querySelector('#mu-status');
    attachDropzone(overlay.querySelector('#mu-drop'), (f) => {
      file = f;
      statusEl.textContent = tR('Fichier sélectionné : {nom}', { nom: f.name });
    });
    overlay.querySelector('#mu-machine').addEventListener('change', (e) => {
      machine = UI.machines.find(m => m.id === e.target.value) || null;
    });
    overlay.querySelector('#mu-cancel').addEventListener('click', close);
    overlay.querySelector('#mu-start').addEventListener('click', () => {
      if (!file) { statusEl.textContent = trad('Choisis d\'abord un fichier PDF (glisser-déposer ou clic sur la zone).'); return; }
      if (!machine) { statusEl.textContent = trad('Choisis la machine concernée.'); return; }
      run();
    });
  }

  async function run() {
    shell(`
      <h2>${trad('Analyse en cours…')}</h2>
      <p class="sub">${esc(file.name)} · ${esc(machine.name)}</p>
      <div class="hint" id="mu-progress">${trad('Téléversement du carnet…')}</div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="mu-cancel">${trad('Fermer')}</button>
      </div>`);
    overlay.querySelector('#mu-cancel').addEventListener('click', close);
    const progress = () => overlay.querySelector('#mu-progress');

    try {
      if (file.size > 15 * 1024 * 1024) throw new Error(trad('Le PDF dépasse 15 Mo, réduis sa taille avant de réessayer.'));

      const path = `${UI.companyId}/${machine.id}.pdf`;
      const { error: upErr } = await sb.storage.from('manuals').upload(path, file, { upsert: true, contentType: 'application/pdf' });
      if (upErr) throw upErr;
      const { error: linkErr } = await sb.from('machines').update({ manual_url: path }).eq('id', machine.id);
      if (linkErr) throw linkErr;

      if (file.size > 8 * 1024 * 1024) {
        stepReview(null);
        return;
      }

      if (progress()) progress().textContent = trad('Lecture du carnet par l\'IA… (jusqu\'à 20 secondes, ne ferme pas cette fenêtre)');
      const base64 = await fileToBase64(file);
      const mode = planIsCounter(machine.plan) ? (counterUnitOf(machine) === 'km' ? 'km' : 'hours') : 'days';
      const { data, error } = await sb.functions.invoke('extract-maintenance-plan', {
        body: {
          fileBase64: base64,
          trackingMode: aiModeFrom(mode),
          currentHours: machineCounter(machine) ?? null,
          serviceDate: machine.service_date ?? null,
        },
      });
      if (error) throw new Error(await functionErrorMessage(error, trad('analyse IA impossible')));
      if (data?.error) throw new Error(data.error);
      analysis = data;
      stepReview(analysis);
    } catch (err) {
      shell(`
        <h2>${trad('Analyse interrompue')}</h2>
        <p class="sub">${esc(err.message)}</p>
        <div class="hint">${trad('Le carnet n\'a peut-être pas été enregistré. Tu peux réessayer, ou renseigner le plan à la main depuis la fiche de la machine.')}</div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="mu-close">${trad('Fermer')}</button>
          <button type="button" class="primary" id="mu-retry">${trad('Réessayer')}</button>
        </div>`);
      overlay.querySelector('#mu-close').addEventListener('click', close);
      overlay.querySelector('#mu-retry').addEventListener('click', () => { analysis = null; stepPick(); });
    }
  }

  function stepReview(result) {
    const mode = planIsCounter(machine.plan) ? (counterUnitOf(machine) === 'km' ? 'km' : 'hours') : 'days';
    const items = normalizeItems(result?.items);
    const unit = counterUnitFromMode(mode);
    const suggested = mode === 'days'
      ? (result?.interval_days || machine.plan?.interval_days || FALLBACK_INTERVAL_DAYS)
      : (result?.interval_hours || planIntervalCounter(machine.plan) || FALLBACK_INTERVAL_HOURS);

    shell(`
      <h2>${result ? trad('Plan proposé par l\'IA') : trad('Carnet attaché')}</h2>
      <p class="sub">${esc(machine.name)} · ${esc(file.name)}</p>
      ${result ? `
        <label for="mu-interval">${tR('Échéance {mode}', { mode: mode === 'days' ? trad('toutes les (jours)') : tR('tous les ({unite})', { unite: COUNTER_UNITS[unit].word }) })}</label>
        <input id="mu-interval" type="number" min="1" value="${esc(suggested)}">
        ${items.length ? `
          <label>${trad('Échéances détectées dans le manuel')}</label>
          <table class="ref-table">
            <thead><tr><th>${trad('Élément')}</th><th>${trad('Fréquence')}</th></tr></thead>
            <tbody>${items.map(it => `<tr><td class="item-label">${esc(it.label || '—')}</td><td>${esc(it.frequency || '—')}</td></tr>`).join('')}</tbody>
          </table>` : ''}
        <label for="mu-tasks">${trad('Tâches de maintenance')}</label>
        <textarea id="mu-tasks">${esc(result.tasks || machine.plan?.tasks || '')}</textarea>
        <div class="hint">${tR('Confiance : {valeur}', { valeur: esc(result.confidence || '—') })}${result.notes ? ' — ' + esc(result.notes) : ''}</div>
      ` : `
        <div class="hint">${trad('Le PDF est attaché à la fiche. L\'analyse automatique n\'a pas été lancée (fichier volumineux ou IA indisponible) : le plan reste à renseigner à la main.')}</div>
      `}
      <div class="hint" id="mu-error"></div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="mu-cancel">${trad('Annuler')}</button>
        <button type="button" class="primary" id="mu-activate">${result ? trad('Activer le plan') : trad('Terminer')}</button>
      </div>`);

    overlay.querySelector('#mu-cancel').addEventListener('click', close);
    overlay.querySelector('#mu-activate').addEventListener('click', async () => {
      const btn = overlay.querySelector('#mu-activate');
      const errEl = overlay.querySelector('#mu-error');
      btn.disabled = true;
      btn.textContent = trad('Enregistrement…');
      try {
        if (!result) { close(); boot(trad('Carnet attaché')); return; }
        const interval = parseInt(overlay.querySelector('#mu-interval').value, 10) || suggested;
        const tasks = overlay.querySelector('#mu-tasks').value.trim();
        const payload = {
          tracking_mode: mode,
          tasks: tasks || null,
          items: items.length ? items : (machine.plan?.items ?? null),
          notes: result.notes || machine.plan?.notes || null,
          interval_days: mode === 'days' ? interval : (machine.plan?.interval_days || FALLBACK_INTERVAL_DAYS),
          reminder_days_before: machine.plan?.reminder_days_before ?? FALLBACK_REMINDER_DAYS,
        };
        if (mode === 'days') {
          payload.next_due_at = addDaysIso(machine.service_date || todayIso(), payload.interval_days);
        } else {
          Object.assign(payload,
            planCounterPatch(interval, machine.plan ? planReminderCounter(machine.plan) : FALLBACK_REMINDER_HOURS),
            planNextDueCounterPatch((machineCounter(machine) || 0) + interval));
        }

        if (machine.plan?.id) {
          const { error } = await sb.from('maintenance_plans').update(payload).eq('id', machine.plan.id);
          if (error) throw error;
        } else {
          const { error } = await sb.from('maintenance_plans').insert({ ...payload, machine_id: machine.id });
          if (error) throw error;
        }
        close();
        boot(trad('Plan activé'));
      } catch (err) {
        errEl.textContent = trad('Erreur :') + " " + err.message;
        btn.disabled = false;
        btn.textContent = result ? trad('Activer le plan') : trad('Terminer');
      }
    });
  }

  if (machine && file) run();
  else stepPick();
}

async function viewManual(path, btn) {
  const original = btn.textContent;
  btn.textContent = trad('Ouverture…');
  const { data, error } = await sb.storage.from('manuals').createSignedUrl(path, 300);
  if (error) { btn.textContent = trad('Erreur d\'ouverture'); return; }
  window.open(data.signedUrl, '_blank');
  btn.textContent = original;
}

// Nom du carnet dans le stockage : VERSIONNÉ à chaque dépôt.
//
// Réutiliser `${companyId}/${machineId}.pdf` posait deux problèmes réels :
//   • le document remplacé n'apparaissait pas tout de suite — le navigateur et le
//     CDN de Supabase continuaient de servir l'ancien fichier, mis en cache sous
//     la même adresse pendant une heure ;
//   • l'écrasement (upsert) exige un droit de MISE À JOUR sur le stockage, alors
//     qu'un nouveau nom n'exige qu'un droit d'ajout.
// Un nom horodaté règle les deux : l'adresse change, donc le document aussi.
function cheminManuel(companyId, machineId) {
  const horodatage = new Date().toISOString().replace(/[^0-9]/g, '').slice(0, 14);
  return `${companyId}/${machineId}-${horodatage}.pdf`;
}

// Dépose le PDF, met la fiche à jour, puis supprime l'ancien carnet. L'ordre
// compte : si le dépôt échoue, la fiche garde son carnet actuel — on ne perd
// jamais le document en place.
async function deposerManuel(companyId, machineId, file, ancienChemin) {
  const chemin = cheminManuel(companyId, machineId);
  const { error: uploadErr } = await sb.storage
    .from('manuals')
    .upload(chemin, file, { contentType: 'application/pdf' });
  if (uploadErr) throw uploadErr;
  const { error: lienErr } = await sb.from('machines').update({ manual_url: chemin }).eq('id', machineId);
  if (lienErr) throw lienErr;
  if (ancienChemin && ancienChemin !== chemin) {
    const { error: supErr } = await sb.storage.from('manuals').remove([ancienChemin]);
    // Un ancien fichier qui reste n'empêche pas d'utiliser le nouveau : on le
    // signale sans interrompre l'enregistrement.
    if (supErr) console.warn('Suppression du carnet précédent impossible :', supErr.message);
  }
  return chemin;
}

async function analyzeManualAndFill(overlay, fileOrBlob, mode = 'days', context = {}) {
  const analysisEl = overlay.querySelector('#f-analysis');
  const fileInput = overlay.querySelector('#f-manual');
  const submitBtn = overlay.querySelector('button[type=submit]');

  if (fileOrBlob.size > 8 * 1024 * 1024) {
    analysisEl.textContent = trad('Fichier volumineux (>8 Mo) : pas d\'analyse automatique, mais le PDF reste attaché.');
    return;
  }

  if (fileInput) fileInput.disabled = true;
  if (submitBtn) submitBtn.disabled = true;
  analysisEl.style.color = 'var(--ok)';
  analysisEl.style.fontWeight = '600';
  analysisEl.textContent = trad('🤖 Lecture du carnet d\'entretien par l\'IA… (jusqu\'à 15-20 secondes, ne ferme pas cette fenêtre)');

  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(fileOrBlob);
    });

    const { data, error } = await sb.functions.invoke('extract-maintenance-plan', {
      body: { fileBase64: base64, trackingMode: mode, currentHours: context.currentHours ?? null, serviceDate: context.serviceDate ?? null },
    });
    if (error) throw new Error(error.message || trad('appel IA impossible'));
    if (data?.error) throw new Error(data.error);

    overlay._aiIntervalDays = data.interval_days || null;
    overlay._aiIntervalHours = data.interval_hours || null;
    overlay._aiTrackingSuggestion = data.tracking_mode_suggestion === 'hours' ? 'hours' : 'days';

    // LE MODE SUIT LA RECOMMANDATION DU CARNET. Le manuel dit « 20 heures » : il
    // serait absurde de laisser la machine en calendaire et d'attendre que
    // l'utilisateur pense à basculer. On coche donc le mode recommandé, on
    // déclenche son écouteur (libellés, champ compteur), et on annonce le
    // changement au lieu de le suggérer à mots couverts.
    const modeRecommande = overlay._aiTrackingSuggestion;
    let modeApplique = mode;
    const radio = overlay.querySelector(`input[name=tm][value=${modeRecommande}]`);
    if (radio && !radio.checked && SCHEMA.hasCounter) {
      radio.checked = true;
      radio.dispatchEvent(new Event('change'));
      modeApplique = modeRecommande;
    }

    // Le champ intervalle prend la valeur de l'unité RÉELLEMENT active, et le
    // drapeau est remis à zéro : l'utilisateur n'a rien saisi, la proposition de
    // l'IA doit donc s'appliquer même s'il change d'unité ensuite.
    const intervalField = overlay.querySelector('#f-interval');
    if (intervalField) {
      overlay._intervalTouche = false;
      intervalField.value = intervallePropose(modeApplique, intervallesIA(overlay));
    }
    if (data.tasks) overlay.querySelector('#f-tasks').value = data.tasks;
    overlay._aiItems = Array.isArray(data.items) && data.items.length ? data.items : null;
    overlay._aiNotes = data.notes || '';
    const detailMsg = overlay._aiItems ? ` ${tR('{n} élément(s) détaillé(s) extrait(s), consultables via « Voir le plan » une fois enregistré.', { n: overlay._aiItems.length })}` : '';
    const modeMsg = modeApplique !== mode
      ? ` ℹ️ ${tR('Le carnet exprime ses échéances en {mode} : le mode de suivi a été basculé automatiquement.', { mode: modeApplique === 'hours' ? trad('heures') : trad('kilomètres') })}`
      : '';
    analysisEl.textContent = `✅ ${tR('Suggestion IA appliquée (confiance {valeur})', { valeur: data.confidence || '—' })}${data.notes ? ' — ' + data.notes : ''}.${detailMsg}${modeMsg} ${trad('Vérifie les champs ci-dessus avant d\'enregistrer.')}`;
  } catch (err) {
    analysisEl.style.color = 'var(--alert)';
    analysisEl.textContent = tR('Analyse IA indisponible ({erreur}) — renseigne le plan manuellement.', { erreur: err.message });
  } finally {
    if (fileInput) fileInput.disabled = false;
    if (submitBtn) submitBtn.disabled = false;
  }
}

  async function saveMachine(submitBtn, errorEl) {
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = trad('Enregistrement…'); }
    try {
      let categoryId;
      const existingCat = categories.find(c => c.name.toLowerCase() === state.category.toLowerCase());

        categoryId = existingCat.id;

        const { data: newCat, error: catErr } = await sb
          .from('machine_categories')
          .insert({ company_id: companyId, name: state.category, default_interval_days: state.intervalDays, default_tasks: state.tasks })
          .select('id, name')
          .single();
        if (catErr) throw catErr;
        categoryId = newCat.id;
        categories.push(newCat);
      }

      const { data: machine, error: machineErr } = await sb
        .from('machines')
        .insert({
          company_id: companyId, category_id: categoryId, name: state.name,
          ...identifiantPatch(state.kind, state.serial),
          ...kindPatch(state.kind),
          service_date: state.serviceDate, status: 'en_service',
          ...brandModelPatch(state.brand, state.model),
          ...yearPatch(state.annee),
          ...machineCounterPatch(
            state.trackingMode !== 'days' ? state.currentHours : null,
            { counter_unit: counterUnitFromMode(state.trackingMode) }
          ),
        })
        .select('id')
        .single();
      if (machineErr) throw machineErr;

      try {
        if (state.pendingPhotoBlob) {
          const url = await uploadMachinePhoto(companyId, machine.id, state.pendingPhotoBlob);
          await sb.from('machines').update({ image_url: url }).eq('id', machine.id);
        } else if (state.searchPhoto) {
          // Uniquement sur demande explicite : l'appel consomme un credit et
          // n'a d'interet que si le carnet PDF n'a pas fourni de photo.
          const demande = requetePhoto({
            brand: state.brand, model: state.model, name: state.name,
            category: state.category, kind: state.kind, annee: state.annee,
          });
          const { data: imgData, error: imgErr } = await sb.functions.invoke('fetch-machine-image', { body: demande });
          if (imgErr) console.warn('Recherche de photo :', await functionErrorMessage(imgErr));
          else if (imgData?.imageUrl) await sb.from('machines').update({ image_url: imgData.imageUrl }).eq('id', machine.id);
        }
      } catch (imgErr) { console.warn('Photo de la machine :', imgErr); }

      if (state.pendingFile) {
        if (state.pendingFile.size > 15 * 1024 * 1024) throw new Error(trad('Le PDF dépasse 15 Mo, réduis sa taille avant de réessayer.'));
        await deposerManuel(companyId, machine.id, state.pendingFile, null);
      }

      const planPayload = {
        machine_id: machine.id,
        tracking_mode: state.trackingMode,
        tasks: state.tasks || null,
        items: state.items,
        notes: state.notes || null,
      };
      if (state.trackingMode !== 'days') {
        const intervalCounter = state.intervalHours || FALLBACK_INTERVAL_HOURS;
        const reminderCounter = state.reminderHoursBefore ?? FALLBACK_REMINDER_HOURS;
        Object.assign(planPayload,
          planCounterPatch(intervalCounter, reminderCounter),
          planNextDueCounterPatch((state.currentHours || 0) + intervalCounter));
        // On conserve aussi un intervalle calendaire cohérent : il servira si la
        // machine bascule plus tard en suivi calendaire.
        planPayload.interval_days = state.intervalDays || FALLBACK_INTERVAL_DAYS;
        planPayload.reminder_days_before = state.reminderDays ?? FALLBACK_REMINDER_DAYS;
      } else {
        planPayload.interval_days = state.intervalDays || FALLBACK_INTERVAL_DAYS;
        planPayload.reminder_days_before = state.reminderDays ?? FALLBACK_REMINDER_DAYS;
        planPayload.next_due_at = addDaysIso(state.serviceDate, planPayload.interval_days);
        planPayload.interval_hours = state.intervalHours || FALLBACK_INTERVAL_HOURS;
        planPayload.reminder_hours_before = state.reminderHoursBefore ?? FALLBACK_REMINDER_HOURS;
      }
      const { error: planErr } = await sb.from('maintenance_plans').insert(planPayload);
      if (planErr) throw planErr;

      overlay.remove();
      boot(trad('Machine ajoutée'));
    } catch (err) {
      if (isQuotaError(err)) {
        overlay.remove();
        openUpgradeNotice(companyId);
        return;
      }
      if (errorEl) errorEl.textContent = trad('Erreur :') + " " + err.message;
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = trad('Enregistrer'); }
    }
  }

  stepIdentification();
}

function openLogInterventionModal(machine) {
  const today = todayIso();
  const isCounter = planIsCounter(machine.plan);
  const unit = counterUnitOf(machine);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  const planItems = normalizeItems(machine.plan?.items);
  const items = planItems.length
    ? planItems.map(it => it.label).filter(Boolean)
    : (machine.plan?.tasks || '').split(',').map(t => t.trim()).filter(Boolean);

  overlay.innerHTML = `
    <div class="modal">
      <h2>${trad('Enregistrer un entretien')}</h2>
      <p class="sub">${tR('{machine} — coche ce qui a été fait, ça met à jour la prochaine échéance.', { machine: esc(machine.name) })}</p>
      <form id="log-form">
        <label for="log-date">${trad('Date de l\'entretien')}</label>
        <input id="log-date" type="date" value="${today}" required>

        ${isCounter ? `
          <label for="log-hours">${tR('Compteur au moment de l\'entretien ({unite})', { unite: COUNTER_UNITS[unit].word })}</label>
          <input id="log-hours" type="number" min="0" step="${COUNTER_UNITS[unit].step}" value="${esc(machineCounter(machine) ?? '')}" required>
        ` : ''}

        ${items.length ? `
          <label>${trad('Éléments traités')}</label>
          <div class="checklist">
            ${items.map(t => `<label><input type="checkbox" value="${esc(t)}"> ${esc(t)}</label>`).join('')}
          </div>
        ` : ''}

        <label for="log-notes">${trad('Remarques (optionnel)')}</label>
        <textarea id="log-notes" placeholder="${trad('Ex. Pièce X remplacée, RAS sinon')}"></textarea>
        <div class="hint" id="log-error"></div>

        <div class="modal-actions">
          <button type="button" class="secondary" id="cancel-log">${trad('Annuler')}</button>
          <button type="submit" class="primary">${trad('Enregistrer')}</button>
        </div>
      </form>
    </div>
  `;

  overlay.querySelector('#cancel-log').addEventListener('click', () => overlay.remove());

  overlay.querySelector('#log-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type=submit]');
    const errorEl = overlay.querySelector('#log-error');
    submitBtn.disabled = true;
    submitBtn.textContent = trad('Enregistrement…');

    const performedAt = overlay.querySelector('#log-date').value;
    const hoursValue = isCounter ? parseFloat(overlay.querySelector('#log-hours').value) : null;
    const checkedItems = items.length
      ? Array.from(overlay.querySelectorAll('.checklist input:checked')).map(c => c.value)
      : [];
    const notes = overlay.querySelector('#log-notes').value.trim();

    try {
      const { error: logErr } = await sb.from('interventions').insert({
        machine_id: machine.id,
        plan_id: machine.plan?.id || null,
        performed_at: performedAt,
        hours_at_intervention: hoursValue,
        description: notes || null,
        items_done: checkedItems.length ? checkedItems : null,
      });
      if (logErr) throw logErr;

      if (isCounter && hoursValue != null) {
        const { error: machErr } = await sb.from('machines').update(machineCounterPatch(hoursValue, machine)).eq('id', machine.id);
        if (machErr) throw machErr;
      }

      if (machine.plan?.id) {
        const planUpdate = {};
        if (isCounter) {
          const interval = planIntervalCounter(machine.plan) || FALLBACK_INTERVAL_HOURS;
          Object.assign(planUpdate, planNextDueCounterPatch((hoursValue || 0) + interval));
        } else {
          planUpdate.next_due_at = addDaysIso(performedAt, machine.plan.interval_days || FALLBACK_INTERVAL_DAYS);
        }
        const { error: planErr } = await sb.from('maintenance_plans').update(planUpdate).eq('id', machine.plan.id);
        if (planErr) throw planErr;
      }

      overlay.remove();
      boot(trad('Entretien enregistré'));
    } catch (err) {
      errorEl.textContent = trad('Erreur :') + " " + err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = trad('Enregistrer');
    }
  });
}

// Récupère l'historique complet d'une machine : l'export CSV ne doit jamais
// être tronqué (PostgREST plafonne à 1000 lignes par requête).
async function fetchAllInterventions(machineId) {
  const pageSize = 1000;
  const all = [];
  for (let from = 0; ; from += pageSize) {
    const { data, error } = await sb.from('interventions')
      .select('id, performed_at, hours_at_intervention, description, items_done')
      .eq('machine_id', machineId)
      .order('performed_at', { ascending: false })
      .order('id', { ascending: false })
      .range(from, from + pageSize - 1);
    if (error) throw error;
    all.push(...(data || []));
    if (!data || data.length < pageSize) break;
  }
  return all;
}

}
